<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Service Desk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    
    <style>
        :root {
            --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
            --glass: rgba(15, 23, 42, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --open-green: #2ecc71; --closed-red: #e74c3c;
            --fault: #ff9f43; --consult: #0abde3; --critical: #ff0000;
        }

        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
            margin: 0; padding: 0; min-height: 100vh;
            overflow-x: hidden; user-select: none; -webkit-tap-highlight-color: transparent;
        }

        /* TŁO - Widoczne zawsze (zmieniono z display:none na block) */
        #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* --- LOGOWANIE --- */
        #login-screen {
            position: fixed; inset: 0; z-index: 1000;
            /* Dodano półprzezroczyste tło, żeby konstelacje były widoczne, ale przyciemnione pod logowaniem */
            background: rgba(2, 4, 8, 0.6); 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        
        .login-card {
            background: rgba(10, 15, 30, 0.9); padding: 40px; border-radius: 20px;
            border: 1px solid var(--cyan); box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
            width: 90%; max-width: 400px; text-align: center; backdrop-filter: blur(10px);
        }

        h1 { color: var(--gold); margin: 0 0 30px 0; font-size: 24px; text-transform: uppercase; letter-spacing: 3px; }

        input, select, textarea {
            width: 100%; padding: 15px; margin: 10px 0;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            color: #fff; border-radius: 10px; font-size: 16px; box-sizing: border-box;
            font-family: inherit;
        }
        
        select option { background: #000; color: #fff; }
        input:focus, textarea:focus, select:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }

        .btn-cyber {
            width: 100%; padding: 18px; border: none; border-radius: 10px;
            font-weight: 900; text-transform: uppercase; cursor: pointer;
            margin-top: 20px; transition: 0.2s; letter-spacing: 1px;
        }
        .btn-enter { background: linear-gradient(90deg, var(--cyan), #2e86de); color: white; box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3); }
        .btn-enter:active { transform: scale(0.98); }
        
        .btn-submit { background: linear-gradient(90deg, var(--gold), #e1b12c); color: black; }
        .btn-cancel { background: transparent; border: 1px solid var(--border); color: #aaa; }

        /* --- DASHBOARD --- */
        #main-app { display: none; position: relative; z-index: 10; padding: 20px; max-width: 800px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        h2 { color: var(--gold); margin: 0; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .user-badge { font-size: 12px; color: var(--cyan); border: 1px solid var(--cyan); padding: 5px 10px; border-radius: 20px; display: inline-block; margin-top: 5px; }
        .user-badge.admin { color: #ff4757; border-color: #ff4757; }

        /* --- LISTA ZGŁOSZEŃ --- */
        .ticket-card {
            background: rgba(255,255,255,0.03); 
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
            transition: 0.3s; position: relative; overflow: hidden;
            backdrop-filter: blur(5px);
        }

        /* OTWARTE */
        .ticket-card.open { border: 1px solid var(--open-green); box-shadow: 0 0 10px rgba(46, 204, 113, 0.1); }
        /* ZAMKNIĘTE */
        .ticket-card.closed { border: 1px solid var(--closed-red); opacity: 0.7; filter: grayscale(0.2); }

        .ticket-header { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 15px; }
        .ticket-title { font-size: 20px; font-weight: 900; color: #fff; margin: 8px 0 0 0; line-height: 1.2; }
        .ticket-meta { font-size: 11px; color: #888; margin-top: 5px; }

        /* Styl Plakietki Statusu */
        .status-badge { 
            padding: 5px 15px; border-radius: 20px; font-size: 10px; font-weight: bold; 
            text-transform: uppercase; letter-spacing: 1px; display: inline-block; 
        }
        
        /* Logika kolorów plakietki */
        .ticket-card.open .status-badge { 
            background: rgba(46, 204, 113, 0.2); color: var(--open-green); border: 1px solid var(--open-green);
        }
        .ticket-card.closed .status-badge { 
            background: rgba(231, 76, 60, 0.2); color: var(--closed-red); border: 1px solid var(--closed-red);
        }

        .ticket-desc { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin: 15px 0; font-size: 14px; line-height: 1.5; color: #ddd; white-space: pre-wrap; }

        /* --- KOMENTARZE --- */
        .comments-section { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
        .comment { margin-bottom: 10px; font-size: 13px; }
        .comment strong { color: var(--gold); }
        .comment.admin-reply strong { color: #ff4757; }
        .comment-text { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; display: inline-block; margin-top: 2px; }
        .admin-reply .comment-text { border-left: 3px solid #ff4757; background: rgba(255, 71, 87, 0.1); }

        .reply-box { display: flex; gap: 10px; margin-top: 15px; }
        .reply-input { flex-grow: 1; padding: 10px; margin: 0; }
        .btn-reply { width: auto; margin: 0; background: var(--cyan); color: #000; border: none; border-radius: 8px; cursor: pointer; }

        /* --- MODAL --- */
        #new-ticket-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal-content { background: #151b26; width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; border: 1px solid var(--gold); box-shadow: 0 0 50px rgba(212, 175, 55, 0.1); max-height: 90vh; overflow-y: auto; }
        .file-upload { border: 1px dashed var(--border); padding: 20px; text-align: center; color: #888; cursor: pointer; border-radius: 10px; transition: 0.2s; position: relative; }
        .file-upload:hover { border-color: var(--cyan); color: var(--cyan); }
        .file-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .file-preview { max-width: 100%; height: auto; margin-top: 10px; display: none; border-radius: 5px; border: 1px solid var(--border); }

        .fab {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--gold), #e1b12c); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4); cursor: pointer; z-index: 100; color: #000; font-weight: bold;
        }

        /* Przyciski Akcji Admina */
        .admin-actions { position: absolute; top: 20px; right: 20px; display: flex; gap: 5px; }
        .btn-action { border: none; padding: 5px 10px; border-radius: 5px; font-size: 10px; font-weight: bold; cursor: pointer; color: white; }
        .btn-close { background: #e74c3c; } 
        .btn-open { background: #2ecc71; } 
        .btn-delete { background: #333; border: 1px solid #555; } 

        .attachment-btn {
            background: rgba(0, 212, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan);
            padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-top: 10px; display: inline-block; text-decoration: none;
        }
        .attachment-img { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); display: none; }
        
        .closed-label {
            position: absolute; top: 20px; right: 20px; 
            color: var(--closed-red); font-weight: 900; font-size: 10px; 
            border: 1px solid var(--closed-red); padding: 4px 8px; border-radius: 4px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="login-screen">
        <div class="login-card">
            <h1>SERVICE DESK</h1>
            
            <select id="userSelect">
                <option value="" disabled selected>Wybierz użytkownika</option>
                <option value="Arek">Arek</option>
                <option value="Dominik">Dominik</option>
                <option value="Grzesiek P">Grzesiek P</option>
                <option value="Grzesiek Sz">Grzesiek Sz</option>
                <option value="Krzysiek">Krzysiek</option>
                <option value="Mariusz">Mariusz</option>
                <option value="Paweł">Paweł</option>
                <option disabled>──────────</option>
                <option value="Admin">🔑 ADMIN SYSTEMU</option>
            </select>

            <input type="password" id="userPass" placeholder="Hasło dostępu">
            
            <button class="btn-cyber btn-enter" onclick="login()">Zaloguj do Systemu</button>
        </div>
    </div>

    <div id="main-app">
        <header>
            <div>
                <h2>Lista Zgłoszeń</h2>
                <div id="userInfo" class="user-badge">Gość</div>
            </div>
            <button class="btn-cyber" style="width: auto; margin:0; padding: 10px 20px; font-size: 12px; background: rgba(255,255,255,0.1);" onclick="location.reload()">Wyloguj</button>
        </header>

        <div id="tickets-container">
            <p style="text-align:center; color:#888;">Ładowanie bazy zgłoszeń...</p>
        </div>
    </div>

    <div id="fab" class="fab" onclick="openModal()" style="display:none;">+</div>

    <div id="new-ticket-modal">
        <div class="modal-content">
            <h2 style="color:var(--gold); margin-top:0;">Nowe Zgłoszenie</h2>
            
            <label style="font-size:12px; color:#888;">Typ zgłoszenia *</label>
            <select id="tType">
                <option value="Usterka">⚠️ Usterka</option>
                <option value="Konsultacje">🔵 Konsultacje</option>
                <option value="Krytyczny">🔥 Stan krytyczny</option>
            </select>

            <label style="font-size:12px; color:#888;">Tytuł *</label>
            <input type="text" id="tTitle" placeholder="Krótki tytuł problemu">

            <label style="font-size:12px; color:#888;">Opis zdarzenia *</label>
            <textarea id="tDesc" rows="5" placeholder="Opisz dokładnie co się stało..."></textarea>

            <label style="font-size:12px; color:#888;">Załączniki (Max 1 zdjęcie)</label>
            <div class="file-upload">
                <span id="file-label">📎 Kliknij, aby dodać zdjęcie</span>
                <input type="file" id="tFile" accept="image/*" onchange="previewFile()">
                <img id="filePreview" class="file-preview">
            </div>

            <button class="btn-cyber btn-submit" onclick="submitTicket()">Wyślij Zgłoszenie</button>
            <button class="btn-cyber btn-cancel" onclick="closeModal()">Anuluj</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, arrayUnion, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", 
            authDomain: "obstaiwanie.firebaseapp.com", 
            projectId: "obstaiwanie" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = "";
        let isAdmin = false;
        let attachmentBase64 = null;

        // --- ANIMACJA TŁA (Konstelacje) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];

        function initBg() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            pts = [];
            for (let i = 0; i < 60; i++) {
                pts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4
                });
            }
        }

        function drawBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pts.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.fillStyle = 'rgba(212, 175, 55, 0.3)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < pts.length; j++) {
                    const p2 = pts[j];
                    const d = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (d < 120) {
                        ctx.strokeStyle = `rgba(0, 212, 255, ${0.4 - d/300})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawBg);
        }
        window.onresize = initBg;
        initBg();
        drawBg();

        // --- LOGOWANIE ---
        window.login = async () => {
            const user = document.getElementById('userSelect').value;
            const pass = document.getElementById('userPass').value.trim();

            if(!user) return alert("Wybierz użytkownika z listy!");
            
            if(user === "Admin") {
                if(pass === "0000") {
                    isAdmin = true;
                    currentUser = "Admin";
                    loginSuccess(currentUser, true);
                } else {
                    return alert("Błędne hasło administratora!");
                }
                return;
            } 
            
            try {
                const userDoc = await getDoc(doc(db, "passwords", user));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const dbPass = String(userData.password || "");
                    const inputPass = String(pass);

                    if (dbPass === inputPass && dbPass !== "") {
                        isAdmin = false;
                        currentUser = user;
                        loginSuccess(user, false);
                    } else {
                        alert("Błędne hasło!");
                    }
                } else {
                    alert("Nie znaleziono hasła dla tego użytkownika.");
                }
            } catch (error) {
                console.error(error);
                alert("Wystąpił błąd logowania.");
            }
        };

        function loginSuccess(name, admin) {
            document.getElementById('userInfo').innerText = admin ? "ADMINISTRATOR" : name;
            if(admin) document.getElementById('userInfo').classList.add('admin');
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('fab').style.display = 'flex';
            
            loadTickets();
        }

        window.openModal = () => document.getElementById('new-ticket-modal').style.display = 'flex';
        window.closeModal = () => {
            document.getElementById('new-ticket-modal').style.display = 'none';
            document.getElementById('tFile').value = "";
            document.getElementById('filePreview').style.display = 'none';
            document.getElementById('file-label').innerText = "📎 Kliknij, aby dodać zdjęcie";
            attachmentBase64 = null;
        };

        window.previewFile = () => {
            const file = document.getElementById('tFile').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const img = new Image();
                    img.src = reader.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_SIZE = 800;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        } else {
                            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        attachmentBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        const preview = document.getElementById('filePreview');
                        preview.src = attachmentBase64;
                        preview.style.display = "block";
                        document.getElementById('file-label').innerText = "✅ Zdjęcie dodane!";
                    };
                };
                reader.readAsDataURL(file);
            }
        };

        window.submitTicket = async () => {
            const type = document.getElementById('tType').value;
            const title = document.getElementById('tTitle').value;
            const desc = document.getElementById('tDesc').value;

            if(!title || !desc) return alert("Wypełnij tytuł i opis!");

            const ticketData = {
                type, title, desc,
                author: currentUser,
                timestamp: serverTimestamp(),
                status: 'open',
                replies: [],
                attachment: attachmentBase64
            };

            await addDoc(collection(db, "tickets"), ticketData);
            closeModal();
            document.getElementById('tTitle').value = "";
            document.getElementById('tDesc').value = "";
        };

        function loadTickets() {
            const q = query(collection(db, "tickets"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('tickets-container');
                container.innerHTML = "";
                
                if(snapshot.empty) {
                    container.innerHTML = "<p style='text-align:center; color:#666;'>Brak zgłoszeń.</p>";
                    return;
                }

                snapshot.forEach(docSnap => {
                    const t = docSnap.data();
                    const date = t.timestamp ? new Date(t.timestamp.seconds * 1000).toLocaleString() : 'Teraz';
                    const typeClass = t.type === 'Stan krytyczny' ? 'Krytyczny' : t.type;
                    const isClosed = t.status === 'closed';
                    const statusClass = isClosed ? 'closed' : 'open';
                    
                    let actionHtml = "";
                    
                    if(isAdmin) {
                        actionHtml += `<div class="admin-actions">`;
                        if(!isClosed) {
                            actionHtml += `<button class="btn-action btn-close" onclick="changeStatus('${docSnap.id}', 'closed')">ZAMKNIJ</button>`;
                        } else {
                            actionHtml += `<button class="btn-action btn-open" onclick="changeStatus('${docSnap.id}', 'open')">OTWÓRZ</button>`;
                        }
                        actionHtml += `<button class="btn-action btn-delete" onclick="deleteTicket('${docSnap.id}')">USUŃ</button>`;
                        actionHtml += `</div>`;
                    } else if(isClosed) {
                         actionHtml = `<div class="closed-label">ZGŁOSZENIE ZAMKNIĘTE</div>`;
                    }

                    let attachmentHtml = "";
                    if(t.attachment) {
                        const imgId = `img-${docSnap.id}`;
                        const btnId = `btn-${docSnap.id}`;
                        attachmentHtml = `
                            <button id="${btnId}" class="attachment-btn" onclick="toggleImage('${imgId}', '${btnId}')">📷 Zobacz załącznik</button>
                            <img id="${imgId}" src="${t.attachment}" class="attachment-img">
                        `;
                    }

                    let repliesHtml = "";
                    if(t.replies && t.replies.length > 0) {
                        t.replies.forEach(r => {
                            const adminClass = r.isAdmin ? 'admin-reply' : '';
                            repliesHtml += `
                                <div class="comment ${adminClass}">
                                    <strong>${r.author}</strong> <span style="font-size:10px; opacity:0.5;">${r.date}</span><br>
                                    <span class="comment-text">${r.text}</span>
                                </div>
                            `;
                        });
                    }

                    let replyInput = "";
                    if(!isClosed) {
                        replyInput = `
                            <div class="reply-box">
                                <input type="text" class="reply-input" id="reply-${docSnap.id}" placeholder="Napisz odpowiedź...">
                                <button class="btn-cyber btn-reply" onclick="sendReply('${docSnap.id}')">📩</button>
                            </div>
                        `;
                    } else {
                        replyInput = `<div style="text-align:center; font-size:10px; color:#555; margin-top:10px;"><i>Możliwość komentowania została zablokowana.</i></div>`;
                    }

                    const html = `
                        <div class="ticket-card ${statusClass}">
                            ${actionHtml}
                            <div class="ticket-header">
                                <span class="status-badge">${t.type}</span>
                                <h3 class="ticket-title">${t.title}</h3>
                                <div class="ticket-meta">Zgłosił: <b>${t.author}</b> • ${date}</div>
                            </div>
                            
                            <div class="ticket-desc">${t.desc}</div>
                            ${attachmentHtml}
                            
                            <div class="comments-section">
                                ${repliesHtml}
                                ${replyInput}
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            });
        }

        window.toggleImage = (imgId, btnId) => {
            const img = document.getElementById(imgId);
            const btn = document.getElementById(btnId);
            
            if(img.style.display === "block") {
                img.style.display = "none";
                btn.innerText = "📷 Zobacz załącznik";
            } else {
                img.style.display = "block";
                btn.innerText = "❌ Ukryj załącznik";
            }
        };

        window.sendReply = async (id) => {
            const input = document.getElementById(`reply-${id}`);
            const text = input.value.trim();
            if(!text) return;

            const replyObj = {
                author: currentUser,
                text: text,
                date: new Date().toLocaleTimeString(),
                isAdmin: isAdmin
            };

            await updateDoc(doc(db, "tickets", id), {
                replies: arrayUnion(replyObj)
            });
            input.value = ""; 
        };

        window.changeStatus = async (id, newStatus) => {
            const action = newStatus === 'closed' ? "zamknąć" : "otworzyć ponownie";
            if(!confirm(`Czy na pewno chcesz ${action} to zgłoszenie?`)) return;
            await updateDoc(doc(db, "tickets", id), { status: newStatus });
        };

        window.deleteTicket = async (id) => {
            if(!confirm("⚠️ Czy na pewno trwale USUNĄĆ to zgłoszenie? Tego nie da się cofnąć!")) return;
            await deleteDoc(doc(db, "tickets", id));
        };
    </script>
</body>
</html>
