<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Service Desk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    
    <style>
        :root {
            --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
            --glass: rgba(15, 23, 42, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --open-green: #2ecc71; --closed-red: #e74c3c;
            --fault: #ff9f43; --consult: #0abde3; --critical: #ff0000;
        }

        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
            margin: 0; padding: 0; min-height: 100vh;
            overflow-x: hidden; user-select: none; -webkit-tap-highlight-color: transparent;
        }

        /* TŁO */
        #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* --- DASHBOARD --- */
        #main-app { display: none; position: relative; z-index: 10; padding: 20px; max-width: 800px; margin: 0 auto; }
        
        header { 
            display: flex; flex-direction: column; gap: 15px; 
            margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; 
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        h2 { color: var(--gold); margin: 0; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* SEARCH BAR */
        .search-container { width: 100%; position: relative; }
        .search-input {
            width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border); border-radius: 10px; color: #fff;
            font-size: 14px; box-sizing: border-box; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }

        /* PRZYCISKI */
        .btn-cyber {
            width: 100%; padding: 18px; border: none; border-radius: 10px;
            font-weight: 900; text-transform: uppercase; cursor: pointer;
            margin-top: 20px; transition: 0.2s; letter-spacing: 1px;
        }
        .btn-submit { background: linear-gradient(90deg, var(--gold), #e1b12c); color: black; }
        .btn-cancel { background: transparent; border: 1px solid var(--border); color: #aaa; }
        
        .btn-back { 
            width: auto; margin: 0; padding: 10px 20px; font-size: 12px; 
            background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: white;
            text-decoration: none; display: inline-block; border-radius: 10px;
        }
        
        /* Specjalny przycisk naprawczy dla Admina */
        .btn-fix-db {
            background: #ff4757; color: white; border: none; padding: 5px 10px;
            font-size: 10px; border-radius: 5px; cursor: pointer; display: none; /* Domyślnie ukryty */
            margin-top: 5px; width: fit-content;
        }

        .user-badge { font-size: 12px; color: var(--cyan); border: 1px solid var(--cyan); padding: 5px 10px; border-radius: 20px; display: inline-block; margin-top: 5px; }
        .user-badge.admin { color: #ff4757; border-color: #ff4757; }

        /* --- LISTA ZGŁOSZEŃ --- */
        .ticket-card {
            background: rgba(255,255,255,0.03); 
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
            transition: 0.3s; position: relative; overflow: hidden;
            backdrop-filter: blur(5px);
        }

        /* OTWARTE */
        .ticket-card.open { border: 1px solid var(--open-green); box-shadow: 0 0 10px rgba(46, 204, 113, 0.1); }
        /* ZAMKNIĘTE */
        .ticket-card.closed { border: 1px solid var(--closed-red); opacity: 0.7; filter: grayscale(0.2); }

        .ticket-header { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 15px; }
        
        .ticket-id {
            color: var(--cyan); font-weight: bold; font-family: monospace; 
            font-size: 14px; margin-right: 10px; text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
        }
        
        .ticket-title { font-size: 18px; font-weight: 900; color: #fff; margin: 8px 0 0 0; line-height: 1.2; display: flex; align-items: center; flex-wrap: wrap;}
        .ticket-meta { font-size: 11px; color: #888; margin-top: 5px; }

        /* Styl Plakietki Statusu */
        .status-badge { 
            padding: 5px 15px; border-radius: 20px; font-size: 10px; font-weight: bold; 
            text-transform: uppercase; letter-spacing: 1px; display: inline-block; 
        }
        
        .ticket-card.open .status-badge { 
            background: rgba(46, 204, 113, 0.2); color: var(--open-green); border: 1px solid var(--open-green);
        }
        .ticket-card.closed .status-badge { 
            background: rgba(231, 76, 60, 0.2); color: var(--closed-red); border: 1px solid var(--closed-red);
        }

        /* --- Umożliwienie zaznaczania tekstu --- */
        .ticket-desc { 
            background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin: 15px 0; 
            font-size: 14px; line-height: 1.5; color: #ddd; white-space: pre-wrap; 
            user-select: text; -webkit-user-select: text; cursor: text;
        }

        /* --- KOMENTARZE --- */
        .comments-section { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
        .comment { margin-bottom: 10px; font-size: 13px; position: relative; }
        .comment strong { color: var(--gold); }
        .comment.admin-reply strong { color: #ff4757; }
        
        .comment-text { 
            background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; 
            display: inline-block; margin-top: 2px;
            user-select: text; -webkit-user-select: text; cursor: text;
        }
        
        .admin-reply .comment-text { border-left: 3px solid #ff4757; background: rgba(255, 71, 87, 0.1); }

        .delete-comment-btn {
            position: absolute; right: 0; top: 0;
            background: transparent; border: none; color: #555; 
            cursor: pointer; font-size: 12px; padding: 2px 5px;
        }
        .delete-comment-btn:hover { color: #ff4757; }

        .reply-box { display: flex; gap: 10px; margin-top: 15px; align-items: flex-end; }
        
        /* ZMIANA: TEXTAREA ZAMIAST INPUT DLA ODPOWIEDZI */
        .reply-input { 
            flex-grow: 1; padding: 10px; margin: 0; background: rgba(0,0,0,0.5); 
            border: 1px solid var(--border); color: #fff; border-radius: 10px; 
            font-family: inherit; resize: vertical; min-height: 42px; max-height: 150px;
        }
        .btn-reply { 
            width: auto; margin: 0; background: var(--cyan); color: #000; 
            border: none; border-radius: 8px; cursor: pointer; padding: 0 15px; 
            font-weight: bold; height: 42px; display: flex; align-items: center; 
        }

        /* --- MODAL --- */
        #new-ticket-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal-content { background: #151b26; width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; border: 1px solid var(--gold); box-shadow: 0 0 50px rgba(212, 175, 55, 0.1); max-height: 90vh; overflow-y: auto; }
        
        input, select, textarea {
            width: 100%; padding: 15px; margin: 10px 0;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            color: #fff; border-radius: 10px; font-size: 16px; box-sizing: border-box; font-family: inherit;
        }
        select option { background: #000; color: #fff; }
        input:focus, textarea:focus, select:focus { border-color: var(--cyan); outline: none; }

        .file-upload { border: 1px dashed var(--border); padding: 20px; text-align: center; color: #888; cursor: pointer; border-radius: 10px; transition: 0.2s; position: relative; }
        .file-upload:hover { border-color: var(--cyan); color: var(--cyan); }
        .file-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .file-preview { max-width: 100%; height: auto; margin-top: 10px; display: none; border-radius: 5px; border: 1px solid var(--border); }

        .fab {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--gold), #e1b12c); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4); cursor: pointer; z-index: 100; color: #000; font-weight: bold;
            display: none; /* Ukryte do załadowania */
        }

        /* Przyciski Akcji Admina */
        .admin-actions { position: absolute; top: 20px; right: 20px; display: flex; gap: 5px; }
        .btn-action { border: none; padding: 5px 10px; border-radius: 5px; font-size: 10px; font-weight: bold; cursor: pointer; color: white; }
        .btn-close { background: #e74c3c; } 
        .btn-open { background: #2ecc71; } 
        .btn-delete { background: #333; border: 1px solid #555; } 

        .attachment-btn {
            background: rgba(0, 212, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan);
            padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-top: 10px; display: inline-block; text-decoration: none;
        }
        .attachment-img { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); display: none; }
        
        .closed-label {
            position: absolute; top: 20px; right: 20px; 
            color: var(--closed-red); font-weight: 900; font-size: 10px; 
            border: 1px solid var(--closed-red); padding: 4px 8px; border-radius: 4px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="main-app">
        <header>
            <div class="header-top">
                <div>
                    <h2>Lista Zgłoszeń</h2>
                    <div id="userInfo" class="user-badge">...</div>
                    <button id="fixDbBtn" class="btn-fix-db" onclick="fixOldTickets()">🛠️ ZRESTARTUJ NUMERACJĘ</button>
                </div>
                <a href="sg.html" class="btn-cyber btn-back">← Wróć do Menu</a>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Szukaj po numerze zgłoszenia..." onkeyup="filterTickets()">
            </div>
        </header>

        <div id="tickets-container">
            <p style="text-align:center; color:#888;">Ładowanie bazy zgłoszeń...</p>
        </div>
    </div>

    <div id="fab" class="fab" onclick="openModal()">+</div>

    <div id="new-ticket-modal">
        <div class="modal-content">
            <h2 style="color:var(--gold); margin-top:0;">Nowe Zgłoszenie</h2>
            
            <label style="font-size:12px; color:#888;">Typ zgłoszenia *</label>
            <select id="tType">
                <option value="Usterka">⚠️ Usterka</option>
                <option value="Konsultacje">🔵 Konsultacje</option>
                <option value="Krytyczny">🔥 Stan krytyczny</option>
            </select>

            <label style="font-size:12px; color:#888;">Tytuł *</label>
            <input type="text" id="tTitle" placeholder="Krótki tytuł problemu">

            <label style="font-size:12px; color:#888;">Opis zdarzenia *</label>
            <textarea id="tDesc" rows="5" placeholder="Opisz dokładnie co się stało..."></textarea>

            <label style="font-size:12px; color:#888;">Załączniki (Max 1 zdjęcie)</label>
            <div class="file-upload">
                <span id="file-label">📎 Kliknij, aby dodać zdjęcie</span>
                <input type="file" id="tFile" accept="image/*" onchange="previewFile()">
                <img id="filePreview" class="file-preview">
            </div>

            <button class="btn-cyber btn-submit" onclick="submitTicket()">Wyślij Zgłoszenie</button>
            <button class="btn-cyber btn-cancel" onclick="closeModal()">Anuluj</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, arrayUnion, serverTimestamp, getDoc, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", 
            authDomain: "obstaiwanie.firebaseapp.com", 
            projectId: "obstaiwanie" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ZABEZPIECZENIE (OCHRONIARZ) ---
        const currentUser = localStorage.getItem('cyberUser');
        if (!currentUser) {
            window.location.href = 'sg.html';
        }

        const isAdmin = (currentUser === 'Admin');
        let attachmentBase64 = null;

        // INICJALIZACJA UI
        document.getElementById('userInfo').innerText = isAdmin ? "ADMINISTRATOR" : currentUser;
        if(isAdmin) {
            document.getElementById('userInfo').classList.add('admin');
            document.getElementById('fixDbBtn').style.display = "inline-block"; // Pokaż przycisk naprawy tylko Adminowi
        }
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('fab').style.display = 'flex';

        // --- HELPER INICJAŁY ---
        const getInitials = (name) => {
            const map = {
                "Arek": "AŻ",
                "Paweł": "PP",
                "Grzesiek Sz": "GS",
                "Grzesiek P": "GP",
                "Mariusz": "MU",
                "Krzysiek": "KS",
                "Dominik": "DW"
            };
            return map[name] || "XX"; // XX dla nieznanych
        };

        // --- NAPRAWA STARYCH NUMERÓW (FUNKCJA ADMINA) ---
        window.fixOldTickets = async () => {
            if(!confirm("⚠️ Czy na pewno chcesz przeliczyć numerację WSZYSTKICH zgłoszeń od początku (chronologicznie)?\nTo naprawi zgłoszenia z numerem '0'.")) return;
            
            // Pobierz wszystkie, sortuj od najstarszego
            const qAll = query(collection(db, "tickets"), orderBy("timestamp", "asc"));
            const snap = await getDocs(qAll);
            
            let counter = 1;
            let promises = [];

            snap.forEach((docSnap) => {
                const ref = doc(db, "tickets", docSnap.id);
                // Nadpisujemy ticketIndex kolejnym numerem
                promises.push(updateDoc(ref, { ticketIndex: counter }));
                counter++;
            });

            await Promise.all(promises);
            alert(`Zaktualizowano numerację dla ${counter - 1} zgłoszeń.`);
        };

        // --- ANIMACJA TŁA ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];
        function initBg() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            pts = [];
            for (let i = 0; i < 60; i++) {
                pts.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4 });
            }
        }
        function drawBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pts.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.fillStyle = 'rgba(212, 175, 55, 0.5)'; 
                ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2); ctx.fill();
                for (let j = i + 1; j < pts.length; j++) {
                    const p2 = pts[j];
                    const d = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (d < 120) {
                        ctx.strokeStyle = `rgba(0, 212, 255, ${0.6 - d/300})`; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawBg);
        }
        window.onresize = initBg; initBg(); drawBg();

        // --- LOGIKA MODALI ---
        window.openModal = () => document.getElementById('new-ticket-modal').style.display = 'flex';
        window.closeModal = () => {
            document.getElementById('new-ticket-modal').style.display = 'none';
            document.getElementById('tFile').value = "";
            document.getElementById('filePreview').style.display = 'none';
            document.getElementById('file-label').innerText = "📎 Kliknij, aby dodać zdjęcie";
            attachmentBase64 = null;
        };

        window.previewFile = () => {
            const file = document.getElementById('tFile').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const img = new Image();
                    img.src = reader.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_SIZE = 800;
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        attachmentBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        const preview = document.getElementById('filePreview');
                        preview.src = attachmentBase64; preview.style.display = "block";
                        document.getElementById('file-label').innerText = "✅ Zdjęcie dodane!";
                    };
                };
                reader.readAsDataURL(file);
            }
        };

        window.submitTicket = async () => {
            const type = document.getElementById('tType').value;
            const title = document.getElementById('tTitle').value;
            const desc = document.getElementById('tDesc').value;
            if(!title || !desc) return alert("Wypełnij tytuł i opis!");

            // 1. Pobierz ostatni numer zgłoszenia (aby wyliczyć X dla nowego)
            const qLast = query(collection(db, "tickets"), orderBy("ticketIndex", "desc"), limit(1));
            const snapLast = await getDocs(qLast);
            let newIndex = 1;
            if (!snapLast.empty) {
                const lastData = snapLast.docs[0].data();
                if (lastData.ticketIndex) {
                    newIndex = lastData.ticketIndex + 1;
                }
            }

            const ticketData = { 
                type, title, desc, author: currentUser, 
                timestamp: serverTimestamp(), status: 'open', 
                replies: [], attachment: attachmentBase64,
                ticketIndex: newIndex // Zapisujemy numer porządkowy
            };

            await addDoc(collection(db, "tickets"), ticketData);
            closeModal();
            document.getElementById('tTitle').value = ""; document.getElementById('tDesc').value = "";
        };

        // --- FILTROWANIE ---
        window.filterTickets = () => {
            const input = document.getElementById('searchInput');
            const filter = input.value.toUpperCase();
            const cards = document.getElementsByClassName('ticket-card');

            for (let i = 0; i < cards.length; i++) {
                const idSpan = cards[i].querySelector('.ticket-id');
                if (idSpan) {
                    const txtValue = idSpan.textContent || idSpan.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        cards[i].style.display = "";
                    } else {
                        cards[i].style.display = "none";
                    }
                }       
            }
        };

        // --- ŁADOWANIE DANYCH ---
        const q = query(collection(db, "tickets"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('tickets-container');
            container.innerHTML = "";
            if(snapshot.empty) { container.innerHTML = "<p style='text-align:center; color:#666;'>Brak zgłoszeń.</p>"; return; }

            snapshot.forEach(docSnap => {
                const t = docSnap.data();
                const dateObj = t.timestamp ? new Date(t.timestamp.seconds * 1000) : new Date();
                const dateStr = dateObj.toLocaleString();
                const typeClass = t.type === 'Stan krytyczny' ? 'Krytyczny' : t.type;
                const isClosed = t.status === 'closed';
                const statusClass = isClosed ? 'closed' : 'open';
                
                // GENEROWANIE NUMERU ZGŁOSZENIA
                const x = t.ticketIndex ? t.ticketIndex : "0"; // 0 jeśli jeszcze nie naprawiono bazy
                const yy = getInitials(t.author);
                const rok = dateObj.getFullYear();
                const fullTicketId = `SD.${x}.${yy}.${rok}`;

                let actionHtml = "";
                if(isAdmin) {
                    actionHtml += `<div class="admin-actions">`;
                    if(!isClosed) actionHtml += `<button class="btn-action btn-close" onclick="changeStatus('${docSnap.id}', 'closed')">ZAMKNIJ</button>`;
                    else actionHtml += `<button class="btn-action btn-open" onclick="changeStatus('${docSnap.id}', 'open')">OTWÓRZ</button>`;
                    actionHtml += `<button class="btn-action btn-delete" onclick="deleteTicket('${docSnap.id}')">USUŃ</button>`;
                    actionHtml += `</div>`;
                } else if(isClosed) {
                        actionHtml = `<div class="closed-label">ZGŁOSZENIE ZAMKNIĘTE</div>`;
                }

                let attachmentHtml = "";
                if(t.attachment) {
                    const imgId = `img-${docSnap.id}`; const btnId = `btn-${docSnap.id}`;
                    attachmentHtml = `<button id="${btnId}" class="attachment-btn" onclick="toggleImage('${imgId}', '${btnId}')">📷 Zobacz załącznik</button><img id="${imgId}" src="${t.attachment}" class="attachment-img">`;
                }

                let repliesHtml = "";
                if(t.replies && t.replies.length > 0) {
                    t.replies.forEach((r, idx) => {
                        const adminClass = r.isAdmin ? 'admin-reply' : '';
                        let deleteBtn = "";
                        if(isAdmin) {
                            deleteBtn = `<button class="delete-comment-btn" onclick="deleteComment('${docSnap.id}', ${idx})">🗑️</button>`;
                        }
                        
                        // ZAMIANA \n NA <BR> DLA WIELOWIERSZOWYCH KOMENTARZY
                        const formattedText = r.text.replace(/\n/g, '<br>');

                        repliesHtml += `
                            <div class="comment ${adminClass}">
                                ${deleteBtn}
                                <strong>${r.author}</strong> <span style="font-size:10px; opacity:0.5;">${r.date}</span><br>
                                <span class="comment-text">${formattedText}</span>
                            </div>
                        `;
                    });
                }

                let replyInput = "";
                if(!isClosed) {
                    // ZMIANA: TEXTAREA ZAMIAST INPUT
                    replyInput = `
                        <div class="reply-box">
                            <textarea class="reply-input" id="reply-${docSnap.id}" placeholder="Napisz odpowiedź... (Enter wysyła, Shift+Enter nowa linia)"></textarea>
                            <button class="btn-cyber btn-reply" onclick="sendReply('${docSnap.id}')">📩</button>
                        </div>`;
                } else {
                    replyInput = `<div style="text-align:center; font-size:10px; color:#555; margin-top:10px;"><i>Możliwość komentowania została zablokowana.</i></div>`;
                }

                const html = `
                    <div class="ticket-card ${statusClass}">
                        ${actionHtml}
                        <div class="ticket-header">
                            <span class="status-badge">${t.type}</span>
                            <h3 class="ticket-title">
                                <span class="ticket-id">${fullTicketId}</span>
                                ${t.title}
                            </h3>
                            <div class="ticket-meta">Zgłosił: <b>${t.author}</b> • ${dateStr}</div>
                        </div>
                        <div class="ticket-desc">${t.desc}</div>
                        ${attachmentHtml}
                        <div class="comments-section">${repliesHtml} ${replyInput}</div>
                    </div>
                `;
                container.innerHTML += html;
                
                // Obsługa Shift+Enter dla textarea
                if(!isClosed) {
                    setTimeout(() => {
                        const txtArea = document.getElementById(`reply-${docSnap.id}`);
                        if(txtArea) {
                            txtArea.addEventListener('keydown', function(e) {
                                if (e.key === 'Enter' && !e.shiftKey) {
                                    e.preventDefault(); // Zatrzymaj nową linię
                                    sendReply(docSnap.id); // Wyślij
                                }
                            });
                        }
                    }, 100);
                }
            });
        });

        window.toggleImage = (imgId, btnId) => {
            const img = document.getElementById(imgId); const btn = document.getElementById(btnId);
            if(img.style.display === "block") { img.style.display = "none"; btn.innerText = "📷 Zobacz załącznik"; } 
            else { img.style.display = "block"; btn.innerText = "❌ Ukryj załącznik"; }
        };

        window.sendReply = async (id) => {
            const input = document.getElementById(`reply-${id}`); 
            const text = input.value.trim();
            if(!text) return;
            const replyObj = { author: currentUser, text: text, date: new Date().toLocaleTimeString(), isAdmin: isAdmin };
            await updateDoc(doc(db, "tickets", id), { replies: arrayUnion(replyObj) });
            input.value = ""; 
        };

        window.deleteComment = async (ticketId, commentIndex) => {
            if(!confirm("Usunąć ten komentarz?")) return;
            
            const ticketRef = doc(db, "tickets", ticketId);
            const ticketSnap = await getDoc(ticketRef);
            
            if (ticketSnap.exists()) {
                const data = ticketSnap.data();
                const newReplies = data.replies;
                
                // Usuń element o podanym indeksie
                newReplies.splice(commentIndex, 1);
                
                await updateDoc(ticketRef, { replies: newReplies });
            }
        };

        window.changeStatus = async (id, newStatus) => {
            const action = newStatus === 'closed' ? "zamknąć" : "otworzyć ponownie";
            if(!confirm(`Czy na pewno chcesz ${action} to zgłoszenie?`)) return;
            await updateDoc(doc(db, "tickets", id), { status: newStatus });
        };

        window.deleteTicket = async (id) => {
            if(!confirm("⚠️ Czy na pewno trwale USUNĄĆ to zgłoszenie? Tego nie da się cofnąć!")) return;
            await deleteDoc(doc(db, "tickets", id));
        };
    </script>
</body>
</html>
