<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber Add - Protokół XXII</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <style>
    :root {
      --gold: #d4af37;
      --cyan: #00d4ff;
      --bg: #050810;
      --glass: rgba(30, 41, 59, 0.7);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: #fff;
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; }

    .header-system {
      position: fixed;
      top: 10%;
      text-align: center;
      z-index: 2;
    }

    .header-system h1 { 
      margin: 0; font-size: clamp(24px, 8vw, 32px); letter-spacing: 4px;
      background: linear-gradient(to right, var(--gold), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .container {
      background: var(--glass);
      backdrop-filter: blur(15px);
      padding: clamp(20px, 5vw, 40px);
      border-radius: 30px;
      width: 90%;
      max-width: 400px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      z-index: 10;
      text-align: center;
    }

    .input-box { margin-bottom: 25px; text-align: left; }
    .input-box label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
      color: var(--gold); font-weight: bold; margin-bottom: 10px; display: block;
    }

    select, input {
      width: 100%; padding: 15px; font-size: 16px; border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4);
      color: #fff; outline: none; transition: 0.3s; box-sizing: border-box;
    }

    select:focus, input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
    }

    .btn-cyber {
      width: 100%; padding: 18px; background: none; color: var(--gold);
      border: 2px solid var(--gold); border-radius: 15px;
      font-size: 16px; font-weight: 900; cursor: pointer;
      position: relative; overflow: hidden; transition: 0.3s;
      text-transform: uppercase; letter-spacing: 3px;
    }

    .btn-cyber:hover { background: rgba(212, 175, 55, 0.15); box-shadow: 0 0 25px rgba(212, 175, 55, 0.5); }

    .scan-line {
      position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), transparent);
    }

    .processing .scan-line { animation: scan 1.5s infinite; }
    @keyframes scan { 0% { left: -100%; } 100% { left: 100%; } }

    #msg { margin-top: 25px; font-size: 14px; letter-spacing: 1px; font-weight: bold; min-height: 20px; }

    .status-panel {
      margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(212, 175, 55, 0.2);
      font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      .container { padding: 25px 20px; }
      .header-system { top: 5%; }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="header-system">
    <h1 id="greeting">Protokół_Aktywny</h1>
    <p style="font-size: 10px; color: var(--cyan); margin-top: 5px; letter-spacing: 1px;">AUTORYZOWANO PRZEZ SYSTEM OBSTAWIANIA</p>
  </div>

  <div class="container">
    <div class="input-box">
      <label>Identyfikacja Jednostki</label>
      <select id="name">
        <option value="">Wybierz...</option>
        <option value="Arek">Arek</option>
        <option value="Paweł">Paweł</option>
        <option value="Grzesiek Sz">Grzesiek Sz</option>
        <option value="Grzesiek P">Grzesiek P</option>
        <option value="Krzysiek">Krzysiek</option>
        <option value="Mariusz">Mariusz</option>
        <option value="Dominik">Dominik</option>
      </select>
    </div>

    <div class="input-box">
      <label>Współrzędne Czasowe (Godzina)</label>
      <input id="hour" type="time">
    </div>

    <button class="btn-cyber" id="saveBtn" onclick="saveData()">
      <span class="btn-text">Transferuj Dane</span>
      <div class="scan-line"></div>
    </button>

    <p id="msg"></p>

    <div class="status-panel">
      Aktywne transfery w sesji: <span id="playerCount" style="color: var(--cyan);">0</span>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI",
  authDomain: "obstaiwanie.firebaseapp.com",
  projectId: "obstaiwanie"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// --- ANIMACJA TŁA XXII WIEK ---
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resize; resize();

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.speed = Math.random() * 0.5 + 0.2;
    this.size = Math.random() * 1.5;
  }
  update() {
    this.y -= this.speed;
    if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
  }
  draw() {
    ctx.fillStyle = 'rgba(212, 175, 55, 0.3)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}
for (let i = 0; i < 100; i++) particles.push(new Particle());
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animate);
}
animate();

// --- LOGIKA FORMULARZA ---
onSnapshot(collection(db, "users"), (snapshot) => {
    document.getElementById("playerCount").innerText = snapshot.size;
});

window.saveData = async function() {
  const name = document.getElementById("name").value;
  const hour = document.getElementById("hour").value;
  const btn = document.getElementById("saveBtn");
  const msg = document.getElementById("msg");

  if (!name || !hour) {
    msg.style.color = "#ff4d4d";
    msg.innerText = "BŁĄD: BRAK DANYCH WEJŚCIOWYCH";
    return;
  }

  btn.classList.add("processing");
  btn.querySelector(".btn-text").innerText = "TRANSFEROWANIE...";

  try {
    await addDoc(collection(db, "users"), { name, hour, timestamp: Date.now() });

    setTimeout(() => {
        btn.classList.remove("processing");
        btn.querySelector(".btn-text").innerText = "TRANSFER ZAKOŃCZONY";
        msg.style.color = "var(--cyan)";
        msg.innerText = "DANE ZOSTAŁY ZAPISANE W CHMURZE";
        document.getElementById("name").value = "";
        document.getElementById("hour").value = "";
    }, 1500);

    setTimeout(() => { 
        msg.innerText = ""; 
        btn.querySelector(".btn-text").innerText = "Transferuj Dane";
    }, 4500);

  } catch (e) {
    btn.classList.remove("processing");
    msg.innerText = "CRITICAL ERROR: TRANSFER PRZERWANY";
  }
};
</script>
</body>
</html>
