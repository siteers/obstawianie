<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Add | Nightmare Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <style>
    :root {
      --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
      --glass: rgba(15, 23, 42, 0.85); --error: #ff0000;
    }

    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
      margin: 0; overflow: hidden; display: flex; justify-content: center;
      align-items: center; min-height: 100vh; perspective: 1000px; transition: 0.3s;
    }

    /* --- EFEKTY KOSZMARU --- */
    .nightmare-mode { background: #400 !important; filter: invert(1) hue-rotate(180deg) contrast(200%) blur(1px) !important; }
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-5px, 5px); }
      40% { transform: translate(-5px, -5px); }
      60% { transform: translate(5px, 5px); }
      80% { transform: translate(5px, -5px); }
      100% { transform: translate(0); }
    }
    .nightmare-shake { animation: glitch 0.2s infinite !important; }

    #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; }
    .tilt-box { z-index: 10; width: 100%; display: flex; justify-content: center; transition: transform 0.1s ease-out; transform-style: preserve-3d; }

    .container {
      background: var(--glass); backdrop-filter: blur(25px); padding: 30px; border-radius: 40px;
      width: 90vw; max-width: 400px; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); text-align: center; position: relative; box-sizing: border-box;
    }

    h2 { margin: 0 0 25px 0; font-size: 24px; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }

    .input-box { margin-bottom: 15px; text-align: left; }
    .input-box label { font-size: 10px; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; display: block; }

    .slot-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .slot-btn {
        padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px; color: #888; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase;
    }
    .slot-btn.active { border-color: var(--cyan); color: #fff; background: rgba(0, 212, 255, 0.2); box-shadow: 0 0 15px var(--cyan); }
    .slot-btn:disabled { opacity: 0.2; cursor: not-allowed; }

    select, input {
      display: block; width: 100%; padding: 14px; font-size: 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: #fff; outline: none; box-sizing: border-box;
    }

    .btn-cyber {
      width: 100%; padding: 18px; background: var(--gold); color: #000; border: none; border-radius: 15px;
      font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 20px;
    }
    .btn-cyber:disabled { background: #334; color: #667; }

    #forgot-link {
        display: block; margin-top: 10px; font-size: 11px; color: var(--cyan); 
        text-decoration: none; font-weight: bold; cursor: pointer; opacity: 0.7;
    }
    #forgot-link:hover { opacity: 1; text-decoration: underline; }

    #msg { margin-top: 15px; font-size: 13px; font-weight: bold; min-height: 20px; }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="tilt-box" id="tiltCard">
    <div class="container" id="mainContainer">
      <h2 id="mainHeader">System Logowania</h2>

      <div class="input-box">
        <label>Użytkownik</label>
        <select id="name" onchange="checkUserAuth()">
          <option value="">Wybierz...</option>
          <option value="Arek">Arek</option><option value="Paweł">Paweł</option><option value="Grzesiek Sz">Grzesiek Sz</option>
          <option value="Grzesiek P">Grzesiek P</option><option value="Krzysiek">Krzysiek</option><option value="Mariusz">Mariusz</option><option value="Dominik">Dominik</option>
        </select>
      </div>

      <div class="input-box">
        <label>Cel Obstawiania</label>
        <div class="slot-selector">
            <button class="slot-btn" id="slot1Btn" onclick="selectSlot('slot1')">---</button>
            <button class="slot-btn" id="slot2Btn" onclick="selectSlot('slot2')">---</button>
        </div>
      </div>

      <div class="input-box">
        <label>Godzina</label>
        <input id="hour" type="time" oninput="validateForm()">
      </div>

      <div id="auth-section" style="display:none;">
        <div class="input-box">
            <label id="main-pass-label">Hasło Dostępowe</label>
            <input id="password" type="password" placeholder="••••" oninput="validateForm()">
            <a id="forgot-link" onclick="forgotPassword()">Zapomniałem hasła</a>
        </div>
        <div class="input-box" id="pass-confirm-box" style="display:none;"><label>Potwierdź nowe hasło</label><input id="password-confirm" type="password" placeholder="••••" oninput="validateForm()"></div>
      </div>

      <button class="btn-cyber" id="saveBtn" onclick="saveData()" disabled>Zatwierdź Dane</button>
      <p id="msg"></p>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDoc, setDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let isFirstTime = false, isResetMode = false, selectedSlot = null, currentTargets = { t1: null, t2: null }, slotLocks = { l1: false, l2: false };

onSnapshot(doc(db, "appState", "status"), (snap) => {
    const data = snap.data(); if(!data) return;
    currentTargets.t1 = data.target1; currentTargets.t2 = data.target2;
    slotLocks.l1 = data.isLocked1 || false; slotLocks.l2 = data.isLocked2 || false;
    document.getElementById('slot1Btn').innerText = (data.target1 && data.target1 !== "Brak") ? data.target1 : "NIEAKTYWNY";
    document.getElementById('slot2Btn').innerText = (data.target2 && data.target2 !== "Brak") ? data.target2 : "NIEAKTYWNY";
    updateSlotAvailability();
});

function updateSlotAvailability() {
    const name = document.getElementById('name').value;
    const s1 = document.getElementById('slot1Btn'), s2 = document.getElementById('slot2Btn');
    s1.disabled = (!currentTargets.t1 || currentTargets.t1 === "Brak" || name === currentTargets.t1 || slotLocks.l1);
    s2.disabled = (!currentTargets.t2 || currentTargets.t2 === "Brak" || name === currentTargets.t2 || slotLocks.l2);
    validateForm();
}

window.selectSlot = (slot) => {
    selectedSlot = slot;
    document.getElementById('slot1Btn').classList.toggle('active', slot === 'slot1');
    document.getElementById('slot2Btn').classList.toggle('active', slot === 'slot2');
    validateForm();
};

window.checkUserAuth = async function() {
    const name = document.getElementById('name').value;
    updateSlotAvailability();
    if (!name) { document.getElementById('auth-section').style.display = 'none'; return; }
    const userDoc = await getDoc(doc(db, "passwords", name));
    document.getElementById('auth-section').style.display = 'block';
    isFirstTime = !userDoc.exists();
    isResetMode = false;
    document.getElementById('pass-confirm-box').style.display = isFirstTime ? 'block' : 'none';
    document.getElementById('main-pass-label').innerText = isFirstTime ? "Ustaw Nowe Hasło" : "Hasło Dostępowe";
    validateForm();
}

window.validateForm = function() {
    const name = document.getElementById('name').value, hour = document.getElementById('hour').value, pass = document.getElementById('password').value;
    const pass2 = document.getElementById('password-confirm').value;
    const btn = document.getElementById('saveBtn');
    
    let isValid = name && hour && pass && selectedSlot;
    if (isFirstTime || isResetMode) isValid = isValid && (pass === pass2);
    btn.disabled = !isValid;
}

// RESET HASŁA KODEM 0000
window.forgotPassword = () => {
    const name = document.getElementById('name').value;
    if(!name) { alert("Wybierz użytkownika!"); return; }
    const code = prompt("AUTORYZACJA ADMINA - WPISZ KOD:");
    if(code === "0000") {
        isResetMode = true;
        document.getElementById('pass-confirm-box').style.display = 'block';
        document.getElementById('main-pass-label').innerText = "USTAW NOWE HASŁO";
        alert("Autoryzacja pomyślna. Wprowadź nowe hasło dwukrotnie.");
    } else {
        alert("BŁĘDNY KOD ADMINA.");
    }
}

window.saveData = async function() {
    const name = document.getElementById('name').value, hour = document.getElementById('hour').value, pass = document.getElementById('password').value;
    const msg = document.getElementById('msg'), btn = document.getElementById('saveBtn'), container = document.getElementById('mainContainer');
    
    btn.disabled = true;
    try {
        if (isFirstTime || isResetMode) {
            await setDoc(doc(db, "passwords", name), { password: pass });
        } else {
            const userDoc = await getDoc(doc(db, "passwords", name));
            if (userDoc.data().password !== pass) {
                document.body.classList.add('nightmare-mode');
                container.classList.add('nightmare-shake');
                document.getElementById('mainHeader').innerText = "FATAL ERROR: BREACH";
                msg.style.color = "#ff0000"; msg.innerText = "BŁĘDNE HASŁO. NARUSZENIE ZAPISANE.";
                if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 300]);
                setTimeout(() => {
                    document.body.classList.remove('nightmare-mode');
                    container.classList.remove('nightmare-shake');
                    document.getElementById('mainHeader').innerText = "System Logowania";
                    btn.disabled = false;
                }, 1500);
                return;
            }
        }
        await addDoc(collection(db, "users"), { name, hour, targetSlot: selectedSlot, timestamp: Date.now() });
        msg.style.color = "var(--cyan)"; msg.innerText = "AUTORYZACJA PRZYJĘTA.";
        setTimeout(() => location.reload(), 1500);
    } catch (e) { alert(e.message); btn.disabled = false; }
}

// --- KONSTELACJA POWRÓT ---
const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let particles = [];
for (let i = 0; i < 60; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
        ctx.fillStyle = 'rgba(212, 175, 55, 0.4)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
        for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j]; const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 120) {
                ctx.strokeStyle = `rgba(0, 212, 255, ${1 - dist/120})`; ctx.lineWidth = 0.5;
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            }
        }
    }); requestAnimationFrame(draw);
} draw();

document.addEventListener('mousemove', (e) => {
    const x = (window.innerWidth / 2 - e.pageX) / 45;
    const y = (window.innerHeight / 2 - e.pageY) / 45;
    document.getElementById('tiltCard').style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
});
</script>
</body>
</html>
