<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Dodaj użytkownika</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">

  <style>
    :root {
      --primary: #0077ff;
      --success: #00ff88;
      --bg-light: #f4f7f6;
      --card-light: #ffffff;
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-light);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: all 0.3s ease;
    }

    body.dark {
      background: var(--bg-dark);
      color: #f1f5f9;
    }

    /* NAGŁÓWEK POWITALNY */
    .welcome-text {
      margin-bottom: 20px;
      text-align: center;
    }
    .welcome-text h1 { margin: 0; font-size: 24px; }
    .welcome-text p { opacity: 0.7; margin: 5px 0; }

    .container {
      background: var(--card-light);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    body.dark .container {
      background: var(--card-dark);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* INPUTY I SELECTY */
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
      opacity: 0.8;
    }

    select, input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      background: #fff;
      transition: 0.3s;
      box-sizing: border-box;
      outline: none;
    }

    body.dark select, body.dark input {
      background: #334155;
      border-color: #475569;
      color: #fff;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0,119,255,0.2);
    }

    button.save-btn {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 4px 12px rgba(0,119,255,0.3);
    }

    button.save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,119,255,0.4);
    }

    button.save-btn:active { transform: scale(0.98); }

    /* STATUS "KTO JUŻ DODAŁ" */
    .status-list {
      margin-top: 25px;
      font-size: 13px;
      background: rgba(0,0,0,0.03);
      padding: 10px;
      border-radius: 10px;
    }
    body.dark .status-list { background: rgba(255,255,255,0.03); }
    .status-item { display: inline-block; margin: 3px; padding: 4px 8px; background: rgba(0,119,255,0.1); border-radius: 6px; }

    #darkModeBtn {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 10px 18px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      background: #1e293b;
      color: #fff;
      z-index: 1000;
      transition: 0.3s;
    }

    body.dark #darkModeBtn { background: #f1f5f9; color: #1e293b; }

    #msg {
      margin-top: 15px;
      font-weight: bold;
      min-height: 20px;
    }

    /* ANIMACJA SUKCESU */
    .success-pulse { animation: pulse 0.5s ease; }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); border-color: var(--success); }
      100% { transform: scale(1); }
    }

    @media (max-width: 480px) {
      .container { padding: 20px; }
      body { padding: 15px; }
    }
  </style>
</head>

<body class="dark">
  <button id="darkModeBtn">☀️ Light mode</button>

  <div class="welcome-text">
    <h1 id="greeting">Dzień dobry!</h1>
    <p>Gotowy na dzisiejsze obstawianie?</p>
  </div>

  <div class="container" id="formContainer">
    <div class="input-group">
      <label>Kim jesteś?</label>
      <select id="name">
        <option value="">Wybierz swoje imię</option>
        <option value="Arek">Arek</option>
        <option value="Paweł">Paweł</option>
        <option value="Grzesiek Sz">Grzesiek Sz</option>
        <option value="Grzesiek P">Grzesiek P</option>
        <option value="Krzysiek">Krzysiek</option>
        <option value="Mariusz">Mariusz</option>
        <option value="Dominik">Dominik</option>
      </select>
    </div>

    <div class="input-group">
      <label>O której kończysz?</label>
      <input id="hour" type="time">
    </div>

    <button class="save-btn" onclick="saveData()">Zatwierdź zgłoszenie</button>

    <p id="msg"></p>

    <div class="status-list" id="statusList">
      <div style="margin-bottom: 5px; opacity: 0.6;">Ostatnio dodali:</div>
      <div id="recentUsers">...</div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, limit, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI",
  authDomain: "obstaiwanie.firebaseapp.com",
  projectId: "obstaiwanie",
  storageBucket: "obstaiwanie.firebasestorage.app",
  messagingSenderId: "64783465818",
  appId: "1:64783465818:web:0a9aa45acf40e351ae8763"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// DYNAMICZNE POWITANIE
const hour = new Date().getHours();
const greeting = document.getElementById("greeting");
if (hour < 12) greeting.innerText = "Dzień dobry!";
else if (hour < 18) greeting.innerText = "Miłego popołudnia!";
else greeting.innerText = "Dobry wieczór!";

// DARK MODE
const darkBtn = document.getElementById("darkModeBtn");
darkBtn.onclick = () => {
    document.body.classList.toggle("dark");
    darkBtn.textContent = document.body.classList.contains("dark") ? "☀️ Light mode" : "🌙 Dark mode";
};

// PODGLĄD "OSTATNIO DODALI" (LIVE)
onSnapshot(query(collection(db, "users"), limit(5)), (snapshot) => {
    const recentDiv = document.getElementById("recentUsers");
    const names = snapshot.docs.map(doc => doc.data().name);
    if(names.length === 0) {
      recentDiv.innerText = "Brak zgłoszeń";
      return;
    }
    recentDiv.innerHTML = names.map(n => `<span class="status-item">${n}</span>`).join("");
});

// ZAPIS DANYCH
window.saveData = async function() {
  const nameEl = document.getElementById("name");
  const hourEl = document.getElementById("hour");
  const container = document.getElementById("formContainer");
  const msg = document.getElementById("msg");

  if (!nameEl.value || !hourEl.value) {
    msg.style.color = "red";
    msg.innerText = "Uzupełnij oba pola!";
    return;
  }

  try {
    await addDoc(collection(db, "users"), {
      name: nameEl.value,
      hour: hourEl.value,
      timestamp: new Date()
    });

    // Efekt sukcesu
    container.classList.add("success-pulse");
    msg.style.color = "var(--success)";
    msg.innerText = "Zgłoszenie wysłane! 🚀";
    
    nameEl.value = "";
    hourEl.value = "";

    setTimeout(() => {
      msg.innerText = "";
      container.classList.remove("success-pulse");
    }, 3000);

  } catch (e) {
    alert("Błąd: " + e.message);
  }
};
</script>
</body>
</html>
