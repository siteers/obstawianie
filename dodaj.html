<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Bet | Operator Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cyber-Bet">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    :root {
      --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
      --glass: rgba(15, 23, 42, 0.85); --error: #ff0000; --gray: #475569;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
      margin: 0; overflow: hidden; display: flex; justify-content: center;
      align-items: center; min-height: 100vh; perspective: 1000px;
      touch-action: manipulation;
    }
    
    @keyframes syncPulse {
        0%, 100% { opacity: 1; text-shadow: 0 0 5px var(--error); border-color: var(--error); box-shadow: 0 0 5px var(--error); }
        50% { opacity: 0.3; text-shadow: 0 0 25px var(--error); border-color: #ff5555; background: rgba(255, 0, 0, 0.2); box-shadow: 0 0 20px var(--error); }
    }
    .group-locked .target-name { color: var(--error) !important; animation: syncPulse 1s infinite; }
    .group-locked input { animation: syncPulse 1s infinite; border: 2px solid var(--error) !important; pointer-events: none; }
    .target-disabled { opacity: 0.25 !important; filter: grayscale(1); pointer-events: none; }
    #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
    .tilt-box { z-index: 10; width: 100%; display: flex; justify-content: center; transform-style: preserve-3d; }
    .container {
      background: var(--glass); backdrop-filter: blur(25px); padding: 35px; border-radius: 40px;
      width: 95vw; max-width: 440px; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); text-align: center; position: relative; box-sizing: border-box;
      display: none; /* Ukryte do załadowania */
    }
    h2 { margin: 0 0 30px 0; font-size: 16px; color: var(--gold); text-transform: uppercase; letter-spacing: 3px; font-weight: 900; }
    .input-box { margin-bottom: 25px; text-align: center; }
    .input-box label { font-size: 9px; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; display: block; letter-spacing: 2px; }
    
    .user-display {
      width: 100%; padding: 16px; font-size: 16px; border-radius: 20px;
      border: 2px solid var(--cyan); background: rgba(0,0,0,0.7);
      color: #fff; text-align: center; font-weight: 900;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
      box-sizing: border-box;
    }

    .target-group { display: flex; flex-direction: column; align-items: center; gap: 12px; transition: 0.4s; }
    .target-name {
        font-size: 14px; font-weight: 900; color: var(--cyan); 
        text-transform: uppercase; transition: 0.3s; height: 18px;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.6); letter-spacing: 1px;
    }
    .hour-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    input {
      display: block; width: 100%; padding: 16px; font-size: 20px; border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.5); color: #fff; outline: none; box-sizing: border-box;
      transition: 0.2s; text-align: center; font-family: 'JetBrains Mono', monospace;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0, 212, 255, 0.25); background: rgba(0, 212, 255, 0.05); }
    .btn-cyber {
      width: 100%; padding: 20px; background: var(--gold); color: #000; border: none; border-radius: 20px;
      font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: 0.3s;
    }
    .btn-cyber:active { transform: scale(0.96); }
    .btn-cyber:disabled { background: #1a1b26; color: #444; box-shadow: none; opacity: 0.7; cursor: not-allowed; }
    
    /* STYL PRZYCISKU POWROTU */
    .btn-back { 
        display: block; width: 100%; padding: 15px; margin-top: 15px; 
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); 
        color: #aaa; text-decoration: none; font-size: 11px; font-weight: bold; 
        text-transform: uppercase; letter-spacing: 1px; border-radius: 15px; 
        box-sizing: border-box; transition: 0.2s; cursor: pointer; text-align: center;
    }
    .btn-back:hover { background: rgba(255, 255, 255, 0.1); color: #fff; border-color: rgba(255, 255, 255, 0.3); }

    #msg { margin-top: 20px; font-size: 12px; font-weight: 900; min-height: 20px; text-transform: uppercase; }
    
    #voteLimitDisplay {
        color: #ff4757; font-size: 12px; margin-top: 10px; 
        font-weight: bold; letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="tilt-box" id="tiltCard">
    <div class="container" id="mainContainer">
      <h2>System Autoryzacji</h2>

      <div class="input-box">
        <label>Operator Systemu</label>
        <div id="userNameDisplay" class="user-display">---</div>
        <div id="voteLimitDisplay">ŁADOWANIE LIMITU...</div>
      </div>

      <div class="hour-grid">
          <div class="target-group" id="group1">
              <span id="targetName1" class="target-name">---</span>
              <div id="targetAvg1" style="font-size: 9px; color: #888; margin-top: -6px; margin-bottom: 6px; font-weight: bold; letter-spacing: 1px; display: none;"></div>
              <input id="hour1" type="text" placeholder="--:--:--" inputmode="numeric" maxlength="8" 
                     oninput="formatTime(this)" 
                     onkeydown="if(event.key === 'Enter' && !document.getElementById('saveBtn').disabled) saveData()">
          </div>
          <div class="target-group" id="group2">
              <span id="targetName2" class="target-name">---</span>
              <div id="targetAvg2" style="font-size: 9px; color: #888; margin-top: -6px; margin-bottom: 6px; font-weight: bold; letter-spacing: 1px; display: none;"></div>
              <input id="hour2" type="text" placeholder="--:--:--" inputmode="numeric" maxlength="8" 
                     oninput="formatTime(this)"
                     onkeydown="if(event.key === 'Enter' && !document.getElementById('saveBtn').disabled) saveData()">
          </div>
      </div>

      <button class="btn-cyber" id="saveBtn" onclick="saveData()" disabled>Zatwierdź Dane</button>
      
      <a href="sg.html" class="btn-back">← WRÓĆ DO HUB</a>
      
      <p id="msg"></p>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, onSnapshot, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

// --- OCHRONIARZ ---
const currentUser = localStorage.getItem('cyberUser');
if (!currentUser) {
    window.location.href = 'sg.html';
}

document.getElementById('userNameDisplay').innerText = currentUser;
document.getElementById('mainContainer').style.display = 'block';

let currentTargets = { t1: null, t2: null }, slotLocks = { l1: false, l2: false };
let votesLeft = 20; 
let targetAverages = {}; 

async function fetchUserStats() {
    const userRef = doc(db, "ranking", currentUser);
    const userSnap = await getDoc(userRef);
    if (userSnap.exists()) {
        const data = userSnap.data();
        let used = data.votesThisMonth || 0;
        votesLeft = Math.max(0, 20 - used);
    } else {
        votesLeft = 20;
    }
    
    const limitDisplay = document.getElementById('voteLimitDisplay');
    limitDisplay.innerText = `POZOSTAŁO TYPOWAŃ: ${votesLeft}/20`;
    if (votesLeft === 0) {
        limitDisplay.style.color = "var(--error)";
    } else if (votesLeft <= 5) {
        limitDisplay.style.color = "orange";
    } else {
        limitDisplay.style.color = "var(--cyan)";
    }
    validateForm();
}
fetchUserStats();

onSnapshot(collection(db, "history"), (snap) => {
    const targetTimes = {};
    snap.forEach(d => {
        const data = d.data();
        if (data.target && data.timestamp) {
            if (!targetTimes[data.target]) targetTimes[data.target] = [];
            const date = new Date(data.timestamp);
            const secs = date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds();
            targetTimes[data.target].push(secs);
        }
    });

    for (const [target, times] of Object.entries(targetTimes)) {
        if (times.length > 0) {
            const avgSecs = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
            const h = String(Math.floor(avgSecs / 3600)).padStart(2, '0');
            const m = String(Math.floor((avgSecs % 3600) / 60)).padStart(2, '0');
            const s = String(Math.floor(avgSecs % 60)).padStart(2, '0');
            targetAverages[target] = `${h}:${m}:${s}`;
        }
    }
    
    updateSlotUI(1, currentTargets.t1, slotLocks.l1);
    updateSlotUI(2, currentTargets.t2, slotLocks.l2);
});

// ZMODYFIKOWANE FORMATOWANIE CZASU CO 10 SEKUND
window.formatTime = (input) => {
    let v = input.value.replace(/\D/g, '');
    
    if (v.length >= 2) { let h = parseInt(v.slice(0, 2)); if (h > 23) v = "23" + v.slice(2); }
    if (v.length >= 4) { let m = parseInt(v.slice(2, 4)); if (m > 59) v = v.slice(0, 2) + "59" + v.slice(4); }
    if (v.length >= 6) { 
        let s = parseInt(v.slice(4, 6)); 
        // Wymuszanie kroku co 10 sekund (końcówka zawsze to '0')
        if (s > 59) v = v.slice(0, 4) + "50"; 
        else v = v.slice(0, 5) + "0"; 
    }
    
    if (v.length > 6) v = v.slice(0, 6);
    
    let formatted = v;
    if (v.length > 4) formatted = v.slice(0, 2) + ':' + v.slice(2, 4) + ':' + v.slice(4);
    else if (v.length > 2) formatted = v.slice(0, 2) + ':' + v.slice(2);
    
    input.value = formatted; 
    validateForm();
};

onSnapshot(doc(db, "appState", "status"), (snap) => {
    const data = snap.data(); if(!data) return;
    currentTargets.t1 = data.target1; currentTargets.t2 = data.target2;
    slotLocks.l1 = data.isLocked1 || false; slotLocks.l2 = data.isLocked2 || false;
    updateSlotUI(1, data.target1, slotLocks.l1);
    updateSlotUI(2, data.target2, slotLocks.l2);
    validateForm();
});

function updateSlotUI(id, name, isLocked) {
    const input = document.getElementById(`hour${id}`), nameDisplay = document.getElementById(`targetName${id}`);
    const avgDisplay = document.getElementById(`targetAvg${id}`);
    const group = document.getElementById(`group${id}`);
    const isEmpty = (!name || name === "Brak"), isSelfBet = (currentUser === name && !isEmpty);
    
    nameDisplay.innerText = isEmpty ? "BRAK CELU" : name;
    
    if (!isEmpty) {
        avgDisplay.innerText = targetAverages[name] ? `ŚR: ${targetAverages[name]}` : `ŚR: BRAK DANYCH`;
        avgDisplay.style.display = "block";
    } else {
        avgDisplay.style.display = "none";
    }
    
    input.disabled = isLocked || isEmpty || isSelfBet || votesLeft <= 0;
    
    if (isLocked) group.className = "target-group group-locked";
    else if (isSelfBet) group.className = "target-group target-disabled";
    else group.className = "target-group";
    
    if (input.disabled) input.value = "";
    nameDisplay.style.color = isEmpty ? "#475569" : "var(--cyan)";
}

window.validateForm = function() {
    const h1 = document.getElementById('hour1').value, h2 = document.getElementById('hour2').value;
    // Aktualizacja regexu - wymusza układ HH:MM:S0
    const timeReg = /^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5]0$/;
    
    let h1V = h1.length === 8 && timeReg.test(h1) && !document.getElementById('hour1').disabled;
    let h2V = h2.length === 8 && timeReg.test(h2) && !document.getElementById('hour2').disabled;
    
    let votesToCast = (h1V ? 1 : 0) + (h2V ? 1 : 0);
    let v = votesToCast > 0 && votesToCast <= votesLeft;
    
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = !v;
    
    const msg = document.getElementById('msg');
    if (votesToCast > votesLeft && votesToCast > 0) {
        msg.style.color = "var(--error)";
        msg.innerText = "PRZEKROCZONO LIMIT TYPOWAŃ!";
    } else {
        msg.innerText = "";
    }
}

window.saveData = async function() {
    const h1 = document.getElementById('hour1').value, h2 = document.getElementById('hour2').value;
    const timeReg = /^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5]0$/;
    const btn = document.getElementById('saveBtn');
    const msg = document.getElementById('msg');
    
    if (btn.disabled) return;
    btn.disabled = true;

    let h1V = h1.length === 8 && timeReg.test(h1) && !document.getElementById('hour1').disabled;
    let h2V = h2.length === 8 && timeReg.test(h2) && !document.getElementById('hour2').disabled;
    let votesToCast = (h1V ? 1 : 0) + (h2V ? 1 : 0);

    try {
        if (h1V) await addDoc(collection(db, "users"), { name: currentUser, hour: h1, targetSlot: 'slot1', timestamp: Date.now() });
        if (h2V) await addDoc(collection(db, "users"), { name: currentUser, hour: h2, targetSlot: 'slot2', timestamp: Date.now() });
        
        const userRef = doc(db, "ranking", currentUser);
        await setDoc(userRef, { votesThisMonth: increment(votesToCast) }, { merge: true });
        
        msg.style.color = "var(--cyan)"; msg.innerText = "TRANSFER COMPLETED";
        setTimeout(() => location.reload(), 1200);
    } catch (e) { alert(e.message); btn.disabled = false; }
}

const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let pts = []; for (let i = 0; i < 60; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pts.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
        ctx.fillStyle = 'rgba(212, 175, 55, 0.4)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
        for (let j = i + 1; j < pts.length; j++) {
            const p2 = pts[j]; const d = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (d < 120) { ctx.strokeStyle = `rgba(0, 212, 255, ${1 - d/120})`; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
        }
    }); requestAnimationFrame(draw);
} draw();

document.addEventListener('mousemove', (e) => {
    const x = (window.innerWidth / 2 - e.pageX) / 500, y = (window.innerHeight / 2 - e.pageY) / 500;
    document.getElementById('tiltCard').style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
});
</script>
</body>
</html>
