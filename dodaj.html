<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber Add - Obstawianie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <style>
    :root {
      --primary: #d4af37;
      --accent: #00d4ff;
      --bg-dark: #050810;
      --card-dark: rgba(30, 41, 59, 0.7);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: #fff;
      margin: 0;
      overflow: hidden; /* Ukrywamy suwak, bo tło zajmuje cały ekran */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* KOSMICZNE TŁO CZĄSTECZKOWE */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      z-index: 1;
    }

    .welcome-text {
      position: fixed;
      top: 10%;
      text-align: center;
      z-index: 2;
    }

    .welcome-text h1 { 
        margin: 0; font-size: 28px; letter-spacing: 2px;
        background: linear-gradient(to right, var(--primary), #fff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .container {
      background: var(--card-dark);
      backdrop-filter: blur(15px); /* Efekt mrożonego szkła */
      padding: 40px;
      border-radius: 30px;
      width: 90%;
      max-width: 380px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      z-index: 2;
      text-align: center;
    }

    .input-group { margin-bottom: 25px; text-align: left; }
    .input-group label {
      font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--primary); font-weight: bold; margin-bottom: 8px; display: block;
    }

    select, input {
      width: 100%; padding: 15px; font-size: 16px; border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
      color: #fff; outline: none; transition: 0.3s; box-sizing: border-box;
    }

    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }

    /* PRZYCISK Z EFEKTEM SKANOWANIA */
    .save-btn {
      width: 100%; padding: 18px; background: none; color: var(--primary);
      border: 2px solid var(--primary); border-radius: 15px;
      font-size: 16px; font-weight: 800; cursor: pointer;
      position: relative; overflow: hidden; transition: 0.3s;
      text-transform: uppercase; letter-spacing: 2px;
    }

    .save-btn:hover { background: rgba(212, 175, 55, 0.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }

    /* Pasek ładowania wewnątrz przycisku */
    .btn-loader {
      position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), transparent);
      transition: 0.5s;
    }

    .loading .btn-loader { left: 100%; transition: 1.5s; }

    #msg { margin-top: 20px; font-size: 14px; letter-spacing: 1px; font-weight: bold; }

    #darkModeBtn { display: none; } /* W tej wersji Dark Mode jest wymuszony jako "Cyber" */

    .anon-counter {
        margin-top: 20px; font-size: 11px; opacity: 0.5; text-transform: uppercase;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="welcome-text">
    <h1 id="greeting">SYSTEM_ONLINE</h1>
    <p style="font-size: 12px; color: var(--accent);">ZALOGOWANO DO PROTOKOŁU OBSTAWIANIA</p>
  </div>

  <div class="container">
    <div class="input-group">
      <label>Identyfikator użytkownika</label>
      <select id="name">
        <option value="">Wybierz...</option>
        <option value="Arek">Arek</option>
        <option value="Paweł">Paweł</option>
        <option value="Grzesiek Sz">Grzesiek Sz</option>
        <option value="Grzesiek P">Grzesiek P</option>
        <option value="Krzysiek">Krzysiek</option>
        <option value="Mariusz">Mariusz</option>
        <option value="Dominik">Dominik</option>
      </select>
    </div>

    <div class="input-group">
      <label>Parametr czasowy (Godzina)</label>
      <input id="hour" type="time">
    </div>

    <button class="save-btn" id="saveBtn" onclick="saveData()">
      <span class="btn-text">Autoryzuj zapis</span>
      <div class="btn-loader"></div>
    </button>

    <p id="msg"></p>

    <div class="anon-counter">
      Aktywnych zgłoszeń w sesji: <span id="playerCount" style="color: var(--accent);">0</span>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI",
  authDomain: "obstaiwanie.firebaseapp.com",
  projectId: "obstaiwanie"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// --- TŁO CZĄSTECZKOWE ---
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = Math.random() * 1 - 0.5;
        this.speedY = Math.random() * 1 - 0.5;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x > canvas.width) this.x = 0;
        if (this.x < 0) this.x = canvas.width;
        if (this.y > canvas.height) this.y = 0;
        if (this.y < 0) this.y = canvas.height;
    }
    draw() {
        ctx.fillStyle = 'rgba(212, 175, 55, 0.5)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function init() {
    for (let i = 0; i < 80; i++) particles.push(new Particle());
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
}
init(); animate();

// --- LOGIKA ZAPISU ---
onSnapshot(collection(db, "users"), (snapshot) => {
    document.getElementById("playerCount").innerText = snapshot.size;
});

window.saveData = async function() {
  const name = document.getElementById("name").value;
  const hour = document.getElementById("hour").value;
  const btn = document.getElementById("saveBtn");
  const msg = document.getElementById("msg");

  if (!name || !hour) {
    msg.style.color = "#ff4d4d";
    msg.innerText = "BŁĄD: BRAK PARAMETRÓW";
    return;
  }

  btn.classList.add("loading");
  document.querySelector(".btn-text").innerText = "PRZETWARZANIE...";

  try {
    await addDoc(collection(db, "users"), {
      name: name,
      hour: hour,
      timestamp: new Date().getTime()
    });

    setTimeout(() => {
        btn.classList.remove("loading");
        document.querySelector(".btn-text").innerText = "AUTORYZOWANO";
        msg.style.color = "var(--accent)";
        msg.innerText = "TRANSFER DANYCH ZAKOŃCZONY";
        
        document.getElementById("name").value = "";
        document.getElementById("hour").value = "";
    }, 1500);

    setTimeout(() => { 
        msg.innerText = ""; 
        document.querySelector(".btn-text").innerText = "AUTORYZUJ ZAPIS";
    }, 4000);

  } catch (e) {
    btn.classList.remove("loading");
    alert("CRITICAL ERROR: " + e.message);
  }
};
</script>
</body>
</html>
