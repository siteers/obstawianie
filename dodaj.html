<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Add | Nightmare Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <style>
    :root {
      --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
      --glass: rgba(15, 23, 42, 0.85); --error: #ff0000;
    }

    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
      margin: 0; overflow: hidden; display: flex; justify-content: center;
      align-items: center; min-height: 100vh; perspective: 1000px; transition: 0.3s;
      touch-action: manipulation;
    }

    /* --- EFEKTY KOSZMARU (NIE ZMIENIAĆ) --- */
    .nightmare-mode { background: #300 !important; filter: invert(1) contrast(300%) blur(2px) !important; }
    @keyframes glitch {
      0% { transform: translate(0); }
      25% { transform: translate(-10px, 10px); }
      50% { transform: translate(10px, -10px); }
      75% { transform: translate(-10px, -10px); }
      100% { transform: translate(0); }
    }
    .nightmare-shake { animation: glitch 0.1s infinite !important; }

    /* --- PULSOWANIE ZABLOKOWANEGO SLOTU --- */
    @keyframes slotPulse {
        0% { border-color: var(--error); box-shadow: 0 0 5px var(--error); }
        50% { border-color: #ff0000; box-shadow: 0 0 25px var(--error); background: rgba(255, 0, 0, 0.3); }
        100% { border-color: var(--error); box-shadow: 0 0 5px var(--error); }
    }
    .input-locked {
        animation: slotPulse 1.2s infinite !important;
        border: 2px solid var(--error) !important;
        pointer-events: none;
        opacity: 0.6;
    }

    #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
    .tilt-box { z-index: 10; width: 100%; display: flex; justify-content: center; transition: transform 0.1s ease-out; transform-style: preserve-3d; pointer-events: auto; }

    .container {
      background: var(--glass); backdrop-filter: blur(25px); padding: 30px; border-radius: 40px;
      width: 90vw; max-width: 420px; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); text-align: center; position: relative; box-sizing: border-box;
    }

    h2 { margin: 0 0 25px 0; font-size: 22px; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
    .input-box { margin-bottom: 15px; text-align: left; position: relative; }
    .input-box label { font-size: 9px; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; display: block; letter-spacing: 1px; }

    /* ROZDZIELENIE NA DWIE GODZINY */
    .hour-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }

    select, input {
      display: block; width: 100%; padding: 14px; font-size: 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: #fff; outline: none; box-sizing: border-box;
      transition: border 0.2s;
    }
    input:focus { border-color: var(--cyan); }
    input:disabled { opacity: 0.3; background: #111; }

    .btn-cyber {
      width: 100%; padding: 18px; background: var(--gold); color: #000; border: none; border-radius: 15px;
      font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px;
      transition: 0.2s; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    }
    .btn-cyber:active { transform: scale(0.96); }
    .btn-cyber:disabled { background: #223; color: #556; box-shadow: none; cursor: not-allowed; }

    #forgot-link { display: block; margin-top: 12px; font-size: 11px; color: var(--cyan); text-decoration: none; font-weight: bold; cursor: pointer; opacity: 0.7; }
    #msg { margin-top: 15px; font-size: 13px; font-weight: bold; min-height: 20px; transition: 0.3s; }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="tilt-box" id="tiltCard">
    <div class="container" id="mainContainer">
      <h2 id="mainHeader">System Logowania</h2>

      <div class="input-box">
        <label>Wybierz Użytkownika</label>
        <select id="name" onchange="checkUserAuth()">
          <option value="">Wybierz...</option>
          <option value="Arek">Arek</option><option value="Paweł">Paweł</option><option value="Grzesiek Sz">Grzesiek Sz</option>
          <option value="Grzesiek P">Grzesiek P</option><option value="Krzysiek">Krzysiek</option><option value="Mariusz">Mariusz</option><option value="Dominik">Dominik</option>
        </select>
      </div>

      <div class="hour-grid">
          <div class="input-box">
              <label id="labelSlot1">Godzina Cel 1</label>
              <input id="hour1" type="time" oninput="validateForm()">
          </div>
          <div class="input-box">
              <label id="labelSlot2">Godzina Cel 2</label>
              <input id="hour2" type="time" oninput="validateForm()">
          </div>
      </div>

      <div id="auth-section" style="display:none;">
        <div class="input-box">
            <label id="main-pass-label">Hasło Dostępowe</label>
            <input id="password" type="password" placeholder="••••" oninput="validateForm()">
            <a id="forgot-link" onclick="forgotPassword()">Zapomniałem hasła</a>
        </div>
        <div id="pass-confirm-box" style="display:none;" class="input-box">
            <label>Potwierdź Nowe Hasło</label>
            <input id="password-confirm" type="password" placeholder="••••" oninput="validateForm()">
        </div>
      </div>

      <button class="btn-cyber" id="saveBtn" onclick="saveData()" disabled>Zatwierdź Dane</button>
      <p id="msg"></p>
    </div>
  </div>

  <audio id="horrorSound" src="https://assets.mixkit.co/active_storage/sfx/2541/2541-preview.mp3"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDoc, setDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

let isFirstTime = false, isResetMode = false, currentTargets = { t1: null, t2: null }, slotLocks = { l1: false, l2: false };

onSnapshot(doc(db, "appState", "status"), (snap) => {
    const data = snap.data(); if(!data) return;
    currentTargets.t1 = data.target1; currentTargets.t2 = data.target2;
    slotLocks.l1 = data.isLocked1 || false; slotLocks.l2 = data.isLocked2 || false;
    
    updateSlotInputUI(1, data.target1, slotLocks.l1);
    updateSlotInputUI(2, data.target2, slotLocks.l2);
    validateForm();
});

function updateSlotInputUI(id, name, isLocked) {
    const input = document.getElementById(`hour${id}`);
    const label = document.getElementById(`labelSlot${id}`);
    const userName = document.getElementById('name').value;

    label.innerText = (name && name !== "Brak") ? `GODZINA: ${name}` : "CEL NIEAKTYWNY";
    
    // Blokada: jeśli locked LUB brak celu LUB użytkownik to cel
    const shouldDisable = isLocked || !name || name === "Brak" || userName === name;
    
    input.disabled = shouldDisable;
    if (isLocked) input.classList.add('input-locked');
    else input.classList.remove('input-locked');
    
    if (shouldDisable) input.value = "";
}

window.checkUserAuth = async function() {
    const n = document.getElementById('name').value;
    updateSlotInputUI(1, currentTargets.t1, slotLocks.l1);
    updateSlotInputUI(2, currentTargets.t2, slotLocks.l2);

    if (!n) { document.getElementById('auth-section').style.display = 'none'; return; }
    const userDoc = await getDoc(doc(db, "passwords", n));
    document.getElementById('auth-section').style.display = 'block';
    isFirstTime = !userDoc.exists(); isResetMode = false;
    document.getElementById('pass-confirm-box').style.display = isFirstTime ? 'block' : 'none';
    document.getElementById('main-pass-label').innerText = isFirstTime ? "Ustaw Nowe Hasło" : "Hasło Dostępowe";
    validateForm();
}

window.validateForm = function() {
    const n = document.getElementById('name').value, p = document.getElementById('password').value;
    const h1 = document.getElementById('hour1').value, h2 = document.getElementById('hour2').value;
    const p2 = document.getElementById('password-confirm').value;
    const btn = document.getElementById('saveBtn');

    // Walidacja: wybrany user, hasło wpisane i PRZYNAJMNIEJ jedna godzina wpisana
    let v = n && p && (h1 || h2);
    if (isFirstTime || isResetMode) v = v && (p === p2 && p.length > 0);
    btn.disabled = !v;
}

window.forgotPassword = () => {
    const n = document.getElementById('name').value; if(!n) return alert("Wybierz użytkownika!");
    if(prompt("AUTORYZACJA ADMINA - WPISZ KOD:") === "0000") {
        isResetMode = true; document.getElementById('pass-confirm-box').style.display = 'block';
        document.getElementById('main-pass-label').innerText = "USTAW NOWE HASŁO";
        alert("Autoryzacja pomyślna. Wprowadź nowe hasło.");
    } else alert("BŁĘDNY KOD.");
}

window.saveData = async function() {
    const n = document.getElementById('name').value, p = document.getElementById('password').value;
    const h1 = document.getElementById('hour1').value, h2 = document.getElementById('hour2').value;
    const msg = document.getElementById('msg'), btn = document.getElementById('saveBtn'), container = document.getElementById('mainContainer');
    const horrorSound = document.getElementById('horrorSound');

    btn.disabled = true;
    try {
        // Weryfikacja hasła
        if (!isFirstTime && !isResetMode) {
            const userDoc = await getDoc(doc(db, "passwords", n));
            if (userDoc.data().password !== p) {
                horrorSound.currentTime = 0; horrorSound.volume = 1.0; horrorSound.play().catch(()=>{});
                document.body.classList.add('nightmare-mode');
                container.classList.add('nightmare-shake');
                document.getElementById('mainHeader').innerText = "SYSTEM CORRUPTED";
                msg.style.color = "#ff0000"; msg.innerText = "ACCESS DENIED: WRONG KEY.";
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                setTimeout(() => {
                    horrorSound.pause();
                    document.body.classList.remove('nightmare-mode');
                    container.classList.remove('nightmare-shake');
                    document.getElementById('mainHeader').innerText = "System Logowania";
                    btn.disabled = false;
                }, 1500);
                return;
            }
        } else {
            await setDoc(doc(db, "passwords", n), { password: p });
        }

        // Zapisywanie danych (jeden lub dwa sloty)
        const timestamp = Date.now();
        if (h1 && !document.getElementById('hour1').disabled) {
            await addDoc(collection(db, "users"), { name: n, hour: h1, targetSlot: 'slot1', timestamp });
        }
        if (h2 && !document.getElementById('hour2').disabled) {
            await addDoc(collection(db, "users"), { name: n, hour: h2, targetSlot: 'slot2', timestamp });
        }

        msg.style.color = "var(--cyan)"; msg.innerText = "DATA UPLOADED.";
        setTimeout(() => location.reload(), 1500);
    } catch (e) { alert(e.message); btn.disabled = false; }
}

// KONSTELACJA (NIE ZMIENIAĆ)
const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let pts = []; for (let i = 0; i < 60; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pts.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
        ctx.fillStyle = 'rgba(212, 175, 55, 0.4)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
        for (let j = i + 1; j < pts.length; j++) {
            const p2 = pts[j]; const d = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (d < 120) { ctx.strokeStyle = `rgba(0, 212, 255, ${1 - d/120})`; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
        }
    }); requestAnimationFrame(draw);
} draw();

document.addEventListener('mousemove', (e) => {
    const x = (window.innerWidth / 2 - e.pageX) / 500;
    const y = (window.innerHeight / 2 - e.pageY) / 500;
    document.getElementById('tiltCard').style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
});
</script>
</body>
</html>
