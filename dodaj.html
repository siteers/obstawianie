<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Dodawanie godziny</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <style>
    :root {
      --gold: #d4af37;
      --cyan: #00d4ff;
      --bg: #020408;
      --glass: rgba(15, 23, 42, 0.85);
      --error: #ff4d4d;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: #fff;
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      perspective: 1000px;
    }

    #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; }

    .tilt-box { z-index: 10; transition: transform 0.1s ease-out; transform-style: preserve-3d; }

    /* HOLOGRAFICZNA KARTA */
    .id-card {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%) rotateX(20deg);
      width: 240px;
      padding: 15px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(212, 175, 55, 0.1));
      border: 1px solid var(--cyan);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      opacity: 0;
      transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 5;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
      pointer-events: none;
    }
    .id-card.active { opacity: 1; top: -140px; transform: translateX(-50%) rotateX(0deg); }
    
    .scan-laser {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: var(--cyan);
      box-shadow: 0 0 15px var(--cyan);
      animation: laserMove 2s infinite linear;
    }
    @keyframes laserMove { 0% { top: 0; } 100% { top: 100%; } }

    .container {
      background: var(--glass);
      backdrop-filter: blur(25px);
      padding: 30px;
      border-radius: 40px;
      width: 90vw;
      max-width: 400px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
    }

    h2 { margin: 0 0 25px 0; font-size: 24px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }

    .input-box { margin-bottom: 15px; text-align: left; }
    .input-box label { font-size: 10px; color: #64748b; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: block; }

    select, input {
      width: 100%; padding: 14px; font-size: 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4);
      color: #fff; outline: none; transition: 0.3s; box-sizing: border-box;
    }
    select:focus, input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }

    #auth-section {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .pass-hint { font-size: 9px; color: #888; margin-top: 5px; line-height: 1.2; }
    .valid { color: #00ff88; }
    .invalid { color: var(--error); }

    .reset-link {
      display: block;
      margin-top: 8px;
      font-size: 10px;
      color: var(--cyan);
      cursor: pointer;
      text-decoration: underline;
      opacity: 0.7;
    }
    .reset-link:hover { opacity: 1; }

    .btn-cyber {
      width: 100%; padding: 18px; background: var(--gold);
      color: #000; border: none; border-radius: 15px;
      font-size: 16px; font-weight: 900; cursor: pointer;
      text-transform: uppercase; letter-spacing: 2px;
      margin-top: 20px; transition: 0.3s;
    }
    .btn-cyber:hover { transform: scale(1.02); filter: brightness(1.1); box-shadow: 0 0 20px rgba(212,175,55,0.4); }
    .btn-cyber:disabled { background: #334; color: #667; cursor: not-allowed; transform: none; }

    #msg { margin-top: 15px; font-size: 13px; font-weight: bold; min-height: 20px; }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="tilt-box" id="tiltCard">
    <div id="hologram" class="id-card">
      <div class="scan-laser"></div>
      <div style="font-size: 9px; color: var(--cyan); margin-bottom: 5px;">WERYFIKACJA...</div>
      <div id="hologram-name" style="font-size: 18px; font-weight: 900; color: #fff;">---</div>
      <div id="hologram-time" style="font-size: 14px; color: var(--gold);">00:00</div>
    </div>

    <div class="container">
      <h2>Dodaj swoje dane</h2>

      <div class="input-box">
        <label>Użytkownik</label>
        <select id="name" onchange="checkUserAuth()">
          <option value="">Wybierz...</option>
          <option value="Arek">Arek</option>
          <option value="Paweł">Paweł</option>
          <option value="Grzesiek Sz">Grzesiek Sz</option>
          <option value="Grzesiek P">Grzesiek P</option>
          <option value="Krzysiek">Krzysiek</option>
          <option value="Mariusz">Mariusz</option>
          <option value="Dominik">Dominik</option>
        </select>
      </div>

      <div class="input-box">
        <label>Godzina zakończenia</label>
        <input id="hour" type="time" oninput="updatePreview()">
      </div>

      <div id="auth-section">
        <div id="first-time-msg" style="display:none; font-size: 10px; color: var(--cyan); margin-bottom: 10px;">
          USTAW HASŁO DOSTĘPU (PIERWSZE LOGOWANIE):
        </div>
        
        <div class="input-box">
          <label id="pass-label">Hasło</label>
          <input id="password" type="password" placeholder="••••••••" oninput="validateForm()">
        </div>

        <div class="input-box" id="pass-confirm-box" style="display:none;">
          <label>Potwierdź hasło</label>
          <input id="password-confirm" type="password" placeholder="••••••••" oninput="validateForm()">
        </div>

        <div class="pass-hint" id="requirements-hint">
          Min. 8 znaków, wielka litera, cyfra i znak specjalny.
        </div>
        
        <span class="reset-link" id="resetBtn" style="display:none;" onclick="handleReset()">Zapomniałeś hasła?</span>
      </div>

      <button class="btn-cyber" id="saveBtn" onclick="saveData()" disabled>Zapisz</button>
      <p id="msg"></p>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDoc, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI",
  authDomain: "obstaiwanie.firebaseapp.com",
  projectId: "obstaiwanie"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let isFirstTime = false;

// --- LOGIKA RESETU ---
window.handleReset = async function() {
    const code = prompt("Podaj kod resetujący od administratora:");
    if (code === "0000") {
        const name = document.getElementById('name').value;
        alert("Kod poprawny. System umożliwi teraz nadanie nowego hasła.");
        isFirstTime = true;
        document.getElementById('pass-confirm-box').style.display = 'block';
        document.getElementById('first-time-msg').style.display = 'block';
        document.getElementById('resetBtn').style.display = 'none';
        document.getElementById('pass-label').innerText = "Ustaw nowe hasło";
        validateForm();
    } else {
        alert("Błędny kod!");
    }
}

window.checkUserAuth = async function() {
    const name = document.getElementById('name').value;
    const authSection = document.getElementById('auth-section');
    const passConfirmBox = document.getElementById('pass-confirm-box');
    const firstTimeMsg = document.getElementById('first-time-msg');
    const resetBtn = document.getElementById('resetBtn');
    const passLabel = document.getElementById('pass-label');

    updatePreview();
    if (!name) { authSection.style.display = 'none'; return; }

    const userDoc = await getDoc(doc(db, "passwords", name));
    authSection.style.display = 'block';

    if (!userDoc.exists()) {
        isFirstTime = true;
        passConfirmBox.style.display = 'block';
        firstTimeMsg.style.display = 'block';
        resetBtn.style.display = 'none';
        passLabel.innerText = "Ustaw nowe hasło";
    } else {
        isFirstTime = false;
        passConfirmBox.style.display = 'none';
        firstTimeMsg.style.display = 'none';
        resetBtn.style.display = 'block';
        passLabel.innerText = "Wpisz hasło";
    }
    validateForm();
}

window.validateForm = function() {
    const name = document.getElementById('name').value;
    const hour = document.getElementById('hour').value;
    const pass = document.getElementById('password').value;
    const passConf = document.getElementById('password-confirm').value;
    const btn = document.getElementById('saveBtn');
    const hint = document.getElementById('requirements-hint');

    const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
    let isValid = name && hour && pass;

    if (isFirstTime) {
        const passComplexity = passRegex.test(pass);
        hint.style.display = 'block';
        hint.classList.toggle('valid', passComplexity);
        isValid = isValid && (pass === passConf) && passComplexity;
    } else {
        hint.style.display = 'none';
    }
    btn.disabled = !isValid;
}

window.updatePreview = () => {
    const name = document.getElementById('name').value;
    const hour = document.getElementById('hour').value;
    const holo = document.getElementById('hologram');
    if(name && hour) {
        document.getElementById('hologram-name').innerText = name;
        document.getElementById('hologram-time').innerText = hour;
        holo.classList.add('active');
    } else { holo.classList.remove('active'); }
}

window.saveData = async function() {
    const name = document.getElementById('name').value;
    const hour = document.getElementById('hour').value;
    const pass = document.getElementById('password').value;
    const msg = document.getElementById('msg');

    try {
        if (isFirstTime) {
            await setDoc(doc(db, "passwords", name), { password: pass });
        } else {
            const userDoc = await getDoc(doc(db, "passwords", name));
            if (userDoc.data().password !== pass) {
                msg.style.color = "var(--error)";
                msg.innerText = "BŁĘDNE HASŁO!";
                return;
            }
        }
        await addDoc(collection(db, "users"), { name, hour, timestamp: Date.now() });
        msg.style.color = "var(--cyan)";
        msg.innerText = "ZAPISANO POMYŚLNIE!";
        setTimeout(() => location.reload(), 2000);
    } catch (e) { alert(e.message); }
}

// --- ANIMACJA TŁA ---
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let particles = [];
for (let i = 0; i < 50; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3 });
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if(p.x<0 || p.x>canvas.width) p.vx*=-1;
        if(p.y<0 || p.y>canvas.height) p.vy*=-1;
        ctx.fillStyle = 'rgba(212, 175, 55, 0.2)';
        ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(draw);
}
draw();

document.addEventListener('mousemove', (e) => {
    const x = (window.innerWidth / 2 - e.pageX) / 40;
    const y = (window.innerHeight / 2 - e.pageY) / 40;
    document.getElementById('tiltCard').style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
});
</script>
</body>
</html>
