<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Bet | Hub System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <style>
    :root {
      --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
      --glass: rgba(15, 23, 42, 0.85); --border: rgba(255, 255, 255, 0.1);
      --gray: #64748b;
    }

    body.light {
      --bg: #f2f2f2; --glass: rgba(255, 255, 255, 0.9); --border: rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
      margin: 0; overflow: hidden; display: flex; justify-content: center;
      align-items: center; min-height: 100vh; transition: 0.3s;
    }

    #bg-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    .hub-container {
      z-index: 10; position: relative; text-align: center;
      width: 90vw; max-width: 500px;
    }

    /* --- PRZYCISKI --- */
    .btn-cyber {
      display: block; width: 100%; padding: 25px; margin: 15px 0;
      background: var(--glass); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 25px;
      color: var(--gold); font-size: 18px; font-weight: 900;
      text-transform: uppercase; letter-spacing: 2px;
      cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-decoration: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }

    .btn-cyber:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      color: #fff;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--gold), #b38f00);
      color: #000; border: none; font-size: 20px;
    }

    .btn-food {
      background: linear-gradient(135deg, #22c55e, #166534);
      color: #fff; border: none; font-size: 20px;
    }

    /* --- ANIMACJA WEJŚCIA MENU --- */
    #sub-menu { display: none; opacity: 0; transform: translateY(20px); transition: 0.5s; }
    #sub-menu.active { display: block; opacity: 1; transform: translateY(0); animation: slideUp 0.5s forwards; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-sub { color: var(--cyan); border-color: rgba(0, 212, 255, 0.2); }
    .btn-sub:hover { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); color: #fff; }

    #darkModeBtn {
      position: fixed; top: 20px; right: 20px; padding: 10px 20px;
      border-radius: 30px; border: 1px solid var(--border);
      background: var(--glass); color: var(--gold);
      cursor: pointer; font-weight: bold; z-index: 100;
    }

    h1 {
      font-size: 12px; color: var(--gray); text-transform: uppercase;
      letter-spacing: 5px; margin-bottom: 40px; opacity: 0.6;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <button id="darkModeBtn">☀️ Light Mode</button>

  <div class="hub-container">
    <h1 id="hub-title">Terminal Dostępowy</h1>
    
    <div id="initial-view">
      <button class="btn-cyber btn-main" onclick="revealMenu()">Obstawianie godzin</button>
      <a href="jedzenie_1.html" target="_blank" class="btn-cyber btn-food">Wybór jedzenia</a>
    </div>

    <div id="sub-menu">
      <a href="dodaj.html" target="_blank" class="btn-cyber btn-sub">➕ Dodaj godzinę</a>
      <a href="ranking.html" target="_blank" class="btn-cyber btn-sub">🏆 Ranking</a>
      <a href="lista.html" target="_blank" class="btn-cyber btn-sub">📋 Lista</a>
      <a href="regulamin.html" target="_blank" class="btn-cyber btn-sub">📜 Regulamin</a>
      <button onclick="hideMenu()" style="background:none; border:none; color:rgba(255,255,255,0.3); cursor:pointer; margin-top:20px; font-weight:bold;">← Wróć</button>
    </div>
  </div>

<script>
  function revealMenu() {
    document.getElementById('initial-view').style.display = 'none';
    const menu = document.getElementById('sub-menu');
    menu.classList.add('active');
    document.getElementById('hub-title').innerText = "Moduł Obstawiania";
  }

  function hideMenu() {
    document.getElementById('sub-menu').classList.remove('active');
    setTimeout(() => {
        document.getElementById('initial-view').style.display = 'block';
        document.getElementById('hub-title').innerText = "Terminal Dostępowy";
    }, 100);
  }

  const darkBtn = document.getElementById("darkModeBtn");
  darkBtn.onclick = () => {
    document.body.classList.toggle("light");
    darkBtn.textContent = document.body.classList.contains("light") ? "🌙 Dark Mode" : "☀️ Light Mode";
  };

  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let pts = [];

  function init() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    pts = [];
    for (let i = 0; i < 70; i++) {
      pts.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const isLight = document.body.classList.contains('light');
    
    pts.forEach((p, i) => {
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

      ctx.fillStyle = isLight ? 'rgba(0,0,0,0.1)' : 'rgba(212, 175, 55, 0.3)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
      ctx.fill();

      for (let j = i + 1; j < pts.length; j++) {
        const p2 = pts[j];
        const d = Math.hypot(p.x - p2.x, p.y - p2.y);
        if (d < 150) {
          ctx.strokeStyle = isLight ? `rgba(0,0,0,${0.1 - d/1500})` : `rgba(0, 212, 255, ${0.5 - d/300})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    });
    requestAnimationFrame(draw);
  }

  window.onresize = init;
  init();
  draw();
</script>
</body>
</html>
