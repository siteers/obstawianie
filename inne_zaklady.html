<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Bet | Inne Zakłady</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    
    <style>
        :root {
            --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
            --glass: rgba(15, 23, 42, 0.95); --border: rgba(255, 255, 255, 0.1);
            --purple: #a855f7; --win: #2ecc71; --lose: #e74c3c;
        }

        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
            margin: 0; padding: 20px; min-height: 100vh;
            overflow-x: hidden; user-select: none; -webkit-tap-highlight-color: transparent;
            padding-bottom: 100px; /* Miejsce na FAB */
        }

        #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; position: relative; z-index: 10; }
        h1 { color: var(--purple); margin: 0; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
        .btn-back { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: #fff; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: bold; }

        /* KARTY ZAKŁADÓW */
        .bets-container { display: grid; gap: 20px; position: relative; z-index: 10; }
        
        .bet-card {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 20px; padding: 20px; position: relative;
            transition: 0.3s; backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .bet-card.active { border-color: var(--purple); box-shadow: 0 0 15px rgba(168, 85, 247, 0.15); }
        .bet-card.finished { border-color: var(--gold); opacity: 0.9; }

        /* NOWY STYL: Miganie na czerwono dla przeterminowanych */
        @keyframes pulseRed {
            0% { box-shadow: 0 0 5px rgba(231, 76, 60, 0.2); border-color: rgba(231, 76, 60, 0.3); }
            50% { box-shadow: 0 0 20px rgba(231, 76, 60, 0.6); border-color: rgba(231, 76, 60, 1); }
            100% { box-shadow: 0 0 5px rgba(231, 76, 60, 0.2); border-color: rgba(231, 76, 60, 0.3); }
        }

        .bet-card.expired {
            animation: pulseRed 1.5s infinite;
            border: 1px solid var(--lose);
        }

        .bet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .bet-topic { font-size: 18px; font-weight: 900; color: #fff; margin: 0; line-height: 1.3; }
        .bet-date { font-size: 10px; color: #888; margin-top: 5px; text-transform: uppercase; }
        
        /* Badges */
        .status-badge { padding: 4px 10px; border-radius: 10px; font-size: 9px; font-weight: bold; text-transform: uppercase; }
        .status-active { background: rgba(168, 85, 247, 0.2); color: var(--purple); border: 1px solid var(--purple); }
        .status-finished { background: rgba(212, 175, 55, 0.2); color: var(--gold); border: 1px solid var(--gold); }
        .status-expired { background: rgba(231, 76, 60, 0.2); color: var(--lose); border: 1px solid var(--lose); }

        /* UCZESTNICY W KARCIE */
        .participant-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; 
        }
        .participant-row:last-child { border-bottom: none; }
        .p-name { font-weight: bold; color: var(--cyan); }
        
        .p-right-side { display: flex; align-items: center; gap: 8px; max-width: 70%; justify-content: flex-end; }
        .p-bet { color: #ccc; text-align: right; font-style: italic; white-space: pre-wrap; word-break: break-word; }
        
        /* Ikony edycji i historii */
        .icon-btn { cursor: pointer; opacity: 0.7; transition: 0.2s; font-size: 14px; text-decoration: none; border:none; background: none; padding: 2px;}
        .icon-btn:hover { opacity: 1; transform: scale(1.2); }
        .icon-edit { color: var(--gold); }
        .icon-history { color: var(--cyan); }

        /* Styl dla zwycięzcy/przegranego */
        .winner .p-name { color: var(--gold); }
        .winner .p-bet { color: var(--gold); font-weight: bold; text-shadow: 0 0 5px rgba(212,175,55,0.5); }
        .loser { opacity: 0.4; text-decoration: line-through; }

        /* PRZYCISKI AKCJI */
        .card-actions { margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px; }
        .btn-action { border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; text-transform: uppercase; }
        .btn-resolve { background: linear-gradient(90deg, var(--gold), #b38f00); color: #000; }
        .btn-delete { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid #ff4757; }

        /* --- MODAL --- */
        #modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal-content { background: #121212; width: 95%; max-width: 500px; padding: 25px; border-radius: 20px; border: 1px solid var(--purple); max-height: 90vh; overflow-y: auto; }
        
        /* GRID WYBORU GRACZY */
        .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin: 15px 0; }
        .user-chip { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
            padding: 10px; border-radius: 10px; text-align: center; cursor: pointer; 
            font-size: 12px; transition: 0.2s; 
        }
        .user-chip.selected { background: rgba(168, 85, 247, 0.3); border-color: var(--purple); color: #fff; font-weight: bold; box-shadow: 0 0 10px rgba(168, 85, 247, 0.2); }
        .user-chip.selected-hidden { background: rgba(231, 76, 60, 0.2); border-color: var(--error); color: #fff; font-weight: bold; box-shadow: 0 0 10px rgba(231, 76, 60, 0.2); }

        /* DYNAMICZNE POLA */
        .dynamic-inputs { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 10px; }
        .input-group { margin-bottom: 10px; }
        .input-label { font-size: 11px; color: var(--cyan); margin-bottom: 4px; display: block; }
        
        input, textarea {
            width: 100%; padding: 12px; margin-bottom: 10px;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            color: #fff; border-radius: 8px; font-size: 14px; box-sizing: border-box;
        }
        input:focus, textarea:focus { border-color: var(--purple); outline: none; }

        .fab {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--purple), #7e22ce); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4); cursor: pointer; z-index: 100; color: #fff; font-weight: bold;
        }

        .btn-full { width: 100%; padding: 15px; border: none; border-radius: 10px; background: var(--purple); color: white; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }

        /* RADIO WINNER SELECTION */
        .winner-select-row { display: flex; align-items: center; margin: 10px 0; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; cursor: pointer; }
        .winner-select-row input { width: auto; margin: 0 10px 0 0; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header>
        <h1>Inne Zakłady</h1>
        <a href="sg.html" class="btn-back">← Wróć</a>
    </header>

    <div id="bets-container" class="bets-container">
        <p style="text-align:center; color:#888; margin-top:50px;">Ładowanie zakładów...</p>
    </div>

    <div class="fab" onclick="openCreateModal()">+</div>

    <div id="modal-overlay">
        <div class="modal-content">
            <button class="btn-close-modal" onclick="closeModal()">×</button>
            <h2 style="color:var(--purple); margin-top:0;">Nowy Zakład</h2>

            <label style="font-size:12px; color:#888;">Temat zakładu (O co chodzi?)</label>
            <input type="text" id="betTopic" placeholder="np. Kto zje więcej pizzy?">

            <label style="font-size:12px; color:#888; margin-top:10px; display:block;">Wybierz uczestników (min. 2)</label>
            <div id="usersGrid" class="users-grid"></div>

            <div id="dynamicInputs" class="dynamic-inputs"></div>

            <label style="font-size:12px; color:#888; margin-top:10px; display:block;">Termin (Opcjonalnie)</label>
            <input type="date" id="betDate">
            
            <label style="font-size:12px; color:#ff4d4d; margin-top:10px; display:block; border-top: 1px dashed rgba(255, 77, 77, 0.3); padding-top: 10px;">🤫 Ukryj zakład przed (Opcjonalnie)</label>
            <div id="hiddenUsersGrid" class="users-grid"></div>

            <button class="btn-full" onclick="saveBet()">UTWÓRZ ZAKŁAD</button>
        </div>
    </div>

    <div id="resolve-overlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2100; display: none; align-items: center; justify-content: center;">
        <div class="modal-content" style="border-color: var(--gold);">
            <button class="btn-close-modal" onclick="document.getElementById('resolve-overlay').style.display='none'">×</button>
            <h2 style="color:var(--gold); margin-top:0; text-align:center;">Kto wygrał?</h2>
            <p id="resolve-topic" style="text-align:center; color:#ccc; margin-bottom:20px;"></p>
            <div id="winner-list"></div>
            <button class="btn-full" style="background: var(--gold); color:#000;" onclick="confirmWinner()">ZATWIERDŹ WYNIK</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", 
            authDomain: "obstaiwanie.firebaseapp.com", 
            projectId: "obstaiwanie" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- OCHRONIARZ ---
        const currentUser = localStorage.getItem('cyberUser');
        if (!currentUser) {
            window.location.href = 'sg.html';
        }
        const isAdmin = (currentUser === 'Admin');

        // --- ZMIENNE GLOBALNE ---
        let allUsers = [];
        let selectedUsers = [];
        let hiddenUsers = [];
        let currentResolveId = null;

        // --- BACKGROUND ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];
        function initBg() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            pts = Array(60).fill().map(() => ({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4
            }));
        }
        function drawBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pts.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.fillStyle = 'rgba(168, 85, 247, 0.4)'; // Purple dots
                ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2); ctx.fill();
                for (let j = i + 1; j < pts.length; j++) {
                    const p2 = pts[j];
                    if (Math.hypot(p.x - p2.x, p.y - p2.y) < 120) {
                        ctx.strokeStyle = `rgba(168, 85, 247, 0.15)`; // Purple lines
                        ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawBg);
        }
        window.onresize = initBg; initBg(); drawBg();

        // --- POBIERANIE UŻYTKOWNIKÓW ---
        onSnapshot(collection(db, "ranking"), (snap) => {
            allUsers = snap.docs.map(d => d.id); 
            renderUserChips();
        });

        function renderUserChips() {
            const grid = document.getElementById('usersGrid');
            const hiddenGrid = document.getElementById('hiddenUsersGrid');
            
            grid.innerHTML = "";
            hiddenGrid.innerHTML = "";
            
            allUsers.forEach(user => {
                // Kafelki uczestników
                const chip = document.createElement('div');
                chip.className = 'user-chip';
                chip.innerText = user;
                chip.onclick = () => toggleUser(user, chip);
                grid.appendChild(chip);

                // Kafelki ukrywania
                const hChip = document.createElement('div');
                hChip.className = 'user-chip';
                hChip.innerText = user;
                hChip.onclick = () => toggleHiddenUser(user, hChip);
                hiddenGrid.appendChild(hChip);
            });
        }

        function toggleUser(user, element) {
            if(selectedUsers.includes(user)) {
                selectedUsers = selectedUsers.filter(u => u !== user);
                element.classList.remove('selected');
            } else {
                selectedUsers.push(user);
                element.classList.add('selected');
            }
            renderDynamicInputs();
        }

        function toggleHiddenUser(user, element) {
            if(hiddenUsers.includes(user)) {
                hiddenUsers = hiddenUsers.filter(u => u !== user);
                element.classList.remove('selected-hidden');
            } else {
                hiddenUsers.push(user);
                element.classList.add('selected-hidden');
            }
        }

        function renderDynamicInputs() {
            const container = document.getElementById('dynamicInputs');
            container.innerHTML = "";
            if(selectedUsers.length > 0) {
                container.innerHTML = `<p style="font-size:10px; color:#888; margin-bottom:10px;">ZDEFINIUJ WARUNKI DLA KAŻDEGO:</p>`;
            }
            selectedUsers.forEach(user => {
                const div = document.createElement('div');
                div.className = 'input-group';
                div.innerHTML = `
                    <span class="input-label">Co obstawia ${user}?</span>
                    <input type="text" id="bet-val-${user}" placeholder="np. Że wypije 5 piw">
                `;
                container.appendChild(div);
            });
        }

        // --- LOGIKA ZAKŁADÓW ---

        window.saveBet = async () => {
            const topic = document.getElementById('betTopic').value;
            const date = document.getElementById('betDate').value;

            if(!topic) return alert("Podaj temat zakładu!");
            if(selectedUsers.length < 2) return alert("Do zakładu potrzeba minimum 2 osób!");

            const participants = selectedUsers.map(user => ({
                name: user,
                prediction: document.getElementById(`bet-val-${user}`).value || "Brak opisu",
                history: []
            }));

            await addDoc(collection(db, "custom_bets"), {
                topic,
                expireDate: date || null,
                participants,
                hiddenFrom: hiddenUsers,
                status: 'active',
                winner: null,
                timestamp: serverTimestamp()
            });

            closeModal();
        };

        window.openCreateModal = () => {
            document.getElementById('modal-overlay').style.display = 'flex';
            
            selectedUsers = [];
            hiddenUsers = [];
            
            document.querySelectorAll('.user-chip').forEach(c => {
                c.classList.remove('selected');
                c.classList.remove('selected-hidden');
            });
            
            document.getElementById('dynamicInputs').innerHTML = "";
            document.getElementById('betTopic').value = "";
            
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('betDate');
            dateInput.value = "";
            dateInput.min = today;
        };

        window.closeModal = () => document.getElementById('modal-overlay').style.display = 'none';

        // --- WYŚWIETLANIE ZAKŁADÓW ---
        onSnapshot(query(collection(db, "custom_bets"), orderBy("timestamp", "desc")), (snap) => {
            const container = document.getElementById('bets-container');
            container.innerHTML = "";

            let visibleBetsCount = 0;
            const todayStr = new Date().toISOString().split('T')[0];

            snap.forEach(docSnap => {
                const bet = docSnap.data();
                
                // --- LOGIKA UKRYWANIA ZAKŁADU ---
                // Jeżeli zakład jest ukryty przed aktualnym graczem, pomijamy go całkowicie (chyba że jest Adminem)
                if (bet.hiddenFrom && bet.hiddenFrom.includes(currentUser) && !isAdmin) {
                    return; 
                }

                visibleBetsCount++;
                const isFinished = bet.status === 'finished';
                
                let isExpired = false;
                if(bet.expireDate && bet.expireDate < todayStr && !isFinished) isExpired = true;

                let statusLabel = 'AKTYWNY';
                let statusClass = 'status-active';
                let cardClass = 'active';

                if(isFinished) {
                    statusLabel = 'ZAKOŃCZONY';
                    statusClass = 'status-finished';
                    cardClass = 'finished';
                } else if(isExpired) {
                    statusLabel = 'PRZETERMINOWANY ❗️';
                    statusClass = 'status-expired';
                    cardClass = 'expired';
                }
                
                let participantsHtml = "";
                bet.participants.forEach(p => {
                    let resultClass = "";
                    if(isFinished) {
                        if(bet.winner === p.name) resultClass = "winner";
                        else resultClass = "loser";
                    }
                    
                    // IKONY EDYCJI I HISTORII
                    let icons = "";
                    const hasHistory = p.history && p.history.length > 0;
                    
                    // Historia widoczna dla wszystkich (którzy mogą widzieć zakład)
                    if(hasHistory) {
                        icons += `<button class="icon-btn icon-history" onclick="viewHistory('${docSnap.id}', '${p.name}')">🕒</button>`;
                    }

                    // Edycja tylko dla właściciela wpisu lub Admina, jeśli zakład nie jest zakończony
                    if(!isFinished && (p.name === currentUser || isAdmin)) {
                        icons += `<button class="icon-btn icon-edit" onclick="editBet('${docSnap.id}', '${p.name}')">✏️</button>`;
                    }

                    participantsHtml += `
                        <div class="participant-row ${resultClass}">
                            <span class="p-name">${isFinished && bet.winner === p.name ? '👑 ' : ''}${p.name}</span>
                            <div class="p-right-side">
                                <span class="p-bet">${p.prediction}</span>
                                <div style="display:flex; gap:5px;">${icons}</div>
                            </div>
                        </div>
                    `;
                });

                let actionsHtml = "";
                if(!isFinished) actionsHtml = `<button class="btn-action btn-resolve" onclick="openResolveModal('${docSnap.id}')">🏆 ROZSTRZYGNIJ</button>`;
                actionsHtml += `<button class="btn-action btn-delete" onclick="deleteBet('${docSnap.id}')">USUŃ</button>`;

                const dateDisplay = bet.expireDate ? `Termin: ${bet.expireDate}` : '';
                
                // Dodanie czerwonego badga informującego o ukryciu zakładu przed kimś
                let hiddenBadgeHtml = "";
                if (bet.hiddenFrom && bet.hiddenFrom.length > 0) {
                    hiddenBadgeHtml = `<div style="font-size: 10px; color: var(--error); margin-top: 5px; font-weight: bold; border: 1px solid var(--error); padding: 3px 8px; border-radius: 5px; display: inline-block;">🤫 Ukryte przed: ${bet.hiddenFrom.join(', ')}</div>`;
                }

                const html = `
                    <div class="bet-card ${cardClass}">
                        <div class="bet-header">
                            <div>
                                <span class="status-badge ${statusClass}">${statusLabel}</span>
                                <h3 class="bet-topic">${bet.topic}</h3>
                                <div class="bet-date">${dateDisplay} ${isExpired ? '❗️' : ''}</div>
                                ${hiddenBadgeHtml}
                            </div>
                        </div>
                        <div class="participants-list">${participantsHtml}</div>
                        <div class="card-actions">${actionsHtml}</div>
                    </div>
                `;
                container.innerHTML += html;
            });
            
            if (visibleBetsCount === 0) {
                container.innerHTML = "<p style='text-align:center; color:#666; margin-top:50px;'>Brak zakładów. Dodaj pierwszy!</p>";
            }
        });

        // --- EDYCJA ZAKŁADU ---
        window.editBet = async (betId, participantName) => {
            const docRef = doc(db, "custom_bets", betId);
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) return;

            const data = docSnap.data();
            const pIndex = data.participants.findIndex(p => p.name === participantName);
            if (pIndex === -1) return;

            const currentVal = data.participants[pIndex].prediction;
            const newVal = prompt(`Edytuj typ dla ${participantName}:`, currentVal);

            if (newVal && newVal !== currentVal) {
                // Inicjalizuj historię jeśli nie istnieje
                if (!data.participants[pIndex].history) {
                    data.participants[pIndex].history = [];
                }

                // Dodaj stary wpis do historii
                data.participants[pIndex].history.push({
                    val: currentVal,
                    date: new Date().toLocaleString()
                });

                // Zaktualizuj na nowy
                data.participants[pIndex].prediction = newVal;

                await updateDoc(docRef, { participants: data.participants });
            }
        };

        // --- HISTORIA EDYCJI ---
        window.viewHistory = async (betId, participantName) => {
            const docRef = doc(db, "custom_bets", betId);
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) return;

            const data = docSnap.data();
            const p = data.participants.find(p => p.name === participantName);
            
            if (p && p.history && p.history.length > 0) {
                let msg = `HISTORIA EDYCJI (${participantName}):\n\n`;
                p.history.forEach(h => {
                    msg += `📅 ${h.date}:\n"${h.val}"\n⬇⬇⬇\n`;
                });
                msg += `OBECNIE: "${p.prediction}"`;
                alert(msg);
            } else {
                alert("Brak historii edycji.");
            }
        };

        // --- ROZSTRZYGANIE ---
        window.openResolveModal = async (id) => {
            currentResolveId = id;
            const docRef = await getDoc(doc(db, "custom_bets", id));
            if(!docRef.exists()) return;
            const data = docRef.data();

            document.getElementById('resolve-topic').innerText = data.topic;
            const list = document.getElementById('winner-list');
            list.innerHTML = "";

            data.participants.forEach(p => {
                const row = document.createElement('label');
                row.className = 'winner-select-row';
                row.innerHTML = `
                    <input type="radio" name="winnerRadio" value="${p.name}">
                    <span style="color:#fff; font-weight:bold;">${p.name}</span>
                    <span style="color:#888; font-size:12px; margin-left:10px;">(${p.prediction})</span>
                `;
                list.appendChild(row);
            });

            document.getElementById('resolve-overlay').style.display = 'flex';
        };

        window.confirmWinner = async () => {
            const radios = document.getElementsByName('winnerRadio');
            let winner = null;
            for(const r of radios) { if(r.checked) winner = r.value; }
            if(!winner) return alert("Wybierz zwycięzcę!");
            await updateDoc(doc(db, "custom_bets", currentResolveId), { status: 'finished', winner: winner });
            document.getElementById('resolve-overlay').style.display = 'none';
        };

        window.deleteBet = async (id) => {
            if(confirm("Usunąć ten zakład?")) {
                await deleteDoc(doc(db, "custom_bets", id));
            }
        };
    </script>
</body>
</html>
