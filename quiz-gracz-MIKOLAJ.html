<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mikołajki | Terminal Agenta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<style>
:root { --gold: #ffd700; --red: #d62828; --green: #2dc653; --bg: #071710; }
body {
font-family: sans-serif; background: radial-gradient(circle at top, #1b4332 0%, #071710 85%);
color: #fff; margin: 0; padding: 15px; min-height: 100vh; display: flex; flex-direction: column;
align-items: center; justify-content: center; text-align: center; box-sizing: border-box;
touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.card {
background: rgba(15, 38, 28, 0.94); border: 2px solid var(--gold); border-radius: 24px;
padding: 22px 18px; width: 95%; max-width: 410px; box-shadow: 0 15px 40px rgba(0,0,0,0.7);
box-sizing: border-box;
}
h2 { color: var(--gold); margin: 0 0 12px 0; text-transform: uppercase; font-size: 20px; letter-spacing: 1.5px; }
select, input[type="text"], input[type="number"] {
width: 100%; padding: 15px; font-size: 20px; border-radius: 14px; border: 2px solid var(--gold);
background: #040d09; color: #fff; text-align: center; font-weight: 900; box-sizing: border-box;
margin-bottom: 12px; outline: none;
}
.btn-main {
width: 100%; padding: 18px; border-radius: 16px; border: 2px solid #fff;
background: linear-gradient(135deg, var(--red), #9b111e); color: #fff;
font-size: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer;
box-shadow: 0 8px 20px rgba(214, 40, 40, 0.45); transition: 0.15s; display: inline-block; box-sizing: border-box;
}
.btn-main:active { transform: scale(0.95); }
.btn-green { background: linear-gradient(135deg, #2dc653, #15803d); color: #000; }
.task-box { background: rgba(0,0,0,0.45); border: 1px dashed var(--gold); border-radius: 14px; padding: 15px; margin: 12px 0; font-size: 16px; line-height: 1.4; color: #f1f5f9; font-weight: bold; }
.step-badge { display: inline-block; background: var(--gold); color: #000; font-weight: 900; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 8px; }
.preview-img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 12px; border: 2px solid var(--gold); margin-top: 10px; display: none; }
.opt-btn { width: 100%; padding: 15px; margin: 6px 0; border-radius: 12px; border: 2px solid var(--gold); background: #0b2419; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
.opt-btn:active { background: var(--gold); color: #000; }
.Tap-btn {
width: 210px; height: 210px; border-radius: 50%; border: 6px solid var(--gold);
background: radial-gradient(circle, #ff4d4d 0%, #9b111e 100%); color: #fff;
font-size: 24px; font-weight: 900; cursor: pointer; margin: 15px auto;
display: flex; flex-direction: column; align-items: center; justify-content: center;
box-shadow: 0 0 35px rgba(255, 77, 77, 0.7);
}
.Tap-btn:active { transform: scale(0.91); filter: brightness(1.25); }
.hold-scanner {
width: 220px; height: 220px; border-radius: 50%; border: 5px dashed var(--gold);
background: rgba(0, 212, 255, 0.12); color: var(--gold); margin: 15px auto;
display: flex; flex-direction: column; align-items: center; justify-content: center;
font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s;
}
.hold-scanner.holding {
background: rgba(45, 198, 83, 0.35); border-style: solid; border-color: #2dc653;
color: #fff; box-shadow: 0 0 40px #2dc653; transform: scale(1.04);
}
.penalty-box {
background: rgba(214, 40, 40, 0.25); border: 3px solid #ff4d4d; border-radius: 16px;
padding: 22px 14px; margin: 12px 0; color: #fff; font-weight: 900;
}
.feedback { color: #ff6b6b; font-weight: 900; font-size: 14px; min-height: 20px; margin-top: 6px; }
</style>
</head>
<body>

<div class="card" id="loginView">
<h2>🎅 MIKOŁAJKOWY TERMINAL AGENTA 🎄</h2>
<p style="font-size:14px; color:#cbd5e1;">Wybierz swoje imię, aby pomóc odblokować Skarbiec Mikołaja:</p>
<select id="agentSel">
<option value="" disabled selected>-- WYBIERZ AGENTA --</option>
<option value="Lila">🦌 Lila</option>
<option value="Kaja">⛄ Kaja</option>
<option value="Darek">🎄 Darek</option>
<option value="Jas">🎅 Jaś</option>
</select>
<button class="btn-main btn-green" onclick="window.joinMission()">DOŁĄCZ DO MISJI</button>
</div>

<div class="card" id="gameView" style="display:none;">
<div id="topAgentHeader" style="font-size:13px; color:var(--gold); font-weight:900; letter-spacing:1px; margin-bottom:6px;">AGENT</div>
<div id="stageContent"></div>
<div class="feedback" id="feedbackMsg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const db = getFirestore(initializeApp(firebaseConfig));
const stateRef = doc(db, "mikolajGame", "state");

const STAGE1_PHOTOS = {
Lila: [
"Zrób zdjęcie uśmiechniętego Bartusia!",
"Zrób zbliżenie na swoją własną skarpetkę (świąteczny skarpetkowy potwór)!",
"Zrób wspólne zdjęcie pozostałym Agentom, jak robią najśmieszniejsze miny!"
],
Kaja: [
"Załóż okulary przeciwsłoneczne lub zimową czapkę i zrób sobie wesołe selfie!",
"Znajdź w domu coś zielonego jak choinka lub roślina i zrób temu zdjęcie!",
"Zrób zdjęcie swoim ulubionym butom gotowym na daleką wyprawę!"
],
Darek: [
"Zrób zdjęcie rzeczy, w którą można spakować ekwipunek na wyjazd (plecak, walizka lub torba)!",
"Znajdź w domu przedmiot pokazujący godzinę i zrób mu zdjęcie!",
"Zrób z ukrycia zdjęcie (jak tajny detektyw!) któremuś z dorosłych w pokoju!"
],
Jas: [
"Znajdź w domu coś czerwonego jak czapka Świętego Mikołaja i zrób temu zdjęcie!",
"Zrób zdjęcie swojej ulubionej zabawce lub pluszakowi!",
"Zrób zdjęcie kubkowi lub szklance, z której pije się ciepłą zimową herbatę!"
]
};

const STAGE2_RIDDLES = {
Lila: [
{ q: "Połykam brudne ubrania, wiruję jak szalona i puszczam gęstą pianę, choć nigdzie z łazienki nie wychodzę. Gdzie ukryto pierwszy kod?", code: "482" },
{ q: "Drugi szyfr nie leży na żadnym meblu! Trzyma go przy sobie seniorka rodu, której wypieki i obiady nie mają sobie równych – mama Waszej mamy lub wujka.", code: "915" },
{ q: "Ostatni Twój szyfr spoczywa w Twoim własnym królestwie na czterech nogach – dokładnie tam, gdzie odrabiasz lekcje, rysujesz i odkładasz zeszyty!", code: "307" }
],
Kaja: [
{ q: "Zwykle zieję gorącem jak wulkan i rumienię świąteczne ciasta za szklaną szybą, ale dziś jestem chłodny i czekam, aż zajrzysz do mojego wnętrza!", code: "629" },
{ q: "Milczę na ścianie tam, gdzie myjesz ręce i zęby, ale potrafię bezbłędnie przedrzeźniać każdą minę, którą przede mną zrobisz!", code: "154" },
{ q: "Ostatni kod ma przy sobie osoba, która zna Twoją mamę od kołyski, bo jest jej starszą siostrą! Podbiegnij do tej cioci po tajny szyfr!", code: "840" }
],
Darek: [
{ q: "Prywatna piaszczysta wyspa w domu, którą odwiedza tylko czworonożny mruczący domownik! Nie musisz kopać w żwirku – obejrzyj jej obudowę z boku!", code: "518" },
{ q: "Świecę prosto w Twoje oczy w tej właśnie sekundzie i wyświetlam całą tę grę! Sprawdź ostrożnie przy mojej ramce lub pod podstawką!", code: "763" },
{ q: "Trzeciego kodu pilnuje młodsza siostra Twojej mamy Ani! Odszukaj tę ciocię i szepnij jej hasło: 'Mikołaj pakuje walizki'!", code: "291" }
],
Jas: [
{ q: "Nawet w środku lata w moim brzuchu panuje arktyczny mróz, a gdy otwierasz moje drzwi, zapala się jasne światełko. Zajrzyj do środka!", code: "336" },
{ q: "Odpoczywamy parami na podłodze blisko drzwi wyjściowych i cierpliwie czekamy, aż włożysz w nas stopy przed wyjściem na dwór!", code: "804" },
{ q: "Gdy nalejesz mi do brzuszka zimnej wody i klikniesz pstryczek, po chwili zaczynam głośno bulgotać i puszczać gorącą parę dzióbkiem!", code: "672" }
]
};

// ETAP 3: ZERO WZMIANEK O CYPRZE - CZYSTO ŚWIĄTECZNO-ZIMOWE ZAGADKI!
const STAGE3_QUIZ = {
Lila: [
{ q: "W jakiej mroźnej krainie na północy Finlandii znajduje się oficjalna wioska Świętego Mikołaja?", o: ["W Laponii", "Na Saharze", "W Bawarii"], c: 0 },
{ q: "Ile geometrycznych ramion ma zawsze prawdziwy płatek śniegu oglądany pod lupą?", o: ["Cztery", "Sześć", "Osiem"], c: 1 },
{ q: "Jak nazywa się najsłynniejszy renifer Mikołaja z błyszczącym czerwonym nosem?", o: ["Kometek", "Rudolf", "Błyskawiczny"], c: 1 }
],
Kaja: [
{ q: "Co według tradycji trzeba wypatrzeć na wigilijnym niebie, zanim zasiądziemy do kolacji?", o: ["Pełnię Księżyca", "Pierwszą gwiazdkę", "Tęczę"], c: 1 },
{ q: "Które drzewo iglaste jako jedyne w Polsce gubi swoje wszystkie igły na zimę?", o: ["Świerk", "Modrzew", "Jodła"], c: 1 },
{ q: "Co zostawia się pod choinką lub na talerzyku jako przysmak dla Świętego Mikołaja?", o: ["Mleko i ciasteczka", "Zupę pomidorową", "Surowe ziemniaki"], c: 0 }
],
Darek: [
{ q: "Które z tych zwierząt zapada w głęboki sen zimowy aż do nadejścia wiosny?", o: ["Wilk", "Świstak i niedźwiedź", "Zając szarak"], c: 1 },
{ q: "W jakiej temperaturze zwykła woda zaczyna zamarzać i zamieniać się w lód?", o: ["0 stopni Celsjusza", "10 stopni Celsjusza", "100 stopni Celsjusza"], c: 0 },
{ q: "Jak nazywa się tradycyjny puszysty wypiek z rodzynkami lub lukrem pieczony w Święta?", o: ["Makowiec i piernik", "Pizza margherita", "Tortilla"], c: 0 }
],
Jas: [
{ q: "Jakiego koloru jest płaszcz i czapka Świętego Mikołaja?", o: ["Zielonego", "Czerwonego", "Niebieskiego"], c: 1 },
{ q: "Jakie zwierzęta z rogami ciągną sanie Mikołaja po zimowym niebie?", o: ["Renifery", "Żyrafy", "Pingwiny"], c: 0 },
{ q: "Z czego lepi się bałwana na podwórku, gdy spadnie biały puch?", o: ["Z piasku", "Ze śniegu", "Z błota"], c: 1 }
]
};

let myName = "";
let currentState = null;
let lastRenderKey = "";
let isHoldingScanner = false;
let quizPenaltyInterval = null;
let stage5PadTimer = null;

window.joinMission = () => {
myName = document.getElementById('agentSel').value;
if (!myName) return alert("Wybierz swoje imię!");
document.getElementById('loginView').style.display = 'none';
document.getElementById('gameView').style.display = 'block';
document.getElementById('topAgentHeader').innerText = `🎄 AGENT: ${myName.toUpperCase()} 🎁`;

onSnapshot(stateRef, (snap) => {
if (!snap.exists()) return;
currentState = snap.data();
renderPad();
});
};

function getQuizLockRemainingSec() {
const unlockAt = parseInt(localStorage.getItem('mikolaj_quiz_lock_' + myName) || '0', 10);
return Math.max(0, Math.ceil((unlockAt - Date.now()) / 1000));
}

function startStage5LocalCountdown() {
if (stage5PadTimer) clearInterval(stage5PadTimer);
stage5PadTimer = setInterval(() => {
if (!currentState || currentState.stage !== 5 || currentState.status !== "stage5_active") {
clearInterval(stage5PadTimer);
return;
}
const el = document.getElementById('padStage5Sec');
if (!el) return;
const startT = currentState.tapsStartTime || Date.now();
const rem = Math.max(0, (20000 - (Date.now() - startT)) / 1000);
el.innerText = `⏱️ POZOSTAŁO CZASU: ${rem.toFixed(1)}s`;
}, 100);
}

function renderPad() {
const container = document.getElementById('stageContent');
const fb = document.getElementById('feedbackMsg');
if (!currentState) return;

const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
if (!activeList.includes(myName)) {
container.innerHTML = `<div class="task-box">Odznaczono Cię w panelu Admina w tej rundzie.</div>`;
return;
}

const st = currentState.stage || 0;
const status = currentState.status || "idle";
const myStep = (currentState.stepProgress && currentState.stepProgress[myName]) || 0;
const myPhoto = (currentState.photos && currentState.photos[myName]) || {};

if (st === 5 && status === "stage5_active") {
const countEl = document.getElementById('liveTapCounter');
if (countEl) {
countEl.innerText = `${currentState.tapsCount || 0} / ${currentState.tapsTarget || 300}`;
return;
}
}

if (st === 6 && status === "stage6_active") {
const secEl = document.getElementById('padHoldSec');
if (secEl) {
secEl.innerText = ((currentState.holdRemainingMs !== undefined ? currentState.holdRemainingMs : 60000) / 1000).toFixed(1) + "s";
return;
}
}

const lockRem = st === 3 ? getQuizLockRemainingSec() : 0;
const renderKey = `${st}_${status}_${myStep}_${myPhoto.status || ""}_${currentState.simonLevel || 0}_${lockRem > 0 ? "locked" : "open"}`;
if (renderKey === lastRenderKey) return;
lastRenderKey = renderKey;
fb.innerText = "";

if (status === "idle" || st === 0) {
container.innerHTML = `<h2>GOTOWY DO MISJI!</h2><div class="task-box">Patrz na ekran telewizora. Zaraz Wujek uruchomi pierwszy etap!</div>`;
return;
}

if (status === "finale_suspense") {
container.innerHTML = `<h2>🔓 ZAMKI PUSZCZAJĄ...</h2><div class="task-box" style="border-color:var(--gold); color:var(--gold); font-size:18px;">PATRZ UWAŻNIE NA TELEWIZOR! Pancerne rygle Skarbca właśnie się otwierają...</div>`;
return;
}

if (status === "finale_unlocked" || st === 7) {
container.innerHTML = `<h2>🏆 SKARBIEC OTWARTY! 🏆</h2><div class="task-box" style="border-color:#2dc653; color:#ffd700; font-size:19px;">KLUCZ DO SKRZYNI Z PREZENTEM MA W KIESZENI WUJEK! ŁAPCIE GO! 🎅🔑</div>`;
return;
}

if (status === "stage_complete") {
container.innerHTML = `<h2>✅ ETAP ${currentState.completedStageNum} UKOŃCZONY!</h2><div class="task-box" style="border-color:#2dc653;">Brawo Drużyno! Rygiel skarbca puścił! Patrzcie na TV i kliknijcie gotowość na kolejny etap!</div>
<button class="btn-main btn-green" onclick="window.triggerNextStageFromPad()">🚀 URUCHOM KOLEJNY ETAP!</button>`;
return;
}

// ETAP 1: FOTO-ZWIAD
if (st === 1) {
if (myStep >= 3) {
container.innerHTML = `<h2>📸 ZDJĘCIA ZALICZONE (3/3)!</h2><div class="task-box">Wszystkie Twoje 3 zdjęcia zostały zaakceptowane! Pomóż reszcie drużyny!</div>`;
return;
}
const taskText = STAGE1_PHOTOS[myName][myStep];
if (myPhoto.status === "pending") {
container.innerHTML = `<span class="step-badge">ZDJĘCIE ${myStep + 1} / 3</span><h2>⏳ WERYFIKACJA...</h2>
<div class="task-box">Twoje zdjęcie wyświetla się teraz na telewizorze! Czekamy aż Wujek je zatwierdzi...</div>`;
return;
}
container.innerHTML = `
<span class="step-badge">FOTO-ZADANIE ${myStep + 1} / 3</span>
<h2>📸 ZRÓB ZDJĘCIE!</h2>
<div class="task-box">${taskText}</div>
${myPhoto.status === "rejected" ? `<div style="color:#ff4d4d; font-weight:bold; margin-bottom:8px;">❌ Wujek poprosił o wyraźniejsze zdjęcie! Spróbuj jeszcze raz!</div>` : ""}
<label class="btn-main btn-green" style="cursor:pointer;">
📷 OTWÓRZ APARAT / ZRÓB ZDJĘCIE
<input type="file" accept="image/*" capture="environment" style="display:none;" onchange="window.handlePhotoUpload(event)">
</label>
`;
return;
}

// ETAP 2: POSZUKIWACZE TAJNYCH KODÓW
if (st === 2) {
if (myStep >= 3) {
container.innerHTML = `<h2>🔐 KODY ZNALEZIONE (3/3)!</h2><div class="task-box">Brawo! Znalazłeś wszystkie 3 tajne karteczki! Pomóż teraz pozostałym!</div>`;
return;
}
const riddleObj = STAGE2_RIDDLES[myName][myStep];
container.innerHTML = `
<span class="step-badge">KRYJÓWKA ${myStep + 1} / 3</span>
<h2>🔎 ZNAJDŹ KOD W DOMU</h2>
<div class="task-box">${riddleObj.q}</div>
<input type="number" id="codeInput" placeholder="Wpisz 3-cyfrowy kod..." inputmode="numeric">
<button class="btn-main btn-green" onclick="window.submitRiddleCode()">🔓 SPRAWDŹ KOD</button>
`;
return;
}

// ETAP 3: PO 3 PYTANIA ŚWIĄTECZNO-ZIMOWE Z BLOKADĄ 20 SEKUND ZA BŁĄD!
if (st === 3) {
if (myStep >= 3) {
container.innerHTML = `<h2>🧠 PYTANIA ROZWIĄZANE (3/3)!</h2><div class="task-box">Świetna robota! Czekamy aż reszta drużyny odpowie na swoje pytania!</div>`;
return;
}
if (lockRem > 0) {
container.innerHTML = `
<span class="step-badge">BLOKADA ZA BŁĄD!</span>
<h2>❄️ TERMINAL ZAMROŻONY!</h2>
<div class="penalty-box">
Pudło! Nie można strzelać na oślep!<br><br>
Odczekaj: <span id="lockTimerSpan" style="font-size:28px; color:var(--gold);">${lockRem}s</span>
</div>
`;
if (quizPenaltyInterval) clearInterval(quizPenaltyInterval);
quizPenaltyInterval = setInterval(() => {
const r = getQuizLockRemainingSec();
const sp = document.getElementById('lockTimerSpan');
if (sp) sp.innerText = r + "s";
if (r <= 0) {
clearInterval(quizPenaltyInterval);
lastRenderKey = "";
renderPad();
}
}, 250);
return;
}
const qObj = STAGE3_QUIZ[myName][myStep];
container.innerHTML = `
<span class="step-badge">PYTANIE ${myStep + 1} / 3 (BŁĄD = BLOKADA 20s)</span>
<h2>🎄 ZAGADKA MIKOŁAJA</h2>
<div class="task-box">${qObj.q}</div>
${qObj.o.map((opt, idx) => `<button class="opt-btn" onclick="window.submitQuizAns(${idx})">${opt}</button>`).join("")}
`;
return;
}

// ETAP 4: TAJNY SZYFR KOLORÓW ELFÓW
if (st === 4) {
const colorMap = {
Lila: { name: "ŻÓŁTY 🔔", bg: "#f59e0b" },
Kaja: { name: "NIEBIESKI ❄️", bg: "#00d4ff" },
Darek: { name: "ZIELONY 🎄", bg: "#2dc653" },
Jas: { name: "CZERWONY 🎅", bg: "#d62828" }
};
const myCol = colorMap[myName];
const isWatching = (status === "stage4_watch");
container.innerHTML = `
<span class="step-badge">POZIOM SZYFRU: ${currentState.simonLevel || 1} / 3</span>
<h2>🎶 SZYFR KOLORÓW ELFÓW</h2>
<div class="task-box">${isWatching ? "👀 PATRZ UWAŻNIE NA TELEWIZOR! Zapamiętaj, kiedy zapala się Twój kolor!" : "👉 WASZA KOLEJ! Naciskajcie swoje kolory w takiej samej kolejności jak na TV!"}</div>
<button class="btn-main" style="background:${myCol.bg}; color:#000; padding:38px 15px; font-size:24px; opacity:${isWatching ? 0.35 : 1};" ${isWatching ? "disabled" : ""} onclick="window.pressSimonColor()">
TWÓJ KOLOR:<br>${myCol.name}
</button>
`;
return;
}

// ETAP 5: TANKOWANIE SAŃ (20 SEKUND!)
if (st === 5) {
if (status === "stage5_failed") {
container.innerHTML = `
<h2>❄️ CZAS 20s MINĄŁ!</h2>
<div class="task-box" style="border-color:#ff4d4d;">Zabrakło odrobiny mocy! Rozgrzejcie palce i spróbujcie jeszcze raz!</div>
<button class="btn-main btn-green" onclick="window.restartStage5()">🔥 SPRÓBUJCIE PONOWNIE (20s)!</button>
`;
return;
}
container.innerHTML = `
<span class="step-badge">WYZWANIE 20 SEKUND!</span>
<h2>🔥 ROZGRZEJ SILNIK SAŃ!</h2>
<div id="padStage5Sec" style="font-size:18px; font-weight:900; color:#ff4d4d; margin-bottom:4px;">⏱️ POZOSTAŁO CZASU: 20.0s</div>
<div style="font-size:22px; font-weight:900; color:var(--gold);" id="liveTapCounter">${currentState.tapsCount || 0} / ${currentState.tapsTarget || 300}</div>
<div class="Tap-btn" onclick="window.sendEngineTap()">🔥<br>STUKAJ<br>SZYBKO!</div>
`;
startStage5LocalCountdown();
return;
}

// ETAP 6: SKANER WYTRWAŁOŚCI 60 SEKUND
if (st === 6) {
const secRem = ((currentState.holdRemainingMs !== undefined ? currentState.holdRemainingMs : 60000) / 1000).toFixed(1);
container.innerHTML = `
<span class="step-badge">OSTATNI RYGIEL SKARBCA!</span>
<h2>⚡ SKANER LINII PAPILARNYCH</h2>
<div class="task-box">Wszyscy jednocześnie przytrzymajcie palec na skanerze przez 60 sekund!<br>(Pozostało: <b id="padHoldSec" style="color:var(--gold); font-size:20px;">${secRem}s</b>)</div>
<div class="hold-scanner ${isHoldingScanner ? 'holding' : ''}" id="scannerPad">
🖐️<br>${isHoldingScanner ? "TRZYMASZ!" : "PRZYŁÓŻ I TRZYMAJ PALEC"}
</div>
`;
bindScannerEvents();
}
}

window.handlePhotoUpload = (e) => {
const file = e.target.files[0];
if (!file) return;
const fb = document.getElementById('feedbackMsg');
fb.style.color = "#ffd700";
fb.innerText = "⏳ Przesyłanie zdjęcia na telewizor...";

const reader = new FileReader();
reader.onload = (ev) => {
const img = new Image();
img.onload = async () => {
const canvas = document.createElement('canvas');
const maxW = 540;
const scale = Math.min(1, maxW / img.width);
canvas.width = Math.round(img.width * scale);
canvas.height = Math.round(img.height * scale);
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
const dataUrl = canvas.toDataURL('image/jpeg', 0.68);

const snap = await getDoc(stateRef);
const data = snap.data() || {};
let photos = { ...(data.photos || {}) };
photos[myName] = { img: dataUrl, status: "pending", uploadedAt: Date.now() };
await updateDoc(stateRef, { photos: photos, photoTick: Date.now() });
fb.innerText = "";
};
img.src = ev.target.result;
};
reader.readAsDataURL(file);
};

window.submitRiddleCode = async () => {
const val = (document.getElementById('codeInput').value || "").trim();
const myStep = (currentState.stepProgress && currentState.stepProgress[myName]) || 0;
const targetCode = STAGE2_RIDDLES[myName][myStep].code;
const fb = document.getElementById('feedbackMsg');

if (val === targetCode) {
fb.style.color = "#2dc653";
fb.innerText = "✅ KOD POPRAWNY!";
const snap = await getDoc(stateRef);
const data = snap.data();
let prog = { ...(data.stepProgress || {}) };
prog[myName] = Math.min(3, (prog[myName] || 0) + 1);
const activeList = data.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const allDone = activeList.every(p => (prog[p] || 0) >= 3);
await updateDoc(stateRef, {
stepProgress: prog,
status: allDone ? "stage_complete" : "stage2_active",
completedStageNum: allDone ? 2 : 0,
speechTick: allDone ? Date.now() : (data.speechTick || 0),
solveTick: Date.now()
});
} else {
fb.style.color = "#ff4d4d";
fb.innerText = "❌ BŁĘDNY KOD! SZUKAJ DALEJ!";
document.getElementById('codeInput').value = "";
}
};

window.submitQuizAns = async (idx) => {
if (getQuizLockRemainingSec() > 0) return;
const myStep = (currentState.stepProgress && currentState.stepProgress[myName]) || 0;
const qObj = STAGE3_QUIZ[myName][myStep];
const fb = document.getElementById('feedbackMsg');

if (idx === qObj.c) {
fb.style.color = "#2dc653";
fb.innerText = "✅ DOBRZE!";
const snap = await getDoc(stateRef);
const data = snap.data();
let prog = { ...(data.stepProgress || {}) };
prog[myName] = Math.min(3, (prog[myName] || 0) + 1);
const activeList = data.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const allDone = activeList.every(p => (prog[p] || 0) >= 3);
await updateDoc(stateRef, {
stepProgress: prog,
status: allDone ? "stage_complete" : "stage3_active",
completedStageNum: allDone ? 3 : 0,
speechTick: allDone ? Date.now() : (data.speechTick || 0),
solveTick: Date.now()
});
} else {
// Karna blokada na 20 sekund!
localStorage.setItem('mikolaj_quiz_lock_' + myName, String(Date.now() + 20000));
lastRenderKey = "";
renderPad();
}
};

window.pressSimonColor = async () => {
if (!currentState || currentState.stage !== 4 || currentState.status !== "stage4_input") return;
const snap = await getDoc(stateRef);
const data = snap.data();
if (data.status !== "stage4_input") return;

const seq = data.simonSeq || [];
let inp = [...(data.simonInput || []), myName];
const curIdx = inp.length - 1;

if (seq[curIdx] !== myName) {
const activeList = data.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const newSeq = [];
for (let i = 0; i < seq.length; i++) newSeq.push(activeList[Math.floor(Math.random() * activeList.length)]);
await updateDoc(stateRef, {
status: "stage4_watch",
simonSeq: newSeq,
simonInput: [],
simonMistakeBy: myName,
seqTick: Date.now()
});
return;
}

if (inp.length >= seq.length) {
const nextLvl = (data.simonLevel || 1) + 1;
if (nextLvl > 3) {
await updateDoc(stateRef, {
lastColorPressed: myName,
colorTick: Date.now(),
status: "stage_complete",
completedStageNum: 4,
speechTick: Date.now()
});
} else {
const activeList = data.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const len = nextLvl === 2 ? 5 : 6;
const newSeq = [];
for (let i = 0; i < len; i++) newSeq.push(activeList[Math.floor(Math.random() * activeList.length)]);
await updateDoc(stateRef, {
status: "stage4_watch",
simonLevel: nextLvl,
simonSeq: newSeq,
simonInput: [],
simonMistakeBy: "",
lastColorPressed: myName,
colorTick: Date.now(),
seqTick: Date.now()
});
}
} else {
await updateDoc(stateRef, { simonInput: inp, lastColorPressed: myName, colorTick: Date.now() });
}
};

window.sendEngineTap = async () => {
if (!currentState || currentState.stage !== 5 || currentState.status !== "stage5_active") return;
const snap = await getDoc(stateRef);
const data = snap.data();
if (data.status !== "stage5_active") return;
const nextCount = (data.tapsCount || 0) + 1;
const target = data.tapsTarget || 300;
if (nextCount >= target) {
await updateDoc(stateRef, {
tapsCount: target,
status: "stage_complete",
completedStageNum: 5,
speechTick: Date.now()
});
} else {
await updateDoc(stateRef, { tapsCount: nextCount });
}
};

window.restartStage5 = async () => {
const activeList = (currentState && currentState.activePlayers) || ["Lila", "Kaja", "Darek", "Jas"];
await updateDoc(stateRef, {
status: "stage5_active",
tapsCount: 0,
tapsTarget: activeList.length * 75,
tapsStartTime: Date.now(),
speechTick: Date.now()
});
};

window.triggerNextStageFromPad = async () => {
if (!currentState || currentState.status !== "stage_complete") return;
const nextSt = (currentState.completedStageNum || 1) + 1;
const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const resetProg = { Lila: 0, Kaja: 0, Darek: 0, Jas: 0 };

if (nextSt === 2) {
await updateDoc(stateRef, { stage: 2, status: "stage2_active", stepProgress: resetProg, speechTick: Date.now() });
} else if (nextSt === 3) {
await updateDoc(stateRef, { stage: 3, status: "stage3_active", stepProgress: resetProg, speechTick: Date.now() });
} else if (nextSt === 4) {
const seq = [];
for (let i = 0; i < 4; i++) seq.push(activeList[Math.floor(Math.random() * activeList.length)]);
await updateDoc(stateRef, { stage: 4, status: "stage4_watch", simonLevel: 1, simonSeq: seq, simonInput: [], simonMistakeBy: "", seqTick: Date.now(), speechTick: Date.now() });
} else if (nextSt === 5) {
await updateDoc(stateRef, { stage: 5, status: "stage5_active", tapsCount: 0, tapsTarget: activeList.length * 75, tapsStartTime: Date.now(), speechTick: Date.now() });
} else if (nextSt === 6) {
await updateDoc(stateRef, { stage: 6, status: "stage6_active", holdMap: { Lila: false, Kaja: false, Darek: false, Jas: false }, holdRemainingMs: 60000, speechTick: Date.now() });
}
};

function bindScannerEvents() {
const el = document.getElementById('scannerPad');
if (!el) return;
const setHold = async (val) => {
if (isHoldingScanner === val) return;
isHoldingScanner = val;
el.classList.toggle('holding', val);
const snap = await getDoc(stateRef);
const data = snap.data() || {};
let hm = { ...(data.holdMap || {}) };
hm[myName] = val;
await updateDoc(stateRef, { holdMap: hm });
};
el.ontouchstart = (e) => { e.preventDefault(); setHold(true); };
el.ontouchend = (e) => { e.preventDefault(); setHold(false); };
el.ontouchcancel = (e) => { e.preventDefault(); setHold(false); };
el.onmousedown = () => setHold(true);
window.onmouseup = () => { if (isHoldingScanner) setHold(false); };
}
</script>
</body>
</html>
