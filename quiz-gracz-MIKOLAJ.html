let myName = "";
let currentState = null;
let lastRenderKey = "";
let isHoldingScanner = false;
let quizPenaltyInterval = null;
let stage7PadTimer = null;

// Etap 2: Mikrofon
let mediaRecorder = null;
let audioChunks = [];
let recordedBase64 = null;

// Etap 3: Akcelerometr (próg 22.0 + max 1 pkt na 150ms, cel 2500 pkt/os.)
let motionActive = false;
let shakeScore = 0;
let lastShakeCountAt = 0;
let lastShakeSync = 0;

window.joinMission = () => {
myName = document.getElementById('agentSel').value;
if (!myName) return alert("Wybierz swoje imię!");

if (!snap.exists()) return;

renderPad();
});
};

function getQuizLockRemainingSec() {
const unlockAt = parseInt(localStorage.getItem('mikolaj_quiz_lock_' + myName) || '0', 10);
return Math.max(0, Math.ceil((unlockAt - Date.now()) / 1000));
}

function startStage7LocalCountdown() {
if (stage7PadTimer) clearInterval(stage7PadTimer);
stage7PadTimer = setInterval(() => {
if (!currentState || currentState.stage !== 7 || currentState.status !== "stage7_active") {
clearInterval(stage7PadTimer);
return;
}
const el = document.getElementById('padStage7Sec');
if (!el) return;
const startT = currentState.tapsStartTime || Date.now();
const rem = Math.max(0, (20000 - (Date.now() - startT)) / 1000);
el.innerText = "⏱️ POZOSTAŁO CZASU: " + rem.toFixed(1) + "s";
}, 100);
}

// --- ETAP 2: MIKROFON ---
window.requestMicPermission = async () => {
try {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
mediaRecorder = new MediaRecorder(stream);
mediaRecorder.ondataavailable = (e) => {
if (e.data && e.data.size > 0) audioChunks.push(e.data);
};
mediaRecorder.onstop = () => {
const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
const reader = new FileReader();
reader.readAsDataURL(blob);
reader.onloadend = () => {
recordedBase64 = reader.result;
const player = document.getElementById('localAudioPlayer');
if (player) player.src = recordedBase64;
lastRenderKey = "";
renderPad();
};
audioChunks = [];
};
lastRenderKey = "";
renderPad();
} catch (err) {
alert("Brak dostępu do mikrofonu! Zezwól przeglądarce na mikrofon w pasku adresu.");
}
};

function bindMicEvents() {
const btn = document.getElementById('micRecordBtn');
if (!btn) return;
const startRec = () => {
if (mediaRecorder && mediaRecorder.state === "inactive") {
audioChunks = [];
mediaRecorder.start();
btn.classList.add('recording');
btn.innerHTML = "🎙️<br>NAGRYWAM!<br>(PUŚĆ ABY STOP)";
}
};
const stopRec = () => {
if (mediaRecorder && mediaRecorder.state === "recording") {
mediaRecorder.stop();
btn.classList.remove('recording');
btn.innerHTML = "⏳<br>PRZETWARZAM...";
}
};
btn.ontouchstart = (e) => { e.preventDefault(); startRec(); };
btn.ontouchend = (e) => { e.preventDefault(); stopRec(); };
btn.ontouchcancel = (e) => { e.preventDefault(); stopRec(); };
btn.onmousedown = () => startRec();
btn.onmouseup = () => stopRec();
}

window.playMyRecording = () => {

if (player && recordedBase64) {
player.currentTime = 0;
player.play().catch(() => {});
}
};

window.discardMyRecording = () => {
recordedBase64 = null;
lastRenderKey = "";
renderPad();
};

window.sendMyRecording = async () => {
if (!recordedBase64 || !currentState) return;
const fb = document.getElementById('feedbackMsg');
fb.style.color = "#ffd700";
fb.innerText = "⏳ Wysyłanie nagrania na TV...";

const snap = await getDoc(stateRef);
const data = snap.data() || {};
const tracks = { ...(data.audioTracks || {}) };
const myTasks = STAGE2_HYMN_TASKS[myName];
let stepIdx = 0;
if (tracks[myTasks[0].slot]) stepIdx = 1;
if (tracks[myTasks[1].slot]) stepIdx = 2;
if (stepIdx < 3) {
tracks[myTasks[stepIdx].slot] = recordedBase64;
}
recordedBase64 = null;
await updateDoc(stateRef, { audioTracks: tracks, trackUpdatedTick: Date.now() });
fb.innerText = "";
};

// --- ETAP 3: AKCELEROMETR (LÓD) ---
window.requestMotionPermission = () => {
if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
DeviceMotionEvent.requestPermission().then(state => {
if (state === 'granted') {
window.addEventListener('devicemotion', handleMotion);
motionActive = true;
lastRenderKey = "";
renderPad();
} else {
alert("Zezwól na czujniki ruchu lub używaj przycisku uderzenia w lód!");
}
}).catch(() => {});
} else {
window.addEventListener('devicemotion', handleMotion);
motionActive = true;
lastRenderKey = "";
renderPad();
}
};

function handleMotion(e) {
if (!motionActive || !currentState || currentState.stage !== 3 || currentState.status !== "stage3_ice") return;
const acc = e.accelerationIncludingGravity;
if (!acc) return;
const mag = Math.sqrt((acc.x || 0) * (acc.x || 0) + (acc.y || 0) * (acc.y || 0) + (acc.z || 0) * (acc.z || 0));
const now = Date.now();
if (mag > 22.0 && now - lastShakeCountAt > 150) {
lastShakeCountAt = now;
shakeScore += 1;
if (now - lastShakeSync > 550) {
lastShakeSync = now;
const add = shakeScore;
shakeScore = 0;
getDoc(stateRef).then(snap => {
if (!snap.exists()) return;
const d = snap.data();
if (d.stage === 3 && d.status === "stage3_ice") {
updateDoc(stateRef, { iceTotalHits: (d.iceTotalHits || 0) + add });
}
});
}
}
}

window.manualIceHit = async () => {
if (!currentState || currentState.stage !== 3 || currentState.status !== "stage3_ice") return;
const snap = await getDoc(stateRef);
const d = snap.data() || {};
await updateDoc(stateRef, { iceTotalHits: (d.iceTotalHits || 0) + 1 });
};

// GENERATOR SEKWENCJI SIMONA (POZWALA NA MAX 2 TAKIE SAME KOLORY Z RZĘDU)
function buildSmartSimonSequence(len, activeList) {
const pool = (activeList && activeList.length > 0) ? activeList : ["Lila", "Kaja", "Darek", "Jas"];
const res = [];
for (let i = 0; i < len; i++) {
let candidates = pool;
if (pool.length > 1 && i >= 2 && res[i - 1] === res[i - 2]) {
candidates = pool.filter(p => p !== res[i - 1]);
}
res.push(candidates[Math.floor(Math.random() * candidates.length)]);
}
return res;
}

function renderPad() {
const container = document.getElementById('stageContent');
const fb = document.getElementById('feedbackMsg');
if (!currentState) return;

const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
if (!activeList.includes(myName)) {
container.innerHTML = '<div class="task-box">Odznaczono Cię w panelu Admina w tej rundzie.</div>';
return;
}

const st = currentState.stage || 0;
const status = currentState.status || "idle";
const myStep = (currentState.stepProgress && currentState.stepProgress[myName]) || 0;
const myPhoto = (currentState.photos && currentState.photos[myName]) || {};

if (st === 7 && status === "stage7_active") {
const countEl = document.getElementById('liveTapCounter');
if (countEl) {
countEl.innerText = (currentState.tapsCount || 0) + " / " + (currentState.tapsTarget || 300);
return;
}
}

if (st === 8 && status === "stage8_active") {
const secEl = document.getElementById('padHoldSec');
if (secEl) {
secEl.innerText = ((currentState.holdRemainingMs !== undefined ? currentState.holdRemainingMs : 60000) / 1000).toFixed(1) + "s";
return;
}
}

const tracks = currentState.audioTracks || {};
const myTasks = STAGE2_HYMN_TASKS[myName];
let hymnDoneCount = 0;
myTasks.forEach(t => { if (tracks[t.slot]) hymnDoneCount++; });

const hasMic = mediaRecorder !== null;
const hasRec = recordedBase64 !== null;
const lockRem = st === 5 ? getQuizLockRemainingSec() : 0;
const renderKey = st + "_" + status + "_" + myStep + "_" + (myPhoto.status || "") + "_" + (currentState.simonLevel || 0) + "_" + (lockRem > 0 ? "locked" : "open") + "_" + hasMic + "_" + hasRec + "_" + hymnDoneCount + "_" + motionActive;

if (renderKey === lastRenderKey) return;
lastRenderKey = renderKey;
fb.innerText = "";

if (status === "idle" || st === 0) {
container.innerHTML = '<h2>GOTOWY DO MISJI!</h2><div class="task-box">Patrz na ekran telewizora. Zaraz Wujek uruchomi pierwszy etap!</div>';
return;
}

if (status === "finale_suspense" || status === "finale_unlocked" || st === 9) {
container.innerHTML = '<h2>🔓 SKARBIEC SIĘ OTWIERA...</h2><div class="task-box" style="border-color:var(--gold); color:var(--gold); font-size:18px;">👀 PATRZ UWAŻNIE NA TELEWIZOR! Skaner właśnie odczytuje lokalizację tajnego klucza...</div>';
return;
}

if (status === "stage_complete") {
container.innerHTML = '<h2>✅ ETAP ' + currentState.completedStageNum + ' UKOŃCZONY!</h2><div class="task-box" style="border-color:#2dc653;">Brawo Drużyno! Rygiel skarbca puścił! Patrzcie na TV i kliknijcie gotowość na kolejny etap!</div>'
+ '<button class="btn-main btn-green" onclick="window.triggerNextStageFromPad()">🚀 URUCHOM KOLEJNY ETAP!</button>';
return;
}

// ETAP 1: FOTO-ZWIAD
if (st === 1) {
if (myStep >= 3) {
container.innerHTML = '<h2>📸 ZDJĘCIA ZALICZONE (3/3)!</h2><div class="task-box">Wszystkie Twoje 3 zdjęcia zostały zaakceptowane! Pomóż reszcie drużyny!</div>';
return;
}
const taskText = STAGE1_PHOTOS[myName][myStep];
if (myPhoto.status === "pending") {
container.innerHTML = '<span class="step-badge">ZDJĘCIE ' + (myStep + 1) + ' / 3</span><h2>⏳ WERYFIKACJA...</h2>'
+ '<div class="task-box">Twoje zdjęcie wyświetla się teraz na telewizorze! Czekamy aż Wujek je zatwierdzi...</div>';
return;
}
const rejHtml = myPhoto.status === "rejected"
? '<div style="color:#ff4d4d; font-weight:bold; margin-bottom:8px;">❌ Wujek poprosił o wyraźniejsze zdjęcie! Spróbuj jeszcze raz!</div>'
: '';
container.innerHTML = '<span class="step-badge">FOTO-ZADANIE ' + (myStep + 1) + ' / 3</span>'
+ '<h2>📸 ZRÓB ZDJĘCIE!</h2>'
+ '<div class="task-box">' + taskText + '</div>'
+ rejHtml
+ '<label class="btn-main btn-green" style="cursor:pointer;">📷 OTWÓRZ APARAT / ZRÓB ZDJĘCIE<input type="file" accept="image/*" capture="environment" style="display:none;" onchange="window.handlePhotoUpload(event)"></label>';
return;
}

// ETAP 2: HYMN (1. ZWROTKA + REFREN, 3 FRAZY NA OSOBĘ, BARTUŚ SOLO W "POLSKA!")
if (st === 2) {
if (hymnDoneCount >= 3) {
container.innerHTML = '<span class="step-badge">ETAP 2: HYMN (3/3)</span><h2>✅ WSZYSTKIE 3 NAGRANIA GOTOWE!</h2><div class="task-box" style="border-color:#2dc653;">Super! Twoje słowa i nagranie z Bartusiem są już na TV! Czekamy na resztę drużyny!</div>';
return;
}
const curTask = myTasks[hymnDoneCount];
const boxClass = curTask.bartus ? "bartus-box" : "task-box";
const taskHtml = curTask.desc + '<br><span style="font-size:25px; color:var(--gold);">"' + curTask.word + '"</span>';

if (!hasMic) {
container.innerHTML = '<span class="step-badge">NAGRANIE ' + (hymnDoneCount + 1) + ' / 3</span><h2>🎤 WOKALNY NAPĘD SAŃ</h2>'
+ '<div class="' + boxClass + '">' + taskHtml + '</div>'
+ '<button class="btn-main btn-green" onclick="window.requestMicPermission()">1. ZEZWÓL NA MIKROFON</button>';
} else if (!hasRec) {
container.innerHTML = '<span class="step-badge">NAGRANIE ' + (hymnDoneCount + 1) + ' / 3</span><h2>🎙️ NAGRAJ FRAZĘ!</h2>'
+ '<div class="' + boxClass + '">' + taskHtml + '</div>'
+ '<div style="font-size:13px; color:#cbd5e1;">Przytrzymaj niebieski przycisk podczas śpiewania, puść gdy skończysz:</div>'
+ '<div class="Tap-btn mic-btn" id="micRecordBtn">🎙️<br>TRZYMAJ<br>I NAGRAJ</div>';
setTimeout(bindMicEvents, 100);
} else {
container.innerHTML = '<span class="step-badge">NAGRANIE ' + (hymnDoneCount + 1) + ' / 3</span><h2>🎧 SPRAWDŹ NAGRANIE</h2>'
+ '<div class="task-box">Odsłuchaj czy dobrze słychać: <b style="color:var(--gold);">"' + curTask.word + '"</b></div>'
+ '<button class="btn-main btn-blue" onclick="window.playMyRecording()">▶️ ODSŁUCHAJ</button>'
+ '<button class="btn-main btn-green" onclick="window.sendMyRecording()">✅ ZATWIERDŹ I WYŚLIJ</button>'
+ '<button class="btn-main" style="background:#334155;" onclick="window.discardMyRecording()">🔄 NAGRAJ PONOWNIE</button>';
}
return;
}

// ETAP 3: ROZBIJANIE LODU (POTRZĄSANIE TELEFONEM)
if (st === 3) {
const motionHtml = !motionActive
? '<button class="btn-main btn-green" onclick="window.requestMotionPermission()">🚀 WŁĄCZ CZUJNIK RUCHU</button>'
: '<div class="shake-banner">📱 MOCNO TRZĘŚ TELEFONEM! 🧊</div>';
container.innerHTML = '<span class="step-badge">ETAP 3 / 8</span><h2>🧊 ROZBIJ PANCERNY LÓD!</h2>'
+ '<div class="task-box">Chwyć mocno telefon i energicznie nim trzęś, aby skruszyć bryłę lodu na TV!</div>'
+ motionHtml
+ '<button class="btn-main btn-blue" style="margin-top:8px;" onclick="window.manualIceHit()">🔨 UDERZ W LÓD (AWARYJNIE)</button>';
return;
}

// ETAP 4: POSZUKIWACZE TAJNYCH KODÓW
if (st === 4) {
if (myStep >= 3) {
container.innerHTML = '<h2>🔐 KODY ZNALEZIONE (3/3)!</h2><div class="task-box">Brawo! Znalazłeś wszystkie 3 tajne karteczki! Pomóż teraz pozostałym!</div>';
return;
}
const riddleObj = STAGE4_RIDDLES[myName][myStep];
container.innerHTML = '<span class="step-badge">KRYJÓWKA ' + (myStep + 1) + ' / 3</span>'
+ '<h2>🔎 ZNAJDŹ KOD W DOMU</h2>'
+ '<div class="task-box">' + riddleObj.q + '</div>'
+ '<input type="number" id="codeInput" placeholder="Wpisz 3-cyfrowy kod..." inputmode="numeric">'
+ '<button class="btn-main btn-green" onclick="window.submitRiddleCode()">🔓 SPRAWDŹ KOD</button>';
return;
}

// ETAP 5: PO 3 PYTANIA ŚWIĄTECZNO-ZIMOWE Z BLOKADĄ 20 SEKUND ZA BŁĄD!
if (st === 5) {
if (myStep >= 3) {
container.innerHTML = '<h2>🧠 PYTANIA ROZWIĄZANE (3/3)!</h2><div class="task-box">Świetna robota! Czekamy aż reszta drużyny odpowie na swoje pytania!</div>';
return;
}
if (lockRem > 0) {
container.innerHTML = '<span class="step-badge">BLOKADA ZA BŁĄD!</span>'
+ '<h2>❄️ TERMINAL ZAMROŻONY!</h2>'
+ '<div class="penalty-box">Pudło! Nie można strzelać na oślep!<br><br>Odczekaj: <span id="lockTimerSpan" style="font-size:28px; color:var(--gold);">' + lockRem + 's</span></div>';
if (quizPenaltyInterval) clearInterval(quizPenaltyInterval);
quizPenaltyInterval = setInterval(() => {
const r = getQuizLockRemainingSec();
const sp = document.getElementById('lockTimerSpan');
if (sp) sp.innerText = r + "s";
if (r <= 0) {
clearInterval(quizPenaltyInterval);
lastRenderKey = "";
renderPad();
}
}, 250);
return;
}
const qObj = STAGE5_QUIZ[myName][myStep];
let optsHtml = "";
qObj.o.forEach((opt, idx) => {
optsHtml += '<button class="opt-btn" onclick="window.submitQuizAns(' + idx + ')">' + opt + '</button>';
});
container.innerHTML = '<span class="step-badge">PYTANIE ' + (myStep + 1) + ' / 3 (BŁĄD = BLOKADA 20s)</span>'
+ '<h2>🎄 ZAGADKA MIKOŁAJA</h2>'
+ '<div class="task-box">' + qObj.q + '</div>'
+ optsHtml;
return;
}

// ETAP 6: TAJNY SZYFR KOLORÓW ELFÓW (SIMON SAYS 7/8/9)
if (st === 6) {
const colorMap = {
Lila: { name: "ŻÓŁTY 🔔", bg: "#f59e0b" },
Kaja: { name: "NIEBIESKI ❄️", bg: "#00d4ff" },
Darek: { name: "ZIELONY 🎄", bg: "#2dc653" },
Jas: { name: "CZERWONY 🎅", bg: "#d62828" }
};
const myCol = colorMap[myName];
const isWatching = (status === "stage6_watch");
const infoTxt = isWatching
? "👀 PATRZ UWAŻNIE NA TELEWIZOR! Zapamiętaj, kiedy zapala się Twój kolor!"
: "👉 WASZA KOLEJ! Naciskajcie swoje kolory w takiej samej kolejności jak na TV!";
container.innerHTML = '<span class="step-badge">POZIOM SZYFRU: ' + (currentState.simonLevel || 1) + ' / 3</span>'
+ '<h2>🎶 SZYFR KOLORÓW ELFÓW</h2>'
+ '<div class="task-box">' + infoTxt + '</div>'
+ '<button class="btn-main" style="background:' + myCol.bg + '; color:#000; padding:38px 15px; font-size:24px; opacity:' + (isWatching ? 0.35 : 1) + ';" ' + (isWatching ? "disabled" : "") + ' onclick="window.pressSimonColor()">TWÓJ KOLOR:<br>' + myCol.name + '</button>';
return;
}

// ETAP 7: TANKOWANIE SAŃ (ZABLOKOWANE DO KOŃCA LEKTORA!)
if (st === 7) {
if (status === "stage7_speaking") {
container.innerHTML = '<span class="step-badge">SŁUCHAJ LEKTORA!</span>'
+ '<h2>🔥 ROZGRZEJ SILNIK SAŃ!</h2>'
+ '<div class="task-box" style="border-color:var(--gold); color:var(--gold);">🗣️ Lektor czyta polecenie... Przycisk odblokuje się dopiero na sygnał START!</div>'
+ '<div class="Tap-btn btn-disabled">⏳<br>CZEKAJ...</div>';
return;
}
if (status === "stage7_failed") {
container.innerHTML = '<h2>❄️ CZAS 20s MINĄŁ!</h2>'
+ '<div class="task-box" style="border-color:#ff4d4d;">Zabrakło odrobiny mocy! Rozgrzejcie palce i spróbujcie jeszcze raz!</div>'
+ '<button class="btn-main btn-green" onclick="window.restartStage7()">🔥 SPRÓBUJCIE PONOWNIE (20s)!</button>';
return;
}
container.innerHTML = '<span class="step-badge">WYZWANIE 20 SEKUND!</span>'
+ '<h2>🔥 ROZGRZEJ SILNIK SAŃ!</h2>'
+ '<div id="padStage7Sec" style="font-size:18px; font-weight:900; color:#ff4d4d; margin-bottom:4px;">⏱️ POZOSTAŁO CZASU: 20.0s</div>'
+ '<div style="font-size:22px; font-weight:900; color:var(--gold);" id="liveTapCounter">' + (currentState.tapsCount || 0) + ' / ' + (currentState.tapsTarget || 300) + '</div>'
+ '<div class="Tap-btn" onclick="window.sendEngineTap()">🔥<br>STUKAJ<br>SZYBKO!</div>';
startStage7LocalCountdown();
return;
}

// ETAP 8: SKANER WYTRWAŁOŚCI 60 SEKUND
if (st === 8) {
const secRem = ((currentState.holdRemainingMs !== undefined ? currentState.holdRemainingMs : 60000) / 1000).toFixed(1);
container.innerHTML = '<span class="step-badge">OSTATNI RYGIEL SKARBCA!</span>'
+ '<h2>⚡ SKANER LINII PAPILARNYCH</h2>'
+ '<div class="task-box">Wszyscy jednocześnie przytrzymajcie palec na skanerze przez 60 sekund!<br>(Pozostało: <b id="padHoldSec" style="color:var(--gold); font-size:20px;">' + secRem + 's</b>)</div>'
+ '<div class="hold-scanner ' + (isHoldingScanner ? 'holding' : '') + '" id="scannerPad">🖐️<br>' + (isHoldingScanner ? "TRZYMASZ!" : "PRZYŁÓŻ I TRZYMAJ PALEC") + '</div>';
bindScannerEvents();
}
}

window.handlePhotoUpload = (e) => {
const file = e.target.files[0];
if (!file) return;
const fb = document.getElementById('feedbackMsg');
fb.style.color = "#ffd700";
fb.innerText = "⏳ Przesyłanie zdjęcia na telewizor...";

const reader = new FileReader();
reader.onload = (ev) => {
const img = new Image();
img.onload = async () => {
const canvas = document.createElement('canvas');
const maxW = 540;
const scale = Math.min(1, maxW / img.width);
canvas.width = Math.round(img.width * scale);
canvas.height = Math.round(img.height * scale);
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
const dataUrl = canvas.toDataURL('image/jpeg', 0.68);

const snap = await getDoc(stateRef);
const data = snap.data() || {};
let photos = { ...(data.photos || {}) };
photos[myName] = { img: dataUrl, status: "pending", uploadedAt: Date.now() };
await updateDoc(stateRef, { photos: photos, photoTick: Date.now() });
fb.innerText = "";
};
img.src = ev.target.result;
};
reader.readAsDataURL(file);
};

window.submitRiddleCode = async () => {
const val = (document.getElementById('codeInput').value || "").trim();
const myStep = (currentState.stepProgress && currentState.stepProgress[myName]) || 0;
const targetCode = STAGE4_RIDDLES[myName][myStep].code;
const fb = document.getElementById('feedbackMsg');

if (val === targetCode) {
fb.style.color = "#2dc653";
fb.innerText = "✅ KOD POPRAWNY!";
const snap = await getDoc(stateRef);
const data = snap.data();
let prog = { ...(data.stepProgress || {}) };
prog[myName] = Math.min(3, (prog[myName] || 0) + 1);
const activeList = data.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const allDone = activeList.every(p => (prog[p] || 0) >= 3);
await updateDoc(stateRef, {
stepProgress: prog,
status: allDone ? "stage_complete" : "stage4_active",
completedStageNum: allDone ? 4 : 0,
speechTick: allDone ? Date.now() : (data.speechTick || 0),
solveTick: Date.now()
});
} else {
fb.style.color = "#ff4d4d";
fb.innerText = "❌ BŁĘDNY KOD! SZUKAJ DALEJ!";
document.getElementById('codeInput').value = "";
}
};

window.submitQuizAns = async (idx) => {
if (getQuizLockRemainingSec() > 0) return;
const myStep = (currentState.stepProgress && currentState.stepProgress[myName]) || 0;
const qObj = STAGE5_QUIZ[myName][myStep];
const fb = document.getElementById('feedbackMsg');

if (idx === qObj.c) {
fb.style.color = "#2dc653";
fb.innerText = "✅ DOBRZE!";
const snap = await getDoc(stateRef);
const data = snap.data();
let prog = { ...(data.stepProgress || {}) };
prog[myName] = Math.min(3, (prog[myName] || 0) + 1);
const activeList = data.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const allDone = activeList.every(p => (prog[p] || 0) >= 3);
await updateDoc(stateRef, {
stepProgress: prog,
status: allDone ? "stage_complete" : "stage5_active",
completedStageNum: allDone ? 5 : 0,
speechTick: allDone ? Date.now() : (data.speechTick || 0),
solveTick: Date.now()
});
} else {
localStorage.setItem('mikolaj_quiz_lock_' + myName, String(Date.now() + 20000));
lastRenderKey = "";
renderPad();
}
};

window.pressSimonColor = async () => {
if (!currentState || currentState.stage !== 6 || currentState.status !== "stage6_input") return;
const snap = await getDoc(stateRef);
const data = snap.data();
if (data.status !== "stage6_input") return;

const seq = data.simonSeq || [];
let inp = [...(data.simonInput || []), myName];
const curIdx = inp.length - 1;

if (seq[curIdx] !== myName) {
const activeList = data.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const newSeq = buildSmartSimonSequence(seq.length, activeList);
await updateDoc(stateRef, {
status: "stage6_watch",
simonSeq: newSeq,
simonInput: [],
simonMistakeBy: myName,
seqTick: Date.now()
});
return;
}

if (inp.length >= seq.length) {
const nextLvl = (data.simonLevel || 1) + 1;
if (nextLvl > 3) {
await updateDoc(stateRef, {
lastColorPressed: myName,
colorTick: Date.now(),
status: "stage_complete",
completedStageNum: 6,
speechTick: Date.now()
});
} else {
const activeList = data.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const len = nextLvl === 2 ? 8 : 9;
const newSeq = buildSmartSimonSequence(len, activeList);
await updateDoc(stateRef, {
status: "stage6_watch",
simonLevel: nextLvl,
simonSeq: newSeq,
simonInput: [],
simonMistakeBy: "",
lastColorPressed: myName,
colorTick: Date.now(),
seqTick: Date.now()
});
}
} else {
await updateDoc(stateRef, { simonInput: inp, lastColorPressed: myName, colorTick: Date.now() });
}
};

window.sendEngineTap = async () => {
if (!currentState || currentState.stage !== 7 || currentState.status !== "stage7_active") return;
const snap = await getDoc(stateRef);
const data = snap.data();
if (data.status !== "stage7_active") return;
const nextCount = (data.tapsCount || 0) + 1;
const target = data.tapsTarget || 300;
if (nextCount >= target) {
await updateDoc(stateRef, {
tapsCount: target,
status: "stage_complete",
completedStageNum: 7,
speechTick: Date.now()
});
} else {
await updateDoc(stateRef, { tapsCount: nextCount });
}
};

window.restartStage7 = async () => {
const activeList = (currentState && currentState.activePlayers) || ["Lila", "Kaja", "Darek", "Jas"];
await updateDoc(stateRef, {
status: "stage7_speaking",
tapsCount: 0,
tapsTarget: activeList.length * 75,
tapsStartTime: 0,
speechTick: Date.now()
});
};

window.triggerNextStageFromPad = async () => {
if (!currentState || currentState.status !== "stage_complete") return;
const nextSt = (currentState.completedStageNum || 1) + 1;
const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const resetProg = { Lila: 0, Kaja: 0, Darek: 0, Jas: 0 };

if (nextSt === 2) {
recordedBase64 = null;
await updateDoc(stateRef, { stage: 2, status: "stage2_active", audioTracks: {}, speechTick: Date.now() });
} else if (nextSt === 3) {
await updateDoc(stateRef, { stage: 3, status: "stage3_ice", iceTotalHits: 0, iceTarget: activeList.length * 2500, speechTick: Date.now() });
} else if (nextSt === 4) {
await updateDoc(stateRef, { stage: 4, status: "stage4_active", stepProgress: resetProg, speechTick: Date.now() });
} else if (nextSt === 5) {
await updateDoc(stateRef, { stage: 5, status: "stage5_active", stepProgress: resetProg, speechTick: Date.now() });
} else if (nextSt === 6) {
const seq = buildSmartSimonSequence(7, activeList);
await updateDoc(stateRef, { stage: 6, status: "stage6_watch", simonLevel: 1, simonSeq: seq, simonInput: [], simonMistakeBy: "", seqTick: Date.now(), speechTick: Date.now() });
} else if (nextSt === 7) {
await updateDoc(stateRef, { stage: 7, status: "stage7_speaking", tapsCount: 0, tapsTarget: activeList.length * 75, tapsStartTime: 0, speechTick: Date.now() });
} else if (nextSt === 8) {
await updateDoc(stateRef, { stage: 8, status: "stage8_active", holdMap: { Lila: false, Kaja: false, Darek: false, Jas: false }, holdRemainingMs: 60000, speechTick: Date.now() });
}
};

function bindScannerEvents() {
const el = document.getElementById('scannerPad');
if (!el) return;
const setHold = async (val) => {
if (isHoldingScanner === val) return;
isHoldingScanner = val;
el.classList.toggle('holding', val);
const snap = await getDoc(stateRef);
const data = snap.data() || {};
let hm = { ...(data.holdMap || {}) };
hm[myName] = val;
await updateDoc(stateRef, { holdMap: hm });
};
el.ontouchstart = (e) => { e.preventDefault(); setHold(true); };
el.ontouchend = (e) => { e.preventDefault(); setHold(false); };
el.ontouchcancel = (e) => { e.preventDefault(); setHold(false); };
el.onmousedown = () => setHold(true);
window.onmouseup = () => { if (isHoldingScanner) setHold(false); };
}
</script>
</body>
</html>
