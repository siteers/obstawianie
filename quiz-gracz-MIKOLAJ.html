<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mikołajki | Terminal Agenta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<style>
:root { --gold: #ffd700; --red: #d62828; --green: #2dc653; --bg: #071710; }
body { font-family: sans-serif; background: radial-gradient(circle at top, #1b4332 0%, #071710 85%); color: #fff; margin: 0; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.card { background: rgba(15, 38, 28, 0.94); border: 2px solid var(--gold); border-radius: 24px; padding: 22px 18px; width: 95%; max-width: 410px; box-shadow: 0 15px 40px rgba(0,0,0,0.7); box-sizing: border-box; }
h2 { color: var(--gold); margin: 0 0 12px 0; text-transform: uppercase; font-size: 20px; letter-spacing: 1.5px; }
select, input[type="text"], input[type="number"] { width: 100%; padding: 15px; font-size: 20px; border-radius: 14px; border: 2px solid var(--gold); background: #040d09; color: #fff; text-align: center; font-weight: 900; box-sizing: border-box; margin-bottom: 12px; outline: none; }
.btn-main { width: 100%; padding: 16px; border-radius: 16px; border: 2px solid #fff; background: linear-gradient(135deg, var(--red), #9b111e); color: #fff; font-size: 17px; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 0 8px 20px rgba(214, 40, 40, 0.45); transition: 0.15s; display: inline-block; box-sizing: border-box; margin-bottom: 8px; }
.btn-main:active { transform: scale(0.95); }
.btn-green { background: linear-gradient(135deg, #2dc653, #15803d); color: #000; }
.btn-disabled { background: #444 !important; color: #888 !important; border-color: #666 !important; pointer-events: none; box-shadow: none !important; }
.task-box { background: rgba(0,0,0,0.45); border: 1px dashed var(--gold); border-radius: 14px; padding: 15px; margin: 12px 0; font-size: 16px; line-height: 1.4; color: #f1f5f9; font-weight: bold; }
.step-badge { display: inline-block; background: var(--gold); color: #000; font-weight: 900; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 8px; }
.opt-btn { width: 100%; padding: 15px; margin: 6px 0; border-radius: 12px; border: 2px solid var(--gold); background: #0b2419; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
.opt-btn:active { background: var(--gold); color: #000; }
.Tap-btn { width: 210px; height: 210px; border-radius: 50%; border: 6px solid var(--gold); background: radial-gradient(circle, #ff4d4d 0%, #9b111e 100%); color: #fff; font-size: 24px; font-weight: 900; cursor: pointer; margin: 15px auto; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 35px rgba(255, 77, 77, 0.7); }
.Tap-btn:active { transform: scale(0.91); filter: brightness(1.25); }
.hold-scanner { width: 220px; height: 220px; border-radius: 50%; border: 5px dashed var(--gold); background: rgba(0, 212, 255, 0.12); color: var(--gold); margin: 15px auto; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s; }
.hold-scanner.holding { background: rgba(45, 198, 83, 0.35); border-style: solid; border-color: #2dc653; color: #fff; box-shadow: 0 0 40px #2dc653; transform: scale(1.04); }
.penalty-box { background: rgba(214, 40, 40, 0.25); border: 3px solid #ff4d4d; border-radius: 16px; padding: 22px 14px; margin: 12px 0; color: #fff; font-weight: 900; }
.feedback { color: #ff6b6b; font-weight: 900; font-size: 14px; min-height: 20px; margin-top: 6px; }
.mic-btn { background: radial-gradient(circle, #00d4ff 0%, #0077b6 100%); border-color: #00d4ff; box-shadow: 0 0 25px #00d4ff; width: 140px; height: 140px; font-size:18px; }
.mic-btn.recording { background: radial-gradient(circle, #ff4d4d 0%, #d62828 100%); border-color: #ff4d4d; box-shadow: 0 0 40px #ff4d4d; transform: scale(1.05); }
.shake-info { font-size: 22px; color: #00d4ff; font-weight: 900; margin: 15px 0; animation: vibrate 0.2s infinite; }
@keyframes vibrate { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-3px,3px);} 50%{transform:translate(3px,-3px);} 75%{transform:translate(-3px,-3px);} }
</style>
</head>
<body>

<div class="card" id="loginView">
<h2>🎅 TERMINAL AGENTA 🎄</h2>
<select id="agentSel">
<option value="" disabled selected>-- WYBIERZ AGENTA --</option>
<option value="Lila">🦌 Lila</option>
<option value="Kaja">⛄ Kaja</option>
<option value="Darek">🎄 Darek</option>
<option value="Jas">🎅 Jaś</option>
</select>
<button class="btn-main btn-green" onclick="window.joinMission()">DOŁĄCZ DO MISJI</button>
</div>

<div class="card" id="gameView" style="display:none;">
<div id="topAgentHeader" style="font-size:13px; color:var(--gold); font-weight:900; letter-spacing:1px; margin-bottom:6px;">AGENT</div>
<div id="stageContent"></div>
<div class="feedback" id="feedbackMsg"></div>
</div>

<!-- Ukryty odtwarzacz audio dla odsłuchu hymnu -->
<audio id="localAudioPlayer" style="display:none;"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const db = getFirestore(initializeApp(firebaseConfig));
const stateRef = doc(db, "mikolajGame", "state");

let myName = "";
let currentState = null;
let lastRenderKey = "";
let isHoldingScanner = false;
let quizPenaltyInterval = null;
let stage7PadTimer = null;

// Audio Recorder (Etap 2)
let mediaRecorder = null;
let audioChunks = [];
let recordedBase64 = null;
let isRecording = false;

// Akcelerometr (Etap 3)
let isShaking = false;
let shakeScore = 0;
let lastShakeSync = 0;

window.joinMission = () => {
myName = document.getElementById('agentSel').value;
if (!myName) return alert("Wybierz swoje imię!");
document.getElementById('loginView').style.display = 'none';
document.getElementById('gameView').style.display = 'block';
document.getElementById('topAgentHeader').innerText = `🎄 AGENT: ${myName.toUpperCase()} 🎁`;

onSnapshot(stateRef, (snap) => {
if (!snap.exists()) return;
currentState = snap.data();
renderPad();
});
};

function getQuizLockRemainingSec() {
const unlockAt = parseInt(localStorage.getItem('mikolaj_quiz_lock_' + myName) || '0', 10);
return Math.max(0, Math.ceil((unlockAt - Date.now()) / 1000));
}

function startStage7LocalCountdown() {
if (stage7PadTimer) clearInterval(stage7PadTimer);
stage7PadTimer = setInterval(() => {
if (!currentState || currentState.stage !== 7 || currentState.status !== "stage7_active") {
clearInterval(stage7PadTimer);
return;
}
const el = document.getElementById('padStage7Sec');
if (!el) return;
const startT = currentState.tapsStartTime || Date.now();
const rem = Math.max(0, (20000 - (Date.now() - startT)) / 1000);
el.innerText = `⏱️ POZOSTAŁO CZASU: ${rem.toFixed(1)}s`;
}, 100);
}

// Obsługa Etapu 3: Lód
window.requestMotionPermission = () => {
if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
DeviceMotionEvent.requestPermission().then(state => {
if (state === 'granted') {
window.addEventListener('devicemotion', handleMotion);
document.getElementById('motionBtn').style.display = 'none';
isShaking = true;
renderPad(); // Force UI update
}
}).catch(console.error);
} else {
window.addEventListener('devicemotion', handleMotion);
document.getElementById('motionBtn').style.display = 'none';
isShaking = true;
renderPad();
}
};

function handleMotion(e) {
if (!isShaking || !currentState || currentState.stage !== 3 || currentState.status !== "stage3_ice") return;
const acc = e.accelerationIncludingGravity;
if (!acc) return;
const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
// Typowe przyciąganie to ok 9.8. Reagujemy na silne wstrząsy > 15
if (magnitude > 15) {
shakeScore += 2;
const now = Date.now();
if (now - lastShakeSync > 600) {
lastShakeSync = now;
updateDoc(stateRef, { iceTotalHits: (currentState.iceTotalHits || 0) + shakeScore });
shakeScore = 0;
}
}
}

// Obsługa Etapu 2: Mikrofon
window.requestMicPermission = async () => {
try {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
mediaRecorder = new MediaRecorder(stream);
mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
mediaRecorder.onstop = () => {
const blob = new Blob(audioChunks, { type: 'audio/webm' });
const reader = new FileReader();
reader.readAsDataURL(blob);
reader.onloadend = () => {
recordedBase64 = reader.result;
document.getElementById('localAudioPlayer').src = recordedBase64;
lastRenderKey = ""; // wymuś render
renderPad();
};
audioChunks = [];
};
lastRenderKey = "";
renderPad();
} catch (e) {
alert("Musisz zezwolić na użycie mikrofonu, żeby napędzić sanie!");
}
};

function bindMicEvents() {
const btn = document.getElementById('micRecordBtn');
if (!btn) return;
const startRec = () => {
if(mediaRecorder && mediaRecorder.state === "inactive") {
audioChunks = [];
mediaRecorder.start();
btn.classList.add('recording');
btn.innerHTML = "🎙️<br>NAGRYWAM!";
isRecording = true;
}
};
const stopRec = () => {
if(mediaRecorder && mediaRecorder.state === "recording") {
mediaRecorder.stop();
btn.classList.remove('recording');
btn.innerHTML = "🎙️<br>NAGRAJ";
isRecording = false;
}
};
btn.ontouchstart = (e) => { e.preventDefault(); startRec(); };
btn.ontouchend = (e) => { e.preventDefault(); stopRec(); };
btn.ontouchcancel = (e) => { e.preventDefault(); stopRec(); };
btn.onmousedown = () => startRec();
btn.onmouseup = () => stopRec();
}

window.playMyRecording = () => {
const p = document.getElementById('localAudioPlayer');
if (p && recordedBase64) p.play();
};

window.sendMyRecording = async () => {
if (!recordedBase64 || !currentState) return;
document.getElementById('feedbackMsg').innerText = "Wysyłanie...";
const snap = await getDoc(stateRef);
let tracks = snap.data().audioTracks || {};
tracks[myName] = recordedBase64;
await updateDoc(stateRef, { audioTracks: tracks, trackUpdatedTick: Date.now() });
};

window.discardMyRecording = () => {
recordedBase64 = null;
lastRenderKey = "";
renderPad();
};

// GŁÓWNY RENDER KARTY GRACZA
function renderPad() {
const container = document.getElementById('stageContent');
const fb = document.getElementById('feedbackMsg');
if (!currentState) return;

const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
if (!activeList.includes(myName)) {
container.innerHTML = `<div class="task-box">Zostałeś odznaczony w panelu Admina.</div>`;
return;
}

const st = currentState.stage || 0;
const status = currentState.status || "idle";
const myStep = (currentState.stepProgress && currentState.stepProgress[myName]) || 0;
const myPhoto = (currentState.photos && currentState.photos[myName]) || {};

// Dynamiczne aktualizacje
if (st === 7 && status === "stage7_active") {
const countEl = document.getElementById('liveTapCounter');
if (countEl) countEl.innerText = `${currentState.tapsCount || 0} / ${currentState.tapsTarget || 300}`;
return;
}
if (st === 8 && status === "stage8_active") {
const secEl = document.getElementById('padHoldSec');
if (secEl) secEl.innerText = ((currentState.holdRemainingMs !== undefined ? currentState.holdRemainingMs : 60000) / 1000).toFixed(1) + "s";
return;
}

const hasMicAccess = mediaRecorder !== null;
const hasRecording = recordedBase64 !== null;
const isSent = (currentState.audioTracks && currentState.audioTracks[myName]);
const lockRem = st === 5 ? getQuizLockRemainingSec() : 0;
const renderKey = `${st}_${status}_${myStep}_${myPhoto.status||""}_${currentState.simonLevel||0}_${lockRem>0?"locked":"open"}_${hasMicAccess}_${hasRecording}_${isSent}_${isShaking}`;

if (renderKey === lastRenderKey) return;
lastRenderKey = renderKey;
fb.innerText = "";

if (status === "idle" || st === 0) {
container.innerHTML = `<h2>GOTOWY DO MISJI!</h2><div class="task-box">Patrz na telewizor. Czekamy na Start!</div>`;
return;
}
if (status === "stage_complete") {
container.innerHTML = `<h2>✅ ETAP ${currentState.completedStageNum} UKOŃCZONY!</h2><div class="task-box" style="border-color:#2dc653;">Brawo Drużyno! Zobaczcie wynik na TV i przejdźcie dalej!</div>
<button class="btn-main btn-green" onclick="window.triggerNextStageFromPad()">🚀 URUCHOM KOLEJNY ETAP!</button>`;
return;
}
if (status === "finale_suspense") {
container.innerHTML = `<h2>🔓 ZAMKI PUSZCZAJĄ...</h2><div class="task-box" style="border-color:var(--gold); color:var(--gold); font-size:18px;">PATRZ UWAŻNIE NA TELEWIZOR! Pancerne rygle Skarbca właśnie się otwierają...</div>`;
return;
}
if (status === "finale_unlocked" || st === 9) {
container.innerHTML = `<h2>🏆 SKARBIEC OTWARTY! 🏆</h2><div class="task-box" style="border-color:#2dc653; color:#ffd700; font-size:19px;">KLUCZ DO SKRZYNI Z PREZENTEM MA W KIESZENI WUJEK! ŁAPCIE GO! 🎅🔑</div>`;
return;
}

// ETAP 1: FOTO-ZWIAD
if (st === 1) {
if (myStep >= 3) {
container.innerHTML = `<h2>📸 ZDJĘCIA ZALICZONE!</h2><div class="task-box">Wszystkie 3 zdjęcia odhaczone! Pomóż reszcie drużyny!</div>`;
return;
}
const txts = {
Lila: ["Zrób zdjęcie uśmiechniętego Bartusia!", "Zrób zbliżenie na swoją własną skarpetkę (skarpetkowy potwór)!", "Zrób zdjęcie pozostałym Agentom, jak robią najśmieszniejsze miny!"],
Kaja: ["Załóż okulary przeciwsłoneczne lub zimową czapkę i zrób sobie wesołe selfie!", "Znajdź w domu coś zielonego jak choinka i zrób temu zdjęcie!", "Zrób zdjęcie swoim ulubionym butom gotowym na daleką wyprawę!"],
Darek: ["Zrób zdjęcie rzeczy, w którą można spakować ekwipunek na wyjazd (plecak/torba)!", "Znajdź w domu przedmiot pokazujący godzinę i zrób mu zdjęcie!", "Zrób z ukrycia zdjęcie (jak detektyw) któremuś z dorosłych!"],
Jas: ["Znajdź w domu coś czerwonego jak czapka Mikołaja i zrób temu zdjęcie!", "Zrób zdjęcie swojej ulubionej zabawce lub pluszakowi!", "Zrób zdjęcie kubkowi, z którego pije się zimową herbatę!"]
};
const taskText = txts[myName][myStep];
if (myPhoto.status === "pending") {
container.innerHTML = `<span class="step-badge">ZDJĘCIE ${myStep + 1}/3</span><h2>⏳ WERYFIKACJA...</h2><div class="task-box">Twoje zdjęcie jest na ekranie TV! Wujek musi je zatwierdzić...</div>`;
return;
}
container.innerHTML = `
<span class="step-badge">FOTO-ZADANIE ${myStep + 1}/3</span><h2>📸 ZRÓB ZDJĘCIE!</h2><div class="task-box">${taskText}</div>
${myPhoto.status === "rejected" ? `<div style="color:#ff4d4d; font-weight:bold; margin-bottom:8px;">❌ Wujek poprosił o wyraźniejsze zdjęcie! Spróbuj jeszcze raz!</div>` : ""}
<label class="btn-main btn-green" style="cursor:pointer;">📷 OTWÓRZ APARAT / ZRÓB ZDJĘCIE
<input type="file" accept="image/*" capture="environment" style="display:none;" onchange="window.handlePhotoUpload(event)"></label>
`;
return;
}

// ETAP 2: HYMN Z BARTUSIEM (NAGRYWANIE)
if (st === 2) {
if (isSent) {
container.innerHTML = `<span class="step-badge">ETAP 2: HYMN</span><h2>✅ NAGRANIE WYSŁANE!</h2><div class="task-box" style="border-color:#2dc653;">Czekamy na nagrania reszty Agentów i słuchamy na TV!</div>`;
return;
}
const lyrics = { Lila: "JESZCZE", Kaja: "POLSKA", Darek: "NIE ZGINĘŁA", Jas: "KIEDY MY ŻYJEMY!" };
let taskText = `Twoje słowo do hymnu to:<br><span style="font-size:28px; color:var(--gold);">${lyrics[myName] || "POLSKA"}</span>`;
if (myName === "Lila" || myName === "Jas") {
taskText = `⭐ ZADANIE SPECJALNE ⭐<br>Złap Bartusia, wciśnij przycisk i nagraj, jak krzyczy:<br><span style="font-size:28px; color:var(--gold);">${lyrics[myName]}</span>`;
}

if (!hasMicAccess) {
container.innerHTML = `
<span class="step-badge">ETAP 2: HYMN</span><h2>🎤 WOKALNY NAPĘD SAŃ</h2><div class="task-box">${taskText}</div>
<button class="btn-main btn-green" onclick="window.requestMicPermission()">1. ZEZWÓL NA MIKROFON</button>
`;
} else if (!hasRecording) {
container.innerHTML = `
<span class="step-badge">ETAP 2: HYMN</span><h2>🎤 NAGRAJ SŁOWO!</h2><div class="task-box">${taskText}</div>
<p style="font-size:12px; color:#cbd5e1;">Naciśnij i trzymaj przycisk, aby nagrać. Puść, by zakończyć.</p>
<div class="Tap-btn mic-btn" id="micRecordBtn">🎙️<br>NAGRAJ</div>
`;
setTimeout(bindMicEvents, 100);
} else {
container.innerHTML = `
<span class="step-badge">ETAP 2: HYMN</span><h2>🎧 ODSŁUCHAJ I WYŚLIJ</h2>
<div class="task-box">Nagranie gotowe! Możesz je sprawdzić przed wysłaniem na serwer Mikołaja.</div>
<button class="btn-main" onclick="window.playMyRecording()">▶️ ODSŁUCHAJ NAGRANIE</button>
<button class="btn-main btn-green" onclick="window.sendMyRecording()">✅ WYŚLIJ DO BAZY</button>
<button class="btn-main" style="background:#444;" onclick="window.discardMyRecording()">🔄 NAGRAJ PONOWNIE</button>
`;
}
return;
}

// ETAP 3: ROZBIJANIE LODU (AKCELEROMETR)
if (st === 3) {
container.innerHTML = `
<span class="step-badge">ETAP 3: ZAMARZNIĘTE SANIE</span><h2>🧊 ROZBIJ LÓD!</h2>
<div class="task-box">Wielka bryła lodu na TV! Chwyć mocno telefon w dłoń i trzęś nim najszybciej jak potrafisz!</div>
${!isShaking ? `<button class="btn-main btn-green" id="motionBtn" onclick="window.requestMotionPermission()">🚀 AKTYWUJ CZUJNIK RUCHU</button>` : `<div class="shake-info">📱 TRZĘŚ TELEFONEM!</div>`}
`;
return;
}

// ETAP 4: KODY W DOMU
if (st === 4) {
if (myStep >= 3) { container.innerHTML = `<h2>🔐 KODY ZNALEZIONE!</h2><div class="task-box">Wszystkie 3 kryjówki zaliczone! Pomóż teraz reszcie!</div>`; return; }
const codes = {
Lila: [ { q: "Połykam brudne ubrania i puszczam pianę. Gdzie ukryto kod?", code: "482" }, { q: "Seniorka rodu z najlepszymi wypiekami. Mama Ani i Krzyska.", code: "915" }, { q: "Odrabiasz tam lekcje i rysujesz – Twoje biurko!", code: "307" } ],
Kaja: [ { q: "Zieję gorącem i piekę ciasta. Dziś jestem chłodny w kuchni.", code: "629" }, { q: "Milczę na ścianie w łazience i przedrzeźniam Twoje miny.", code: "154" }, { q: "Zna Twoją mamę od kołyski, to jej starsza siostra (Ciocia Ania)!", code: "840" } ],
Darek: [ { q: "Prywatna piaszczysta wyspa kota (kuweta)! Szukaj na obudowie.", code: "518" }, { q: "Świecę Ci prosto w oczy – wielki telewizor w salonie!", code: "763" }, { q: "Młodsza siostra Twojej mamy Ani (Ciocia Ola)! Szepnij jej hasło.", code: "291" } ],
Jas: [ { q: "W moim brzuchu zawsze arktyczny mróz i jedzenie (Lodówka).", code: "336" }, { q: "Czekamy na podłodze, aż włożysz w nas stopy by wyjść z domu.", code: "804" }, { q: "Bulgoczę i wypuszczam parę, by zrobić gorącą herbatę (Czajnik)!", code: "672" } ]
};
const riddleObj = codes[myName][myStep];
container.innerHTML = `
<span class="step-badge">KRYJÓWKA ${myStep + 1}/3</span><h2>🔎 ZNAJDŹ KOD W DOMU</h2>
<div class="task-box">${riddleObj.q}</div>
<input type="number" id="codeInput" placeholder="Wpisz 3 cyfry..." inputmode="numeric">
<button class="btn-main btn-green" onclick="window.submitRiddleCode()">🔓 SPRAWDŹ KOD</button>
`;
return;
}

// ETAP 5: QUIZ
if (st === 5) {
if (myStep >= 3) { container.innerHTML = `<h2>🧠 ZAGADKI ROZWIĄZANE!</h2><div class="task-box">Świetnie! Czekamy aż reszta drużyny odgadnie odpowiedzi!</div>`; return; }
if (lockRem > 0) {
container.innerHTML = `<span class="step-badge">BLOKADA ZA BŁĄD!</span><h2>❄️ TERMINAL ZAMROŻONY!</h2><div class="penalty-box">Pudło! Nie można strzelać na oślep!<br>Odczekaj: <span id="lockTimerSpan" style="font-size:28px; color:var(--gold);">${lockRem}s</span></div>`;
if (quizPenaltyInterval) clearInterval(quizPenaltyInterval);
quizPenaltyInterval = setInterval(() => { const r = getQuizLockRemainingSec(); const sp = document.getElementById('lockTimerSpan'); if (sp) sp.innerText = r + "s"; if (r <= 0) { clearInterval(quizPenaltyInterval); lastRenderKey = ""; renderPad(); } }, 250);
return;
}
const quiz = {
Lila: [ { q: "Gdzie znajduje się wioska Mikołaja?", o: ["W Laponii", "Na Saharze", "W Bawarii"], c: 0 }, { q: "Ile ramion ma płatek śniegu?", o: ["Cztery", "Sześć", "Osiem"], c: 1 }, { q: "Renifer z czerwonym nosem?", o: ["Kometek", "Rudolf", "Błyskawiczny"], c: 1 } ],
Kaja: [ { q: "Co wypatrujemy w Wigilię?", o: ["Pełnię", "Pierwszą gwiazdkę", "Tęczę"], c: 1 }, { q: "Drzewo, które gubi igły?", o: ["Świerk", "Modrzew", "Jodła"], c: 1 }, { q: "Przysmak dla Mikołaja?", o: ["Mleko i ciastka", "Zupa", "Ziemniaki"], c: 0 } ],
Darek: [ { q: "Kto zapada w sen zimowy?", o: ["Wilk", "Świstak i niedźwiedź", "Zając"], c: 1 }, { q: "Kiedy woda zamarza?", o: ["0 stopni", "10 stopni", "100 stopni"], c: 0 }, { q: "Świąteczne ciasta?", o: ["Makowiec i piernik", "Pizza", "Tortilla"], c: 0 } ],
Jas: [ { q: "Kolor czapki Mikołaja?", o: ["Zielony", "Czerwony", "Niebieski"], c: 1 }, { q: "Zwierzęta ciągnące sanie?", o: ["Renifery", "Żyrafy", "Pingwiny"], c: 0 }, { q: "Z czego jest bałwan?", o: ["Z piasku", "Ze śniegu", "Z błota"], c: 1 } ]
};
const qObj = quiz[myName][myStep];
container.innerHTML = `
<span class="step-badge">ZAGADKA ${myStep + 1}/3 (BŁĄD = BLOKADA 20s)</span><h2>🎄 MĄDRA GŁOWA</h2>
<div class="task-box">${qObj.q}</div>
${qObj.o.map((opt, idx) => `<button class="opt-btn" onclick="window.submitQuizAns(${idx})">${opt}</button>`).join("")}
`;
return;
}

// ETAP 6: SIMON SAYS
if (st === 6) {
const colorMap = { Lila: { n: "ŻÓŁTY 🔔", bg: "#f59e0b" }, Kaja: { n: "NIEBIESKI ❄️", bg: "#00d4ff" }, Darek: { n: "ZIELONY 🎄", bg: "#2dc653" }, Jas: { n: "CZERWONY 🎅", bg: "#d62828" } };
const myCol = colorMap[myName];
const isWatching = (status === "stage6_watch");
container.innerHTML = `
<span class="step-badge">POZIOM SZYFRU: ${currentState.simonLevel || 1} / 3</span><h2>🎶 SZYFR ELFÓW</h2>
<div class="task-box">${isWatching ? "👀 PATRZ UWAŻNIE NA TELEWIZOR! Zapamiętaj, kiedy zapala się Twój kolor!" : "👉 WASZA KOLEJ! Wciśnijcie kolory w odpowiedniej kolejności!"}</div>
<button class="btn-main" style="background:${myCol.bg}; color:#000; padding:38px 15px; font-size:24px; opacity:${isWatching ? 0.35 : 1};" ${isWatching ? "disabled" : ""} onclick="window.pressSimonColor()">TWÓJ KOLOR:<br>${myCol.n}</button>
`;
return;
}

// ETAP 7: TANKOWANIE (20s)
if (st === 7) {
if (status === "stage7_speaking") {
container.innerHTML = `<span class="step-badge">CZEKAJ NA START!</span><h2>🔥 TANKOWANIE SAŃ</h2><div class="task-box" style="border-color:var(--gold); color:var(--gold);">🗣️ Lektor czyta zasady... Za ułamek sekundy odblokuje się przycisk!</div>
<div class="Tap-btn btn-disabled">⏳<br>CZEKAJ...</div>`;
return;
}
if (status === "stage7_failed") {
container.innerHTML = `<h2>❄️ CZAS MINĄŁ!</h2><div class="task-box" style="border-color:#ff4d4d;">Za mało mocy! Spróbujcie jeszcze raz!</div><button class="btn-main btn-green" onclick="window.restartStage7()">🔥 ZRESETUJ STOPER (20s)!</button>`;
return;
}
container.innerHTML = `
<span class="step-badge">WYZWANIE 20 SEKUND!</span><h2>🔥 SZYBKIE KLIKANIE!</h2>
<div id="padStage7Sec" style="font-size:18px; font-weight:900; color:#ff4d4d; margin-bottom:4px;">⏱️ 20.0s</div>
<div style="font-size:22px; font-weight:900; color:var(--gold);" id="liveTapCounter">${currentState.tapsCount || 0} / ${currentState.tapsTarget || 300}</div>
<div class="Tap-btn" onclick="window.sendEngineTap()">🔥<br>STUKAJ<br>SZYBKO!</div>
`;
startStage7LocalCountdown();
return;
}

// ETAP 8: SKANER
if (st === 8) {
const secRem = ((currentState.holdRemainingMs !== undefined ? currentState.holdRemainingMs : 60000) / 1000).toFixed(1);
container.innerHTML = `
<span class="step-badge">OSTATNI RYGIEL!</span><h2>⚡ SKANER LINII PAPILARNYCH</h2>
<div class="task-box">Wszyscy jednocześnie trzymajcie palec przez 60 sekund!<br>(Pozostało: <b id="padHoldSec" style="color:var(--gold);">${secRem}s</b>)</div>
<div class="hold-scanner ${isHoldingScanner ? 'holding' : ''}" id="scannerPad">🖐️<br>${isHoldingScanner ? "TRZYMASZ!" : "PRZYŁÓŻ I TRZYMAJ PALEC"}</div>
`;
bindScannerEvents();
}
}

// LOGIKA DO FUNKCJI WYKONAWCZYCH
window.handlePhotoUpload = (e) => {
const file = e.target.files[0];
if (!file) return;
document.getElementById('feedbackMsg').innerText = "Wysyłanie zdjęcia na TV...";
const reader = new FileReader();
reader.onload = (ev) => {
const img = new Image();
img.onload = async () => {
const canvas = document.createElement('canvas'); const scale = Math.min(1, 540 / img.width);
canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
const dataUrl = canvas.toDataURL('image/jpeg', 0.68);
const snap = await getDoc(stateRef);
let photos = { ...(snap.data().photos || {}) };
photos[myName] = { img: dataUrl, status: "pending", uploadedAt: Date.now() };
await updateDoc(stateRef, { photos: photos, photoTick: Date.now() });
document.getElementById('feedbackMsg').innerText = "";
};
img.src = ev.target.result;
};
reader.readAsDataURL(file);
};

window.submitRiddleCode = async () => {
const val = (document.getElementById('codeInput').value || "").trim();
const myStep = (currentState.stepProgress && currentState.stepProgress[myName]) || 0;
const targetCode = ["482", "915", "307", "629", "154", "840", "518", "763", "291", "336", "804", "672"].find(c => {
const m = ["Lila", "Kaja", "Darek", "Jas"].indexOf(myName);
return c === [["482", "915", "307"], ["629", "154", "840"], ["518", "763", "291"], ["336", "804", "672"]][m][myStep];
});
if (val === targetCode) {
let prog = { ...(currentState.stepProgress || {}) };
prog[myName] = Math.min(3, (prog[myName] || 0) + 1);
const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const allDone = activeList.every(p => (prog[p] || 0) >= 3);
await updateDoc(stateRef, { stepProgress: prog, status: allDone ? "stage_complete" : "stage4_active", completedStageNum: allDone ? 4 : 0, solveTick: Date.now() });
} else {
document.getElementById('feedbackMsg').innerText = "❌ BŁĘDNY KOD! SZUKAJ DALEJ!";
document.getElementById('codeInput').value = "";
}
};

window.submitQuizAns = async (idx) => {
if (getQuizLockRemainingSec() > 0) return;
const myStep = (currentState.stepProgress && currentState.stepProgress[myName]) || 0;
const correctAns = [[0, 1, 1], [1, 1, 0], [1, 0, 0], [1, 0, 1]][["Lila", "Kaja", "Darek", "Jas"].indexOf(myName)][myStep];
if (idx === correctAns) {
let prog = { ...(currentState.stepProgress || {}) };
prog[myName] = Math.min(3, (prog[myName] || 0) + 1);
const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const allDone = activeList.every(p => (prog[p] || 0) >= 3);
await updateDoc(stateRef, { stepProgress: prog, status: allDone ? "stage_complete" : "stage5_active", completedStageNum: allDone ? 5 : 0, solveTick: Date.now() });
} else {
localStorage.setItem('mikolaj_quiz_lock_' + myName, String(Date.now() + 20000));
lastRenderKey = ""; renderPad();
}
};

window.pressSimonColor = async () => {
if (currentState.status !== "stage6_input") return;
const seq = currentState.simonSeq || [];
let inp = [...(currentState.simonInput || []), myName];
const curIdx = inp.length - 1;
if (seq[curIdx] !== myName) {
const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const newSeq = [];
for (let i = 0; i < seq.length; i++) newSeq.push(activeList[Math.floor(Math.random() * activeList.length)]);
await updateDoc(stateRef, { status: "stage6_watch", simonSeq: newSeq, simonInput: [], simonMistakeBy: myName, seqTick: Date.now() });
return;
}
if (inp.length >= seq.length) {
const nextLvl = (currentState.simonLevel || 1) + 1;
if (nextLvl > 3) {
await updateDoc(stateRef, { lastColorPressed: myName, colorTick: Date.now(), status: "stage_complete", completedStageNum: 6, speechTick: Date.now() });
} else {
const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const len = nextLvl === 2 ? 5 : 6;
const newSeq = [];
for (let i = 0; i < len; i++) newSeq.push(activeList[Math.floor(Math.random() * activeList.length)]);
await updateDoc(stateRef, { status: "stage6_watch", simonLevel: nextLvl, simonSeq: newSeq, simonInput: [], simonMistakeBy: "", lastColorPressed: myName, colorTick: Date.now(), seqTick: Date.now() });
}
} else {
await updateDoc(stateRef, { simonInput: inp, lastColorPressed: myName, colorTick: Date.now() });
}
};

window.sendEngineTap = async () => {
if (currentState.status !== "stage7_active") return;
const nextCount = (currentState.tapsCount || 0) + 1;
const target = currentState.tapsTarget || 300;
if (nextCount >= target) {
await updateDoc(stateRef, { tapsCount: target, status: "stage_complete", completedStageNum: 7, speechTick: Date.now() });
} else {
await updateDoc(stateRef, { tapsCount: nextCount });
}
};

window.restartStage7 = async () => {
const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
await updateDoc(stateRef, { status: "stage7_speaking", tapsCount: 0, tapsTarget: activeList.length * 75, speechTick: Date.now() });
};

window.triggerNextStageFromPad = async () => {
if (!currentState || currentState.status !== "stage_complete") return;
const nextSt = (currentState.completedStageNum || 1) + 1;
const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const resetProg = { Lila: 0, Kaja: 0, Darek: 0, Jas: 0 };
if (nextSt === 2) await updateDoc(stateRef, { stage: 2, status: "stage2_mic", audioTracks: {}, speechTick: Date.now() });
else if (nextSt === 3) await updateDoc(stateRef, { stage: 3, status: "stage3_ice", iceTotalHits: 0, speechTick: Date.now() });
else if (nextSt === 4) await updateDoc(stateRef, { stage: 4, status: "stage4_active", stepProgress: resetProg, speechTick: Date.now() });
else if (nextSt === 5) await updateDoc(stateRef, { stage: 5, status: "stage5_active", stepProgress: resetProg, speechTick: Date.now() });
else if (nextSt === 6) {
const seq = []; for (let i = 0; i < 4; i++) seq.push(activeList[Math.floor(Math.random() * activeList.length)]);
await updateDoc(stateRef, { stage: 6, status: "stage6_watch", simonLevel: 1, simonSeq: seq, simonInput: [], seqTick: Date.now(), speechTick: Date.now() });
}
else if (nextSt === 7) await updateDoc(stateRef, { stage: 7, status: "stage7_speaking", tapsCount: 0, tapsTarget: activeList.length * 75, speechTick: Date.now() });
else if (nextSt === 8) await updateDoc(stateRef, { stage: 8, status: "stage8_active", holdMap: { Lila: false, Kaja: false, Darek: false, Jas: false }, holdRemainingMs: 60000, speechTick: Date.now() });
};

function bindScannerEvents() {
const el = document.getElementById('scannerPad');
if (!el) return;
const setHold = async (val) => {
if (isHoldingScanner === val) return;
isHoldingScanner = val;
el.classList.toggle('holding', val);
let hm = { ...(currentState.holdMap || {}) };
hm[myName] = val;
await updateDoc(stateRef, { holdMap: hm });
};
el.ontouchstart = (e) => { e.preventDefault(); setHold(true); };
el.ontouchend = (e) => { e.preventDefault(); setHold(false); };
el.ontouchcancel = (e) => { e.preventDefault(); setHold(false); };
el.onmousedown = () => setHold(true);
window.onmouseup = () => { if (isHoldingScanner) setHold(false); };
}
</script>
</body>
</html>
