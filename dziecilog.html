<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Agent | Logowanie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  <style>
    :root {
      --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
      --glass: rgba(15, 23, 42, 0.85); --error: #ff0000; --gray: #475569;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
      margin: 0; overflow: hidden; display: flex; justify-content: center;
      align-items: center; min-height: 100vh; perspective: 1000px;
      touch-action: manipulation;
    }
    
    #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
    .tilt-box { z-index: 10; width: 100%; display: flex; justify-content: center; transform-style: preserve-3d; }
    
    .container {
      background: var(--glass); backdrop-filter: blur(25px); padding: 35px; border-radius: 40px;
      width: 95vw; max-width: 440px; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); text-align: center; position: relative; box-sizing: border-box;
      transition: 0.2s;
    }
    h2 { margin: 0 0 30px 0; font-size: 18px; color: var(--gold); text-transform: uppercase; letter-spacing: 3px; font-weight: 900; transition: 0.2s; }
    
    .input-box { margin-bottom: 25px; text-align: center; }
    .input-box label { font-size: 10px; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; display: block; letter-spacing: 2px; }
    
    select, input {
      display: block; width: 100%; padding: 16px; font-size: 18px; border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.5); color: #fff; outline: none; box-sizing: border-box;
      transition: 0.2s; text-align: center; font-family: 'JetBrains Mono', monospace;
      appearance: none; -webkit-appearance: none;
    }
    select:focus, input:focus { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0, 212, 255, 0.25); background: rgba(0, 212, 255, 0.05); }
    select option { background: #0f172a; color: #fff; }

    .btn-cyber {
      width: 100%; padding: 20px; background: var(--cyan); color: #000; border: none; border-radius: 20px;
      font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px;
      box-shadow: 0 10px 25px rgba(0,212,255,0.3); transition: 0.3s;
    }
    .btn-cyber:active { transform: scale(0.96); }
    .btn-cyber:disabled { background: #1a1b26; color: #444; box-shadow: none; cursor: not-allowed; }
    
    #msg { margin-top: 20px; font-size: 13px; font-weight: 900; min-height: 20px; text-transform: uppercase; letter-spacing: 1px; }

    /* --- QR KOD SEKCYJKA --- */
    .qr-container {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
    }
    .qr-container p {
      font-size: 10px; color: #64748b; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; margin-top: 0;
    }
    .qr-container img {
      width: 130px; height: 130px; background: #fff; padding: 5px; border-radius: 10px; border: 2px solid var(--cyan);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
    }

    /* --- SCARY ERROR MOTYW --- */
    @keyframes systemError {
      0%, 100% { box-shadow: 0 25px 50px rgba(255, 0, 0, 0.4); border-color: var(--error); }
      50% { box-shadow: 0 25px 80px rgba(255, 0, 0, 0.9), inset 0 0 30px rgba(255, 0, 0, 0.4); border-color: #ff5555; background: rgba(255, 0, 0, 0.15); }
    }
    @keyframes glitchShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 3px); }
      40% { transform: translate(6px, -3px); }
      60% { transform: translate(-6px, -3px); }
      80% { transform: translate(6px, 3px); }
      100% { transform: translate(0, 0); }
    }
    .scary-error {
      animation: systemError 0.8s infinite, glitchShake 0.3s infinite !important;
    }
    .scary-text {
      color: var(--error) !important;
      text-shadow: 0 0 10px var(--error), 0 0 20px var(--error) !important;
      animation: glitchShake 0.2s infinite !important;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="tilt-box" id="tiltCard">
    <div class="container" id="mainContainer">
      <h2 id="mainTitle">Terminal Agentów</h2>

      <div class="input-box">
        <label>Wybierz Agenta</label>
        <select id="agentSelect">
          <option value="" disabled selected>-- WYBIERZ AGENTA --</option>
          <option value="Lila">Lila</option>
          <option value="Kaja">Kaja</option>
          <option value="Darek">Darek</option>
          <option value="Jaś">Jaś</option>
          <option value="Wujek (admin)">Wujek (admin)</option>
        </select>
      </div>

      <div class="input-box">
        <label>Kod Dostępu</label>
        <input type="password" id="agentPassword" placeholder="Wprowadź PIN" inputmode="numeric" maxlength="4">
      </div>

      <button class="btn-cyber" id="loginBtn" onclick="authorizeAgent()">Autoryzuj</button>
      
      <p id="msg"></p>

      <!-- SEKTYCJA Z KODEM QR -->
      <div class="qr-container">
        <p>Skanuj, aby wejść z telefonu:</p>
        <img id="dynamicQRCode" src="" alt="Ładowanie QR...">
      </div>

    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { 
    apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", 
    authDomain: "obstaiwanie.firebaseapp.com", 
    projectId: "obstaiwanie" 
};
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);

// GENEROWANIE KODU QR NA BAZIE AKTUALNEGO ADRESU STRONY
window.onload = () => {
    const qrImg = document.getElementById('dynamicQRCode');
    // Pobiera aktualny link do strony i koduje go w formacie bezpiecznym dla URL
    const currentUrl = encodeURIComponent(window.location.href);
    // Używa darmowego API do wygenerowania obrazka QR
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${currentUrl}&color=000000&bgcolor=ffffff`;
};

window.authorizeAgent = async function() {
    const agentName = document.getElementById('agentSelect').value;
    const passInput = document.getElementById('agentPassword');
    const agentPass = passInput.value;
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('msg');
    const container = document.getElementById('mainContainer');
    const title = document.getElementById('mainTitle');
    
    // Sprawdzanie czy wybrano agenta
    if (!agentName) {
        msg.style.color = "var(--error)";
        msg.innerText = "WYBIERZ AGENTA Z LISTY!";
        return;
    }

    if (agentPass.length === 0) {
        msg.style.color = "var(--error)";
        msg.innerText = "WPROWADŹ KOD DOSTĘPU!";
        return;
    }

    btn.disabled = true;
    msg.style.color = "var(--cyan)";
    msg.innerText = "WERYFIKACJA...";

    try {
        const docRef = doc(db, "gracze", agentName);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.haslo === agentPass) {
                msg.style.color = "#00ff00";
                msg.innerText = "DOSTĘP PRZYZNANY!";
                
                setTimeout(() => { 
                    // Przekierowanie w zależności od tego, kto się loguje
                    if (agentName === "Wujek (admin)") {
                        window.location.href = 'admin.html';
                    } else {
                        localStorage.setItem('activeAgent', agentName);
                        window.location.href = 'wskazowki.html'; 
                    }
                }, 1000);
            } else {
                triggerScaryError();
            }
        } else {
            triggerScaryError();
        }
    } catch (error) {
        msg.style.color = "var(--error)";
        msg.innerText = "BŁĄD SIECI!";
        btn.disabled = false;
    }

    function triggerScaryError() {
        msg.innerText = "BŁĘDNY KOD DOSTĘPU!";
        container.classList.add('scary-error');
        title.classList.add('scary-text');
        msg.classList.add('scary-text');
        passInput.style.borderColor = "var(--error)";
        passInput.style.color = "var(--error)";

        setTimeout(() => {
            container.classList.remove('scary-error');
            title.classList.remove('scary-text');
            msg.classList.remove('scary-text');
            passInput.style.borderColor = "rgba(255,255,255,0.15)";
            passInput.style.color = "#fff";
            passInput.value = '';
            msg.innerText = "";
            btn.disabled = false;
        }, 2000);
    }
}

// Efekt tła
const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let pts = []; for (let i = 0; i < 40; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pts.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
        ctx.fillStyle = 'rgba(0, 212, 255, 0.4)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
        for (let j = i + 1; j < pts.length; j++) {
            const p2 = pts[j]; const d = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (d < 120) { ctx.strokeStyle = `rgba(0, 212, 255, ${1 - d/120})`; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
        }
    }); requestAnimationFrame(draw);
} draw();

// Efekt 3D
document.addEventListener('mousemove', (e) => {
    const x = (window.innerWidth / 2 - e.pageX) / 500, y = (window.innerHeight / 2 - e.pageY) / 500;
    document.getElementById('tiltCard').style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
});
</script>
</body>
</html>
