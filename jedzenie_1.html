<!DOCTYPE html>
<html lang="pl">
<head>

    <title>🍕 Cyber-Eat | Friday Protocol</title>

    <style>
        :root {

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        #bg-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

        .container {

            backdrop-filter: blur(20px); /* Mocniejszy blur */
            padding: 40px 30px; /* Większy padding */
            border-radius: 30px;
            border: 1px solid var(--border);
            /* Elegancki, głęboki cień */
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
            margin-top: 40px;
            box-sizing: border-box;
            margin-bottom: 40px;
            /* Płynne przejścia */
            transition: 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
            position: relative;
        }
        
        .auth-container { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; max-width: 320px; margin: 0 auto; }
        /* Lekka zmiana tła inputów na mniej smoliste */
        input, select { width: 100%; padding: 15px; background:#111; color:#fff; border-radius:12px; border: 1px solid var(--cyan); box-sizing: border-box; font-size: 14px; font-weight: bold; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }

        .cuisine-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 20px 0; }
        .cuisine-card { background: rgba(0,0,0,0.5); border: 1px solid var(--cyan); padding: 12px; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .cuisine-card.selected { border-color: var(--gold); background: rgba(212, 175, 55, 0.2); box-shadow: 0 0 15px var(--gold); }
        .cuisine-card h4 { margin: 5px 0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        .emoji { font-size: 24px; display: block; margin-bottom: 5px; }

        .btn-cyber { width: 100%; max-width: 280px; padding: 18px; background: var(--gold); color: #000; border: none; border-radius: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin: 10px auto; display: block; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .btn-cyber:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.3); }
        .btn-cyber:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
        
        #draw-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); display: block; }
        .voters-box { color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-weight: 900; }
        #voters-list { color: var(--cyan); }
