<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>🍕 Cyber-Eat | Friday Protocol</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cyber-Bet">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root {
            --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
            --glass: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; overscroll-behavior-y: contain; user-select: none; -webkit-tap-highlight-color: transparent; }
        #bg-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        
        .container {
            z-index: 10; width: 95vw; max-width: 600px;
            background: var(--glass); backdrop-filter: blur(20px);
            padding: 40px 30px; border-radius: 30px; border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center;
            margin-top: 40px; box-sizing: border-box; margin-bottom: 40px;
            transition: 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); position: relative;
            display: none; /* Domyślnie ukryte do momentu weryfikacji */
        }

        /* HEADER Z POWROTEM */
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .btn-back { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: #fff; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: bold; cursor: pointer; }

        .cuisine-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 20px 0; }
        .cuisine-card { background: rgba(0,0,0,0.5); border: 1px solid var(--cyan); padding: 12px; border-radius: 15px; cursor: pointer; transition: 0.3s; position: relative;}
        .cuisine-card.selected { border-color: var(--gold); background: rgba(212, 175, 55, 0.2); box-shadow: 0 0 15px var(--gold); }
        .cuisine-card h4 { margin: 5px 0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        .emoji { font-size: 24px; display: block; margin-bottom: 5px; }
        .vote-count { position: absolute; top: -5px; right: -5px; background: var(--cyan); color: black; font-weight: bold; font-size: 10px; padding: 3px 6px; border-radius: 10px; display: none;}

        .btn-cyber { width: 100%; max-width: 280px; padding: 18px; background: var(--gold); color: #000; border: none; border-radius: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin: 10px auto; display: block; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .btn-cyber:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.3); }
        .btn-cyber:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
        
        #draw-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); display: block; }
        .voters-box { color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-weight: 900; }
        #voters-list { color: var(--cyan); }
        
        .winner-display { font-size: clamp(28px, 6vw, 44px); font-weight: 900; color: #fff; margin: 15px 0; text-shadow: 0 0 15px var(--gold); display: none; }
        
        #other-input-container { display: none; margin-top: 10px; width: 100%; max-width: 300px; margin-left: auto; margin-right: auto; }
        #other-name { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--cyan); background: rgba(0,0,0,0.5); color: white; text-align: center; }
        
        .btn-clear { background: rgba(128,128,128,0.2); border: 1px solid #444; color: white; display: none; }
        #results-summary { text-align: left; font-size: 12px; margin-top: 15px; color: #aaa; display: none; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px;}
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="container" id="food-box">
        <div class="header-bar">
            <h2 style="color:var(--cyan); margin:0; font-size: 18px;">PIĄTKOWY PROTOKÓŁ</h2>
            <a href="sg.html" class="btn-back">← WRÓĆ</a>
        </div>

        <p id="counter" style="color: #888; font-size: 14px;">Wybierz 3 kuchnie (0/3)</p>
        
        <div class="cuisine-grid">
            <div class="cuisine-card" onclick="select(this, 'Włoska 🍕')"><div class="vote-count" id="vote-Włoska 🍕">0</div><span class="emoji">🍕</span><h4>Włoska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Azjatycka 🍣')"><div class="vote-count" id="vote-Azjatycka 🍣">0</div><span class="emoji">🍣</span><h4>Azjatycka</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Burgery 🍔')"><div class="vote-count" id="vote-Burgery 🍔">0</div><span class="emoji">🍔</span><h4>Burgery</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Polska 🥟')"><div class="vote-count" id="vote-Polska 🥟">0</div><span class="emoji">🥟</span><h4>Polska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Indyjska 🍛')"><div class="vote-count" id="vote-Indyjska 🍛">0</div><span class="emoji">🍛</span><h4>Indyjska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Kebab 🥙')"><div class="vote-count" id="vote-Kebab 🥙">0</div><span class="emoji">🥙</span><h4>Kebab</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Meksykańska 🌮')"><div class="vote-count" id="vote-Meksykańska 🌮">0</div><span class="emoji">🌮</span><h4>Meksykańska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Tajska 🍜')"><div class="vote-count" id="vote-Tajska 🍜">0</div><span class="emoji">🍜</span><h4>Tajska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Grecka 🥗')"><div class="vote-count" id="vote-Grecka 🥗">0</div><span class="emoji">🥗</span><h4>Grecka</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Sushi 🍱')"><div class="vote-count" id="vote-Sushi 🍱">0</div><span class="emoji">🍱</span><h4>Sushi</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Pizza 🍕')"><div class="vote-count" id="vote-Pizza 🍕">0</div><span class="emoji">🍕</span><h4>Pizza</h4></div>
            <div class="cuisine-card" onclick="select(this, 'McDonald\'s 🍟')"><div class="vote-count" id="vote-McDonald's 🍟">0</div><span class="emoji">🍟</span><h4>McDonald's</h4></div>
            <div class="cuisine-card" id="other-card" onclick="toggleOther()"><div class="vote-count" id="vote-other">0</div><span class="emoji">❓</span><h4>Inna...</h4></div>
        </div>

        <div id="other-input-container"><input type="text" id="other-name" placeholder="Jaka kuchnia?"></div>
        <button class="btn-cyber" id="voteBtn" onclick="saveVotes()" disabled>Zapisz Głosy</button>

        <div id="draw-section">
            <div class="voters-box">Głosowali: <span id="voters-list">-</span></div>
            <button class="btn-cyber" id="drawBtn" onclick="resolveWinner()" style="background:#ff4d4d; color:#fff;" disabled>Rozstrzygnij</button>
            <div id="status-text" style="color:var(--gold); font-size: 12px; margin-top: 10px; display: none;">ANALIZA PREFERENCJI...</div>
            <div id="winner-text" class="winner-display"></div>
            <div id="results-summary"></div>
            <button class="btn-cyber" id="gmapsBtn" style="display:none; background:var(--gold); color:#000;" onclick="openGmaps()">Pokaż na Mapie 📍</button>
            <button class="btn-cyber btn-clear" id="clearBtn" onclick="clearResult()">Wyczyść Wynik</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, setDoc, doc, getDocs, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);

    // --- OCHRONIARZ (ZABEZPIECZENIE) ---
    const currentUser = localStorage.getItem('cyberUser');
    if (!currentUser) {
        window.location.href = 'sg.html';
    } else {
        // Jeśli zalogowany, pokaż panel
        document.getElementById('food-box').style.display = 'block';
    }

    let currentSelections = [], user = currentUser, winnerName = "", otherSelected = false;
    let globalVoteCounts = {};

    onSnapshot(collection(db, "food_votes"), snap => {
        const voters = snap.docs.map(d => d.id);
        document.getElementById('voters-list').innerText = voters.length > 0 ? voters.join(", ") : "-";
        
        let totalChoices = 0; 
        globalVoteCounts = {};
        
        snap.forEach(d => {
            const votes = d.data().votes || [];
            totalChoices += votes.length;
            votes.forEach(v => {
                globalVoteCounts[v] = (globalVoteCounts[v] || 0) + 1;
            });
        });

        // Update UI with vote counts
        document.querySelectorAll('.vote-count').forEach(el => {
            el.style.display = 'none';
            el.innerText = '0';
        });

        let otherCount = 0;
        for (const [food, count] of Object.entries(globalVoteCounts)) {
            const elementId = `vote-${food}`;
            const el = document.getElementById(elementId);
            if (el) {
                el.innerText = count;
                el.style.display = 'block';
            } else if (food.includes('❓')) {
                 otherCount += count;
            }
        }
        
        if(otherCount > 0) {
            const otherEl = document.getElementById('vote-other');
            if(otherEl){
                otherEl.innerText = otherCount;
                otherEl.style.display = 'block';
            }
        }


        const btn = document.getElementById('drawBtn');
        btn.disabled = totalChoices === 0;
        btn.innerText = totalChoices > 0 ? `Rozstrzygnij (${totalChoices} opcji)` : "Rozstrzygnij";
    });

    window.toggleOther = () => {
        const card = document.getElementById('other-card');
        const inputCont = document.getElementById('other-input-container');
        if(!otherSelected && currentSelections.length < 3) {
            otherSelected = true; card.classList.add('selected'); inputCont.style.display = 'block';
        } else if(otherSelected) {
            otherSelected = false; card.classList.remove('selected'); inputCont.style.display = 'none'; document.getElementById('other-name').value = "";
        }
        updateCounter();
    };

    window.select = (el, type) => {
        if(currentSelections.includes(type)) {
            currentSelections = currentSelections.filter(t => t !== type); el.classList.remove('selected');
        } else if(currentSelections.length < (otherSelected ? 2 : 3)) {
            currentSelections.push(type); el.classList.add('selected');
        }
        updateCounter();
    };

    function updateCounter() {
        const total = currentSelections.length + (otherSelected ? 1 : 0);
        document.getElementById('counter').innerText = `Wybierz 3 kuchnie (${total}/3)`;
        document.getElementById('voteBtn').disabled = total === 0;
    }

    window.saveVotes = async () => {
        let finalVotes = [...currentSelections];
        if(otherSelected) {
            const custom = document.getElementById('other-name').value.trim();
            if(!custom) return alert("Wpisz nazwę innej kuchni!");
            finalVotes.push(custom + " ❓");
        }
        await setDoc(doc(db, "food_votes", user), { votes: finalVotes, timestamp: Date.now() });
        alert("Głosy zapisane!");
    };

    window.resolveWinner = async () => {
        const winnerDisplay = document.getElementById('winner-text');
        const statusText = document.getElementById('status-text');
        const gmapsBtn = document.getElementById('gmapsBtn');
        const clearBtn = document.getElementById('clearBtn');
        const drawBtn = document.getElementById('drawBtn');
        const summary = document.getElementById('results-summary');

        drawBtn.disabled = true;
        statusText.style.display = "block";
        winnerDisplay.style.display = "block";
        gmapsBtn.style.display = "none";
        clearBtn.style.display = "none";
        summary.style.display = "none";

        if (Object.keys(globalVoteCounts).length === 0) return;

        // Find max votes
        let maxVotes = 0;
        for (const count of Object.values(globalVoteCounts)) {
            if (count > maxVotes) maxVotes = count;
        }

        // Find all options with max votes
        const topCandidates = [];
        for (const [food, count] of Object.entries(globalVoteCounts)) {
            if (count === maxVotes) topCandidates.push(food);
        }

        let summaryText = `<b>Najwięcej głosów (${maxVotes}):</b><br>`;
        topCandidates.forEach(c => summaryText += `- ${c}<br>`);
        summary.innerHTML = summaryText;

        if (topCandidates.length === 1) {
            // Single winner
            statusText.innerText = "ZWYCIĘZCA WYŁONIONY BEZ LOSOWANIA:";
            winnerName = topCandidates[0];
            winnerDisplay.innerText = winnerName;
            
            setTimeout(() => {
                summary.style.display = "block";
                gmapsBtn.style.display = "block";
                clearBtn.style.display = "block";
                resetVotes();
            }, 1000);

        } else {
            // Tie - need to draw
            statusText.innerText = "REMIS! LOSOWANIE SPOŚRÓD NAJLEPSZYCH...";
            summary.style.display = "block";
            
            let i = 0;
            const itv = setInterval(() => {
                winnerName = topCandidates[Math.floor(Math.random()*topCandidates.length)];
                winnerDisplay.innerText = winnerName;
                i++; 
                if(i > 25) { 
                    clearInterval(itv); 
                    statusText.innerText = "WYLOSOWANO ZWYCIĘZCĘ:"; 
                    gmapsBtn.style.display = "block";
                    clearBtn.style.display = "block";
                    resetVotes();
                }
            }, 80);
        }
    };

    async function resetVotes() {
        const snap = await getDocs(collection(db, "food_votes"));
        for (const d of snap.docs) { await deleteDoc(doc(db, "food_votes", d.id)); }
    }

    window.openGmaps = () => {
        const cleanName = winnerName.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, '').trim(); // Usuń emoji
        // Otwórz wyszukiwanie w Google Maps
        window.open(`https://google.pl/maps/search/${encodeURIComponent(cleanName + " restauracja")}`, '_blank');
    };

    window.clearResult = () => {
        document.getElementById('winner-text').style.display = "none";
        document.getElementById('status-text').style.display = "none";
        document.getElementById('gmapsBtn').style.display = "none";
        document.getElementById('clearBtn').style.display = "none";
        document.getElementById('results-summary').style.display = "none";
        winnerName = "";
    };

    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    for (let i = 0; i < 60; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4 });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pts.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy;
            if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
            ctx.fillStyle = 'rgba(212, 175, 55, 0.4)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
            for (let j = i + 1; j < pts.length; j++) {
                const p2 = pts[j]; const d = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (d < 120) { ctx.strokeStyle = `rgba(0, 212, 255, ${1 - d/120})`; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
            }
        }); requestAnimationFrame(draw);
    } draw();
</script>
</body>
</html>
