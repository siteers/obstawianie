<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Eat | World Selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <style>
    :root {
      --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
      --glass: rgba(15, 23, 42, 0.85); --border: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden;
    }

    #bg-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    .container {
      z-index: 10; width: 95vw; max-width: 1000px; background: var(--glass);
      backdrop-filter: blur(20px); padding: 30px; border-radius: 40px;
      border: 1px solid var(--border); margin: 20px; text-align: center;
      box-sizing: border-box;
    }

    h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 5px; font-size: clamp(18px, 4vw, 24px); }

    /* --- LOGIN SECTION FIXED --- */
    #login-section { 
        max-width: 400px; 
        margin: 40px auto;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
    }
    /* Ujednolicenie szerokości boxów */
    #login-section select, #login-section input, #login-section .btn-cyber {
      width: 100%; 
      max-width: 100%;
      box-sizing: border-box; 
    }
    select, input {
      padding: 15px; margin: 10px 0; border-radius: 15px;
      background: #000; border: 1px solid var(--cyan); color: #fff; font-weight: bold;
      font-size: 16px;
    }

    /* --- MAP STYLES --- */
    #map-container { display: none; }
    #world-map-wrapper { 
        width: 100%; 
        height: auto; 
        margin: 20px 0;
        /* Ograniczenie maksymalnej wysokości mapy, żeby nie zajmowała całego ekranu */
        max-height: 60vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
    }
    /* Stylowanie osadzonego SVG */
    #world-map-wrapper svg { 
        fill: #1a1b26; 
        stroke: var(--cyan); 
        stroke-width: 0.5px; /* Cieńsze linie */
        width: 100%; 
        height: 100%; /* Dopasowanie do wrappera */
        cursor: pointer; 
        transition: fill 0.3s ease;
    }
    path:hover { fill: rgba(0, 212, 255, 0.3); }
    path.selected { fill: var(--gold) !important; filter: drop-shadow(0 0 8px var(--gold)); }

    .btn-cyber {
      padding: 20px 40px; background: var(--gold); color: #000; border: none;
      border-radius: 20px; font-weight: 900; cursor: pointer; text-transform: uppercase;
      margin: 10px; transition: 0.3s; font-size: 14px;
    }
    /* Styl dla zablokowanego przycisku */
    .btn-cyber:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.5); }
    .btn-draw { background: #ff4d4d; color: #fff; transition: 0.5s; }

    /* --- RESULT MODAL --- */
    #result-box {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      z-index: 1000; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    .matrix-text { font-size: 24px; color: var(--gold); font-family: 'Courier New', monospace; height: 30px; }

    #counter { font-weight: 800; color: var(--cyan); margin-bottom: 10px; font-size: 14px; }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container" id="login-section">
    <h1>Autoryzacja</h1>
    <select id="user-select"><option value="">Wybierz Operatora...</option></select>
    <input type="password" id="user-pass" placeholder="Klucz dostępu">
    <button class="btn-cyber" onclick="login()">Wstąp do systemu</button>
</div>
