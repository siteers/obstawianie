<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>🍕 Piątkowy Feast Protocol</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <style>
        :root { --gold: #d4af37; --cyan: #00d4ff; --bg: #020408; --glass: rgba(15, 23, 42, 0.9); }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { z-index: 10; width: 95vw; max-width: 500px; background: var(--glass); padding: 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); text-align: center; margin-top: 50px; }
        .cuisine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .cuisine-card { background: rgba(0,0,0,0.5); border: 1px solid var(--cyan); padding: 15px; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .cuisine-card.selected { border-color: var(--gold); background: rgba(212, 175, 55, 0.2); box-shadow: 0 0 15px var(--gold); }
        .cuisine-card h4 { margin: 5px 0; font-size: 14px; }
        .emoji { font-size: 24px; }
        .btn-cyber { width: 100%; padding: 20px; background: var(--gold); color: #000; border: none; border-radius: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
        .btn-cyber:disabled { opacity: 0.3; cursor: not-allowed; }
        #draw-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="container" id="login-box">
        <h2 style="color:var(--gold)">AUTORYZACJA</h2>
        <select id="user-select" style="width:100%; padding:15px; margin-bottom:10px; background:#000; color:#fff; border-radius:10px;"></select>
        <input type="password" id="pass-input" placeholder="KLUCZ DOSTĘPU" style="width:100%; padding:15px; margin-bottom:10px; background:#000; color:#fff; border-radius:10px; box-sizing:border-box;">
        <button class="btn-cyber" onclick="login()">WSTĄP</button>
    </div>

    <div class="container" id="food-box" style="display:none;">
        <h2 style="color:var(--cyan)">CO JEMY W PIĄTEK?</h2>
        <p id="counter">Wybierz 3 kuchnie (0/3)</p>
        <div class="cuisine-grid">
            <div class="cuisine-card" onclick="select(this, 'Włoska 🍕')"><span class="emoji">🍕</span><h4>Włoska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Azjatycka 🍣')"><span class="emoji">🍣</span><h4>Azjatycka</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Burgery 🍔')"><span class="emoji">🍔</span><h4>Amerykańska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Polska 🥟')"><span class="emoji">🥟</span><h4>Polska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Indyjska 🍛')"><span class="emoji">🍛</span><h4>Indyjska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Kebab 🥙')"><span class="emoji">🥙</span><h4>Kebab</h4></div>
        </div>
        <button class="btn-cyber" id="voteBtn" onclick="saveVotes()" disabled>Zapisz Głosy</button>
        <button class="btn-cyber" id="drawBtn" onclick="drawFood()" style="background:#ff4d4d; color:#fff;" disabled>Losuj (0/9)</button>
    </div>

    <div id="draw-overlay">
        <h1 style="color:var(--gold)" id="status-text">ANALIZA PREFERENCJI...</h1>
        <div id="winner-text" style="font-size: 40px; font-weight: 900; margin: 20px 0;"></div>
        <button class="btn-cyber" onclick="location.reload()">ZAMKNIJ</button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, setDoc, doc, getDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);

    let currentSelections = [], user = "";

    onSnapshot(collection(db, "passwords"), snap => {
        const sel = document.getElementById('user-select');
        sel.innerHTML = snap.docs.map(d => `<option value="${d.id}">${d.id}</option>`).join("");
    });

    onSnapshot(collection(db, "food_votes"), snap => {
        let count = 0; snap.forEach(d => count += d.data().votes.length);
        document.getElementById('drawBtn').innerText = `LOSUJ (${count}/9)`;
        document.getElementById('drawBtn').disabled = count < 9;
    });

    window.login = async () => {
        user = document.getElementById('user-select').value;
        const pass = document.getElementById('pass-input').value;
        const d = await getDoc(doc(db, "passwords", user));
        if(d.exists() && d.data().password === pass) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('food-box').style.display = 'block';
        } else alert("BŁĘDNE HASŁO");
    };

    window.select = (el, type) => {
        if(currentSelections.includes(type)) {
            currentSelections = currentSelections.filter(t => t !== type);
            el.classList.remove('selected');
        } else if(currentSelections.length < 3) {
            currentSelections.push(type);
            el.classList.add('selected');
        }
        document.getElementById('counter').innerText = `Wybierz 3 kuchnie (${currentSelections.length}/3)`;
        document.getElementById('voteBtn').disabled = currentSelections.length === 0;
    };

    window.saveVotes = async () => {
        await setDoc(doc(db, "food_votes", user), { votes: currentSelections, timestamp: Date.now() });
        alert("Głosy zapisane!");
    };

    window.drawFood = async () => {
        const snap = await getDocs(collection(db, "food_votes"));
        let pool = []; snap.forEach(d => pool.push(...d.data().votes));
        document.getElementById('draw-overlay').style.display = 'flex';
        let i = 0;
        const itv = setInterval(() => {
            document.getElementById('winner-text').innerText = pool[Math.floor(Math.random()*pool.length)];
            i++; if(i > 20) { clearInterval(itv); document.getElementById('status-text').innerText = "WYNIK LOSOWANIA:"; }
        }, 100);
    };
</script>
</body>
</html>
