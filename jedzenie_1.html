<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Eat | World Selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <style>
    :root {
      --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
      --glass: rgba(15, 23, 42, 0.85); --border: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden;
    }

    #bg-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    .container {
      z-index: 10; width: 95vw; max-width: 1000px; background: var(--glass);
      backdrop-filter: blur(20px); padding: 30px; border-radius: 40px;
      border: 1px solid var(--border); margin: 20px; text-align: center;
      box-sizing: border-box;
    }

    /* --- LOGIN SECTION - JEDNAKOWA SZEROKOŚĆ --- */
    #login-section { max-width: 400px; margin: 40px auto; }
    #login-section select, #login-section input, #login-section .btn-cyber {
      width: 100%; display: block; box-sizing: border-box; margin: 15px 0;
    }
    
    h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 5px; font-size: clamp(18px, 4vw, 24px); }

    select, input {
      padding: 15px; border-radius: 15px;
      background: #000; border: 1px solid var(--cyan); color: #fff; font-weight: bold;
      font-size: 16px; outline: none;
    }

    /* --- WIRTUALNA MAPA (BOKSY) --- */
    #map-container { display: none; }
    .virtual-map {
        width: 100%; height: 350px; margin: 30px 0; display: flex;
        justify-content: center; align-items: center; position: relative;
    }
    svg { width: 100%; height: 100%; cursor: pointer; }
    rect { fill: rgba(0, 212, 255, 0.05); stroke: var(--cyan); stroke-width: 1.5; transition: 0.3s; }
    rect:hover { fill: rgba(0, 212, 255, 0.2); }
    rect.selected { fill: var(--gold) !important; stroke: #fff; filter: drop-shadow(0 0 15px var(--gold)); }

    .btn-cyber {
      padding: 20px; background: var(--gold); color: #000; border: none;
      border-radius: 20px; font-weight: 900; cursor: pointer; text-transform: uppercase;
      transition: 0.3s; font-size: 14px;
    }
    .btn-cyber:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
    .btn-draw { background: #ff4d4d; color: #fff; }

    #result-box {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      z-index: 1000; flex-direction: column; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container" id="login-section">
    <h1>Autoryzacja</h1>
    <select id="user-select"><option value="">Wczytywanie graczy...</option></select>
    <input type="password" id="user-pass" placeholder="Klucz dostępu">
    <button class="btn-cyber" onclick="login()">Wstąp do systemu</button>
</div>

<div class="container" id="map-container">
    <h1 id="user-welcome">Wybierz 3 Kraje</h1>
    <div id="counter" style="color:var(--cyan); font-weight:800; margin-bottom:15px;">Pozostało wyborów: 3</div>
    
    <div class="virtual-map">
        <svg viewBox="0 0 800 400">
            <rect title="USA" x="150" y="150" width="120" height="80" onclick="toggleCountry(this)"/>
            <rect title="Meksyk" x="170" y="240" width="40" height="30" onclick="toggleCountry(this)"/>
            
            <rect title="Polska" x="400" y="150" width="35" height="35" onclick="toggleCountry(this)"/>
            <rect title="Niemcy" x="375" y="160" width="20" height="20" onclick="toggleCountry(this)"/>
            <rect title="Włochy" x="395" y="195" width="15" height="30" onclick="toggleCountry(this)"/>
            <rect title="Grecja" x="415" y="200" width="15" height="15" onclick="toggleCountry(this)"/>
            <rect title="Turcja" x="440" y="185" width="40" height="20" onclick="toggleCountry(this)"/>
            <rect title="Egipt" x="405" y="125" width="20" height="20" onclick="toggleCountry(this)"/>

            <rect title="Indie" x="530" y="180" width="90" height="70" onclick="toggleCountry(this)"/>
            <rect title="Chiny" x="520" y="260" width="45" height="45" onclick="toggleCountry(this)"/>
            <rect title="Japonia" x="640" y="180" width="20" height="40" onclick="toggleCountry(this)"/>
        </svg>
    </div>

    <button class="btn-cyber" id="vote-btn" onclick="saveVotes()" disabled>Zatwierdź Wybory</button>
    <button class="btn-cyber btn-draw" id="draw-btn" onclick="startDraw()" disabled>LOSUJ KRAJ (0/9)</button>
</div>

<div id="result-box">
    <div style="color:var(--gold); font-family:monospace; font-size:24px;">DESTINATION SELECTED:</div>
    <h1 id="final-country" style="font-size: 50px; margin: 30px 0; color: #fff;"></h1>
    <button class="btn-cyber" onclick="openGmaps()">Pokaż restauracje 📍</button>
    <button class="btn-cyber" style="background:none; color:white; margin-top:20px;" onclick="location.reload()">Zamknij</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, setDoc, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

let currentUser = "", selected = [];

// WCZYTYWANIE GRACZY
onSnapshot(collection(db, "passwords"), (snap) => {
    const sel = document.getElementById('user-select');
    sel.innerHTML = '<option value="">Wybierz Operatora...</option>';
    snap.forEach(d => {
        let opt = document.createElement('option');
        opt.value = d.id; opt.innerText = d.id;
        sel.appendChild(opt);
    });
});

// MONITOROWANIE ŁĄCZNEJ LICZBY GŁOSÓW (MIN 9)
onSnapshot(collection(db, "food_votes"), (snap) => {
    let total = 0;
    snap.forEach(d => { if(d.data().countries) total += d.data().countries.length; });
    const btn = document.getElementById('draw-btn');
    btn.innerText = `LOSUJ KRAJ (${total}/9)`;
    btn.disabled = total < 9;
});

window.login = async () => {
    const n = document.getElementById('user-select').value;
    const p = document.getElementById('user-pass').value;
    if(!n || !p) return alert("Podaj dane!");
    const userDoc = await getDoc(doc(db, "passwords", n));
    if(userDoc.exists() && userDoc.data().password === p) {
        currentUser = n;
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('map-container').style.display = 'block';
    } else alert("BŁĄD AUTORYZACJI");
};

window.toggleCountry = (el) => {
    const name = el.getAttribute('title');
    if(selected.includes(name)) {
        selected = selected.filter(c => c !== name);
        el.classList.remove('selected');
    } else if(selected.length < 3) {
        selected.push(name);
        el.classList.add('selected');
    }
    document.getElementById('counter').innerText = `Pozostało wyborów: ${3 - selected.length}`;
    document.getElementById('vote-btn').disabled = selected.length === 0;
};

window.saveVotes = async () => {
    await setDoc(doc(db, "food_votes", currentUser), { countries: selected, timestamp: Date.now() });
    alert("Wybory zapisane!");
};

window.startDraw = async () => {
    const snap = await getDocs(collection(db, "food_votes"));
    let pool = []; snap.forEach(d => pool.push(...d.data().countries));
    document.getElementById('result-box').style.display = 'flex';
    setTimeout(() => {
        const winner = pool[Math.floor(Math.random() * pool.length)];
        document.getElementById('final-country').innerText = winner;
    }, 1500);
};

window.openGmaps = () => {
    const c = document.getElementById('final-country').innerText;
    window.open(`https://www.google.com/maps/search/${encodeURIComponent(c)}+restaurant`, '_blank');
};

// TŁO
const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let pts = []; for (let i = 0; i < 50; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pts.forEach(p => {
        p.x += p.vx; p.y += p.vy; if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
        ctx.fillStyle = 'rgba(212, 175, 55, 0.4)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
    }); requestAnimationFrame(draw);
} draw();
</script>
</body>
</html>
