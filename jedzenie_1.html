<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>🍕 Cyber-Eat | Friday Protocol</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cyber-Eat">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root {
            --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
            --glass: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; overscroll-behavior-y: contain; user-select: none; -webkit-tap-highlight-color: transparent; }
        #bg-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        
        .container {
            z-index: 10; width: 95vw; max-width: 600px;
            background: var(--glass); backdrop-filter: blur(20px);
            padding: 40px 30px; border-radius: 30px; border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center;
            margin-top: 40px; box-sizing: border-box; margin-bottom: 40px;
            transition: 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); position: relative;
            display: none; 
        }

        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .btn-back { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: #fff; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: bold; cursor: pointer; }

        .cuisine-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 20px 0; }
        .cuisine-card { background: rgba(0,0,0,0.5); border: 1px solid var(--cyan); padding: 12px; border-radius: 15px; cursor: pointer; transition: 0.3s; position: relative;}
        .cuisine-card.selected { border-color: var(--gold); background: rgba(212, 175, 55, 0.2); box-shadow: 0 0 15px var(--gold); }
        .cuisine-card h4 { margin: 5px 0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        .emoji { font-size: 24px; display: block; margin-bottom: 5px; }

        .btn-cyber { width: 100%; max-width: 280px; padding: 18px; background: var(--gold); color: #000; border: none; border-radius: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin: 10px auto; display: block; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .btn-cyber:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.3); }
        .btn-cyber:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
        
        #draw-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); display: block; }
        .voters-box { color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-weight: 900; }
        #voters-list { color: var(--cyan); }
        
        #other-input-container { display: none; margin-top: 10px; width: 100%; max-width: 300px; margin-left: auto; margin-right: auto; }
        #other-name { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--cyan); background: rgba(0,0,0,0.5); color: white; text-align: center; }
        
        /* --- DRAMATIC OVERLAY --- */
        #drama-overlay {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; overflow: hidden;
        }
        .drama-text {
            font-size: clamp(20px, 5vw, 36px); font-weight: 900; color: #fff;
            text-transform: uppercase; letter-spacing: 3px; margin: 20px 0;
            opacity: 0; transform: translateY(20px); transition: all 0.5s ease-out;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            z-index: 10002;
        }
        .drama-text.visible { opacity: 1; transform: translateY(0); }
        .drama-text.out { opacity: 0; transform: translateY(-20px); }
        
        .drama-loser { color: #888; font-size: clamp(16px, 4vw, 24px); text-shadow: none; }
        .drama-build { color: #ff4d4d; font-size: clamp(30px, 7vw, 50px); text-shadow: 0 0 20px #ff4d4d; animation: heartbeat 1s infinite; }
        
        .drama-winner {
            font-size: clamp(40px, 10vw, 80px); color: var(--gold);
            text-shadow: 0 0 30px var(--gold), 0 0 60px #fff;
            animation: winnerPop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            margin-bottom: 40px;
        }

        .action-btns-drama { opacity: 0; transition: opacity 1s; display: flex; flex-direction: column; gap: 15px; z-index: 10002; }
        .action-btns-drama.visible { opacity: 1; }

        @keyframes heartbeat { 0% { transform: scale(1); } 20% { transform: scale(1.1); } 40% { transform: scale(1); } 60% { transform: scale(1.1); } 80% { transform: scale(1); } }
        @keyframes winnerPop { 0% { transform: scale(0.1) rotate(-10deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        @keyframes flashRed { 0%, 100% { background: #000; } 50% { background: #300; } }
        @keyframes cringeBg { 0% { background: #ff00ff; } 33% { background: #00ffff; } 66% { background: #ffff00; } 100% { background: #00ff00; } }
        
        .bg-flashing { animation: flashRed 1s infinite; }

        /* --- FIREWORKS & CRINGE GIFS --- */
        #fireworksCanvas { position: absolute; inset: 0; pointer-events: none; z-index: 10000; display: none; }
        #cringeGifs { position: absolute; bottom: 20px; left: 0; width: 100%; display: none; justify-content: center; gap: 15px; z-index: 10001; }

        /* --- PIG VIDEO OVERLAY --- */
        #pig-video-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10005;
            display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .close-vid { position: absolute; top: 20px; right: 30px; font-size: 50px; color: #888; cursor: pointer; transition: 0.2s; }
        .close-vid:hover { color: #ff4d4d; }
        video { max-width: 90%; max-height: 70vh; border: 2px solid var(--gold); border-radius: 15px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="container" id="food-box">
        <div class="header-bar">
            <h2 style="color:var(--cyan); margin:0; font-size: 18px;">PIĄTKOWY PROTOKÓŁ</h2>
            <a href="sg.html" class="btn-back">← WRÓĆ</a>
        </div>

        <p id="counter" style="color: #888; font-size: 14px;">Wybierz 3 kuchnie (0/3)</p>
        
        <div class="cuisine-grid">
            <div class="cuisine-card" onclick="select(this, 'Włoska 🍕')"><span class="emoji">🍕</span><h4>Włoska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Azjatycka 🍣')"><span class="emoji">🍣</span><h4>Azjatycka</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Burgery 🍔')"><span class="emoji">🍔</span><h4>Burgery</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Polska 🥟')"><span class="emoji">🥟</span><h4>Polska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Indyjska 🍛')"><span class="emoji">🍛</span><h4>Indyjska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Kebab 🥙')"><span class="emoji">🥙</span><h4>Kebab</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Meksykańska 🌮')"><span class="emoji">🌮</span><h4>Meksykańska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Tajska 🍜')"><span class="emoji">🍜</span><h4>Tajska</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Grecka 🥗')"><span class="emoji">🥗</span><h4>Grecka</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Sushi 🍱')"><span class="emoji">🍱</span><h4>Sushi</h4></div>
            <div class="cuisine-card" onclick="select(this, 'Pizza 🍕')"><span class="emoji">🍕</span><h4>Pizza</h4></div>
            <div class="cuisine-card" onclick="select(this, 'McDonald\'s 🍟')"><span class="emoji">🍟</span><h4>McDonald's</h4></div>
            <div class="cuisine-card" id="other-card" onclick="toggleOther()"><span class="emoji">❓</span><h4>Inna...</h4></div>
            <div class="cuisine-card" onclick="playPigVideo()" style="border-color: #ff9ff3;"><span class="emoji">🐶</span><h4 style="color:#ff9ff3;">Świnka Żaneta</h4></div>
        </div>

        <div id="other-input-container"><input type="text" id="other-name" placeholder="Jaka kuchnia?"></div>
        <button class="btn-cyber" id="voteBtn" onclick="saveVotes()" disabled>Zapisz Głosy</button>

        <div id="draw-section">
            <div class="voters-box">Głosowali: <span id="voters-list">-</span></div>
            <button class="btn-cyber" id="drawBtn" onclick="startDramaticResolution()" style="background:#ff4d4d; color:#fff;" disabled>Rozstrzygnij Wyniki</button>
        </div>
    </div>

    <div id="drama-overlay">
        <canvas id="fireworksCanvas"></canvas>
        <div id="cringeGifs">
            <img src="https://media.giphy.com/media/3oz8xAFtqoOUUrsh7W/giphy.gif" style="max-height: 80px; border-radius: 10px;">
            <img src="https://media.giphy.com/media/l0ExncehJzexFpRHq/giphy.gif" style="max-height: 80px; border-radius: 10px;">
            <img src="https://media.giphy.com/media/xT5LMHxhOfscxPfIfm/giphy.gif" style="max-height: 80px; border-radius: 10px;">
        </div>

        <div id="drama-content" class="drama-text">INICJALIZACJA...</div>
        
        <div id="final-actions" class="action-btns-drama">
            <button class="btn-cyber" style="background:var(--gold); color:#000; margin:0;" onclick="openGmaps()">📍 Znajdź na Mapie</button>
            <button class="btn-cyber" style="background:rgba(255,255,255,0.1); color:#fff; margin:0;" onclick="closeDrama()">Zakończ i Wyczyść</button>
        </div>
    </div>

    <div id="pig-video-overlay">
        <span class="close-vid" onclick="closePigVideo()">×</span>
        <h2 style="color:#ff9ff3; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px;">Specjalność Zakładu 🐷</h2>
        <video id="pig-video" controls>
            <source src="swinka_zaneta.mp4" type="video/mp4">
            Twoja przeglądarka nie obsługuje wideo.
        </video>
    </div>

    <audio id="sfx-suspense" src="galaxy_bells.mp3" loop></audio>
    <audio id="sfx-heartbeat" src="https://assets.mixkit.co/active_storage/sfx/125/125-preview.mp3" loop></audio>
    <audio id="sfx-reveal" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>
    <audio id="sfx-victory" src="fanfare1.mp3"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, setDoc, doc, getDocs, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);

    const currentUser = localStorage.getItem('cyberUser');
    if (!currentUser) window.location.href = 'sg.html';
    else document.getElementById('food-box').style.display = 'block';

    let currentSelections = [], user = currentUser, winnerName = "", otherSelected = false;
    let globalVoteCounts = {};

    // --- LOGIKA WIDEO ŚWINKI ŻANETY ---
    window.playPigVideo = () => {
        const overlay = document.getElementById('pig-video-overlay');
        const vid = document.getElementById('pig-video');
        overlay.style.display = 'flex';
        vid.play().catch(e => console.log("Przeglądarka zablokowała autoodtwarzanie", e));
    };

    window.closePigVideo = () => {
        const overlay = document.getElementById('pig-video-overlay');
        const vid = document.getElementById('pig-video');
        overlay.style.display = 'none';
        vid.pause();
        vid.currentTime = 0;
    };

    // --- LOGIKA GŁOSOWANIA (Cicha) ---
    onSnapshot(collection(db, "food_votes"), snap => {
        const voters = snap.docs.map(d => d.id);
        document.getElementById('voters-list').innerText = voters.length > 0 ? voters.join(", ") : "-";
        
        let totalChoices = 0; 
        globalVoteCounts = {};
        
        snap.forEach(d => {
            const votes = d.data().votes || [];
            totalChoices += votes.length;
            votes.forEach(v => {
                globalVoteCounts[v] = (globalVoteCounts[v] || 0) + 1;
            });
        });

        const btn = document.getElementById('drawBtn');
        btn.disabled = totalChoices === 0;
        btn.innerText = totalChoices > 0 ? `ROZSTRZYGNIJ WYNIKI` : "Brak głosów";
    });

    window.toggleOther = () => {
        const card = document.getElementById('other-card');
        const inputCont = document.getElementById('other-input-container');
        if(!otherSelected && currentSelections.length < 3) {
            otherSelected = true; card.classList.add('selected'); inputCont.style.display = 'block';
        } else if(otherSelected) {
            otherSelected = false; card.classList.remove('selected'); inputCont.style.display = 'none'; document.getElementById('other-name').value = "";
        }
        updateCounter();
    };

    window.select = (el, type) => {
        if(currentSelections.includes(type)) {
            currentSelections = currentSelections.filter(t => t !== type); el.classList.remove('selected');
        } else if(currentSelections.length < (otherSelected ? 2 : 3)) {
            currentSelections.push(type); el.classList.add('selected');
        }
        updateCounter();
    };

    function updateCounter() {
        const total = currentSelections.length + (otherSelected ? 1 : 0);
        document.getElementById('counter').innerText = `Wybierz 3 kuchnie (${total}/3)`;
        document.getElementById('voteBtn').disabled = total === 0;
    }

    window.saveVotes = async () => {
        let finalVotes = [...currentSelections];
        if(otherSelected) {
            const custom = document.getElementById('other-name').value.trim();
            if(!custom) return alert("Wpisz nazwę innej kuchni!");
            finalVotes.push(custom + " ❓");
        }
        await setDoc(doc(db, "food_votes", user), { votes: finalVotes, timestamp: Date.now() });
        alert("Głosy zapisane! (Ciii... wyniki są tajne do czasu losowania)");
    };

    // --- FAJERWERKI I EFEKTY WIZUALNE ---
    const canvasFw = document.getElementById("fireworksCanvas");
    const ctxFw = canvasFw.getContext("2d");
    let fwParticles = [], fwActive = false;

    function startCelebration() {
        canvasFw.width = window.innerWidth; canvasFw.height = window.innerHeight;
        canvasFw.style.display = "block"; fwActive = true; fwParticles = []; 
        const interval = setInterval(() => {
            const x = Math.random()*canvasFw.width, y = Math.random()*canvasFw.height*0.5;
            for(let i=0; i<50; i++) fwParticles.push({x,y,a:Math.random()*Math.PI*2,s:Math.random()*4+1,al:1,c:["#ff0","#f0f","#0ff","#f00"][Math.floor(Math.random()*4)]});
        }, 400);
        
        document.getElementById("cringeGifs").style.display = "flex";
        document.getElementById("drama-overlay").style.animation = "cringeBg 0.4s infinite alternate";

        setTimeout(() => { 
            clearInterval(interval); 
            fwActive = false; 
            canvasFw.style.display = "none"; 
            document.getElementById("cringeGifs").style.display = "none"; 
            document.getElementById("drama-overlay").style.animation = "none"; 
        }, 5000);
        updateFW();
    }

    function updateFW() {
        if(!fwActive) return;
        ctxFw.clearRect(0,0,canvasFw.width,canvasFw.height);
        fwParticles.forEach((p,i) => {
            p.x += Math.cos(p.a)*p.s; p.y += Math.sin(p.a)*p.s; p.al -= 0.01;
            if(p.al <= 0) fwParticles.splice(i,1);
            ctxFw.globalAlpha = p.al; ctxFw.fillStyle = p.c; ctxFw.beginPath(); ctxFw.arc(p.x, p.y, 3, 0, Math.PI*2); ctxFw.fill();
        });
        if(fwActive) requestAnimationFrame(updateFW);
    }

    // --- SYSTEM DRAMATYCZNEGO OGŁASZANIA ---
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const sfxSuspense = document.getElementById('sfx-suspense');
    const sfxHeartbeat = document.getElementById('sfx-heartbeat');
    const sfxReveal = document.getElementById('sfx-reveal');
    const sfxVictory = document.getElementById('sfx-victory');

    async function updateDramaText(text, className = "drama-text") {
        const el = document.getElementById('drama-content');
        el.classList.remove('visible');
        el.classList.add('out');
        await sleep(500); // Czas na zniknięcie
        
        el.className = className; // Reset klas
        el.innerHTML = text;
        
        // Zmuszenie przeglądarki do reflow
        void el.offsetWidth;
        
        el.classList.add('visible');
        el.classList.remove('out');
    }

    window.startDramaticResolution = async () => {
        if (Object.keys(globalVoteCounts).length === 0) return;

        // Sortowanie wyników: od najmniejszej liczby głosów do największej
        const sortedResults = Object.entries(globalVoteCounts).sort((a,b) => a[1] - b[1]);
        const maxVotes = sortedResults[sortedResults.length - 1][1];
        
        const winners = sortedResults.filter(r => r[1] === maxVotes).map(r => r[0]);
        const losers = sortedResults.filter(r => r[1] !== maxVotes);

        // Przygotowanie sceny
        document.getElementById('drawBtn').disabled = true;
        const overlay = document.getElementById('drama-overlay');
        overlay.style.display = 'flex';
        document.getElementById('final-actions').classList.remove('visible');

        // Odpalenie podkładu (dzwonek Samsunga)
        sfxSuspense.volume = 0.8;
        sfxSuspense.currentTime = 0;
        sfxSuspense.play().catch(e=>console.log(e));

        await updateDramaText("ZAMYKAM URNĘ WYBORCZĄ...");
        await sleep(2000);
        await updateDramaText("PODLICZAM GŁOSY...");
        await sleep(2000);

        // Ogłaszanie przegranych (od najsłabszego)
        if (losers.length > 0) {
            await updateDramaText("ODRZUCONE PROPOZYCJE:", "drama-text");
            await sleep(1500);
            
            for (let [food, count] of losers) {
                sfxReveal.currentTime = 0; sfxReveal.play().catch(e=>console.log(e));
                await updateDramaText(`${food}<br><span style="font-size:0.5em;color:#ff4d4d">Głosów: ${count}</span>`, "drama-text drama-loser");
                await sleep(2000);
            }
        }

        // Zbudowanie napięcia przed 1 miejscem (Samsung cichnie, wchodzi bicie serca)
        sfxSuspense.pause();
        sfxHeartbeat.volume = 1;
        sfxHeartbeat.play().catch(e=>console.log(e));
        overlay.classList.add('bg-flashing');

        await updateDramaText("NA PLACU BOJU POZOSTALI NAJLEPSI...", "drama-text drama-build");
        await sleep(3000);

        if (winners.length === 1) {
            // BEZSPORNY ZWYCIĘZCA
            await updateDramaText("JEDNOGŁOŚNĄ DECYZJĄ...", "drama-text drama-build");
            await sleep(3000);
            
            // Finał
            sfxHeartbeat.pause();
            overlay.classList.remove('bg-flashing');
            sfxVictory.play().catch(e=>console.log(e));
            startCelebration(); // <--- ODPALENIE FAJERWERKÓW I DYSKOTEKI
            
            winnerName = winners[0];
            await updateDramaText(`🏆 ZWYCIĘŻA 🏆<br><br>${winnerName}<br><span style="font-size:0.4em; color:#fff; text-shadow:none;">Zdobywając ${maxVotes} głosów!</span>`, "drama-text drama-winner");

        } else {
            // REMIS - POTRZEBNE LOSOWANIE
            await updateDramaText(`MAMY REMIS!<br><span style="font-size:0.5em">(${winners.length} opcje po ${maxVotes} głosów)</span>`, "drama-text drama-build");
            await sleep(3000);
            await updateDramaText("ROZPOCZYNAM LOSOWANIE NAGŁEJ ŚMIERCI...", "drama-text drama-build");
            await sleep(2000);

            // Szybkie losowanie na ekranie
            sfxHeartbeat.playbackRate = 2.0; // Przyspieszenie serca
            let ticks = 0;
            const drawInterval = setInterval(() => {
                const tempWinner = winners[Math.floor(Math.random() * winners.length)];
                document.getElementById('drama-content').innerHTML = tempWinner;
                ticks++;
            }, 100);

            await sleep(3000); // 3 sekundy szybkiego migania
            clearInterval(drawInterval);

            // Wyłonienie ostatecznego
            sfxHeartbeat.pause();
            sfxHeartbeat.playbackRate = 1.0;
            overlay.classList.remove('bg-flashing');
            sfxVictory.play().catch(e=>console.log(e));
            startCelebration(); // <--- ODPALENIE FAJERWERKÓW I DYSKOTEKI

            winnerName = winners[Math.floor(Math.random() * winners.length)];
            await updateDramaText(`🎲 LOS ZADECYDOWAŁ 🎲<br><br>${winnerName}`, "drama-text drama-winner");
        }

        // Pokaż przyciski końcowe
        setTimeout(() => {
            document.getElementById('final-actions').classList.add('visible');
            resetVotesInDB();
        }, 2000);
    };

    async function resetVotesInDB() {
        const snap = await getDocs(collection(db, "food_votes"));
        for (const d of snap.docs) { await deleteDoc(doc(db, "food_votes", d.id)); }
    }

    window.openGmaps = () => {
        const cleanName = winnerName.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, '').trim(); 
        window.open(`https://google.pl/maps/search/${encodeURIComponent(cleanName + " restauracja")}`, '_blank');
    };

    window.closeDrama = () => {
        document.getElementById('drama-overlay').style.display = "none";
        document.getElementById('drawBtn').disabled = false;
        winnerName = "";
        sfxVictory.pause();
        sfxVictory.currentTime = 0;
        sfxSuspense.pause(); // Na wszelki wypadek
    };

    // --- TŁO ---
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    for (let i = 0; i < 60; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4 });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pts.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy;
            if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
            ctx.fillStyle = 'rgba(212, 175, 55, 0.4)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
            for (let j = i + 1; j < pts.length; j++) {
                const p2 = pts[j]; const d = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (d < 120) { ctx.strokeStyle = `rgba(0, 212, 255, ${1 - d/120})`; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
            }
        }); requestAnimationFrame(draw);
    } draw();
</script>
</body>
</html>
