<script type="module">

import { getFirestore, collection, getDocs, deleteDoc, doc, onSnapshot, setDoc, getDoc, updateDoc, increment, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const appStateRef = doc(db, "appState", "status");
const lockSound = document.getElementById("lockSound");
const fanfareAudio = document.getElementById("fanfareAudio");

// --- KONFIGURACJA AUTOMATYZACJI ---
// LINK DO PLIKU RAW NA GITHUBIE (Wklej tutaj swój link!)
const EXCEL_URL = "https://raw.githubusercontent.com/TWOJA_NAZWA_UZYTKOWNIKA/TWOJE_REPO/main/CSR_Grafik_2026.xlsx"; 

const NAME_MAPPING = {
    "Szymura Grzegorz": "Grzesiek Sz",
    "Sitko Krzysztof": "Krzysiek",
    "Pilarski Grzegorz": "Grzesiek P",
    "Urbańczyk Mariusz": "Mariusz",
    "Dominik Waligóra": "Dominik",
    "Arek": "Arek", 
    "Paweł": "Paweł" 
};

const MONTH_MAP = {
    "sty": 0, "lut": 1, "mar": 2, "kwi": 3, "maj": 4, "cze": 5,
    "lip": 6, "sie": 7, "wrz": 8, "paź": 9, "lis": 10, "gru": 11
};

function logAuto(msg) {
    const t = new Date().toLocaleTimeString();
    document.getElementById('autoLog').innerHTML = `[${t}] ${msg}<br>` + document.getElementById('autoLog').innerHTML;
    console.log(`[AUTOMAT] ${msg}`);
}

window.forceCheckSchedule = () => {
    logAuto("⚠️ Ręczne wymuszenie sprawdzenia grafiku.");
    processScheduleAndOpen();
};

async function processScheduleAndOpen() {
    if(currentUser !== "SCIANA") return; // Tylko Ściana wykonuje

    try {
        logAuto("📥 Pobieranie grafiku...");
        const f = await fetch(EXCEL_URL);
        if (!f.ok) throw new Error("Błąd pobierania pliku Excel");
        const ab = await f.arrayBuffer();
        const workbook = XLSX.read(ab);
        
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        const targets = findTargetsForToday(data);

        if (targets.length > 0) {
            logAuto(`✅ Znaleziono cele: ${targets.join(", ")}`);
            
            // Ustawiamy cele w bazie
            await setDoc(appStateRef, { 
                target1: targets[0] || "Brak",
                target2: targets[1] || "Brak"
            }, { merge: true });

            // Odblokowujemy sloty (jeśli były zamknięte ręcznie)
            await setDoc(appStateRef, { isLocked1: false, isLocked2: false }, { merge: true });
            
            logAuto("🔓 System otwarty automatycznie.");
        } else {
            logAuto("⚠️ Brak osób na zmianie 'P' dzisiaj.");
        }

    } catch (e) {
        logAuto("❌ BŁĄD: " + e.message);
    }
}

function findTargetsForToday(rows) {
    const now = new Date();
    const currentDay = now.getDate();
    const currentMonthIdx = now.getMonth(); 
    
    let headerRowIdx = -1;
    let colMap = {}; 

    for(let i=0; i<rows.length; i++) {
        const row = rows[i];
        for(let j=0; j<row.length; j++) {
            const cell = row[j];
            if(cell && typeof cell === 'string' && NAME_MAPPING[cell]) {
                headerRowIdx = i;
                colMap[j] = NAME_MAPPING[cell]; 
            }
        }
        if(headerRowIdx !== -1) break; 
    }

    if(headerRowIdx === -1) { logAuto("Nie znaleziono nagłówków!"); return []; }

    let targets = [];
    for(let i = headerRowIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        const dateCell = row[0]; 

        if (typeof dateCell === 'string') {
            const parts = dateCell.trim().split(' ');
            if(parts.length === 2) {
                const day = parseInt(parts[0]);
                const monthStr = parts[1].toLowerCase().slice(0, 3); 
                
                if (day === currentDay && MONTH_MAP[monthStr] === currentMonthIdx) {
                    for (const [colIdx, playerNick] of Object.entries(colMap)) {
                        const val = row[colIdx];
                        if (val === "P" || val === "p") {
                            targets.push(playerNick);
                        }
                    }
                    break; 
                }
            }
        }
    }
    return targets.slice(0, 2);
}

// Główny Timer Automatyzacji

            logAuto("⏰ 12:30 - Otwieranie systemu...");
            processScheduleAndOpen();
        }
        if (timeStr === "13:00" && now.getSeconds() === 0) {

            // Symulacja kliknięcia STOP dla obu slotów

let usersData = [], isStopped1 = false, isStopped2 = false, isLocked1 = false, isLocked2 = false;
let stoppedSec1 = 0, stoppedSec2 = 0;
let savedWinners1 = null, savedWinners2 = null;

const funnyNames = ["leonard bogumił", "Adaś :*", "Bożenka :*", "Marcin ufam Tobie", "Jarołd", "Mariolka", "Kebab z falafelem", "Nooo cześć", " To jest skandal", "Nie traćmy pesymizmu", "Dziwne.. u mnie działa", "Dojadę go"];

function shuffleArray(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}

const canvasFw = document.getElementById("fireworksCanvas");
const ctxFw = canvasFw.getContext("2d");
let fwParticles = [], fwActive = false;

function startCelebration() {
    canvasFw.width = window.innerWidth; canvasFw.height = window.innerHeight;
    canvasFw.style.display = "block"; fwActive = true; fwParticles = []; 
    const interval = setInterval(() => {
        const x = Math.random()*canvasFw.width, y = Math.random()*canvasFw.height*0.5;
        for(let i=0; i<50; i++) fwParticles.push({x,y,a:Math.random()*Math.PI*2,s:Math.random()*4+1,al:1,c:["#ff0","#f0f","#0ff","#f00"][Math.floor(Math.random()*4)]});
    }, 400);
    document.getElementById("cringeGifs").style.display = "flex";
    document.body.style.animation = "cringeBg 0.4s infinite alternate";
    
    fanfareAudio.play().catch(e => console.log("Audio block:", e));

    setTimeout(() => { clearInterval(interval); fwActive = false; canvasFw.style.display = "none"; document.getElementById("cringeGifs").style.display = "none"; document.body.style.animation = "none"; }, 5000);
    updateFW();
}

function updateFW() {
    if(!fwActive) return;
    ctxFw.clearRect(0,0,canvasFw.width,canvasFw.height);
    fwParticles.forEach((p,i) => {
        p.x += Math.cos(p.a)*p.s; p.y += Math.sin(p.a)*p.s; p.al -= 0.01;
        if(p.al <= 0) fwParticles.splice(i,1);
        ctxFw.globalAlpha = p.al; ctxFw.fillStyle = p.c; ctxFw.beginPath(); ctxFw.arc(p.x, p.y, 3, 0, Math.PI*2); ctxFw.fill();
    });
    if(fwActive) requestAnimationFrame(updateFW);
}

function triggerStopEffect(id, timestamp, winners) {
    const isAlreadyStopped = (id === 1) ? isStopped1 : isStopped2;
    if (isAlreadyStopped) return; 

    const date = new Date(timestamp);
    if(id === 1) { isStopped1 = true; stoppedSec1 = timestamp/1000; savedWinners1 = winners; document.getElementById('panel1').classList.add('frozen'); } 
    else { isStopped2 = true; stoppedSec2 = timestamp/1000; savedWinners2 = winners; document.getElementById('panel2').classList.add('frozen'); }
    
    const winnersList = winners.filter(p => p.rank <= 3);
    document.getElementById(`winner${id}`).style.display = "block";
    document.getElementById(`winner${id}`).innerHTML = "<b>🏆 WYNIKI:</b><br>" + winnersList.map(p => `${p.rank}. ${p.name} (+${p.points} pkt)`).join("<br>");
    
    document.getElementById(`stoppedTime${id}`).textContent = "ZATRZYMANO: " + date.toLocaleTimeString("pl-PL");
    
    const btn = document.getElementById(`stopBtn${id}`);
    if(btn) { btn.disabled = true; btn.textContent = "STOP"; }

    startCelebration(); 
    renderTable(id, timestamp/1000); 
}

window.stopSlot = async (id) => {
    const btn = document.getElementById(`stopBtn${id}`);
    if(btn) {
        btn.disabled = true;
        btn.textContent = "ZAPIS...";
    }

    try {
        const checkSnap = await getDoc(appStateRef);
        if (checkSnap.exists()) {
            const data = checkSnap.data();
            if (data[`stop${id}`]) {
                console.log("Slot już zatrzymany przez kogoś innego.");
                return; 
            }
        }
    } catch(e) {
        console.error("Błąd sprawdzania stanu:", e);
        if(btn) { btn.disabled = false; btn.textContent = "STOP"; } 
        return;
    }

    const slotData = usersData.filter(u => u.targetSlot === `slot${id}`);
    // Pozwalamy zatrzymać nawet pusty slot (dla automatyzacji)
    
    const now = new Date(); 
    const s = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
    
    const sorted = [...slotData].sort((a,b) => Math.abs(toSec(a.hour)-s) - Math.abs(toSec(b.hour)-s));
    
    let playersWithPoints = [], rank = 1;
    for (let i = 0; i < sorted.length; i++) {
        if (i > 0 && Math.abs(toSec(sorted[i].hour) - s) !== Math.abs(toSec(sorted[i-1].hour) - s)) rank = i + 1;
        const pts = (rank === 1 ? 3 : rank === 2 ? 2 : rank === 3 ? 1 : 0);
        
        playersWithPoints.push({ 
            name: sorted[i].name, 
            hour: sorted[i].hour, 
            points: pts, 
            rank: rank, 
            id: sorted[i].id 
        });
    }

    for(const p of playersWithPoints) {
        if (p.points > 0) {
            const ref = doc(db, "ranking", p.name); const snap = await getDoc(ref);
            if(snap.exists()) await updateDoc(ref, { points: increment(p.points) }); else await setDoc(ref, { points: p.points });
        }
    }
    
    await addDoc(collection(db, "history"), { date: now.toLocaleString("pl-PL"), timestamp: now.getTime(), winners: playersWithPoints });

    await setDoc(appStateRef, { 
        [`stop${id}`]: now.getTime(),
        [`winners${id}`]: playersWithPoints 
    }, { merge: true });
};

window.clearSlot = async (id) => {
    if(!confirm(`Wyczyścić?`)) return;
    const q = query(collection(db, "users"), where("targetSlot", "==", `slot${id}`));
    const snap = await getDocs(q);
    for(const d of snap.docs) await deleteDoc(doc(db, "users", d.id));
    
    await setDoc(appStateRef, { 
        [`isLocked${id}`]: false, 
        [`target${id}`]: "Brak",
        [`stop${id}`]: null,       
        [`winners${id}`]: null     
    }, { merge: true });
};
