<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Dashboard | XXII</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --gold: #d4af37;
            --cyan: #00d4ff;
            --bg: #f2f2f2;
            --text: #111;
            --glass: rgba(255, 255, 255, 0.9);
            --border: rgba(0, 0, 0, 0.1);
            --error: #ff0000;
        }

        body.dark {
            --bg: #020408;
            --text: #fff;
            --glass: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            perspective: 1000px;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* PRZYWRÓCONE TŁO SIECI NEURONOWEJ */
        #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }

        .top-nav { 
            width: 100%; max-width: 1100px; display: flex; 
            justify-content: flex-end; gap: 10px; margin-bottom: 20px; 
            z-index: 100; flex-wrap: wrap; 
        }

        #tilt-wrapper {
            width: 100%;
            max-width: 1100px;
            z-index: 10;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        .container { 
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 25px; 
            border-radius: 30px; 
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            box-sizing: border-box;
            transition: 0.3s;
        }
        body.dark .container { box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        /* ANIMACJE ALARMU */
        @keyframes alarmPulse {
            0% { box-shadow: 0 0 0 var(--error) inset; background: rgba(255, 0, 0, 0.1); }
            50% { box-shadow: 0 0 100px var(--error) inset; background: rgba(255, 0, 0, 0.4); }
            100% { box-shadow: 0 0 0 var(--error) inset; background: rgba(255, 0, 0, 0.1); }
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        body.alarm-active .container { animation: alarmPulse 0.8s infinite, shake 0.2s infinite; }
        body.apocalypse .container { border: 2px solid var(--error); }

        h2 { text-align: center; margin-top: 0; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }

        .flex { display: flex; flex-direction: row; gap: 30px; justify-content: center; align-items: flex-start; }
        .panel { flex: 1; min-width: 300px; }

        .table-wrapper { 
            width: 100%; overflow-x: auto; margin-top: 10px; border-radius: 15px; 
            border: 1px solid var(--border); background: rgba(0,0,0,0.05); 
        }
        body.dark .table-wrapper { background: rgba(0,0,0,0.3); }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 400px; }
        th, td { padding: 12px; text-align: center; vertical-align: middle; border-bottom: 1px solid var(--border); font-weight: bold; }
        th { background: rgba(0, 0, 0, 0.05); color: var(--gold); text-transform: uppercase; font-size: 11px; }
        
        /* POPRAWIONY PRZYCISK X */
        .deleteBtn { 
            color: #ff4d4d; cursor: pointer; font-size: 20px; font-weight: 900;
            transition: 0.2s; text-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }
        .deleteBtn:hover { transform: scale(1.3); color: #ff0000; }

        #clock { font-size: 56px; font-weight: 900; text-align: center; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        
        #stopBtn { 
            background: linear-gradient(135deg, #ff4d4d, #b30000); color: white; 
            padding: 20px 45px; font-size: 28px; border-radius: 50px; border: none; 
            cursor: pointer; display: block; margin: 20px auto; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 77, 77, 0.3); font-weight: 900;
        }

        #lockBtn {
            width: 100%; margin-top: 20px; padding: 15px;
            border-radius: 15px; font-size: 18px; font-weight: 900;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
            border: none; color: white;
        }
        .btn-is-unlocked { background: linear-gradient(45deg, #ff0000, #8b0000); box-shadow: 0 5px 15px rgba(255,0,0,0.3); }
        .btn-is-locked { background: linear-gradient(45deg, #d4af37, #8a6d10); color: #000 !important; box-shadow: 0 5px 15px rgba(212,175,55,0.3); }
        
        #stoppedTime { font-size: 22px; text-align: center; margin-top: 15px; color: var(--cyan); font-weight: bold; }
        
        .btn-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .clear, .reveal-btn { padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; flex: 1; transition: 0.3s; font-size: 12px; text-transform: uppercase; }
        .clear { background: rgba(0,0,0,0.1); color: #555; }
        body.dark .clear { background: rgba(255,255,255,0.1); color: #ccc; }
        .reveal-btn { background: var(--gold); color: #000; }

        .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; margin: 0 auto; }
        .hidden-hour { filter: blur(8px); opacity: 0.3; }
        .reveal-data { filter: blur(0) !important; opacity: 1 !important; }

        #darkModeBtn, #rankingBtn { padding: 10px 20px; border-radius: 30px; border: none; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.3s; text-decoration: none; }
        #darkModeBtn { background: #111; color: #fff; }
        #rankingBtn { background: var(--gold); color: #000; }

        .qr-container { display: flex; flex-direction: column; align-items: center; margin-top: 25px; }
        #qrcode { padding: 12px; background: #fff; border-radius: 15px; }
        
        #fireworksCanvas { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 9999; }
        @keyframes blinkGreen { 0% { background: rgba(0, 255, 136, 0.1); } 50% { background: rgba(0, 128, 0, 0.6); } 100% { background: rgba(0, 255, 136, 0.1); } }
        .blink { animation: blinkGreen 1.5s infinite; }
    </style>
</head>
<body class="dark">

<canvas id="bg-canvas"></canvas>

<div class="top-nav">
    <button id="darkModeBtn">☀️ Light mode</button>
    <a href="ranking.html" target="_blank" id="rankingBtn">🏆 Zobacz Ranking</a>
</div>

<div id="tilt-wrapper">
    <div class="container">
        <h2>Lista zapisanych osób</h2>
        <div class="flex">
            <div class="panel">
                <div class="btn-group">
                    <button class="clear" onclick="clearAll()">Wyczyść dane</button>
                    <button class="reveal-btn" id="revealNamesBtn">Odkryj imiona</button>
                </div>
                <div class="table-wrapper">
                    <table id="table">
                        <tr><th>No.</th><th>Imię</th><th>Godzina</th><th>X</th></tr>
                    </table>
                </div>
                <button id="lockBtn" class="btn-is-unlocked">⛔ Zablokuj listę ⛔</button>
            </div>
            <div class="panel">
                <div id="clock">--:--:--</div>
                <button id="stopBtn">STOP</button>
                <div id="stoppedTime"></div>
                <div class="qr-container">
                    <div id="qrcode"></div>
                </div>
            </div>
        </div>
        <div id="winner"></div>
    </div>
</div>

<canvas id="fireworksCanvas"></canvas>
<audio id="alarmAudio" src="https://www.soundjay.com/mechanical/sounds/air-raid-siren-test-01.mp3"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc, onSnapshot, setDoc, getDoc, updateDoc, increment, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const lockBtn = document.getElementById("lockBtn");
const alarmAudio = document.getElementById("alarmAudio");
const appStateRef = doc(db, "appState", "status");

let usersData = [];
let isStopped = false; 
let namesRevealed = false;

// PRZYWRÓCONA SIEĆ NEURONOWA
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];
function resize() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
window.onresize = resize; resize();
class Particle {
    constructor() { this.x = Math.random() * bgCanvas.width; this.y = Math.random() * bgCanvas.height; this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4; }
    update() { this.x += this.vx; this.y += this.vy; if(this.x<0 || this.x>bgCanvas.width) this.vx*=-1; if(this.y<0 || this.y>bgCanvas.height) this.vy*=-1; }
}
for (let i = 0; i < 60; i++) particles.push(new Particle());
function drawBg() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    if(document.body.classList.contains('dark')) {
        particles.forEach((p, i) => {
            p.update(); bgCtx.fillStyle = 'rgba(212, 175, 55, 0.3)'; bgCtx.beginPath(); bgCtx.arc(p.x, p.y, 1.5, 0, Math.PI * 2); bgCtx.fill();
            for (let j = i + 1; j < particles.length; j++) {
                const p2 = particles[j]; const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (dist < 120) { bgCtx.strokeStyle = `rgba(0, 212, 255, ${1 - dist/120})`; bgCtx.lineWidth = 0.5; bgCtx.beginPath(); bgCtx.moveTo(p.x, p.y); bgCtx.lineTo(p2.x, p2.y); bgCtx.stroke(); }
            }
        });
    }
    requestAnimationFrame(drawBg);
} drawBg();

// TILT 1000
const tiltWrapper = document.getElementById('tilt-wrapper');
document.addEventListener('mousemove', (e) => {
    const x = (window.innerWidth / 2 - e.pageX) / 1000;
    const y = (window.innerHeight / 2 - e.pageY) / 1000;
    tiltWrapper.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
});

// LOCK LOGIC (TOGGLE)
lockBtn.onclick = async () => {
    const snap = await getDoc(appStateRef);
    const locked = snap.data()?.isLocked || false;
    await setDoc(appStateRef, { isLocked: !locked }, { merge: true });
};

onSnapshot(appStateRef, (snap) => {
    const isLocked = snap.data()?.isLocked;
    if(isLocked) {
        lockBtn.textContent = "🔓 Odblokuj listę 🔓";
        lockBtn.className = "btn-is-locked";
        document.body.classList.add('apocalypse');
        if(!isStopped && !document.body.classList.contains('alarm-active')) {
            document.body.classList.add('alarm-active');
            alarmAudio.play().catch(()=>{});
            setTimeout(() => { document.body.classList.remove('alarm-active'); alarmAudio.pause(); alarmAudio.currentTime = 0; }, 5000);
        }
    } else {
        lockBtn.textContent = "⛔ Zablokuj listę ⛔";
        lockBtn.className = "btn-is-unlocked";
        document.body.classList.remove('apocalypse');
        document.body.classList.remove('alarm-active');
        alarmAudio.pause(); alarmAudio.currentTime = 0;
    }
});

// REFRESH TABLE
setInterval(() => {
    const n = new Date();
    document.getElementById("clock").textContent = n.toLocaleTimeString("pl-PL");
    const s = n.getHours()*3600+n.getMinutes()*60+n.getSeconds();
    const table = document.getElementById("table");
    table.innerHTML="<tr><th>No.</th><th>Imię</th><th>Godzina</th><th>X</th></tr>";
    
    usersData.sort((a,b) => {
        const tA = a.hour.split(":").map(Number);
        const tB = b.hour.split(":").map(Number);
        const secA = (tA[0]||0)*3600 + (tA[1]||0)*60 + (tA[2]||0);
        const secB = (tB[0]||0)*3600 + (tB[1]||0)*60 + (tB[2]||0);
        return Math.abs(secA - s) - Math.abs(secB - s);
    }).forEach((u, i) => {
        const hourClass = isStopped ? 'reveal-data' : 'hidden-hour';
        const blinkClass = (i === 0) ? 'blink' : '';
        table.innerHTML += `<tr class="${blinkClass}">
            <td>${i+1}</td>
            <td>${(namesRevealed || isStopped) ? u.name : '???'}</td>
            <td class="${hourClass}">${u.hour}</td>
            <td><span class="deleteBtn" onclick="deleteOne('${u.id}')">✕</span></td>
        </tr>`;
    });
}, 1000);

onSnapshot(collection(db, "users"), snap => { usersData = snap.docs.map(d => ({id: d.id, ...d.data()})); });
window.deleteOne = async id => deleteDoc(doc(db,"users",id));
window.clearAll = async () => { if(confirm("Wyczyścić?")) { 
    const s = await getDocs(collection(db,"users"));
    s.forEach(d => deleteDoc(doc(db,"users",d.id)));
    await setDoc(appStateRef, { isLocked: false }, { merge: true });
    isStopped = false;
}};
document.getElementById("revealNamesBtn").onclick = () => { namesRevealed = !namesRevealed; document.getElementById("revealNamesBtn").textContent = namesRevealed ? "Ukryj imiona" : "Odkryj imiona"; };
document.getElementById("stopBtn").onclick = async () => { isStopped = true; await setDoc(appStateRef, { isLocked: false }, { merge: true }); };
new QRCode(document.getElementById("qrcode"), { text: window.location.href.replace("lista.html", "regulamin.html"), width: 80, height: 80 });
const darkBtn = document.getElementById("darkModeBtn");
darkBtn.onclick = () => { document.body.classList.toggle("dark"); darkBtn.textContent = document.body.classList.contains("dark") ? "☀️ Light mode" : "🌙 Dark mode"; };
</script>
</body>
</html>
