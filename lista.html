<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --gold: #d4af37;
            --cyan: #00d4ff;
            --bg: #020408;
            --glass: rgba(15, 23, 42, 0.7);
            --error: #ff4d4d;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            perspective: 1000px;
            transition: background-color 0.3s;
        }

        /* TŁO SIECI NEURONOWEJ */
        #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }

        .top-nav { 
            width: 100%; max-width: 1100px; display: flex; 
            justify-content: flex-end; gap: 10px; margin-bottom: 20px; 
            z-index: 100; flex-wrap: wrap; 
        }

        #tilt-wrapper {
            width: 100%;
            max-width: 1100px;
            z-index: 10;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        .container { 
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 25px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            box-sizing: border-box;
        }

        h2 { text-align: center; margin-top: 0; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }

        .flex { display: flex; flex-direction: row; gap: 30px; justify-content: center; align-items: flex-start; }
        .panel { flex: 1; min-width: 300px; }

        /* FUTURYSTYCZNA TABELA */
        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 400px; }
        th, td { padding: 12px; text-align: center; vertical-align: middle; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: bold; }
        th { background: rgba(255, 255, 255, 0.05); color: var(--gold); text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        
        th:nth-child(1) { width: 40px; }
        th:nth-child(2) { width: 180px; }
        th:nth-child(3) { width: 100px; }
        th:nth-child(4) { width: 50px; }

        .deleteBtn { 
            width: 26px; height: 26px; line-height: 24px; border-radius: 50%; 
            background: rgba(255, 77, 77, 0.1); border: 1px solid var(--error); 
            color: var(--error); cursor: pointer; transition: 0.3s;
        }
        .deleteBtn:hover { background: var(--error); color: #fff; }

        /* ZEGAR I PRZYCISKI */
        #clock { font-size: 56px; font-weight: 900; text-align: center; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        #stopBtn { 
            background: linear-gradient(135deg, #ff4d4d, #b30000); color: white; 
            padding: 20px 45px; font-size: 28px; border-radius: 50px; border: none; 
            cursor: pointer; display: block; margin: 20px auto; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 77, 77, 0.3); font-weight: 900;
        }
        #stopBtn:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(255, 77, 77, 0.5); }
        
        #stoppedTime { font-size: 22px; text-align: center; margin-top: 15px; color: var(--cyan); font-weight: bold; }
        
        #winner { 
            margin-top: 30px; padding: 20px; border-radius: 20px; font-size: 20px; 
            background: rgba(0, 212, 255, 0.1); border: 1px solid var(--cyan); 
            display: none; text-align: center; color: #fff; animation: fadeIn 0.5s ease;
        }

        .btn-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .clear, .reveal-btn { 
            padding: 12px; border-radius: 10px; border: none; cursor: pointer; 
            font-weight: bold; flex: 1; transition: 0.3s; font-size: 12px; text-transform: uppercase;
        }
        .clear { background: rgba(255,255,255,0.1); color: #ccc; border: 1px solid rgba(255,255,255,0.2); }
        .reveal-btn { background: var(--gold); color: #000; }
        .clear:hover { background: rgba(255,255,255,0.2); color: #fff; }

        .user-cell { display: flex; align-items: center; justify-content: flex-start; gap: 10px; text-align: left; }
        .avatar { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; border: 1px solid rgba(255,255,255,0.2); }
        .name-text { font-size: 14px; }

        .hidden-hour { filter: blur(8px); opacity: 0.3; transition: 0.5s; }
        .reveal-data { filter: blur(0) !important; opacity: 1 !important; }

        #darkModeBtn, #rankingBtn { 
            padding: 10px 20px; border-radius: 30px; border: none; cursor: pointer; 
            font-size: 13px; font-weight: bold; transition: 0.3s; text-decoration: none; 
            display: flex; align-items: center; backdrop-filter: blur(10px);
        }
        #darkModeBtn { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        #rankingBtn { background: var(--gold); color: #000; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }

        .qr-container { display: flex; flex-direction: column; align-items: center; margin-top: 25px; }
        #qrcode { padding: 12px; background: #fff; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        #fireworksCanvas { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 9999; }
        #cringeGifs { position: fixed; bottom: 20px; left: 0; width: 100%; display: none; justify-content: center; gap: 15px; z-index: 99999; flex-wrap: wrap; }
        #cringeGifs img { max-height: 100px; border-radius: 15px; border: 2px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        @keyframes blinkGreen { 0% { background: rgba(0, 255, 136, 0.1); } 50% { background: rgba(0, 128, 0, 0.6); } 100% { background: rgba(0, 255, 136, 0.1); } }
        .blink { animation: blinkGreen 1.5s infinite; }
        .blink td { color: #fff !important; }
        
        @keyframes cringeBg { 0% { background: #ff00ff; } 33% { background: #00ffff; } 66% { background: #ffff00; } 100% { background: #00ff00; } }

        @media (max-width: 850px) {
            body { padding: 15px; }
            .flex { flex-direction: column-reverse; gap: 20px; }
            .panel { width: 100%; min-width: unset; }
            .top-nav { justify-content: center; margin-bottom: 10px; }
            #clock { font-size: 42px; }
            #stopBtn { width: 100%; padding: 15px; }
            #cringeGifs img { max-height: 70px; }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="top-nav">
    <button id="darkModeBtn">🌙 Dark mode</button>
    <a href="ranking.html" target="_blank" id="rankingBtn">🏆 Zobacz Ranking</a>
</div>

<div id="tilt-wrapper">
    <div class="container">
        <h2>Lista zapisanych osób</h2>
        <div class="flex">
            <div class="panel">
                <div class="btn-group">
                    <button class="clear" onclick="clearAll()">Wyczyść dane</button>
                    <button class="reveal-btn" id="revealNamesBtn">Odkryj imiona</button>
                </div>
                <div class="table-wrapper">
                    <table id="table">
                        <tr><th>No.</th><th>Imię</th><th>Godzina</th><th>X</th></tr>
                    </table>
                </div>
            </div>
            <div class="panel">
                <div id="clock">--:--:--</div>
                <button id="stopBtn">STOP</button>
                <div id="stoppedTime"></div>
                <div class="qr-container">
                    <div id="qrcode"></div>
                    <div style="margin-top:10px; font-size:11px; font-weight:bold; color:var(--gold); letter-spacing: 1px;">SKANUJ REGULAMIN</div>
                </div>
            </div>
        </div>
        <div id="winner"></div>
    </div>
</div>

<canvas id="fireworksCanvas"></canvas>
<div id="cringeGifs">
    <img src="https://media.giphy.com/media/3oz8xAFtqoOUUrsh7W/giphy.gif">
    <img src="https://media.giphy.com/media/l0ExncehJzexFpRHq/giphy.gif">
    <img src="https://media.giphy.com/media/xT5LMHxhOfscxPfIfm/giphy.gif">
</div>

<audio id="fanfareAudio" src="fanfare1.mp3"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc, onSnapshot, setDoc, getDoc, updateDoc, increment, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const table = document.getElementById("table");
const stoppedTime = document.getElementById("stoppedTime");
const winner = document.getElementById("winner");
const fanfareAudio = document.getElementById("fanfareAudio");

let usersData = [];
let isStopped = false; 
let namesRevealed = false; 
let assignedFakeNames = {};
const funnyNames = ["leonard bogumił", "Adaś W.", "Bożenka :*", "Marcin ufam Tobie", "Jarołd", "Kebab z falafelem", "Mariolka"];

// --- TŁO SIECI NEURONOWEJ ---
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];
function resize() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
window.onresize = resize; resize();

class Particle {
    constructor() {
        this.x = Math.random() * bgCanvas.width;
        this.y = Math.random() * bgCanvas.height;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if(this.x<0 || this.x>bgCanvas.width) this.vx*=-1;
        if(this.y<0 || this.y>bgCanvas.height) this.vy*=-1;
    }
}
for (let i = 0; i < 60; i++) particles.push(new Particle());

function drawBg() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    particles.forEach((p, i) => {
        p.update();
        bgCtx.fillStyle = 'rgba(212, 175, 55, 0.3)';
        bgCtx.beginPath(); bgCtx.arc(p.x, p.y, 1.5, 0, Math.PI * 2); bgCtx.fill();
        for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 120) {
                bgCtx.strokeStyle = `rgba(0, 212, 255, ${1 - dist/120})`;
                bgCtx.lineWidth = 0.5;
                bgCtx.beginPath(); bgCtx.moveTo(p.x, p.y); bgCtx.lineTo(p2.x, p2.y); bgCtx.stroke();
            }
        }
    });
    requestAnimationFrame(drawBg);
}
drawBg();

// --- EFEKT 3D TILT ---
const tiltWrapper = document.getElementById('tilt-wrapper');
document.addEventListener('mousemove', (e) => {
    const x = (window.innerWidth / 2 - e.pageX) / 50;
    const y = (window.innerHeight / 2 - e.pageY) / 50;
    tiltWrapper.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
});

function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

const regulaminUrl = window.location.href.substring(0, window.location.href.lastIndexOf("/")) + "/regulamin.html";
new QRCode(document.getElementById("qrcode"), { text: regulaminUrl, width: 100, height: 100, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });

function getAvatarColor(name) {
    const colors = ["#1abc9c", "#2ecc71", "#3498db", "#9b59b6", "#e67e22", "#e74c3c"];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
}

onSnapshot(collection(db, "users"), snap => {
    let newUsers = [];
    snap.forEach(d => newUsers.push({ id: d.id, ...d.data() }));
    if (newUsers.length !== usersData.length) {
        const shuffledFakes = shuffle([...funnyNames]);
        assignedFakeNames = {};
        newUsers.forEach((u, index) => { assignedFakeNames[u.id] = shuffledFakes[index % shuffledFakes.length]; });
    }
    usersData = newUsers;
});

document.getElementById("revealNamesBtn").onclick = function() {
    namesRevealed = !namesRevealed;
    this.textContent = namesRevealed ? "Ukryj imiona" : "Odkryj imiona";
};

window.deleteOne = async id => deleteDoc(doc(db,"users",id));
window.clearAll = async () => {
    if(!confirm("Wyczyścić wszystkich?")) return;
    const snap = await getDocs(collection(db,"users"));
    for (const d of snap.docs) { await deleteDoc(doc(db,"users",d.id)); }
    winner.style.display = "none"; stoppedTime.textContent = ""; 
    isStopped = false; namesRevealed = false;
    document.body.style.animation = "none";
};

function toSec(t){
    const p=t.split(":").map(Number);
    return (p[0]||0)*3600+(p[1]||0)*60+(p[2]||0);
}

setInterval(() => {
    const n = new Date();
    document.getElementById("clock").textContent = n.toLocaleTimeString("pl-PL");
    const s = n.getHours()*3600+n.getMinutes()*60+n.getSeconds();
    const sorted = [...usersData].sort((a,b)=>Math.abs(toSec(a.hour)-s)-Math.abs(toSec(b.hour)-s));
    
    table.innerHTML="<tr><th>No.</th><th>Imię</th><th>Godzina</th><th>X</th></tr>";
    sorted.forEach((u, i) => {
        const hourClass = isStopped ? 'reveal-data' : 'hidden-hour';
        const color = getAvatarColor(u.name);
        const fakeName = assignedFakeNames[u.id] || "Anonim";
        const nameContent = (namesRevealed || isStopped) ? u.name : fakeName;
        const avatarContent = (namesRevealed || isStopped) ? u.name.charAt(0) : "?";
        const blinkClass = (i === 0) ? 'blink' : '';
        
        table.innerHTML += `<tr class="${blinkClass}">
            <td>${i+1}</td>
            <td><div class="user-cell"><div class="avatar" style="background:${color}">${avatarContent}</div><span class="name-text">${nameContent}</span></div></td>
            <td class="${hourClass}">${u.hour}</td>
            <td><span class="deleteBtn" onclick="deleteOne('${u.id}')">X</span></td>
        </tr>`;
    });
}, 1000);

stopBtn.onclick = async () => {
    if(!usersData.length || isStopped) return;
    isStopped = true; 
    const nowObj = new Date();
    const s = nowObj.getHours()*3600+nowObj.getMinutes()*60+nowObj.getSeconds();
    stoppedTime.textContent = "Zatrzymana godzina: " + nowObj.toLocaleTimeString("pl-PL");
    
    const sorted = [...usersData].sort((a,b)=>Math.abs(toSec(a.hour)-s)-Math.abs(toSec(b.hour)-s));
    let playersWithPoints = [];
    let rank = 1;
    for (let i = 0; i < sorted.length; i++) {
        if (i > 0 && Math.abs(toSec(sorted[i].hour)-s) !== Math.abs(toSec(sorted[i-1].hour)-s)) rank = i+1;
        if (rank > 3) break;
        playersWithPoints.push({ name: sorted[i].name, points: (rank===1?3:rank===2?2:1), rank: rank });
    }
    
    winner.style.display = "block";
    winner.innerHTML = `<strong>🏆 WYNIKI RUNDY:</strong><br>` + playersWithPoints.map(p => `${p.rank}. ${p.name} (+${p.points} pkt)`).join("<br>");
    document.body.style.animation = "cringeBg 0.4s infinite alternate";
    fanfareAudio.play().catch(()=>{});
    startCelebration();
    for (const p of playersWithPoints) {
        const ref = doc(db, "ranking", p.name);
        const snap = await getDoc(ref);
        if(snap.exists()) await updateDoc(ref, { points: increment(p.points) });
        else await setDoc(ref, { points: p.points });
    }
    await addDoc(collection(db, "history"), { date: nowObj.toLocaleString("pl-PL"), timestamp: nowObj.getTime(), winners: playersWithPoints.map(p => ({name:p.name, rank:p.rank})) });
};

const canvas = document.getElementById("fireworksCanvas");
const ctx = canvas.getContext("2d");
let fwParticles = [], fwActive = false;
function updateFW() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    fwParticles.forEach((p,i) => {
        p.x += Math.cos(p.a)*p.s; p.y += Math.sin(p.a)*p.s; p.al -= 0.01;
        if(p.al <= 0) fwParticles.splice(i,1);
        ctx.globalAlpha = p.al; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
    });
    if(fwActive) requestAnimationFrame(updateFW);
}
function startCelebration() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    canvas.style.display = "block"; fwActive = true;
    const interval = setInterval(() => {
        const x = Math.random()*canvas.width, y = Math.random()*canvas.height*0.5;
        for(let i=0; i<50; i++) fwParticles.push({x,y,a:Math.random()*Math.PI*2,s:Math.random()*4+1,al:1,c:["#ff0","#f0f","#0ff","#f00"][Math.floor(Math.random()*4)]});
    }, 400);
    document.getElementById("cringeGifs").style.display = "flex";
    setTimeout(() => { 
        clearInterval(interval); 
        fwActive = false; 
        canvas.style.display = "none"; 
        document.getElementById("cringeGifs").style.display = "none"; 
        document.body.style.animation = "none"; 
    }, 7000);
    updateFW();
}
const darkBtn = document.getElementById("darkModeBtn");
darkBtn.onclick = () => {
    document.body.classList.toggle("dark");
    darkBtn.textContent = document.body.classList.contains("dark") ? "☀️ Light mode" : "🌙 Dark mode";
};
</script>
</body>
</html>
