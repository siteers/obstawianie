<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Lista użytkowników & Stoper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; transition: background-color 0.3s; }
        body.dark { background: #121212; }
        
        .top-nav { width: 100%; max-width: 1100px; display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }

        .container { max-width: 1100px; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); box-sizing: border-box; position: relative; z-index: 10; }
        body.dark .container { background: #1e1e1e; box-shadow: 0 10px 30px rgba(255,255,255,0.05); }
        
        h2 { text-align: center; margin-top: 0; }
        body.dark h2, body.dark th, body.dark td, body.dark #clock, body.dark #stoppedTime { color: #f1f1f1; }
        
        .flex { display: flex; flex-direction: row; gap: 30px; justify-content: center; align-items: flex-start; }
        .panel { flex: 1; min-width: 300px; }

        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; min-width: 400px; }
        body.dark table { background: #1e1e1e; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; vertical-align: middle; overflow: hidden; font-weight: bold; }
        body.dark th, body.dark td { border-color: #333; }
        th { background: #eee; }
        body.dark th { background: #2a2a2a; }
        
        th:nth-child(1) { width: 40px; }
        th:nth-child(2) { width: 180px; }
        th:nth-child(3) { width: 100px; }
        th:nth-child(4) { width: 50px; }

        .deleteBtn { width: 26px; height: 26px; line-height: 26px; border-radius: 50%; background: #ffdddd; border: 1px solid red; color: red; cursor: pointer; display: inline-block; }
        
        #clock { font-size: 48px; font-weight: bold; text-align: center; }
        #stopBtn { background: red; color: white; padding: 20px 45px; font-size: 28px; border-radius: 60px; border: none; cursor: pointer; display: block; margin: 15px auto; transition: 0.2s; }
        #stoppedTime { font-size: 26px; text-align: center; margin-top: 15px; }
        
        #winner { margin-top: 30px; padding: 20px; font-size: 24px; background: #d1ffd1; border-left: 5px solid green; display: none; text-align: center; color: #000; }
        body.dark #winner { background: #1f3d1f; color: #aaffaa; }
        
        .btn-group { display: flex; gap: 8px; margin-bottom: 10px; }
        .clear, .reveal-btn { padding: 10px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; flex: 1; }
        .clear { background: #444; color: white; }
        .reveal-btn { background: #007bff; color: white; }

        .user-cell { display: flex; align-items: center; justify-content: flex-start; gap: 8px; text-align: left; }
        .avatar { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .name-text { font-size: 14px; line-height: 1.2; word-wrap: break-word; }

        .hidden-hour { filter: blur(5px); user-select: none; }
        .reveal-data { filter: blur(0) !important; }

        #darkModeBtn, #rankingBtn { padding: 10px 18px; border-radius: 30px; border: none; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.3s; text-decoration: none; display: flex; align-items: center; }
        #darkModeBtn { background: #111; color: #fff; }
        body.dark #darkModeBtn { background: #f1f1f1; color: #111; }
        #rankingBtn { background: #ffcc00; color: #111; }

        .qr-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 20px; }
        #qrcode { padding: 10px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        #fireworksCanvas { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 9999; }
        #cringeGifs { position: fixed; bottom: 10px; left: 0; width: 100%; display: none; justify-content: center; gap: 10px; z-index: 99999; flex-wrap: wrap; }
        #cringeGifs img { max-height: 120px; border-radius: 10px; border: 3px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        @keyframes blinkGreen { 0% { background: #d1ffd1; } 50% { background: #008000; } 100% { background: #d1ffd1; } }
        .blink { animation: blinkGreen 1.5s infinite; }
        .blink td { color: white !important; }
        
        @keyframes cringeBg { 0% { background: #ff69b4; } 25% { background: #00ffff; } 50% { background: #ffff00; } 75% { background: #ff00ff; } 100% { background: #00ff00; } }

        @media (max-width: 850px) {
            body { padding: 10px; }
            .flex { flex-direction: column-reverse; gap: 20px; }
            .panel { width: 100%; min-width: unset; }
            .top-nav { justify-content: center; }
            #clock { font-size: 38px; }
            #stopBtn { width: 100%; }
            #cringeGifs img { max-height: 80px; }
        }
    </style>
</head>
<body>

<div class="top-nav">
    <button id="darkModeBtn">🌙 Dark mode</button>
    <a href="ranking.html" target="_blank" id="rankingBtn">🏆 Zobacz Ranking</a>
</div>

<div class="container">
    <h2>Lista zapisanych osób</h2>
    <div class="flex">
        <div class="panel">
            <div class="btn-group">
                <button class="clear" onclick="clearAll()">Wyczyść dane</button>
                <button class="reveal-btn" id="revealNamesBtn">Odkryj imiona</button>
            </div>
            <div class="table-wrapper">
                <table id="table">
                    <tr><th>No.</th><th>Imię</th><th>Godzina</th><th>X</th></tr>
                </table>
            </div>
        </div>
        <div class="panel">
            <div id="clock">--:--:--</div>
            <button id="stopBtn">STOP</button>
            <div id="stoppedTime"></div>
            <div class="qr-container">
                <div id="qrcode"></div>
                <div style="margin-top:8px; font-size:12px; font-weight:bold; color:#666;">SKANUJ REGULAMIN</div>
            </div>
        </div>
    </div>
    <div id="winner"></div>
</div>

<canvas id="fireworksCanvas"></canvas>
<div id="cringeGifs">
    <img src="https://media.giphy.com/media/3oz8xAFtqoOUUrsh7W/giphy.gif">
    <img src="https://media.giphy.com/media/l0ExncehJzexFpRHq/giphy.gif">
    <img src="https://media.giphy.com/media/xT5LMHxhOfscxPfIfm/giphy.gif">
</div>

<audio id="fanfareAudio" src="fanfare1.mp3"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc, onSnapshot, setDoc, getDoc, updateDoc, increment, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const table = document.getElementById("table");
const stoppedTime = document.getElementById("stoppedTime");
const winner = document.getElementById("winner");
const fanfareAudio = document.getElementById("fanfareAudio");

let usersData = [];
let isStopped = false; 
let namesRevealed = false; 
let assignedFakeNames = {};
const funnyNames = ["leonard bogumił", "Adaś W.", "Bożenka :*", "Marcin ufam Tobie", "Jarołd", "Kebab z falafelem", "Mariolka"];

function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

const regulaminUrl = window.location.href.substring(0, window.location.href.lastIndexOf("/")) + "/regulamin.html";
new QRCode(document.getElementById("qrcode"), { text: regulaminUrl, width: 100, height: 100, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });

function getAvatarColor(name) {
    const colors = ["#1abc9c", "#2ecc71", "#3498db", "#9b59b6", "#e67e22", "#e74c3c"];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
}

onSnapshot(collection(db, "users"), snap => {
    let newUsers = [];
    snap.forEach(d => newUsers.push({ id: d.id, ...d.data() }));
    if (newUsers.length !== usersData.length) {
        const shuffledFakes = shuffle([...funnyNames]);
        assignedFakeNames = {};
        newUsers.forEach((u, index) => { assignedFakeNames[u.id] = shuffledFakes[index % shuffledFakes.length]; });
    }
    usersData = newUsers;
});

document.getElementById("revealNamesBtn").onclick = function() {
    namesRevealed = !namesRevealed;
    this.textContent = namesRevealed ? "Ukryj imiona" : "Odkryj imiona";
};

window.deleteOne = async id => deleteDoc(doc(db,"users",id));
window.clearAll = async () => {
    if(!confirm("Wyczyścić wszystkich?")) return;
    const snap = await getDocs(collection(db,"users"));
    for (const d of snap.docs) { await deleteDoc(doc(db,"users",d.id)); }
    winner.style.display = "none"; stoppedTime.textContent = ""; 
    isStopped = false; namesRevealed = false;
    document.body.style.animation = "none";
};

function toSec(t){
    const p=t.split(":").map(Number);
    return (p[0]||0)*3600+(p[1]||0)*60+(p[2]||0);
}

setInterval(() => {
    const n = new Date();
    document.getElementById("clock").textContent = n.toLocaleTimeString("pl-PL");
    const s = n.getHours()*3600+n.getMinutes()*60+n.getSeconds();
    const sorted = [...usersData].sort((a,b)=>Math.abs(toSec(a.hour)-s)-Math.abs(toSec(b.hour)-s));
    
    table.innerHTML="<tr><th>No.</th><th>Imię</th><th>Godzina</th><th>X</th></tr>";
    sorted.forEach((u, i) => {
        const hourClass = isStopped ? 'reveal-data' : 'hidden-hour';
        const color = getAvatarColor(u.name);
        const fakeName = assignedFakeNames[u.id] || "Anonim";
        const nameContent = (namesRevealed || isStopped) ? u.name : fakeName;
        const avatarContent = (namesRevealed || isStopped) ? u.name.charAt(0) : "?";
        const blinkClass = (i === 0) ? 'blink' : '';
        
        table.innerHTML += `<tr class="${blinkClass}">
            <td>${i+1}</td>
            <td><div class="user-cell"><div class="avatar" style="background:${color}">${avatarContent}</div><span class="name-text">${nameContent}</span></div></td>
            <td class="${hourClass}">${u.hour}</td>
            <td><span class="deleteBtn" onclick="deleteOne('${u.id}')">X</span></td>
        </tr>`;
    });
}, 1000);

stopBtn.onclick = async () => {
    if(!usersData.length || isStopped) return;
    isStopped = true; 
    const nowObj = new Date();
    const s = nowObj.getHours()*3600+nowObj.getMinutes()*60+nowObj.getSeconds();
    stoppedTime.textContent = "Zatrzymana godzina: " + nowObj.toLocaleTimeString("pl-PL");
    
    const sorted = [...usersData].sort((a,b)=>Math.abs(toSec(a.hour)-s)-Math.abs(toSec(b.hour)-s));
    let playersWithPoints = [];
    let rank = 1;
    for (let i = 0; i < sorted.length; i++) {
        if (i > 0 && Math.abs(toSec(sorted[i].hour)-s) !== Math.abs(toSec(sorted[i-1].hour)-s)) rank = i+1;
        if (rank > 3) break;
        playersWithPoints.push({ name: sorted[i].name, points: (rank===1?3:rank===2?2:1), rank: rank });
    }
    
    winner.style.display = "block";
    winner.innerHTML = `<strong>🏆 WYNIKI RUNDY:</strong><br>` + playersWithPoints.map(p => `${p.rank}. ${p.name} (+${p.points} pkt)`).join("<br>");
    document.body.style.animation = "cringeBg 0.3s infinite alternate";
    fanfareAudio.play().catch(()=>{});
    startCelebration();
    for (const p of playersWithPoints) {
        const ref = doc(db, "ranking", p.name);
        const snap = await getDoc(ref);
        if(snap.exists()) await updateDoc(ref, { points: increment(p.points) });
        else await setDoc(ref, { points: p.points });
    }
    await addDoc(collection(db, "history"), { date: nowObj.toLocaleString("pl-PL"), timestamp: nowObj.getTime(), winners: playersWithPoints.map(p => ({name:p.name, rank:p.rank})) });
};

const canvas = document.getElementById("fireworksCanvas");
const ctx = canvas.getContext("2d");
let particles = [], fwActive = false;
function updateFW() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach((p,i) => {
        p.x += Math.cos(p.a)*p.s; p.y += Math.sin(p.a)*p.s; p.al -= 0.01;
        if(p.al <= 0) particles.splice(i,1);
        ctx.globalAlpha = p.al; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
    });
    if(fwActive) requestAnimationFrame(updateFW);
}
function startCelebration() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    canvas.style.display = "block"; fwActive = true;
    const interval = setInterval(() => {
        const x = Math.random()*canvas.width, y = Math.random()*canvas.height*0.5;
        for(let i=0; i<50; i++) particles.push({x,y,a:Math.random()*Math.PI*2,s:Math.random()*4+1,al:1,c:["#ff0","#f0f","#0ff","#f00"][Math.floor(Math.random()*4)]});
    }, 400);
    document.getElementById("cringeGifs").style.display = "flex";
    setTimeout(() => { 
        clearInterval(interval); 
        fwActive = false; 
        canvas.style.display = "none"; 
        document.getElementById("cringeGifs").style.display = "none"; 
        document.body.style.animation = "none"; 
    }, 7000);
    updateFW();
}
const darkBtn = document.getElementById("darkModeBtn");
darkBtn.onclick = () => {
    document.body.classList.toggle("dark");
    darkBtn.textContent = document.body.classList.contains("dark") ? "☀️ Light mode" : "🌙 Dark mode";
};
</script>
</body>
</html>
