<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Dashboard | XXII</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --gold: #d4af37; --cyan: #00d4ff; --bg: #f2f2f2; --text: #111;
            --glass: rgba(255, 255, 255, 0.9); --border: rgba(0, 0, 0, 0.1); --error: #ff4d4d;
        }
        body.dark {
            --bg: #020408; --text: #fff; --glass: rgba(15, 23, 42, 0.75); --border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; transition: 0.3s; overflow-x: hidden;
        }

        /* TŁO I INTERFEJS */
        #bg-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .top-nav { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; margin-bottom: 20px; z-index: 100; }
        
        #darkModeBtn { padding: 10px 20px; border-radius: 30px !important; border: 1px solid var(--border); cursor: pointer; background: #fff; color: #111; font-weight: bold; }
        body.dark #darkModeBtn { background: #111; color: #fff; }

        .admin-config { background: var(--glass); padding: 15px; border-radius: 20px; border: 1px solid var(--gold); display: flex; gap: 15px; align-items: center; margin-bottom: 20px; z-index: 100; backdrop-filter: blur(10px); }
        .admin-config select { padding: 8px; border-radius: 10px; background: #1a1a1a; color: white; border: 1px solid var(--gold); font-weight: bold; }
        body:not(.dark) .admin-config select { background: white; color: black; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 1300px; z-index: 10; }
        .container { background: var(--glass); backdrop-filter: blur(20px); padding: 20px; border-radius: 30px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.15); transition: 0.3s; }

        /* ALARM I PULSOWANIE */
        .slot-locked { border: 2px solid var(--error) !important; animation: alarmPulse 1.5s infinite; }
        @keyframes alarmPulse { 0%, 100% { box-shadow: 0 0 0 inset; } 50% { box-shadow: 0 0 50px var(--error) inset; } }

        .target-label { font-size: 26px; font-weight: 900; color: var(--cyan); text-align: center; display: block; margin-bottom: 10px; text-shadow: 0 0 15px var(--cyan); text-transform: uppercase; }
        
        .table-wrapper { width: 100%; overflow-x: auto; border-radius: 15px; border: 1px solid var(--border); background: rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border); font-weight: bold; font-size: 13px; }
        
        .action-group { display: flex; gap: 10px; margin-top: 15px; }
        .stop-btn { flex: 1; background: linear-gradient(135deg, #ff4d4d, #b30000); color: white; padding: 15px; font-size: 18px; border-radius: 15px; border: none; cursor: pointer; font-weight: 900; }
        .clear-slot-btn { flex: 1; background: rgba(128,128,128,0.2); border: 1px solid var(--border); color: var(--text); border-radius: 15px; cursor: pointer; font-size: 11px; font-weight: bold; }

        .lock-btn-slot { width: 100%; margin-top: 10px; padding: 12px; border-radius: 15px; font-weight: 900; cursor: pointer; border: none; text-transform: uppercase; font-size: 14px; display: none; }
        .winner-box { margin-top: 15px; padding: 15px; border-radius: 20px; background: rgba(0, 212, 255, 0.05); border: 1px solid var(--cyan); display: none; text-align: left; font-size: 13px; line-height: 1.6; }

        #clock { font-size: 56px; font-weight: 900; text-align: center; margin: 30px 0; z-index: 100; position: relative; }
        .qr-frame { padding: 10px; background: #fff; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: inline-block; }

        /* EFEKTY WIZUALNE */
        #fireworksCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; display: none; }
        #cringeGifs { position: fixed; bottom: 20px; left: 0; width: 100%; display: none; justify-content: center; gap: 15px; z-index: 10000; }
        .hidden-hour { filter: blur(8px); opacity: 0.3; transition: 0.5s; }
        .reveal-data { filter: blur(0) !important; opacity: 1 !important; }

        @keyframes cringeBg { 0% { background: #ff00ff; } 33% { background: #00ffff; } 66% { background: #ffff00; } 100% { background: #00ff00; } }
        @media (max-width: 850px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="dark">

<canvas id="bg-canvas"></canvas>

<div class="top-nav">
    <button id="darkModeBtn">☀️ Light mode</button>
    <a href="ranking.html" target="_blank" style="padding: 10px 20px; background: var(--gold); border-radius: 30px; text-decoration: none; color: #000; font-weight: bold;">🏆 Ranking</a>
</div>

<div class="admin-config">
    <div style="font-weight: bold; color: var(--gold); font-size: 11px;">USTAW CELE:</div>
    <select id="targetSelect1" onchange="updateTargets()"><option value="Brak">Cel 1...</option><option value="Arek">Arek</option><option value="Paweł">Paweł</option><option value="Grzesiek Sz">Grzesiek Sz</option><option value="Grzesiek P">Grzesiek P</option><option value="Krzysiek">Krzysiek</option><option value="Mariusz">Mariusz</option><option value="Dominik">Dominik</option></select>
    <select id="targetSelect2" onchange="updateTargets()"><option value="Brak">Cel 2...</option><option value="Arek">Arek</option><option value="Paweł">Paweł</option><option value="Grzesiek Sz">Grzesiek Sz</option><option value="Grzesiek P">Grzesiek P</option><option value="Krzysiek">Krzysiek</option><option value="Mariusz">Mariusz</option><option value="Dominik">Dominik</option></select>
</div>

<div class="dashboard-grid">
    <div class="container" id="panel1">
        <span class="target-label" id="targetName1">---</span>
        <div class="table-wrapper"><table id="table1"></table></div>
        <div class="action-group"><button class="stop-btn" onclick="stopSlot(1)">STOP</button><button class="clear-slot-btn" onclick="clearSlot(1)">WYCZYŚĆ LISTĘ</button></div>
        <button id="lockBtn1" class="lock-btn-slot" onclick="toggleLock(1)">⛔ ZAMKNIJ LISTĘ ⛔</button>
        <div id="winner1" class="winner-box"></div>
    </div>

    <div class="container" id="panel2">
        <span class="target-label" id="targetName2">---</span>
        <div class="table-wrapper"><table id="table2"></table></div>
        <div class="action-group"><button class="stop-btn" onclick="stopSlot(2)">STOP</button><button class="clear-slot-btn" onclick="clearSlot(2)">WYCZYŚĆ LISTĘ</button></div>
        <button id="lockBtn2" class="lock-btn-slot" onclick="toggleLock(2)">⛔ ZAMKNIJ LISTĘ ⛔</button>
        <div id="winner2" class="winner-box"></div>
    </div>
</div>

<div id="clock">--:--:--</div>

<div style="text-align:center; z-index:100; position:relative; padding-bottom: 40px;">
    <div class="qr-frame"><div id="qrcode"></div></div>
</div>

<canvas id="fireworksCanvas"></canvas>
<div id="cringeGifs">
    <img src="https://media.giphy.com/media/3oz8xAFtqoOUUrsh7W/giphy.gif" style="max-height: 80px; border-radius: 10px;">
    <img src="https://media.giphy.com/media/l0ExncehJzexFpRHq/giphy.gif" style="max-height: 80px; border-radius: 10px;">
    <img src="https://media.giphy.com/media/xT5LMHxhOfscxPfIfm/giphy.gif" style="max-height: 80px; border-radius: 10px;">
</div>

<audio id="fanfareAudio" src="fanfare1.mp3"></audio>
<audio id="nukeAlarm" src="https://ia801602.us.archive.org/28/items/FederalSignalThunderbolt1000T/Federal%20Signal%20Thunderbolt%201000T.mp3"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc, onSnapshot, setDoc, getDoc, updateDoc, increment, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const appStateRef = doc(db, "appState", "status");
const nukeAlarm = document.getElementById("nukeAlarm");
const fanfareAudio = document.getElementById("fanfareAudio");

let usersData = [], isStopped1 = false, isStopped2 = false;
let isLocked1 = false, isLocked2 = false;
let assignedFakeNames = {};

const funnyNames = ["leonard bogumił", "Adaś :*", "Bożenka :*", "Marcin ufam Tobie", "Jarołd", "Mariolka", "Kebab z falafelem", "Nooo cześć", " To jest skandal"];

function shuffle(a) { for (let i=a.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// --- TŁO KONSTELACJI ---
const bgCanvas = document.getElementById('bg-canvas'); const bgCtx = bgCanvas.getContext('2d'); let particles = [];
function resize() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
window.onresize = resize; resize();
for(let i=0; i<60; i++) particles.push({x:Math.random()*bgCanvas.width, y:Math.random()*bgCanvas.height, vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4});
function drawBg() {
    bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height); const isDark = document.body.classList.contains('dark');
    particles.forEach((p,i) => {
        p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>bgCanvas.width) p.vx*=-1; if(p.y<0||p.y>bgCanvas.height) p.vy*=-1;
        bgCtx.fillStyle = isDark ? 'rgba(212,175,55,0.3)' : 'rgba(0,0,0,0.1)';
        bgCtx.beginPath(); bgCtx.arc(p.x,p.y,1.5,0,Math.PI*2); bgCtx.fill();
        for(let j=i+1; j<particles.length; j++) {
            const p2=particles[j]; const d=Math.hypot(p.x-p2.x, p.y-p2.y);
            if(d<120) { bgCtx.strokeStyle=isDark?`rgba(0,212,255,${1-d/120})`:`rgba(0,0,0,${(1-d/120)*0.1})`; bgCtx.lineWidth=0.5; bgCtx.beginPath(); bgCtx.moveTo(p.x,p.y); bgCtx.lineTo(p2.x,p2.y); bgCtx.stroke(); }
        }
    }); requestAnimationFrame(drawBg);
} drawBg();

document.getElementById("darkModeBtn").onclick = () => {
    document.body.classList.toggle("dark");
    document.getElementById("darkModeBtn").textContent = document.body.classList.contains("dark") ? "☀️ Light mode" : "🌙 Dark mode";
};

new QRCode(document.getElementById("qrcode"), { text: window.location.href.replace("lista.html", "regulamin.html"), width: 90, height: 90 });

function toSec(t){ const p=t.split(":").map(Number); return (p[0]||0)*3600+(p[1]||0)*60+(p[2]||0); }
function getAvatarColor(n) { const c=["#1abc9c","#2ecc71","#3498db","#9b59b6","#e67e22","#e74c3c"]; let h=0; for(let i=0;i<n.length;i++) h=n.charCodeAt(i)+((h<<5)-h); return c[Math.abs(h)%6]; }

window.updateTargets = async () => {
    await setDoc(appStateRef, { target1: document.getElementById("targetSelect1").value, target2: document.getElementById("targetSelect2").value }, { merge: true });
};

onSnapshot(appStateRef, (snap) => {
    const data = snap.data(); if(!data) return;
    document.getElementById("targetName1").textContent = data.target1 || "---";
    document.getElementById("targetName2").textContent = data.target2 || "---";
    document.getElementById("targetSelect1").value = data.target1 || "Brak";
    document.getElementById("targetSelect2").value = data.target2 || "Brak";
    isLocked1 = data.isLocked1 || false; isLocked2 = data.isLocked2 || false;
    updateLockUI(1, isLocked1); updateLockUI(2, isLocked2);
});

function updateLockUI(id, isLocked) {
    const btn = document.getElementById(`lockBtn${id}`); const panel = document.getElementById(`panel${id}`);
    if(isLocked) { panel.classList.add('slot-locked'); btn.textContent = "🔓 ODBLOKUJ LISTĘ 🔓"; btn.style.background = "var(--gold)"; btn.style.color = "#000"; }
    else { panel.classList.remove('slot-locked'); btn.textContent = "⛔ ZAMKNIJ LISTĘ ⛔"; btn.style.background = "var(--error)"; btn.style.color = "#fff"; }
}

window.toggleLock = async (id) => {
    const snap = await getDoc(appStateRef); const field = `isLocked${id}`;
    const newState = !snap.data()[field]; await setDoc(appStateRef, { [field]: newState }, { merge: true });
    // ODTWÓRZ RYCZĄCĄ SYRENĘ
    if(newState) { 
        nukeAlarm.currentTime = 0; nukeAlarm.volume = 0.7;
        nukeAlarm.play().catch(e => console.log("Błąd audio: ", e));
        setTimeout(() => nukeAlarm.pause(), 15000); 
    }
};

onSnapshot(collection(db, "users"), snap => {
    usersData = []; snap.forEach(d => usersData.push({ id: d.id, ...d.data() }));
    const pool = shuffle([...funnyNames]);
    usersData.forEach((u, i) => { if(!assignedFakeNames[u.id]) assignedFakeNames[u.id] = pool[i % pool.length]; });
    document.getElementById('lockBtn1').style.display = usersData.some(u => u.targetSlot === 'slot1') ? 'block' : 'none';
    document.getElementById('lockBtn2').style.display = usersData.some(u => u.targetSlot === 'slot2') ? 'block' : 'none';
});

setInterval(() => {
    const now = new Date(); document.getElementById("clock").textContent = now.toLocaleTimeString("pl-PL");
    const s = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds(); renderTable(1, s); renderTable(2, s);
}, 1000);

function renderTable(id, sec) {
    const slotData = usersData.filter(u => u.targetSlot === `slot${id}`);
    const isStopped = id === 1 ? isStopped1 : isStopped2; const isLocked = id === 1 ? isLocked1 : isLocked2;
    const sorted = [...slotData].sort((a,b) => Math.abs(toSec(a.hour)-sec) - Math.abs(toSec(b.hour)-sec));
    const table = document.getElementById(`table${id}`);
    table.innerHTML = "<tr><th>#</th><th>Gracz</th><th>Czas</th><th>X</th></tr>";
    sorted.forEach((u, i) => {
        const reveal = isLocked || isStopped; const nameDisp = reveal ? u.name : (assignedFakeNames[u.id] || "Anonim");
        table.innerHTML += `<tr><td>${i+1}</td><td><div style="display:flex; align-items:center; gap:8px;"><div style="width:24px; height:24px; border-radius:50%; background:${getAvatarColor(u.name)}; color:white; font-size:10px; display:flex; align-items:center; justify-content:center;">${reveal ? u.name[0] : "?"}</div>${nameDisp}</div></td><td class="${isStopped?'reveal-data':'hidden-hour'}">${u.hour}</td><td><span style="color:#ff4d4d; cursor:pointer;" onclick="deleteOne('${u.id}')">✕</span></td></tr>`;
    });
}

window.stopSlot = async (id) => {
    const slotData = usersData.filter(u => u.targetSlot === `slot${id}`); if(!slotData.length) return;
    if(id === 1) isStopped1 = true; else isStopped2 = true;
    const now = new Date(); const s = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
    const sorted = [...slotData].sort((a,b) => Math.abs(toSec(a.hour)-s) - Math.abs(toSec(b.hour)-s));
    
    let winners = [], rank = 1;
    for (let i = 0; i < sorted.length; i++) {
        if (i > 0 && Math.abs(toSec(sorted[i].hour)-s) !== Math.abs(toSec(sorted[i-1].hour)-s)) rank = i+1;
        if (rank > 3) break; winners.push({ name: sorted[i].name, pts: (rank===1?3:rank===2?2:1), rank: rank });
    }
    const winDiv = document.getElementById(`winner${id}`); winDiv.style.display = "block";
    winDiv.innerHTML = "<b>🏆 WYNIKI:</b><br>" + winners.map(p => `${p.rank}. ${p.name} (+${p.pts} pkt)`).join("<br>");
    document.body.style.animation = "cringeBg 0.4s infinite alternate"; fanfareAudio.play().catch(()=>{});
    for(const p of winners) { const ref = doc(db, "ranking", p.name); const sn = await getDoc(ref); if(sn.exists()) await updateDoc(ref, { points: increment(p.pts) }); else await setDoc(ref, { points: p.pts }); }
    await addDoc(collection(db, "history"), { date: now.toLocaleString("pl-PL"), timestamp: now.getTime(), winners: winners.map(p=>({name:p.name, rank:p.rank})) });
};

window.clearSlot = async (id) => {
    if(!confirm(`Wyczyścić listę slotu ${id}?`)) return;
    const q = query(collection(db, "users"), where("targetSlot", "==", `slot${id}`)); const snap = await getDocs(q);
    for(const d of snap.docs) await deleteDoc(doc(db, "users", d.id));
    await setDoc(appStateRef, { [`isLocked${id}`]: false, [`target${id}`]: "Brak" }, { merge: true });
    if(id === 1) { isStopped1 = false; document.getElementById("winner1").style.display = "none"; }
    else { isStopped2 = false; document.getElementById("winner2").style.display = "none"; }
};

window.deleteOne = async id => await deleteDoc(doc(db, "users", id));
</script>
</body>
</html>
