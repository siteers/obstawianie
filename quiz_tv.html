<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Quiz | TV</title>
  <style>
    :root { --cyan: #00d4ff; --gold: #d4af37; --bg: #050b14; --error: #ff4757; }
    body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    
    #audio-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    #audio-btn { background: var(--cyan); color: #000; border: none; padding: 2vw 4vw; font-size: 2vw; font-weight: 900; border-radius: 1vw; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 3vw rgba(0, 212, 255, 0.5); animation: pulse 1s infinite; }

    .timer-box { position: absolute; top: 3vw; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 0.3vw solid var(--error); border-radius: 50%; width: 8vw; height: 8vw; display: none; align-items: center; justify-content: center; font-size: 4vw; font-weight: 900; color: #fff; box-shadow: 0 0 2vw rgba(255, 71, 87, 0.5); z-index: 100; transition: color 0.3s; }
    .timer-alert { color: var(--error) !important; animation: pulse 0.5s infinite; }

    .score-corner { position: absolute; width: 15vw; background: rgba(0,0,0,0.8); border: 0.2vw solid var(--cyan); border-radius: 1vw; padding: 1.5vw; text-align: center; box-shadow: 0 0 1.5vw rgba(0, 212, 255, 0.2); transition: all 0.3s; }
    .top-left { top: 2vw; left: 2vw; } .top-right { top: 2vw; right: 2vw; }
    .bottom-left { bottom: 2vw; left: 2vw; } .bottom-right { bottom: 2vw; right: 2vw; }
    .player-name { font-size: 2vw; color: var(--gold); font-weight: 900; text-transform: uppercase; letter-spacing: 0.2vw; transition: 0.3s; }
    .player-score { font-size: 3.5vw; font-weight: bold; color: #fff; text-shadow: 0 0 1vw var(--cyan); margin-top: 0.5vw; transition: 0.3s; }

    .score-corner.blocked { filter: grayscale(1); opacity: 0.4; border-color: var(--error) !important; box-shadow: none; }
    .score-corner.blocked .player-name { text-decoration: line-through; color: var(--error); }

    .center-stage { width: 50vw; max-width: 50vw; text-align: center; background: rgba(15,23,42,0.9); border: 0.3vw solid var(--gold); border-radius: 2vw; padding: 3vw; box-shadow: 0 0 4vw rgba(212, 175, 55, 0.3); transition: 0.5s; z-index: 10; margin-top: 5vw; }
    .center-stage.success-glow { box-shadow: 0 0 6vw rgba(0, 255, 0, 0.6); border-color: #00ff00; }
    .center-stage.error-glow { box-shadow: 0 0 6vw rgba(255, 71, 87, 0.6); border-color: var(--error); }

    .round-title { font-size: 1.5vw; color: #888; text-transform: uppercase; letter-spacing: 0.3vw; margin-bottom: 1vw; }
    .question-text { font-size: 2.8vw; font-weight: bold; line-height: 1.3; margin-bottom: 2vw; color: #fff; }
    .category-text { font-size: 2.5vw; font-weight: 900; color: #00d4ff; text-transform: uppercase; letter-spacing: 0.5vw; margin-bottom: 2vw; display: none; text-shadow: 0 0 2vw #00d4ff; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5vw; display: none; }
    .option { background: #111; border: 0.2vw solid #444; padding: 1.5vw; font-size: 1.8vw; border-radius: 1vw; font-weight: bold; }
    
    #tv-qr-container { display: none; margin-top: 2vw; }
    #tv-qr-container p { font-size: 1.2vw; color: var(--cyan); font-weight: bold; text-transform: uppercase; letter-spacing: 0.2vw; margin-bottom: 1vw; }
    #tv-qr-container img { width: 12vw; height: 12vw; border: 0.3vw solid var(--cyan); border-radius: 1vw; padding: 0.5vw; background: #fff; }

    #tv-typed-answer { font-size: 2.2vw; color: #aaa; margin-bottom: 1.5vw; font-style: italic; display: none; }
    #tv-typed-answer span { color: #fff; font-weight: bold; font-style: normal; }

    .status-msg { font-size: 3vw; color: #00ff00; font-weight: bold; margin-top: 2vw; display: none; text-shadow: 0 0 2vw #00ff00; }
    .winner-announcement { font-size: 3vw; color: var(--gold); text-transform: uppercase; font-weight: 900; margin-top: 1vw; text-shadow: 0 0 2vw var(--gold); display: none; }
    
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <div id="audio-overlay">
    <button id="audio-btn" onclick="initAudio()">KLIKNIJ, ABY AKTYWOWAĆ DŹWIĘK TV</button>
  </div>

  <div class="timer-box" id="tv-timer">10</div>

  <div class="score-corner top-left" id="score-Lila"><div class="player-name">Lila</div><div class="player-score" id="pts-Lila">0</div></div>
  <div class="score-corner top-right" id="score-Kaja"><div class="player-name">Kaja</div><div class="player-score" id="pts-Kaja">0</div></div>
  <div class="score-corner bottom-left" id="score-Darek"><div class="player-name">Darek</div><div class="player-score" id="pts-Darek">0</div></div>
  <div class="score-corner bottom-right" id="score-Jas"><div class="player-name">Jaś</div><div class="player-score" id="pts-Jas">0</div></div>

  <div class="center-stage" id="stage-box">
    <div class="round-title" id="tv-round">CZEKANIE NA ADMINA...</div>
    <div class="category-text" id="tv-cat">KATEGORIA</div>
    <div class="question-text" id="tv-question">Zaraz zaczynamy! Przygotujcie telefony.</div>
    
    <div id="tv-qr-container">
        <p>Zeskanuj, aby wejść do gry</p>
        <img id="qrGraczTv" src="" alt="QR">
    </div>
    
    <div class="options-grid" id="tv-options">
      <div class="option" id="opt-A">A: ...</div><div class="option" id="opt-B">B: ...</div>
      <div class="option" id="opt-C">C: ...</div><div class="option" id="opt-D">D: ...</div>
    </div>
    
    <div id="tv-typed-answer"></div>
    <div class="winner-announcement" id="tv-winner"></div>
    <div class="status-msg" id="tv-status"></div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, updateDoc, getDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const db = getFirestore(initializeApp(firebaseConfig));

const tickSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"); 
tickSound.loop = true; tickSound.volume = 0.8;
const suspenseSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2570/2570-preview.mp3"); 
suspenseSound.loop = true; suspenseSound.volume = 1.0;
const winSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"); 
const loseSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"); 

window.initAudio = function() {
    document.getElementById('audio-overlay').style.display = 'none';
    // Puste odtworzenie odblokowuje silnik w przeglądarce
    winSound.play().then(() => { winSound.pause(); winSound.currentTime = 0; }).catch(()=>{});
};

let currentTick = null;
let timerInterval = null;
let suspenseTimeout = null;
let autoNextTimer = null;
let lastPlayedResult = null;
let isSuspense = false;
let pendingScores = {}; 

window.onload = () => {
    const baseHref = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
    const graczUrl = encodeURIComponent(baseHref + 'quiz_gracz.html');
    document.getElementById('qrGraczTv').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${graczUrl}&color=000000&bgcolor=ffffff`;
};

onSnapshot(collection(db, "quizScores"), (snap) => {
    snap.forEach(doc => { 
        pendingScores[doc.id] = doc.data().points; 
        if(!isSuspense) {
            let el = document.getElementById(`pts-${doc.id}`); 
            if(el) el.innerText = doc.data().points; 
        }
    });
});

onSnapshot(doc(db, "quizGame", "state"), (docSnap) => {
    if (!docSnap.exists()) return;
    const data = docSnap.data();
    
    let roundNames = {1: "RUNDA 1: KTO PIERWSZY (ABCD) | 10 PKT", 2: "RUNDA 2: SZYBKIE PISANIE | 10 PKT", 3: "RUNDA 3: RYZYKO | +20 / -20 PKT"};
    document.getElementById('tv-round').innerText = roundNames[data.round] || "CZEKANIE NA START";
    
    const stage = document.getElementById('stage-box');
    const catEl = document.getElementById('tv-cat');
    const qEl = document.getElementById('tv-question');
    const opts = document.getElementById('tv-options');
    const winnerEl = document.getElementById('tv-winner');
    const statusEl = document.getElementById('tv-status');
    const timerEl = document.getElementById('tv-timer');
    const qrContainer = document.getElementById('tv-qr-container');
    const typedAnsEl = document.getElementById('tv-typed-answer');
    
    catEl.style.display = "none"; opts.style.display = "none"; winnerEl.style.display = "none"; statusEl.style.display = "none";
    typedAnsEl.style.display = "none";
    qrContainer.style.display = (data.status === "idle") ? "block" : "none";
    stage.classList.remove("success-glow", "error-glow");

    const players = ["Lila", "Kaja", "Darek", "Jas"];
    players.forEach(p => {
        let el = document.getElementById(`score-${p}`);
        if(data.blocked && data.blocked.includes(p)) el.classList.add('blocked');
        else el.classList.remove('blocked');
    });

    if (data.status === "idle" || data.status === "setup_nomination" || data.status === "nominating") {
        isSuspense = false;
        clearInterval(timerInterval); timerEl.style.display = 'none';
        tickSound.pause(); tickSound.currentTime = 0; suspenseSound.pause(); suspenseSound.currentTime = 0;
        
        if (data.status === "setup_nomination" || data.status === "nominating") {
            catEl.style.display = "block";
            catEl.innerText = "KATEGORIA: " + data.category;
            qEl.innerText = data.status === "nominating" ? `${data.controller.toUpperCase()} WYBIERA KTO ODPOWIE...` : "LOSOWANIE GRACZA...";
        } else {
            qEl.innerText = "Zaraz zaczynamy! Przygotujcie telefony.";
        }
        
    } else if (data.status === "reading") {
        isSuspense = false;
        suspenseSound.pause(); suspenseSound.currentTime = 0;
        
        for(let id in pendingScores) { let el = document.getElementById(`pts-${id}`); if(el) el.innerText = pendingScores[id]; }

        qEl.innerText = data.question;
        
        if (data.round === 1 || data.round === 3) {
            document.getElementById('opt-A').innerText = "A: " + data.options[0];
            document.getElementById('opt-B').innerText = "B: " + data.options[1];
            document.getElementById('opt-C').innerText = "C: " + data.options[2];
            document.getElementById('opt-D').innerText = "D: " + data.options[3];
            opts.style.display = "grid";
        }
        if (data.round === 3) {
            winnerEl.style.display = "block"; winnerEl.style.color = "#d4af37";
            winnerEl.innerText = `ODPOWIADA TYLKO: ${data.nominated.toUpperCase()}`;
        }

        if (data.tick !== currentTick) {
            currentTick = data.tick;
            clearInterval(timerInterval);
            tickSound.pause(); tickSound.currentTime = 0;
            let timeLeft = 10;
            timerEl.style.display = 'flex';
            timerEl.classList.remove('timer-alert');
            timerEl.innerText = timeLeft;
            
            timerInterval = setInterval(async () => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    tickSound.pause(); tickSound.currentTime = 0;
                    loseSound.play();
                    timerEl.innerText = "0";
                    winnerEl.style.display = "block";
                    winnerEl.style.color = "var(--error)";
                    winnerEl.innerText = "CZAS MINĄŁ!";
                    qEl.innerText = "Nikt nie zdążył odpowiedzieć.";
                    opts.style.display = "none";
                    
                    // WYMUSZENIE TIMEOUT I AUTO-NEXT
                    await updateDoc(doc(db, "quizGame", "state"), { status: "timeout" });
                } else {
                    timerEl.innerText = timeLeft;
                    if (timeLeft <= 3) {
                        timerEl.classList.add('timer-alert');
                        tickSound.play().catch(e=>{});
                    }
                }
            }, 1000);
        }

    } else if (data.status === "verifying" || data.status.startsWith("results_pending_")) {
        // ROZPOCZĘCIE BICIA SERCA I ODLICZANIE NAPIĘCIA W TV
        if (!isSuspense) {
            isSuspense = true;
            clearInterval(timerInterval); timerEl.style.display = 'none';
            tickSound.pause(); tickSound.currentTime = 0;
            suspenseSound.play().catch(e=>{}); 
            
            if (data.round === 2 && data.givenAnswer) {
                typedAnsEl.style.display = "block";
                typedAnsEl.innerHTML = `${data.fastest.toUpperCase()} WPISAŁ/A: <span>"${data.givenAnswer.toUpperCase()}"</span>`;
            }

            qEl.innerText = data.question;
            opts.style.display = "none";
            winnerEl.style.display = "block"; winnerEl.style.color = "#d4af37";
            winnerEl.style.animation = "pulse 0.5s infinite";
            winnerEl.innerText = `WERYFIKACJA ODPOWIEDZI: ${data.fastest.toUpperCase()}...`;

            if (!suspenseTimeout && data.status !== "verifying") {
                suspenseTimeout = setTimeout(async () => {
                    let r = data.round;
                    let isCorrect = data.isAnswerCorrect;
                    let player = data.fastest;
                    let ptsChange = 0;
                    
                    if(r === 1) ptsChange = isCorrect ? 10 : -10;
                    if(r === 2) ptsChange = isCorrect ? 10 : -10;
                    if(r === 3) ptsChange = isCorrect ? 20 : -20;

                    const scoreRef = doc(db, "quizScores", player);
                    const scoreSnap = await getDoc(scoreRef);
                    await updateDoc(scoreRef, { points: scoreSnap.data().points + ptsChange });

                    if (isCorrect) {
                        await updateDoc(doc(db, "quizGame", "state"), {
                            status: "results", winner: player, loser: "", pointsChange: ptsChange, answerTick: Date.now()
                        });
                    } else {
                        let newBlocked = [...(data.blocked || []), player];
                        await updateDoc(doc(db, "quizGame", "state"), {
                            status: r === 2 ? "results_r2_wrong" : "results", loser: player, winner: "", pointsChange: ptsChange, answerTick: Date.now(), blocked: newBlocked
                        });
                        
                        if (r === 2) {
                            setTimeout(async () => {
                                await updateDoc(doc(db, "quizGame", "state"), { status: "reading", blocked: newBlocked, fastest: "", givenAnswer: "", tick: Date.now() });
                            }, 5000);
                        }
                    }
                    suspenseTimeout = null;
                }, 3500); 
            }
        }
        
    } else if (data.status === "results" || data.status === "results_r2_wrong" || data.status === "timeout") {
        clearInterval(timerInterval); timerEl.style.display = 'none';
        tickSound.pause(); tickSound.currentTime = 0; suspenseSound.pause(); suspenseSound.currentTime = 0;
        winnerEl.style.animation = "none";
        isSuspense = false;
        
        qEl.innerText = data.question;
        winnerEl.style.display = "block"; 

        if (data.status === "timeout") {
            winnerEl.style.color = "var(--error)";
            winnerEl.innerText = "CZAS MINĄŁ!";
            qEl.innerText = "Nikt nie zdążył odpowiedzieć.";
        } else {
            statusEl.style.display = "block";
            if (data.round === 2 && data.givenAnswer) {
                typedAnsEl.style.display = "block";
                typedAnsEl.innerHTML = `${(data.winner || data.loser || data.fastest || "").toUpperCase()} WPISAŁ/A: <span>"${data.givenAnswer.toUpperCase()}"</span>`;
            }

            for(let id in pendingScores) { let el = document.getElementById(`pts-${id}`); if(el) el.innerText = pendingScores[id]; }
            
            if (data.winner) {
                stage.classList.add("success-glow");
                winnerEl.style.color = "#00ff00"; winnerEl.innerText = `${data.winner.toUpperCase()} ODPOWIADA POPRAWNIE!`;
                statusEl.style.color = "#00ff00"; statusEl.innerText = `+${data.pointsChange} PKT`;
                if (lastPlayedResult !== "win_" + data.answerTick) { winSound.play().catch(e=>{}); lastPlayedResult = "win_" + data.answerTick; }
            } else if (data.loser) {
                stage.classList.add("error-glow");
                winnerEl.style.color = "#ff4757"; winnerEl.innerText = `${data.loser.toUpperCase()} BŁĘDNA ODPOWIEDŹ!`;
                statusEl.style.color = "#ff4757"; statusEl.innerText = `${data.pointsChange} PKT`;
                if (lastPlayedResult !== "lose_" + data.answerTick) { loseSound.play().catch(e=>{}); lastPlayedResult = "lose_" + data.answerTick; }
            }
        }

        // AUTOMATYCZNE PRZEWIJANIE (W R1 i R3 LUB PO TIMEOUT)
        if (data.status === "timeout" || data.status === "results") {
            clearTimeout(autoNextTimer);
            autoNextTimer = setTimeout(async () => {
                // Skrypt na TV powiadamia admina o progresie ukrytym flago-stanem by puścić nowe
                if (currentState.status === "results" || currentState.status === "timeout") {
                    await updateDoc(doc(db, "quizGame", "state"), { triggerNext: Date.now() });
                }
            }, 6000); // 6 sekund żeby zobaczyli punkty
        }
    }
});
</script>
</body>
</html>
