<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Quiz | TV</title>
  <style>
    :root { --cyan: #00d4ff; --gold: #d4af37; --bg: #050b14; --error: #ff4757; }
    body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    
    #audio-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    #audio-btn { background: var(--cyan); color: #000; border: none; padding: 2vw 4vw; font-size: 2vw; font-weight: 900; border-radius: 1vw; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 3vw rgba(0, 212, 255, 0.5); animation: pulse 1s infinite; }

    /* CANVAS FAJERWERKÓW NA PIERWSZYM PLANIE */
    #fireworks-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 800; display: none; }

    @keyframes pulseTimer {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.12); }
      100% { transform: translateX(-50%) scale(1); }
    }

    @keyframes blockedFlash {
      0%, 100% { border-color: #ff0000; background: rgba(255, 0, 0, 0.35); box-shadow: 0 0 2.5vw #ff0000; }
      50% { border-color: #550000; background: rgba(80, 0, 0, 0.15); box-shadow: 0 0 0.5vw #ff0000; }
    }

    .timer-box { position: absolute; top: 1.5vw; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 0.3vw solid var(--cyan); border-radius: 50%; width: 6.5vw; height: 6.5vw; display: none; align-items: center; justify-content: center; font-size: 3.2vw; font-weight: 900; color: #fff; box-shadow: 0 0 1.5vw rgba(0, 212, 255, 0.4); z-index: 100; margin: 0 !important; }
    .timer-alert { border-color: var(--error) !important; color: var(--error) !important; box-shadow: 0 0 2.5vw rgba(255, 71, 87, 0.8) !important; animation: pulseTimer 0.5s infinite !important; }

    .score-corner { position: absolute; width: 14vw; background: rgba(0,0,0,0.85); border: 0.2vw solid var(--cyan); border-radius: 1vw; padding: 1vw 1.2vw; text-align: center; box-shadow: 0 0 1.5vw rgba(0, 212, 255, 0.2); transition: all 0.3s; z-index: 20; box-sizing: border-box; }
    .top-left { top: 1.5vw; left: 1.5vw; } .top-right { top: 1.5vw; right: 1.5vw; }
    .bottom-left { bottom: 1.5vw; left: 1.5vw; } .bottom-right { bottom: 1.5vw; right: 1.5vw; }
    .player-name { font-size: 1.7vw; color: var(--gold); font-weight: 900; text-transform: uppercase; letter-spacing: 0.15vw; }
    .player-score { font-size: 3vw; font-weight: bold; color: #fff; text-shadow: 0 0 1vw var(--cyan); margin-top: 0.3vw; }
    .blocked-tag { display: none; font-size: 0.9vw; color: #fff; background: #ff0000; padding: 0.2vw 0.5vw; border-radius: 0.4vw; margin-top: 0.4vw; font-weight: 900; letter-spacing: 0.1vw; }

    .score-corner.blocked { animation: blockedFlash 0.8s infinite !important; }
    .score-corner.blocked .player-name { color: #ffcccc; text-decoration: line-through; }
    .score-corner.blocked .blocked-tag { display: inline-block; }

    .center-stage { width: 48vw; max-width: 48vw; text-align: center; background: rgba(15,23,42,0.92); border: 0.25vw solid var(--gold); border-radius: 1.8vw; padding: 2.2vw 2.5vw; box-shadow: 0 0 3.5vw rgba(212, 175, 55, 0.25); transition: 0.4s; z-index: 10; margin-top: 2vw; box-sizing: border-box; }
    .center-stage.success-glow { box-shadow: 0 0 5vw rgba(0, 255, 0, 0.6); border-color: #00ff00; }
    .center-stage.error-glow { box-shadow: 0 0 5vw rgba(255, 71, 87, 0.6); border-color: var(--error); }

    .round-title { font-size: 1.2vw; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.25vw; margin-bottom: 0.8vw; font-weight: bold; }
    .question-text { font-size: 2.3vw; font-weight: bold; line-height: 1.3; margin-bottom: 1.5vw; color: #fff; }
    .category-text { font-size: 2vw; font-weight: 900; color: #00d4ff; text-transform: uppercase; letter-spacing: 0.4vw; margin-bottom: 1.2vw; display: none; text-shadow: 0 0 1.5vw #00d4ff; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2vw; display: none; }
    .option { background: #111; border: 0.18vw solid #444; padding: 1.2vw; font-size: 1.6vw; border-radius: 0.8vw; font-weight: bold; transition: 0.3s; }
    .option.used-wrong { background: rgba(255, 0, 0, 0.15); border-color: #ff4757; color: #ff4757; text-decoration: line-through; opacity: 0.45; }

    /* TABLICA KOŁA FORTUNY (RUNDA 2) */
    .wheel-board { display: none; flex-wrap: wrap; justify-content: center; gap: 2vw; margin: 1.5vw 0; }
    .wheel-word { display: flex; gap: 0.4vw; }
    .wheel-letter { width: 3.1vw; height: 4.2vw; background: #111; border: 0.18vw solid #444; border-radius: 0.5vw; display: flex; align-items: center; justify-content: center; font-size: 2.2vw; font-weight: 900; color: #fff; transition: 0.3s; }
    .wheel-letter.revealed { background: var(--gold); color: #000; border-color: #fff; box-shadow: 0 0 1.2vw rgba(212,175,55,0.8); }
    .wheel-winners-list { display: none; justify-content: center; gap: 0.8vw; flex-wrap: wrap; margin-top: 1.2vw; }
    .wheel-badge { background: rgba(0, 255, 0, 0.15); border: 0.15vw solid #00ff00; color: #00ff00; padding: 0.5vw 1vw; border-radius: 0.6vw; font-size: 1.3vw; font-weight: 900; }

    /* WIELKIE PODIUM FINAŁOWE */
    #podium-view { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; z-index: 600; }
    .podium-title { font-size: 2.8vw; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 0.3vw; text-shadow: 0 0 2vw var(--gold); margin-bottom: 2vw; animation: pulse 1.2s infinite; }
    .podium-bars { display: flex; align-items: flex-end; justify-content: center; gap: 1.8vw; height: 27vw; width: 100%; }
    .podium-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 10vw; }
    .podium-avatar { font-size: 2.8vw; margin-bottom: 0.4vw; filter: drop-shadow(0 0 0.8vw rgba(255,255,255,0.5)); }
    .podium-pname { font-size: 1.7vw; font-weight: 900; color: #fff; text-transform: uppercase; margin-bottom: 0.3vw; }
    .podium-pts { font-size: 1.4vw; font-weight: bold; color: var(--cyan); margin-bottom: 0.8vw; }
    .podium-pedestal { width: 100%; border-radius: 1vw 1vw 0 0; display: flex; align-items: center; justify-content: center; font-size: 3.5vw; font-weight: 900; color: #000; box-shadow: 0 0 2.5vw rgba(255,255,255,0.2); animation: growUp 1s ease-out forwards; transform-origin: bottom; }
    .ped-1 { height: 16vw; background: linear-gradient(180deg, #ffd700, #b8860b); border: 0.25vw solid #fff; box-shadow: 0 0 3.5vw rgba(255, 215, 0, 0.8); }
    .ped-2 { height: 12vw; background: linear-gradient(180deg, #e2e8f0, #64748b); border: 0.2vw solid #fff; box-shadow: 0 0 2vw rgba(226, 232, 240, 0.5); }
    .ped-3 { height: 9vw; background: linear-gradient(180deg, #d97706, #78350f); border: 0.2vw solid #fbd38d; }
    .ped-4 { height: 6vw; background: linear-gradient(180deg, #334155, #0f172a); color: #fff; border: 0.15vw solid #64748b; font-size: 2.2vw; }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    #tv-qr-container { display: none; margin-top: 1.5vw; }
    #tv-qr-container p { font-size: 1.1vw; color: var(--cyan); font-weight: bold; text-transform: uppercase; letter-spacing: 0.15vw; margin-bottom: 0.8vw; }
    #tv-qr-container img { width: 10vw; height: 10vw; border: 0.25vw solid var(--cyan); border-radius: 0.8vw; padding: 0.4vw; background: #fff; }

    #tv-typed-answer { font-size: 1.8vw; color: #cbd5e1; margin-bottom: 1vw; display: none; }
    #tv-typed-answer span { color: var(--cyan); font-weight: 900; }

    .winner-announcement { font-size: 2.3vw; color: var(--gold); text-transform: uppercase; font-weight: 900; margin-top: 0.8vw; text-shadow: 0 0 1.5vw var(--gold); display: none; }
    .status-msg { font-size: 2.4vw; color: #00ff00; font-weight: 900; margin-top: 0.8vw; display: none; text-shadow: 0 0 1.5vw #00ff00; }
    
    .correct-answer-banner { display: none; margin-top: 1.2vw; padding: 0.8vw 1.5vw; background: rgba(212, 175, 55, 0.15); border: 0.15vw solid var(--gold); border-radius: 0.8vw; font-size: 1.7vw; color: #fff; font-weight: bold; }
    .correct-answer-banner span { color: var(--gold); font-weight: 900; text-transform: uppercase; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <div id="audio-overlay">
    <button id="audio-btn" onclick="initAudio()">🔊 KLIKNIJ, ABY AKTYWOWAĆ EKRAN I DŹWIĘK TV</button>
  </div>

  <canvas id="fireworks-canvas"></canvas>

  <div class="timer-box" id="tv-timer">10</div>

  <div class="score-corner top-left" id="score-Lila">
    <div class="player-name">Lila</div>
    <div class="player-score" id="pts-Lila">0</div>
    <div class="blocked-tag">ZABLOKOWANA</div>
  </div>
  <div class="score-corner top-right" id="score-Kaja">
    <div class="player-name">Kaja</div>
    <div class="player-score" id="pts-Kaja">0</div>
    <div class="blocked-tag">ZABLOKOWANA</div>
  </div>
  <div class="score-corner bottom-left" id="score-Darek">
    <div class="player-name">Darek</div>
    <div class="player-score" id="pts-Darek">0</div>
    <div class="blocked-tag">ZABLOKOWANY</div>
  </div>
  <div class="score-corner bottom-right" id="score-Jas">
    <div class="player-name">Jaś</div>
    <div class="player-score" id="pts-Jas">0</div>
    <div class="blocked-tag">ZABLOKOWANY</div>
  </div>

  <div class="center-stage" id="stage-box">
    <div class="round-title" id="tv-round">CZEKANIE NA ADMINA...</div>
    <div class="category-text" id="tv-cat">KATEGORIA</div>
    <div class="question-text" id="tv-question">Zaraz zaczynamy! Przygotujcie telefony.</div>
    
    <!-- KOŁO FORTUNY (Runda 2) -->
    <div class="wheel-board" id="tv-wheel-board"></div>
    <div class="category-text" id="tv-wheel-cat" style="margin-top: 1vw; margin-bottom: 0;"></div>
    <div class="wheel-winners-list" id="tv-wheel-winners"></div>

    <!-- PODIUM FINAŁOWE -->
    <div id="podium-view">
      <div class="podium-title">🏆 WIELKI FINAŁ - WYNIKI KOŃCOWE 🏆</div>
      <div class="podium-bars" id="podium-bars-container"></div>
    </div>

    <div id="tv-qr-container">
        <p>Zeskanuj, aby wejść do gry</p>
        <img id="qrGraczTv" src="" alt="QR">
    </div>
    
    <div class="options-grid" id="tv-options">
      <div class="option" id="opt-0">A: ...</div><div class="option" id="opt-1">B: ...</div>
      <div class="option" id="opt-2">C: ...</div><div class="option" id="opt-3">D: ...</div>

  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, updateDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const db = getFirestore(initializeApp(firebaseConfig));

const tickSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"); 
tickSound.loop = true; tickSound.volume = 0.5;
const suspenseSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2570/2570-preview.mp3"); 
suspenseSound.loop = true; suspenseSound.volume = 1.0;
const winSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"); 
winSound.volume = 1.0;
const loseSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"); 
loseSound.volume = 0.9;
const fanfareSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3");
fanfareSound.volume = 1.0;

// --- SYNTEZATOR MUZYKI W TLE ORAZ POTĘŻNYCH FANFAR I HUKU FAJERWERKÓW ---
let audioCtx = null;
let bgMasterGain = null;
let musicInterval = null;
let fanfareLoopInterval = null;
let isBgMusicPlaying = false;

function createUpbeatGameMusic() {
    if (audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    
    bgMasterGain = audioCtx.createGain();
    bgMasterGain.gain.value = 0.25;
    bgMasterGain.connect(audioCtx.destination);

    const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
    const bassNotes = [130.81, 146.83, 164.81, 196.00];

    let step = 0;
    musicInterval = setInterval(() => {
        if (!audioCtx || !isBgMusicPlaying) return;
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

        const now = audioCtx.currentTime;

        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = "triangle";
        bassOsc.frequency.setValueAtTime(bassNotes[Math.floor(step / 4) % bassNotes.length], now);
        bassGain.gain.setValueAtTime(0.12, now);
        bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        bassOsc.connect(bassGain);
        bassGain.connect(bgMasterGain);
        bassOsc.start(now);
        bassOsc.stop(now + 0.25);

        if (step % 2 === 0) {
            const leadOsc = audioCtx.createOscillator();
            const leadGain = audioCtx.createGain();
            leadOsc.type = "sine";
            const note = scale[Math.floor(Math.random() * scale.length)];
            leadOsc.frequency.setValueAtTime(note, now);
            leadGain.gain.setValueAtTime(0.08, now);
            leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
            leadOsc.connect(leadGain);
            leadGain.connect(bgMasterGain);
            leadOsc.start(now);
            leadOsc.stop(now + 0.18);
        }

        step++;
    }, 220);
}

// Dźwięk wybuchu fajerwerku (syntezator huku petardy)
function playFireworkBoom() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    const now = audioCtx.currentTime;

    // 1. Szum eksplozji
    const bufferSize = audioCtx.sampleRate * 0.45;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.12));
    }
    const whiteNoise = audioCtx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(900, now);
    filter.frequency.exponentialRampToValueAtTime(120, now + 0.4);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.45, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.44);

    whiteNoise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    whiteNoise.start(now);

    // 2. Niskie uderzenie basowe ("Thump")
    const punchOsc = audioCtx.createOscillator();
    const punchGain = audioCtx.createGain();
    punchOsc.type = "sine";
    punchOsc.frequency.setValueAtTime(130, now);
    punchOsc.frequency.exponentialRampToValueAtTime(35, now + 0.25);
    punchGain.gain.setValueAtTime(0.5, now);
    punchGain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    punchOsc.connect(punchGain);
    punchGain.connect(audioCtx.destination);
    punchOsc.start(now);
    punchOsc.stop(now + 0.26);
}

// Potężne, wielogłosowe fanfary orkiestrowe (akordy trąbek sawtooth)
function playGrandFanfareSequence() {
    fanfareSound.currentTime = 0;
    fanfareSound.play().catch(()=>{});
    winSound.currentTime = 0;
    winSound.play().catch(()=>{});

    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

    const playBrassChord = (freqs, startOffset, duration, vol = 0.22) => {
        const now = audioCtx.currentTime + startOffset;
        freqs.forEach((f, idx) => {
            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const g = audioCtx.createGain();

            osc.type = "sawtooth"; // Brzmienie sekcji dętej (trąbki/puzony)
            osc.frequency.setValueAtTime(f, now);
            osc.detune.setValueAtTime((idx - 1) * 6, now); // Szerokie brzmienie orkiestry

            filter.type = "lowpass";
            filter.frequency.setValueAtTime(2400, now);

            g.gain.setValueAtTime(0.001, now);
            g.gain.linearRampToValueAtTime(vol, now + 0.03);
            g.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(filter);
            filter.connect(g);
            g.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + duration + 0.02);
        });
    };

    // Triumfalna sekwencja akordowa (C-dur -> G-dur -> A-dur -> F-dur -> G-dur -> C-dur Wielki Finał)
    playBrassChord([261.63, 329.63, 392.00, 523.25], 0.00, 0.22, 0.25);
    playBrassChord([261.63, 329.63, 392.00, 523.25], 0.24, 0.22, 0.25);
    playBrassChord([261.63, 329.63, 392.00, 523.25], 0.48, 0.22, 0.25);
    playBrassChord([329.63, 392.00, 523.25, 659.25], 0.72, 0.55, 0.30);
    playBrassChord([293.66, 349.23, 440.00, 587.33], 1.32, 0.45, 0.28);
    playBrassChord([329.63, 392.00, 523.25, 659.25], 1.82, 0.45, 0.28);
    playBrassChord([261.63, 392.00, 523.25, 659.25, 783.99], 2.32, 1.80, 0.35);
}

function startVictoryFanfareLoop() {
    clearInterval(fanfareLoopInterval);
    playGrandFanfareSequence();
    // Powtarzaj uroczyste fanfary co 6.5 sekundy podczas trwania pokazu na podium
    fanfareLoopInterval = setInterval(() => {
        if (fwActive) playGrandFanfareSequence();
    }, 6500);
}

function stopVictoryFanfareLoop() {
    clearInterval(fanfareLoopInterval);
}

function setBgMusicActive(active) {
    isBgMusicPlaying = active;
    if (audioCtx && active && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(()=>{});
    }
}

window.initAudio = function() {
    document.getElementById('audio-overlay').style.display = 'none';
    createUpbeatGameMusic();
    setBgMusicActive(true);
    [tickSound, suspenseSound, winSound, loseSound, fanfareSound].forEach(s => {
        s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(()=>{});
    });
};

// --- POTĘŻNY SILNIK FAJERWERKÓW NA ŻYWO (RAKIETY + PODWÓJNE EKSPLOZJE + BŁYSKI + DŹWIĘK) ---
const fwCanvas = document.getElementById('fireworks-canvas');
const fwCtx = fwCanvas.getContext('2d');
let fwParticles = [];
let fwRockets = [];
let fwActive = false;
let fwLoopId = null;
let fwSpawnTimer = null;

function createExplosion(x, y, mainColor) {
    playFireworkBoom();
    const count = 95;
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.1;
        const speed = Math.random() * 8 + 2.5;
        fwParticles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            size: Math.random() * 3.5 + 2,
            color: i % 3 === 0 ? '#ffffff' : mainColor,
            decay: Math.random() * 0.012 + 0.010
        });
    }
}

function startFireworks() {
    if (fwActive) return;
    fwActive = true;
    fwCanvas.style.display = 'block';
    fwCanvas.width = window.innerWidth;
    fwCanvas.height = window.innerHeight;
    fwParticles = [];
    fwRockets = [];

    const colors = ['#ffd700', '#00d4ff', '#ff4757', '#2ed573', '#a855f7', '#ff9f43', '#00ffcc'];

    function launchWave() {
        if (!fwActive) return;
        // Wystrzel 2 lub 3 rakiety naraz
        const rocketsCount = Math.random() > 0.4 ? 2 : 3;
        for (let r = 0; r < rocketsCount; r++) {
            const startX = fwCanvas.width * (0.15 + Math.random() * 0.7);
            const targetY = fwCanvas.height * (0.12 + Math.random() * 0.38);
            const color = colors[Math.floor(Math.random() * colors.length)];
            fwRockets.push({
                x: startX,
                y: fwCanvas.height,
                vx: (Math.random() - 0.5) * 2.5,
                vy: -(Math.random() * 5 + 11),
                targetY,
                color
            });
        }
        fwSpawnTimer = setTimeout(launchWave, 550);
    }
    launchWave();

    function animateFw() {
        if (!fwActive) return;
        fwCtx.globalCompositeOperation = 'destination-out';
        fwCtx.fillStyle = 'rgba(0, 0, 0, 0.22)'; // Efekt smugi świetlnej
        fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
        fwCtx.globalCompositeOperation = 'lighter';

        // Rysowanie lecących rakiet
        for (let i = fwRockets.length - 1; i >= 0; i--) {
            const r = fwRockets[i];
            r.x += r.vx;
            r.y += r.vy;
            r.vy += 0.12;

            fwCtx.globalAlpha = 1;
            fwCtx.fillStyle = '#ffffff';
            fwCtx.beginPath();
            fwCtx.arc(r.x, r.y, 4, 0, Math.PI * 2);
            fwCtx.fill();

            if (r.y <= r.targetY || r.vy >= 0) {
                createExplosion(r.x, r.y, r.color);
                fwRockets.splice(i, 1);
            }
        }

        // Rysowanie iskier eksplozji
        for (let i = fwParticles.length - 1; i >= 0; i--) {
            const p = fwParticles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.97;
            p.vy *= 0.97;
            p.vy += 0.08; // Grawitacja
            p.alpha -= p.decay;

            if (p.alpha <= 0) {
                fwParticles.splice(i, 1);
            } else {
                fwCtx.globalAlpha = p.alpha;
                fwCtx.shadowBlur = 12;
                fwCtx.shadowColor = p.color;
                fwCtx.fillStyle = p.color;
                fwCtx.beginPath();
                fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                fwCtx.fill();
            }
        }
        fwCtx.shadowBlur = 0;
        fwLoopId = requestAnimationFrame(animateFw);
    }
    animateFw();
}

function stopFireworks() {
    fwActive = false;
    clearTimeout(fwSpawnTimer);
    if (fwLoopId) cancelAnimationFrame(fwLoopId);
    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
    fwCanvas.style.display = 'none';
}

let currentTick = null;
let timerInterval = null;
let wheelRevealInterval = null;
let revealedWheelCount = 0;
let lastWheelWinnersCount = 0;
let lastPlayedResult = null;
let isSuspense = false;
let pendingScores = { Lila: 0, Kaja: 0, Darek: 0, Jas: 0 }; 

window.onload = () => {
    const baseHref = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
    const graczUrl = encodeURIComponent(baseHref + 'quiz_gracz.html');
    document.getElementById('qrGraczTv').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${graczUrl}&color=000000&bgcolor=ffffff`;
};

function renderWheelBoard(phrase, order, count) {
    const board = document.getElementById('tv-wheel-board');
    board.innerHTML = "";
    const unlocked = (order || []).slice(0, count);
    let letterIdx = 0;

    phrase.split(" ").forEach(word => {
        const wDiv = document.createElement('div');
        wDiv.className = "wheel-word";
        for (let ch of word) {
            const lDiv = document.createElement('div');
            if (unlocked.includes(letterIdx)) {
                lDiv.className = "wheel-letter revealed";
                lDiv.innerText = ch;
            } else {
                lDiv.className = "wheel-letter";
                lDiv.innerText = "";
            }
            wDiv.appendChild(lDiv);
            letterIdx++;
        }
        board.appendChild(wDiv);
    });
}

// SPRAWIEDLIWE PODIUM Z OBSŁUGĄ REMISÓW (EX AEQUO)
function renderPodium() {
    const container = document.getElementById('podium-bars-container');
    container.innerHTML = "";
    const displayNames = { Lila: "Lila", Kaja: "Kaja", Darek: "Darek", Jas: "Jaś" };
    
    // 1. Sortujemy graczy malejąco po punktach
    let sorted = Object.keys(displayNames).map(id => ({
        id,
        name: displayNames[id],
        pts: pendingScores[id] !== undefined ? pendingScores[id] : 0
    })).sort((a, b) => b.pts - a.pts);

    // 2. Przypisujemy sprawiedliwe miejsca (jeśli mają tyle samo punktów -> mają to samo miejsce, ten sam medal i tę samą wysokość słupka!)
    let currentRank = 1;
    for (let i = 0; i < sorted.length; i++) {
        if (i > 0 && sorted[i].pts < sorted[i - 1].pts) {
            currentRank = currentRank + 1; // Kolejny próg punktowy dostaje kolejne miejsce na podium (1 -> 2 -> 3 -> 4)
        }
        sorted[i].rank = currentRank;
    }

    // 3. Układamy wizualnie tak, aby najwyższe miejsce (1.) było na środku sceny
    const visualArrangement = [];
    sorted.forEach((player, idx) => {
        if (idx % 2 === 0) visualArrangement.push(player);
        else visualArrangement.unshift(player);
    });

    const medalsMap = { 1: "🥇", 2: "🥈", 3: "🥉", 4: "🏅" };
    const pedClassMap = { 1: "ped-1", 2: "ped-2", 3: "ped-3", 4: "ped-4" };

    visualArrangement.forEach(p => {
        const r = Math.min(4, p.rank);
        const col = document.createElement('div');
        col.className = "podium-col";
        col.innerHTML = `
            <div class="podium-avatar">${medalsMap[r]}</div>
            <div class="podium-pname">${p.name}</div>
            <div class="podium-pts">${p.pts} PKT</div>
            <div class="podium-pedestal ${pedClassMap[r]}">${r}</div>
        `;
        container.appendChild(col);
    });
}

onSnapshot(collection(db, "quizScores"), (snap) => {
    snap.forEach(doc => { 
        pendingScores[doc.id] = doc.data().points; 
        if(!isSuspense) {
            let el = document.getElementById(`pts-${doc.id}`); 
            if(el) el.innerText = doc.data().points; 
        }
    });
    // Jeśli jesteśmy na ekranie podium i zmienią się punkty (np. reset), odśwież słupki na żywo
    if (document.getElementById('podium-view').style.display === 'flex') {
        renderPodium();
    }
});

onSnapshot(doc(db, "quizGame", "state"), (docSnap) => {
    if (!docSnap.exists()) return;
    const data = docSnap.data();
    
    let roundNames = {
        1: "RUNDA 1: KTO PIERWSZY (ABCD) | +10 / -10 PKT", 
        2: "RUNDA 2: KOŁO FORTUNY (60s) | 20 / 15 / 10 / 5 PKT",
        3: "RUNDA 3: SZYBKIE PISANIE (15s) | +10 / -10 PKT", 
        4: "RUNDA 4: WYBIERANIE (NA SIEBIE: ±20 PKT | NA KOGOŚ / DOBITKA: ±10 PKT)"
    };
    document.getElementById('tv-round').innerText = data.status === "podium" ? "PODSUMOWANIE TELEWIZYJNE" : (roundNames[data.round] || "CZEKANIE NA START");
    
    const stage = document.getElementById('stage-box');
    const catEl = document.getElementById('tv-cat');
    const qEl = document.getElementById('tv-question');
    const opts = document.getElementById('tv-options');
    const winnerEl = document.getElementById('tv-winner');
    const statusEl = document.getElementById('tv-status');
    const timerEl = document.getElementById('tv-timer');
    const qrContainer = document.getElementById('tv-qr-container');
    const typedAnsEl = document.getElementById('tv-typed-answer');
    const correctBanner = document.getElementById('tv-correct-banner');
    const correctVal = document.getElementById('tv-correct-val');
    const wheelBoard = document.getElementById('tv-wheel-board');
    const wheelCat = document.getElementById('tv-wheel-cat');
    const wheelWinnersEl = document.getElementById('tv-wheel-winners');
    const podiumView = document.getElementById('podium-view');
    
    catEl.style.display = "none"; opts.style.display = "none"; winnerEl.style.display = "none"; 
    statusEl.style.display = "none"; typedAnsEl.style.display = "none"; correctBanner.style.display = "none";
    wheelBoard.style.display = "none"; wheelCat.style.display = "none"; wheelWinnersEl.style.display = "none";
    podiumView.style.display = "none";
    qEl.style.display = "block";
    qrContainer.style.display = (data.status === "idle") ? "block" : "none";
    stage.classList.remove("success-glow", "error-glow");

    if (data.status !== "podium") {
        stopFireworks();
        stopVictoryFanfareLoop();
    }

    const players = ["Lila", "Kaja", "Darek", "Jas"];
    players.forEach(p => {
        let el = document.getElementById(`score-${p}`);
        if(data.blocked && data.blocked.includes(p)) el.classList.add('blocked');
        else el.classList.remove('blocked');
    });

    const letters = ["A", "B", "C", "D"];

    if (data.status === "podium") {
        // --- WIELKI FINAŁ: SPRAWIEDLIWE PODIUM, GĘSTE FAJERWERKI I GŁOŚNE FANFARY ---
        isSuspense = false;
        clearInterval(timerInterval); clearInterval(wheelRevealInterval);
        timerEl.style.display = 'none';
        tickSound.pause(); tickSound.currentTime = 0; suspenseSound.pause(); suspenseSound.currentTime = 0;
        setBgMusicActive(false);

        qEl.style.display = "none";
        stage.classList.add("success-glow");
        podiumView.style.display = "flex";
        renderPodium();
        startFireworks();

        if (lastPlayedResult !== "podium_" + data.answerTick) {
            startVictoryFanfareLoop();
            lastPlayedResult = "podium_" + data.answerTick;
        }
        return;
    }

    if (data.status === "idle" || data.status === "setup_nomination" || data.status === "nominating") {
        isSuspense = false;
        clearInterval(timerInterval); clearInterval(wheelRevealInterval);
        timerEl.style.display = 'none';
        tickSound.pause(); tickSound.currentTime = 0; suspenseSound.pause(); suspenseSound.currentTime = 0;
        
        setBgMusicActive(true);
        
        if (data.status === "setup_nomination" || data.status === "nominating") {
            catEl.style.display = "block";
            catEl.innerText = "KATEGORIA: " + data.category;
            if (data.tieMsg) {
                winnerEl.style.display = "block"; winnerEl.style.color = "var(--cyan)";
                winnerEl.innerText = data.tieMsg;
            }
            qEl.innerText = data.status === "nominating" ? `${data.controller.toUpperCase()} WYBIERA KTO ODPOWIE...` : "PRZYGOTOWANIE KATEGORII...";
        } else {
            qEl.innerText = data.question || "Zaraz zaczynamy! Przygotujcie telefony.";
        }
        
    } else if (data.status === "wheel_reading") {
        isSuspense = false;
        suspenseSound.pause(); suspenseSound.currentTime = 0;
        for(let id in pendingScores) { let el = document.getElementById(`pts-${id}`); if(el) el.innerText = pendingScores[id]; }

        qEl.style.display = "none";
        wheelBoard.style.display = "flex";
        wheelCat.style.display = "block";
        wheelCat.innerText = "KATEGORIA: " + data.category;
        wheelWinnersEl.style.display = "flex";

        const winners = data.wheelWinners || [];
        const ptsMap = [20, 15, 10, 5];
        const medals = ["🥇", "🥈", "🥉", "🏅"];
        wheelWinnersEl.innerHTML = winners.map((w, idx) => `<div class="wheel-badge">${medals[idx]} ${idx+1}. ${w.toUpperCase()} (+${ptsMap[idx]} PKT)</div>`).join("");

        if (winners.length > lastWheelWinnersCount) {
            lastWheelWinnersCount = winners.length;
            winSound.currentTime = 0;
            winSound.play().catch(()=>{});
        }

        if (data.tick !== currentTick) {
            currentTick = data.tick;
            lastWheelWinnersCount = winners.length;
            clearInterval(timerInterval);
            clearInterval(wheelRevealInterval);
            tickSound.pause(); tickSound.currentTime = 0;
            setBgMusicActive(true);

            let totalLetters = (data.wheelOrder || []).length;
            revealedWheelCount = 0;
            renderWheelBoard(data.question, data.wheelOrder, revealedWheelCount);

            let intervalMs = Math.max(1500, Math.floor(52000 / Math.max(1, totalLetters)));
            wheelRevealInterval = setInterval(() => {
                if (revealedWheelCount < totalLetters) {
                    revealedWheelCount++;
                    renderWheelBoard(data.question, data.wheelOrder, revealedWheelCount);
                }
            }, intervalMs);

            let timeLeft = 60;
            timerEl.style.display = 'flex';
            timerEl.classList.remove('timer-alert');
            timerEl.innerText = timeLeft;

            timerInterval = setInterval(async () => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    clearInterval(wheelRevealInterval);
                    tickSound.pause(); tickSound.currentTime = 0;
                    setBgMusicActive(false);
                    timerEl.innerText = "0";
                    await updateDoc(doc(db, "quizGame", "state"), { status: "wheel_results", answerTick: Date.now() });
                } else {
                    timerEl.innerText = timeLeft;
                    if (timeLeft <= 5) {
                        timerEl.classList.add('timer-alert');
                        setBgMusicActive(false);
                        tickSound.play().catch(()=>{});
                    }
                }
            }, 1000);
        } else {
            renderWheelBoard(data.question, data.wheelOrder, revealedWheelCount);
        }

    } else if (data.status === "wheel_results") {
        clearInterval(timerInterval); clearInterval(wheelRevealInterval);
        timerEl.style.display = 'none';
        tickSound.pause(); tickSound.currentTime = 0;
        setBgMusicActive(false);

        for(let id in pendingScores) { let el = document.getElementById(`pts-${id}`); if(el) el.innerText = pendingScores[id]; }

        qEl.style.display = "none";
        wheelBoard.style.display = "flex";
        wheelCat.style.display = "block";
        wheelCat.innerText = "KATEGORIA: " + data.category;
        wheelWinnersEl.style.display = "flex";

        renderWheelBoard(data.question, data.wheelOrder, (data.wheelOrder || []).length);

        const winners = data.wheelWinners || [];
        const ptsMap = [20, 15, 10, 5];
        const medals = ["🥇", "🥈", "🥉", "🏅"];
        wheelWinnersEl.innerHTML = winners.map((w, idx) => `<div class="wheel-badge">${medals[idx]} ${idx+1}. ${w.toUpperCase()} (+${ptsMap[idx]} PKT)</div>`).join("");

        stage.classList.add("success-glow");
        winnerEl.style.display = "block";
        winnerEl.style.color = "var(--gold)";
        winnerEl.innerText = winners.length === 4 ? "WSZYSCY ODGADLI HASŁO!" : "KONIEC CZASU! OTO PEŁNE HASŁO!";
        if (lastPlayedResult !== "wheel_end_" + data.answerTick) {
            winSound.play().catch(()=>{});
            lastPlayedResult = "wheel_end_" + data.answerTick;
        }

    } else if (data.status === "reading") {
        isSuspense = false;
        clearInterval(wheelRevealInterval);
        suspenseSound.pause(); suspenseSound.currentTime = 0;
        
        setBgMusicActive(true);
        
        for(let id in pendingScores) { let el = document.getElementById(`pts-${id}`); if(el) el.innerText = pendingScores[id]; }

        qEl.innerText = data.question;
        
        if ((data.round === 1 || data.round === 4) && data.options) {
            for(let i=0; i<4; i++) {
                let optEl = document.getElementById(`opt-${i}`);
                optEl.innerText = `${letters[i]}: ${data.options[i]}`;
                optEl.classList.remove('used-wrong');
                if (data.usedOptions && data.usedOptions.includes(i)) {
                    optEl.classList.add('used-wrong');
                }
            }
            opts.style.display = "grid";
        }
        if (data.round === 4) {
            winnerEl.style.display = "block"; winnerEl.style.color = "#d4af37";
            if (data.nominated) {
                let stawkTxt = (data.nominated === data.controller) ? "GRA NA SIEBIE (±20 PKT)" : "WSKAZANY (±10 PKT)";
                winnerEl.innerText = `ODPOWIADA: ${data.nominated.toUpperCase()} [${stawkTxt}]`;
            } else {
                winnerEl.innerText = `DOBITKA! KTO PIERWSZY, TEN LEPSZY! (±10 PKT)`;
            }
        }

        if (data.tick !== currentTick) {
            currentTick = data.tick;
            clearInterval(timerInterval);
            tickSound.pause(); tickSound.currentTime = 0;
            let timeLeft = data.round === 3 ? 15 : 10;
            timerEl.style.display = 'flex';
            timerEl.classList.remove('timer-alert');
            timerEl.innerText = timeLeft;
            
            timerInterval = setInterval(async () => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    tickSound.pause(); tickSound.currentTime = 0;
                    setBgMusicActive(false);
                    timerEl.innerText = "0";
                    if (data.round === 4 && data.nominated) {
                        await updateDoc(doc(db, "quizGame", "state"), { status: "nominated_timeout", answerTick: Date.now() });
                    } else {
                        await updateDoc(doc(db, "quizGame", "state"), { status: "timeout", answerTick: Date.now() });
                    }
                } else {
                    timerEl.innerText = timeLeft;
                    if (timeLeft <= 3) {
                        timerEl.classList.add('timer-alert');
                        setBgMusicActive(false);
                        tickSound.play().catch(()=>{});
                    }
                }
            }, 1000);
        }

    } else if (data.status === "verifying" || data.status.startsWith("results_pending_")) {
        isSuspense = true;
        clearInterval(timerInterval); timerEl.style.display = 'none';
        tickSound.pause(); tickSound.currentTime = 0;
        
        setBgMusicActive(false);
        suspenseSound.play().catch(()=>{}); 
        
        qEl.innerText = data.question;
        
        if (data.round === 3 && data.givenAnswer) {
            typedAnsEl.style.display = "block";
            typedAnsEl.innerHTML = `${data.fastest.toUpperCase()} WPISAŁ/A: <span>"${data.givenAnswer.toUpperCase()}"</span>`;
        } else if ((data.round === 1 || data.round === 4) && data.selectedIndex !== undefined && data.options) {
            typedAnsEl.style.display = "block";
            typedAnsEl.innerHTML = `${data.fastest.toUpperCase()} ZAZNACZA: <span>${letters[data.selectedIndex]}: ${data.options[data.selectedIndex]}</span>`;
        }

        winnerEl.style.display = "block"; winnerEl.style.color = "#d4af37";
        winnerEl.style.animation = "pulse 0.5s infinite";
        winnerEl.innerText = `WERYFIKACJA ODPOWIEDZI: ${data.fastest.toUpperCase()}...`;
        
    } else if (data.status === "results" || data.status === "results_wrong" || data.status === "timeout") {
        clearInterval(timerInterval); timerEl.style.display = 'none';
        tickSound.pause(); tickSound.currentTime = 0; suspenseSound.pause(); suspenseSound.currentTime = 0;
        winnerEl.style.animation = "none";
        isSuspense = false;
        
        setBgMusicActive(false);
        
        for(let id in pendingScores) { let el = document.getElementById(`pts-${id}`); if(el) el.innerText = pendingScores[id]; }
        
        qEl.innerText = data.question;
        winnerEl.style.display = "block";

        if (data.status === "timeout") {
            stage.classList.add("error-glow");
            winnerEl.style.color = "var(--error)";
            if (data.loser) {
                winnerEl.innerText = `${data.loser.toUpperCase()} - BRAK ODPOWIEDZI / BŁĄD! (${data.pointsChange} PKT)`;
            } else {
                winnerEl.innerText = "CZAS MINĄŁ! NIKT NIE ZDOBYŁ PUNKTÓW.";
            }
            
            correctBanner.style.display = "block";
            if ((data.round === 1 || data.round === 4) && data.options) {
                correctVal.innerText = `${letters[data.correctIndex]}: ${data.options[data.correctIndex]}`;
            } else if (data.round === 3 && data.correctText) {
                correctVal.innerText = data.correctText;
            }
            if (lastPlayedResult !== "timeout_" + data.answerTick) { loseSound.play().catch(()=>{}); lastPlayedResult = "timeout_" + data.answerTick; }

        } else if (data.winner) {
            stage.classList.add("success-glow");
            statusEl.style.display = "block";
            winnerEl.style.color = "#00ff00"; 
            winnerEl.innerText = `${data.winner.toUpperCase()} ODPOWIADA POPRAWNIE!`;
            statusEl.style.color = "#00ff00"; 
            statusEl.innerText = `+${data.pointsChange} PKT`;
            
            correctBanner.style.display = "block";
            if ((data.round === 1 || data.round === 4) && data.options) {
                correctVal.innerText = `${letters[data.correctIndex]}: ${data.options[data.correctIndex]}`;
            } else if (data.round === 3) {
                correctVal.innerText = `${data.givenAnswer.toUpperCase()} (${data.correctText || ""})`;
            }

            if (lastPlayedResult !== "win_" + data.answerTick) { winSound.play().catch(()=>{}); lastPlayedResult = "win_" + data.answerTick; }

        } else if (data.loser) {
            stage.classList.add("error-glow");
            statusEl.style.display = "block";
            
            if (data.timeoutPenalty) {
                typedAnsEl.style.display = "block";
                typedAnsEl.innerHTML = `${data.loser.toUpperCase()} <span>NIE UDZIELIŁ/A ODPOWIEDZI W CZASIE!</span>`;
            } else if (data.round === 3 && data.givenAnswer) {
                typedAnsEl.style.display = "block";
                typedAnsEl.innerHTML = `${data.loser.toUpperCase()} WPISAŁ/A: <span>"${data.givenAnswer.toUpperCase()}"</span>`;
            } else if ((data.round === 1 || data.round === 4) && data.selectedIndex !== undefined && data.options) {
                typedAnsEl.style.display = "block";
                typedAnsEl.innerHTML = `${data.loser.toUpperCase()} ZAZNACZYŁ/A: <span>${letters[data.selectedIndex]}: ${data.options[data.selectedIndex]}</span>`;
            }

            winnerEl.style.color = "#ff4757"; 
            winnerEl.innerText = data.timeoutPenalty ? `${data.loser.toUpperCase()} - CZAS MINĄŁ!` : `${data.loser.toUpperCase()} - BŁĘDNA ODPOWIEDŹ!`;
            statusEl.style.color = "#ff4757"; 
            statusEl.innerText = `${data.pointsChange} PKT (ZA CHWILĘ KTO PIERWSZY, TEN LEPSZY!)`;
            
            if (lastPlayedResult !== "lose_" + data.answerTick) { loseSound.play().catch(()=>{}); lastPlayedResult = "lose_" + data.answerTick; }
        }
    }
});
