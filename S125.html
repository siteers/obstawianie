<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Bet | Uwagi S125</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root {
            --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
            --glass: rgba(15, 23, 42, 0.9); --border: rgba(255, 255, 255, 0.1);
            --error: #ff4757; --success: #2ecc71;
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; box-sizing: border-box;
        }
        #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        .wrapper { width: 100%; max-width: 600px; position: relative; z-index: 10; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--cyan); margin: 0; font-size: 20px;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }
        .btn-back {
            background: rgba(255,255,255,0.1); border: 1px solid var(--border);
            color: #fff; padding: 8px 15px; border-radius: 20px;
            text-decoration: none; font-size: 12px; font-weight: bold; transition: 0.2s;
        }
        .btn-back:hover { border-color: var(--cyan); color: var(--cyan); }

        /* CRINGOWY ŚWIECĄCY LINK DO PLIKU */
        @keyframes cringeGlow {
            0%   { background-position: 0% 50%;   box-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff; transform: scale(1); }
            25%  { background-position: 50% 50%;  box-shadow: 0 0 25px #00ffff, 0 0 45px #00ffff; transform: scale(1.02); }
            50%  { background-position: 100% 50%; box-shadow: 0 0 15px #ffff00, 0 0 35px #ffff00; transform: scale(1); }
            75%  { background-position: 50% 50%;  box-shadow: 0 0 25px #00ff00, 0 0 45px #00ff00; transform: scale(1.02); }
            100% { background-position: 0% 50%;   box-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff; transform: scale(1); }
        }
        .cringe-doc-link {
            display: block; text-decoration: none; text-align: center;
            padding: 16px 20px; margin-bottom: 25px; border-radius: 18px;
            background: linear-gradient(90deg, #ff00cc, #00ffcc, #ffff00, #00ff00, #ff00cc);
            background-size: 300% 300%;
            color: #000; font-weight: 900; font-size: 14px;
            border: 3px solid #fff; cursor: pointer;
            text-shadow: 0 0 6px rgba(255,255,255,0.9);
            animation: cringeGlow 2s linear infinite;
            word-break: break-all;
        }
        .cringe-doc-sub {
            display: block; font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 4px;
            color: #111;
        }

        .card {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 20px; padding: 25px; backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); margin-bottom: 25px;
        }

        /* ANKIETA */
        .poll-card {
            border-color: rgba(212, 175, 55, 0.4);
        }
        .poll-badge {
            font-size: 10px; color: var(--gold); text-transform: uppercase;
            letter-spacing: 1.5px; font-weight: 900; margin-bottom: 10px;
        }
        .poll-question {
            font-size: 15px; font-weight: bold; color: #fff;
            line-height: 1.45; margin: 0 0 18px 0;
        }
        .poll-btns {
            display: flex; gap: 12px;
        }
        .poll-btn {
            flex: 1; padding: 14px; border-radius: 12px; font-weight: 900;
            font-size: 14px; text-transform: uppercase; cursor: pointer;
            transition: 0.2s; background: rgba(255,255,255,0.05); color: #fff;
        }
        .poll-btn-yes { border: 1px solid var(--success); }
        .poll-btn-yes:hover { background: var(--success); color: #000; }
        .poll-btn-no { border: 1px solid var(--error); }
        .poll-btn-no:hover { background: var(--error); color: #fff; }

        .poll-results { display: none; }
        .poll-bar-wrap {
            background: rgba(255,255,255,0.08); border-radius: 8px;
            height: 28px; position: relative; overflow: hidden; margin-bottom: 10px;
        }
        .poll-bar { height: 100%; transition: width 0.5s ease-out; width: 0%; }
        .poll-bar.yes { background: linear-gradient(90deg, #10b981, #059669); }
        .poll-bar.no { background: linear-gradient(90deg, #ef4444, #b91c1c); }
        .poll-bar-label {
            position: absolute; inset: 0; display: flex; align-items: center;
            padding: 0 12px; font-size: 12px; font-weight: bold;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        .poll-voted-info {
            font-size: 11px; color: #888; margin-top: 8px; text-align: right;
        }

        .user-badge {
            font-size: 11px; color: #888; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 15px;
        }
        .user-badge span { color: var(--gold); font-weight: bold; }

        label {
            display: block; font-size: 11px; color: var(--cyan);
            text-transform: uppercase; letter-spacing: 1px;
            font-weight: bold; margin-bottom: 8px;
        }
        textarea {
            width: 100%; min-height: 120px; padding: 15px;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 12px; color: #fff; font-family: inherit;
            font-size: 14px; resize: vertical; box-sizing: border-box;
            outline: none; transition: 0.2s;
        }
        textarea:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        /* ZAŁĄCZNIK ZDJĘCIA */
        .file-row {
            margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .file-label {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 16px; background: rgba(255,255,255,0.06);
            border: 1px dashed var(--cyan); border-radius: 10px;
            color: var(--cyan); font-size: 12px; font-weight: bold;
            cursor: pointer; transition: 0.2s; margin: 0; text-transform: uppercase;
        }
        .file-label:hover { background: rgba(0, 212, 255, 0.15); }
        #photoInput { display: none; }

        .preview-box {
            display: none; position: relative; margin-top: 12px;
            width: fit-content; border-radius: 10px; overflow: hidden;
            border: 1px solid var(--border);
        }
        .preview-box img {
            display: block; max-height: 140px; max-width: 100%; object-fit: cover;
        }
        .preview-remove {
            position: absolute; top: 5px; right: 5px;
            background: rgba(0,0,0,0.8); color: var(--error);
            border: 1px solid var(--error); border-radius: 50%;
            width: 24px; height: 24px; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
        }

        .btn-send {
            width: 100%; padding: 16px; margin-top: 15px;
            background: linear-gradient(90deg, var(--cyan), #2e86de);
            color: #fff; border: none; border-radius: 14px;
            font-size: 15px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }
        .btn-send:hover { transform: translateY(-2px); }
        .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        #status-msg {
            margin-top: 12px; text-align: center; font-size: 12px;
            font-weight: bold; min-height: 16px;
        }

        .list-title {
            font-size: 12px; color: var(--gold); text-transform: uppercase;
            letter-spacing: 2px; margin: 0 0 15px 5px; font-weight: 900;
        }
        .note-item {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 15px; padding: 15px 18px; margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }
        .note-meta {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-size: 11px; color: #888;
        }
        .note-author { color: var(--cyan); font-weight: bold; font-size: 13px; }
        .note-text {
            font-size: 14px; color: #e2e8f0; line-height: 1.5;
            white-space: pre-wrap; word-break: break-word; margin: 0;
        }
        .note-img {
            margin-top: 12px; max-width: 100%; max-height: 260px;
            border-radius: 10px; border: 1px solid var(--border);
            cursor: zoom-in; display: block; object-fit: cover;
        }
        .btn-del {
            background: none; border: none; color: var(--error);
            cursor: pointer; font-size: 13px; padding: 2px 6px; opacity: 0.7;
        }
        .btn-del:hover { opacity: 1; }

        /* LIGHTBOX DO POWIĘKSZANIA ZDJĘĆ */
        #lightbox {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 9999; display: none; align-items: center; justify-content: center;
            padding: 20px; cursor: zoom-out; backdrop-filter: blur(5px);
        }
        #lightbox img {
            max-width: 95%; max-height: 92vh; border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.25);
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="wrapper">
        <header>
            <h1>⚠️ Uwagi — S125</h1>
            <a href="sg.html" class="btn-back">← Wróć</a>
        </header>

        <!-- CRINGOWY LINK DO DOKUMENTU -->
        <a href="file:///Z:/Wspolny/Krzysiek/s125.docx" class="cringe-doc-link" onclick="copyDocPath()">
            🔥📄 Z:\Wspolny\Krzysiek\s125.docx 📄🔥
            <span id="cringeDocSub" class="cringe-doc-sub">✨ KLIKNIJ, ABY OTWORZYĆ / SKOPIOWAĆ ŚCIEŻKĘ ✨</span>
        </a>

        <!-- ANKIETA -->
        <div class="card poll-card">
            <div class="poll-badge">📊 Ankieta S125</div>
            <p class="poll-question">Wpuszczenie pieszego w ostatniej sekundzie fazy B/między zielonym do Fazy A?</p>

            <div id="pollVoteArea" class="poll-btns">
                <button class="poll-btn poll-btn-yes" onclick="voteS125('Tak')">TAK</button>
                <button class="poll-btn poll-btn-no" onclick="voteS125('Nie')">NIE</button>
            </div>

            <div id="pollResultsArea" class="poll-results">
                <div class="poll-bar-wrap">
                    <div id="barYes" class="poll-bar yes"></div>
                    <div id="textYes" class="poll-bar-label">TAK: 0% (0)</div>
                </div>
                <div class="poll-bar-wrap">
                    <div id="barNo" class="poll-bar no"></div>
                    <div id="textNo" class="poll-bar-label">NIE: 0% (0)</div>
                </div>
                <div id="pollVotedInfo" class="poll-voted-info"></div>
            </div>
        </div>

        <!-- FORMULARZ UWAG -->
        <div class="card">
            <div class="user-badge">Zalogowany jako: <span id="userDisplay">---</span></div>
            <label for="noteInput">Opis uwagi</label>
            <textarea id="noteInput" placeholder="Wpisz treść uwagi dotyczącej S125..."></textarea>

            <div class="file-row">
                <label for="photoInput" class="file-label">📷 Dodaj zdjęcie (opcjonalnie)</label>
                <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(this)">
            </div>
            <div id="previewBox" class="preview-box">
                <img id="previewImg" src="" alt="Podgląd">
                <button type="button" class="preview-remove" onclick="clearPhoto()" title="Usuń zdjęcie">✕</button>
            </div>

            <button id="sendBtn" class="btn-send" onclick="sendNote()">Wyślij</button>
            <div id="status-msg"></div>
        </div>

        <div class="list-title">Zgłoszone uwagi</div>
        <div id="notesList">
            <p style="text-align:center; color:#666; font-size:13px;">Ładowanie...</p>
        </div>
    </div>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightboxImg" src="" alt="Powiększenie">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // --- OCHRONIARZ (przejście przez sg.html) ---
        const currentUser = localStorage.getItem('cyberUser');
        if (!currentUser) {
            window.location.href = 'sg.html';
        }
        document.getElementById('userDisplay').innerText = currentUser;
        const canDeleteAll = (currentUser === 'Admin' || currentUser.toLowerCase() === 'krzysiek');

        const firebaseConfig = {
            apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI",
            authDomain: "obstaiwanie.firebaseapp.com",
            projectId: "obstaiwanie"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- KOPIOWANIE ŚCIEŻKI DO PLIKU ---
        window.copyDocPath = () => {
            const path = "Z:\\Wspolny\\Krzysiek\\s125.docx";
            if (navigator.clipboard) {
                navigator.clipboard.writeText(path).then(() => {
                    const sub = document.getElementById('cringeDocSub');
                    sub.innerText = "✅ SKOPIOWANO DO SCHOWKA! WKLEJ W EKSPLORATORZE ✅";
                    setTimeout(() => {
                        sub.innerText = "✨ KLIKNIJ, ABY OTWORZYĆ / SKOPIOWAĆ ŚCIEŻKĘ ✨";
                    }, 3000);
                }).catch(() => {});
            }
        };

        // --- LOGIKA ANKIETY S125 ---
        const pollRef = doc(db, "appState", "s125_poll");

        window.voteS125 = async (choice) => {
            await setDoc(pollRef, { votes: { [currentUser]: choice } }, { merge: true });
        };

        onSnapshot(pollRef, (snap) => {
            const data = snap.exists() ? snap.data() : { votes: {} };
            const votes = data.votes || {};
            const myVote = votes[currentUser];

            const voteArea = document.getElementById('pollVoteArea');
            const resultsArea = document.getElementById('pollResultsArea');

            if (myVote) {
                voteArea.style.display = 'none';
                resultsArea.style.display = 'block';

                let yes = 0, no = 0;
                Object.values(votes).forEach(v => {
                    if (v === 'Tak') yes++;
                    if (v === 'Nie') no++;
                });
                const total = yes + no;
                const yesPct = total === 0 ? 0 : Math.round((yes / total) * 100);
                const noPct = total === 0 ? 0 : Math.round((no / total) * 100);

                document.getElementById('barYes').style.width = yesPct + '%';
                document.getElementById('textYes').innerText = `TAK: ${yesPct}% (${yes})`;
                document.getElementById('barNo').style.width = noPct + '%';
                document.getElementById('textNo').innerText = `NIE: ${noPct}% (${no})`;
                document.getElementById('pollVotedInfo').innerText = `Twój głos: ${myVote.toUpperCase()} • Łącznie głosów: ${total}`;
            } else {
                voteArea.style.display = 'flex';
                resultsArea.style.display = 'none';
            }
        });

        // --- ZAŁĄCZN
