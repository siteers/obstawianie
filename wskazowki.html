<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Agent | Zadania</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  <style>
    :root { --gold: #d4af37; --cyan: #00d4ff; --bg: #020408; --glass: rgba(15, 23, 42, 0.85); --error: #ff0000; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
    
    .container { z-index: 10; background: var(--glass); backdrop-filter: blur(25px); padding: 30px; border-radius: 30px; width: 95vw; max-width: 400px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); text-align: center; position: relative; max-height: 95vh; overflow-y: auto; }
    h2 { margin: 0 0 10px 0; font-size: 16px; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
    .agent-name { font-size: 22px; color: var(--cyan); font-weight: 900; margin-bottom: 25px; text-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
    
    .task-box { background: rgba(0,0,0,0.5); border: 1px solid var(--cyan); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
    .task-number { font-size: 10px; color: #888; letter-spacing: 2px; margin-bottom: 10px; font-weight: bold; }
    .task-text { font-size: 18px; font-weight: bold; letter-spacing: 1px; min-height: 50px; display: flex; align-items: center; justify-content: center; line-height: 1.4; }
    
    input { width: 100%; padding: 15px; font-size: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.8); color: #fff; text-align: center; box-sizing: border-box; margin-bottom: 15px; outline: none; transition: 0.3s; }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }
    
    .btn-cyber { width: 100%; padding: 16px; background: var(--cyan); color: #000; border: none; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; transition: 0.2s; }
    .btn-cyber:active { transform: scale(0.95); }
    .btn-board { background: transparent; border: 2px solid var(--gold); color: var(--gold); }
    .btn-logout { background: transparent; border: 1px solid var(--error); color: var(--error); font-size: 10px; padding: 10px; margin-top: 25px; letter-spacing: 1px; }
    
    #msg { font-size: 12px; font-weight: bold; min-height: 15px; text-transform: uppercase; margin-bottom: 10px; }
    
    /* MODALE (Tablica i Gratulacje) */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
    .board-container { padding: 20px; text-align: center; width: 100%; max-width: 600px; }
    .phrase { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 40px; }
    .word { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
    
    .letter-box { width: 35px; height: 45px; background: #111; border: 2px solid #333; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; color: #fff; text-transform: uppercase; }
    .letter-box.revealed { background: var(--gold); color: #000; border-color: #fff; box-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }
    .close-btn { padding: 15px 40px; background: #222; color: #fff; border: 1px solid #444; border-radius: 15px; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
    
    .finished-text { font-size: 18px; color: #00ff00; font-weight: bold; margin-top: 20px; display: none; }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="container">
    <h2>Zalogowano jako:</h2>
    <div class="agent-name" id="agentDisplay">---</div>
    
    <div class="task-box" id="taskContainer">
      <div class="task-number" id="taskLabel">ZADANIE 1 / 5</div>
      <div class="task-text" id="taskQuestion">...</div>
    </div>
    
    <div class="finished-text" id="finishedMsg">ROZWIĄZAŁEŚ WSZYSTKIE SWOJE ZADANIA! POMÓŻ INNYM CZYTAĆ HASŁO.</div>
    
    <input type="text" id="answerInput" placeholder="Wpisz odpowiedź">
    <p id="msg"></p>
    
    <button class="btn-cyber" id="submitBtn" onclick="checkAnswer()">Zatwierdź Odpowiedź</button>
    <button class="btn-cyber btn-board" onclick="openBoard()">Pokaż Tablicę Hasła</button>
    <button class="btn-cyber btn-logout" onclick="logout()">WYLOGUJ Z TERMINALA</button>
  </div>

  <!-- Modal Tablicy Hasła -->
  <div class="modal" id="boardModal">
    <div class="board-container">
      <h2 style="margin-bottom: 30px; color: var(--cyan); font-size: 24px;">WSPÓLNE HASŁO</h2>
      <div class="phrase" id="boardWords"></div>
      <button class="close-btn" onclick="closeBoard()">ZAMKNIJ TABLICĘ</button>
    </div>
  </div>

  <!-- Modal Gratulacji -->
  <div class="modal" id="successModal" style="z-index: 200;">
    <div class="board-container" style="background: var(--glass); border: 2px solid #00ff00; border-radius: 30px; box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);">
      <h2 style="color: #00ff00; font-size: 24px; margin-top: 20px;">GRATULACJE!</h2>
      <p style="font-size: 14px; margin-bottom: 25px; color: #ccc; letter-spacing: 1px;">ZNALAZŁEŚ LITERĘ W HAŚLE:</p>
      <div class="letter-box revealed" id="foundLetterDisplay" style="margin: 0 auto 35px auto; width: 70px; height: 80px; font-size: 45px;">X</div>
      <button class="btn-cyber" style="background: #00ff00; color: #000; box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);" onclick="nextTask()">PRZEJDŹ DALEJ ➔</button>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, updateDoc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);

const activeAgent = localStorage.getItem('activeAgent');
if (!activeAgent) window.location.href = 'index.html';
document.getElementById('agentDisplay').innerText = activeAgent;

const tasksData = {
    "Lila": [ 
        { q: "(50 + 50) : 2 =", a: ["50"] }, 
        { q: "Jak jest 'ptak' po angielsku?", a: ["bird"] }, 
        { q: "Jakie miasto jest stolicą Hiszpanii?", a: ["madryt", "madrid"] }, 
        { q: "Która planeta znajduje się najbliżej słońca?", a: ["merkury"] }, 
        { q: "Jak jest 'okno' po angielsku?", a: ["window"] } 
    ],
    "Kaja": [ 
        { q: "8 x 7 =", a: ["56"] }, 
        { q: "Jak jest 'pies' po angielsku?", a: ["dog"] }, 
        { q: "W jakim państwie leży miasto Paryż?", a: ["francja", "we francji"] }, 
        { q: "Ile sztuk to jest jeden tuzin?", a: ["12", "dwanascie"] }, 
        { q: "100 - 45 =", a: ["55"] } 
    ],
    "Darek": [ 
        { q: "9 x 6 =", a: ["54"] }, 
        { q: "Jak jest 'jabłko' po angielsku?", a: ["apple"] }, 
        { q: "Jakie państwo graniczy z Polską od zachodu?", a: ["niemcy"] }, 
        { q: "Który miesiąc w roku ma najmniej dni?", a: ["luty"] }, 
        { q: "Z połączenia koloru żółtego i niebieskiego powstaje...", a: ["zielony"] } 
    ],
    "Jaś": [ 
        { q: "15 + 15 =", a: ["30"] }, 
        { q: "Jak jest 'czerwony' po angielsku?", a: ["red"] }, 
        { q: "Ile kół ma samochód osobowy?", a: ["4", "cztery"] }, 
        { q: "20 - 5 =", a: ["15"] }, 
        { q: "Zwierzę, które daje mleko to...", a: ["krowa"] } 
    ]
};

let currentTaskIndex = 0;
let globalSolved = 0;
let isProcessing = false;

// NOWE HASŁO (20 znaków)
const phraseWords = ["SZUKAJCIE", "DALEJ", "W", "BUCIE"];
const fullPhrase = phraseWords.join(""); // SZUKAJCIEDALEJWBUCIE

// Odsłaniamy 15 pierwszych liter losowo (indeksy 0-14), potem 5 ostatnich "BUCIE" (indeksy 15-19)
const unlockOrder = [4, 1, 8, 12, 0, 7, 2, 10, 5, 14, 3, 9, 13, 6, 11, 15, 16, 17, 18, 19];

onSnapshot(doc(db, "gracze", activeAgent), (docSnap) => {
    if (docSnap.exists()) {
        currentTaskIndex = docSnap.data().task || 0;
        updateUI();
    }
});

onSnapshot(doc(db, "appState2", "global"), (docSnap) => {
    if (docSnap.exists()) {
        globalSolved = docSnap.data().totalSolved || 0;
        renderBoard();
    }
});

function updateUI() {
    const container = document.getElementById('taskContainer');
    const input = document.getElementById('answerInput');
    const btn = document.getElementById('submitBtn');
    const finishedMsg = document.getElementById('finishedMsg');
    
    document.getElementById('msg').innerText = "";
    input.value = "";
    
    if (currentTaskIndex >= 5) {
        container.style.display = "none";
        input.style.display = "none";
        btn.style.display = "none";
        finishedMsg.style.display = "block";
    } else {
        document.getElementById('taskLabel').innerText = `ZADANIE ${currentTaskIndex + 1} / 5`;
        document.getElementById('taskQuestion').innerText = tasksData[activeAgent][currentTaskIndex].q;
    }
}

function normalizeString(str) {
    return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ł/g, "l").trim();
}

window.checkAnswer = async function() {
    if (isProcessing) return;
    const input = document.getElementById('answerInput');
    const msg = document.getElementById('msg');
    
    const userAnswer = normalizeString(input.value);
    if (userAnswer === "") return;
    
    const correctAnswers = tasksData[activeAgent][currentTaskIndex].a;
    let isCorrect = false;
    
    for (let ca of correctAnswers) {
        if (userAnswer === normalizeString(ca)) {
            isCorrect = true;
            break;
        }
    }
    
    if (isCorrect) {
        isProcessing = true;
        msg.innerText = "";
        
        // Pokazujemy Modal Gratulacji przed wczytaniem kolejnego zadania
        const unlockedLetter = fullPhrase[unlockOrder[globalSolved]];
        document.getElementById('foundLetterDisplay').innerText = unlockedLetter;
        document.getElementById('successModal').style.display = "flex";
        
        // Zapis w tle (UI zaktualizuje się automatycznie pod spodem dzięki onSnapshot)
        await updateDoc(doc(db, "gracze", activeAgent), { task: increment(1) });
        await updateDoc(doc(db, "appState2", "global"), { totalSolved: increment(1) });
    } else {
        msg.style.color = "var(--error)";
        msg.innerText = "BŁĘDNA ODPOWIEDŹ! SPRÓBUJ PONOWNIE.";
        input.value = "";
    }
}

window.nextTask = function() {
    document.getElementById('successModal').style.display = "none";
    isProcessing = false;
}

window.logout = function() {
    localStorage.removeItem('activeAgent');
    window.location.href = 'index.html';
}

window.openBoard = () => document.getElementById('boardModal').style.display = "flex";
window.closeBoard = () => document.getElementById('boardModal').style.display = "none";

function renderBoard() {
    const container = document.getElementById('boardWords');
    container.innerHTML = "";
    
    const unlockedIndices = unlockOrder.slice(0, globalSolved);
    let letterCounter = 0;
    
    phraseWords.forEach(word => {
        const wordDiv = document.createElement('div');
        wordDiv.className = "word";
        
        for (let i = 0; i < word.length; i++) {
            const char = word[i];
            const letterDiv = document.createElement('div');
            
            if (unlockedIndices.includes(letterCounter)) {
                letterDiv.className = "letter-box revealed";
                letterDiv.innerText = char;
            } else {
                letterDiv.className = "letter-box";
                letterDiv.innerText = "?";
            }
            wordDiv.appendChild(letterDiv);
            letterCounter++;
        }
        container.appendChild(wordDiv);
    });
}

const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let pts = []; for (let i = 0; i < 30; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pts.forEach((p) => {
        p.x += p.vx; p.y += p.vy; if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
        ctx.fillStyle = 'rgba(0, 212, 255, 0.3)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
    }); requestAnimationFrame(draw);
} draw();
</script>
</body>
</html>
