<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Quiz | Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; margin: 0; }
    .box { background: #222; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #444; }
    h3 { margin-top: 0; color: #00d4ff; }
    button { background: #00d4ff; border: none; padding: 15px 20px; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 16px; margin: 5px; text-transform: uppercase; }
    button.red { background: #ff4757; color: white; }
    button.green { background: #2ed573; color: black; }
    button.gold { background: #d4af37; color: black; }
    
    .verify-box, .nominate-box { background: #1e272e; border: 2px solid #d4af37; padding: 20px; border-radius: 15px; display: none; margin-bottom: 20px; }
    .ans-text { font-size: 24px; font-weight: 900; margin: 15px 0; background: #000; color: #00d4ff; padding: 15px; border-radius: 10px; text-align: center; }
    select { padding: 10px; font-size: 16px; margin-right: 10px; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="box">
    <h3>STEROWANIE GRĄ</h3>
    <button class="red" onclick="startGame()">RESETUJ I ZACZNIJ OD NOWA</button><br><br>
    
    <label>Runda:</label>
    <select id="roundSel">
        <option value="1">Runda 1 (ABCD - Kto pierwszy)</option>
        <option value="2">Runda 2 (Pisanie na czas)</option>
        <option value="3">Runda 3 (Ryzyko - Wybieranie gracza)</option>
    </select>
    <button class="gold" onclick="nextQuestion()">PUŚĆ NASTĘPNE PYTANIE</button>
  </div>

  <div class="nominate-box" id="nominateUI">
    <h3 style="color: #d4af37;">RUNDA 3: KTO WYBIERA?</h3>
    <p>Zanim wyświetlisz pytanie z kategorii <b id="n-cat"></b>, wybierz kto ma prawo wskazać gracza:</p>
    <select id="controllerSel">
        <option value="Lila">Lila</option>
        <option value="Kaja">Kaja</option>
        <option value="Darek">Darek</option>
        <option value="Jas">Jaś</option>
    </select>
    <button class="green" onclick="startNominationPhase()">ROZPOCZNIJ WYBIERANIE</button>
  </div>

  <div class="verify-box" id="verifyUI">
    <h3 style="color: #d4af37;">WERYFIKACJA ODPOWIEDZI! (Runda 2)</h3>
    <p>Gracz <b style="color:#00ff00"><span id="v-player"></span></b> wpisał:</p>
    <div class="ans-text" id="v-ans">...</div>
    <p>Prawidłowa powinna być: <b style="color:#d4af37"><span id="v-correct"></span></b></p>
    
    <button class="green" onclick="judgeAnswer(true)">✅ ZALICZ (+10)</button>
    <button class="red" onclick="judgeAnswer(false)">❌ ODRZUĆ I ODBLOKUJ INNYCH</button>
  </div>
  
  <div class="verify-box" id="verifyR3UI">
    <h3 style="color: #d4af37;">WERYFIKACJA RUNDY 3</h3>
    <p>Odpowiadał: <b style="color:#00ff00"><span id="v3-player"></span></b></p>
    <button class="green" onclick="judgeR3(true)">✅ DOBRZE (+20)</button>
    <button class="red" onclick="judgeR3(false)">❌ ŹLE (-20)</button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const db = getFirestore(initializeApp(firebaseConfig));

const questionsDB = {
    1: [
        { q: "Która planeta jest największa w Układzie Słonecznym?", o: ["Ziemia", "Mars", "Jowisz", "Saturn"], c: 2 },
        { q: "Ile nóg ma pająk?", o: ["Sześć", "Osiem", "Dziesięć", "Dwanaście"], c: 1 },
        { q: "Co jest stolicą Francji?", o: ["Madryt", "Londyn", "Paryż", "Berlin"], c: 2 },
        { q: "Jak nazywa się żółty pokemon Asha?", o: ["Charmander", "Squirtle", "Pikachu", "Bulbasaur"], c: 2 },
        { q: "Ile to jest 7 x 8?", o: ["54", "56", "62", "48"], c: 1 }
    ],
    2: [
        { q: "Z jakiego owocu robi się rodzynki?", c: "Z winogron" },
        { q: "Które zwierzę ma najdłuższą szyję?", c: "Żyrafa" },
        { q: "Jak nazywa się kontynent, na którym znajduje się Polska?", c: "Europa" },
        { q: "W jakim sporcie używa się rakietki i lotki?", c: "Badminton" },
        { q: "Ile dni ma luty w roku przestępnym?", c: "29" }
    ],
    3: [
        { cat: "BAJKI", q: "Czego używa Harry Potter do latania?", o: ["Dywanu", "Miotły", "Rakiety", "Smoka"], c: 1 },
        { cat: "KOLORY", q: "Jaki kolor powstanie ze zmieszania żółtego i niebieskiego?", o: ["Fioletowy", "Pomarańczowy", "Czarny", "Zielony"], c: 3 },
        { cat: "MATEMATYKA", q: "Ile to jest (20 + 30) - 10?", o: ["40", "30", "50", "60"], c: 0 },
        { cat: "LITERATURA", q: "Kto napisał wiersz 'Lokomotywa'?", o: ["Jan Brzechwa", "Julian Tuwim", "Adam Mickiewicz", "Henryk Sienkiewicz"], c: 1 },
        { cat: "PRZYRODA", q: "Co jedzą pandy wielkie?", o: ["Mięso", "Eukaliptus", "Bambus", "Banany"], c: 2 }
    ]
};

let currentQIndex = { 1: -1, 2: -1, 3: -1 };
let currentState = null;

onSnapshot(doc(db, "quizGame", "state"), (docSnap) => {
    if (!docSnap.exists()) return;
    currentState = docSnap.data();
    
    document.getElementById('nominateUI').style.display = 'none';
    document.getElementById('verifyUI').style.display = 'none';
    document.getElementById('verifyR3UI').style.display = 'none';

    if (currentState.status === "setup_nomination" && currentState.round === 3) {
        document.getElementById('nominateUI').style.display = 'block';
        document.getElementById('n-cat').innerText = currentState.category;
    } else if (currentState.status === "verifying") {
        document.getElementById('verifyUI').style.display = 'block';
        document.getElementById('v-player').innerText = currentState.fastest.toUpperCase();
        document.getElementById('v-ans').innerText = currentState.givenAnswer;
        document.getElementById('v-correct').innerText = questionsDB[2][currentQIndex[2]].c;
    } else if (currentState.status === "results_r3_pending") {
        document.getElementById('verifyR3UI').style.display = 'block';
        document.getElementById('v3-player').innerText = currentState.nominated.toUpperCase();
    }
});

window.startGame = async () => {
    if(!confirm("Zresetować punkty wszystkich dzieci do zera?")) return;
    const players = ["Lila", "Kaja", "Darek", "Jas"];
    for(let p of players) { await setDoc(doc(db, "quizScores", p), { points: 0 }); }
    await setDoc(doc(db, "quizGame", "state"), { status: "idle", round: 1, question: "Czekamy na start!", blocked: [] });
    currentQIndex = { 1: -1, 2: -1, 3: -1 };
    alert("Punkty wyzerowane!");
};

window.nextQuestion = async () => {
    let r = parseInt(document.getElementById('roundSel').value);
    currentQIndex[r]++;
    let qData = questionsDB[r][currentQIndex[r]];
    if (!qData) return alert("Koniec pytań w tej rundzie!");

    if (r === 3) {
        await setDoc(doc(db, "quizGame", "state"), { status: "setup_nomination", round: 3, category: qData.cat, question: qData.q, options: qData.o, correctIndex: qData.c, blocked: [] });
    } else {
        let payload = { status: "reading", round: r, question: qData.q, blocked: [], fastest: "", winner: "", loser: "", givenAnswer: "" };
        if (r === 1) { payload.options = qData.o; payload.correctIndex = qData.c; }
        await setDoc(doc(db, "quizGame", "state"), payload);
    }
};

window.startNominationPhase = async () => {
    let controller = document.getElementById('controllerSel').value;
    await updateDoc(doc(db, "quizGame", "state"), { status: "nominating", controller: controller });
};

window.judgeAnswer = async (isCorrect) => {
    let player = currentState.fastest;
    if (isCorrect) {
        const scoreRef = doc(db, "quizScores", player);
        const scoreSnap = await getDoc(scoreRef);
        await updateDoc(scoreRef, { points: scoreSnap.data().points + 10 });
        await updateDoc(doc(db, "quizGame", "state"), { status: "results", winner: player, loser: "", pointsChange: 10 });
    } else {
        // Blokujemy gracza i wracamy do trybu czytania dla reszty
        let newBlocked = [...(currentState.blocked || []), player];
        await updateDoc(doc(db, "quizGame", "state"), { status: "reading", blocked: newBlocked, fastest: "", givenAnswer: "" });
    }
};

window.judgeR3 = async (isCorrect) => {
    let player = currentState.nominated;
    let ptsChange = isCorrect ? 20 : -20;
    
    const scoreRef = doc(db, "quizScores", player);
    const scoreSnap = await getDoc(scoreRef);
    await updateDoc(scoreRef, { points: scoreSnap.data().points + ptsChange });
    
    await updateDoc(doc(db, "quizGame", "state"), { status: "results", winner: isCorrect ? player : "", loser: isCorrect ? "" : player, pointsChange: ptsChange });
};
</script>
</body>
</html>
