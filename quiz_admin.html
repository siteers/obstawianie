        2: parseWheel(`GEOGRAFIA|WIELKI MUR CHIŃSKI\nKOSMOS|UKŁAD SŁONECZNY\nHISTORIA|BITWA POD GRUNWALDEM\nZABYTKI|WIEŻA EIFFLA\nNAUKA|SZTUCZNA INTELIGENCJA`),
        3: rawR3_P2,
        4: [...rawR4_C, ...rawR4_A],
        5: [...rawR4_C, ...rawR4_D]
    },
    3: {
        1: rawR1_P3,
        2: parseWheel(`FILM|GWIEZDNE WOJNY\nLITERATURA|AKADEMIA PANA KLEKSA\nGEOGRAFIA|MORZE BAŁTYCKIE\nSPORT|PIŁKA NOŻNA\nBOHATER|HARRY POTTER`),
        3: rawR3_P3,
        4: [...rawR4_B, ...rawR4_D],
        5: [...rawR4_D, ...rawR4_B]
    },
    4: {
        1: rawR1_P4,
        2: parseWheel(`ZWIERZĘTA|NIEDŹWIEDŹ POLARNY\nBAJKA|KRÓL LEW\nGEOGRAFIA|KOPALNIA SOLI\nSPORT|SKOKI NARCIARSKIE\nGRY|MINECRAFT`),
        3: rawR3_P4,
        4: [...rawR4_D, ...rawR4_A],
        5: [...rawR4_A, ...rawR4_D]
    },
    5: {
        1: rawR1_P5,
        2: parseWheel(`KOSMOS|DROGA MLECZNA\nBAJKA|TOY STORY\nPRZYRODA|CZTERY PORY ROKU\nMIASTO|ZAMEK NA WAWELU\nSPORT|IGRZYSKA OLIMPIJSKIE`),
        3: rawR3_P5,
        4: [...rawR4_D, ...rawR4_C],
        5: [...rawR4_B, ...rawR4_C]
    }
};

let currentPool = 1;
let currentQIndex = { 1: -1, 2: -1, 3: -1, 4: -1, 5: -1 };
let usedR5Indices = [];
let r5CarryOverPool = 0;
let currentState = null;
let r4Controller = "";

let suspenseTimer = null;
let autoFlowTimer = null;
let auctionMonitorInterval = null;
let lastHandledStatus = "";
let lastSpinHandled = 0;

statusEl.innerText = "✅ SYSTEM GOTOWY! Połączono z bazą. Wybierz pulę (1-5) lub kliknij START GRY.";

async function determineInitialController() {
    const snap = await getDocs(collection(db, "quizScores"));
    let maxPts = -999999;
    let leaders = [];
    snap.forEach(d => {
        let pts = d.data().points || 0;
        if (pts > maxPts) {
            maxPts = pts;
            leaders = [d.id];
        } else if (pts === maxPts) {
            leaders.push(d.id);
        }
    });
    if (leaders.length === 0) return { player: "Lila", tieMsg: "" };
    if (leaders.length === 1) {
        return { player: leaders[0], tieMsg: `NAJWIĘCEJ PUNKTÓW (${maxPts}) MA: ${leaders[0].toUpperCase()}!` };
    } else {
        let chosen = leaders[Math.floor(Math.random() * leaders.length)];
        return { player: chosen, tieMsg: `REMIS LIDERÓW (${maxPts} PKT)! WYLOSOWANO: ${chosen.toUpperCase()}!` };
    }
}

async function showGrandFinale() {
    try {
        clearTimeout(suspenseTimer); clearTimeout(autoFlowTimer); clearInterval(auctionMonitorInterval);
        await updateDoc(doc(db, "quizGame", "state"), {
            status: "podium", answerTick: Date.now()
        });
        statusEl.innerText = "🏆 WIELKI FINAŁ! Na ekranie TV wyświetlane jest podium i fajerwerki!";
    } catch (err) { showError(err.message); }
}

function pickR5QuestionByCategory(pool, catName) {
    const list = allDBs[pool][5] || allDBs[pool][4];
    let idx = list.findIndex((item, i) => item.cat === catName && !usedR5Indices.includes(i));
    if (idx === -1) {
        idx = list.findIndex((item, i) => !usedR5Indices.includes(i));
    }
    if (idx === -1) {
        usedR5Indices = [];
        idx = 0;
    }
    usedR5Indices.push(idx);
    return list[idx];
}

onSnapshot(doc(db, "quizGame", "state"), (docSnap) => {
    if (!docSnap.exists()) return;
    currentState = docSnap.data();
    
    document.getElementById('nominateUI').style.display = 'none';
    r3LiveBox.style.display = 'none';

    if ((currentState.status === "setup_nomination" || currentState.status === "nominating" || currentState.status === "r5_wait_spin") && (currentState.round === 4 || currentState.round === 5)) {
        document.getElementById('nominateUI').style.display = 'block';
        document.getElementById('n-curr').innerText = currentState.controller || r4Controller;
        statusEl.innerText = currentState.round === 5 
            ? `Status: Runda 5 - ${currentState.controller} kręci palcem kołem na swoim telefonie!`
            : `Status: Runda 4 - ${currentState.controller} wybiera na telefonie kto odpowiada!`;
    } 
    else if (currentState.status === "speaking") {
        statusEl.innerText = `🗣️ Lektor na TV czyta teraz pytanie... Po zakończeniu włączy się stoper!`;
    }
    else if (currentState.status === "reading" && currentState.round === 1) {
        let count = Object.keys(currentState.r1Answers || {}).length;
        statusEl.innerText = `Status: Runda 1 (Wyścig ABCD - 12s) - odpowiedziało już: ${count}/4 graczy.`;
    }
    else if (currentState.status === "wheel_reading" && currentState.round === 2) {
        let winnersCount = (currentState.wheelWinners || []).length;
        statusEl.innerText = `Status: Runda 2 (Koło Fortuny) w toku! Odgadło już: ${winnersCount}/4 graczy.`;
    }
    else if (currentState.status === "reading" && currentState.round === 3) {
        let winners = currentState.r3Winners || [];
        statusEl.innerText = `Status: Runda 3 (Szybkie Pisanie - 20s) - odgadło już: ${winners.length}/4 graczy (Prawidłowa: ${currentState.correctText}).`;
        r3LiveBox.style.display = 'block';
        r3LiveBox.innerHTML = `<b>Poprawna:</b> <span style="color:#d4af37">${currentState.correctText}</span> | <b>Trafili:</b> ${winners.join(", ") || "brak"}`;
    }

    // --- OBSŁUGA RUNDY 5: KRĘCENIE KOŁEM NA TELEFONIE -> 12 SEKUND LICYTACJI + 5 SEKUND DOGRYWKI ---
    if (currentState.round === 5 && currentState.status === "r5_spinning") {
        if (currentState.spinTick && currentState.spinTick !== lastSpinHandled) {
            lastSpinHandled = currentState.spinTick;
            statusEl.innerText = `🎡 Koło się kręci! Za 4.8s zatrzyma się na kategorii i ruszy 12-sekundowa licytacja...`;
            setTimeout(async () => {
                let initBids = { Lila: 5, Kaja: 5, Darek: 5, Jas: 5 };
                let totalPot = (currentState.carryOver || 0) + 20;
                // Dajemy 3.5s na przeczytanie kategorii przez lektora + 12 sekund spokojnej licytacji podstawowej!
                let now = Date.now();
                await updateDoc(doc(db, "quizGame", "state"), {
                    status: "r5_bidding",
                    r5Bids: initBids,
                    r5Pot: totalPot,
                    r5HighestBidder: currentState.controller,
                    r5HighestBid: 5,
                    r5MainSec: 12,
                    r5Countdown: 0,
                    auctionStartTime: now + 3500, // 3.5s dla lektora na przeczytanie "Kategoria X, rozpoczynamy licytację!"
                    bidTick: now,
                    speechTick: now
                });
            }, 4800);
        }
    }

    // Monitorowanie licytacji w Rundzie 5: 12 sekund spokojnej licytacji -> potem 5 sekund "CZY KTOŚ JESZCZE LICYTUJE?" (resetowane przy przebiciu)
    if (currentState.round === 5 && currentState.status === "r5_bidding") {
        if (!auctionMonitorInterval) {
            auctionMonitorInterval = setInterval(async () => {
                if (!currentState || currentState.round !== 5 || currentState.status !== "r5_bidding") {
                    clearInterval(auctionMonitorInterval);
                    auctionMonitorInterval = null;
                    return;
                }
                const now = Date.now();
                const startT = currentState.auctionStartTime || now;
                const mainEndT = startT + 12000; // 12 sekund podstawowego czasu licytacji!
                // Jeśli ktoś przebił pod koniec lub w dogrywce, dajemy 3s ciszy + 5s odliczania końcowego (razem 8s od ostatniego podbicia)
                const effectiveCloseT = Math.max(mainEndT + 5000, (currentState.bidTick || startT) + 8000);
                const remTotalMs = effectiveCloseT - now;

                if (now < mainEndT) {
                    // Trwa podstawowe 12 sekund spokojnej licytacji
                    let mainSec = Math.min(12, Math.max(1, Math.ceil((mainEndT - now) / 1000)));
                    if (currentState.r5MainSec !== mainSec || currentState.r5Countdown !== 0) {
                        await updateDoc(doc(db, "quizGame", "state"), { r5MainSec: mainSec, r5Countdown: 0 });
                    }
                } else if (remTotalMs > 5000) {
                    // Ktoś właśnie przebił w dogrywce -> 3 sekundy oddechu przed ponownym odliczaniem 5..1
                    if (currentState.r5MainSec !== 0 || currentState.r5Countdown !== 0) {
                        await updateDoc(doc(db, "quizGame", "state"), { r5MainSec: 0, r5Countdown: 0 });
                    }
                } else if (remTotalMs > 0) {
                    // Ostatnie 5 sekund: "CZY KTOŚ JESZCZE LICYTUJE? (5..4..3..2..1)"
                    let finalSec = Math.ceil(remTotalMs / 1000);
                    if (currentState.r5Countdown !== finalSec || currentState.r5MainSec !== 0) {
                        await updateDoc(doc(db, "quizGame", "state"), { r5MainSec: 0, r5Countdown: finalSec });
                    }
                } else {
                    // SPRZEDANE!
                    clearInterval(auctionMonitorInterval);
                    auctionMonitorInterval = null;
                    let bids = currentState.r5Bids || { Lila: 5, Kaja: 5, Darek: 5, Jas: 5 };
                    for (let p of ["Lila", "Kaja", "Darek", "Jas"]) {
                        let ref = doc(db, "quizScores", p);
                        let snap = await getDoc(ref);
                        let cur = snap.exists() ? snap.data().points : 0;
                        await setDoc(ref, { points: cur - (bids[p] || 5) }, { merge: true });
                    }
                    await updateDoc(doc(db, "quizGame", "state"), {
                        status: "r5_sold",
                        nominated: currentState.r5HighestBidder,
                        r5MainSec: 0,
                        r5Countdown: 0,
                        speechTick: Date.now()
                    });
                    // Wydłużona przerwa (6.5 sekundy!), aby lektor spokojnie powiedział "Sprzedane! Za X pkt odpowiada Lila" i zrobił pauzę przed pytaniem!
                    setTimeout(async () => {
                        await updateDoc(doc(db, "quizGame", "state"), {
                            status: "speaking",
                            speechTick: Date.now()
                        });
                    }, 6500);
                }
            }, 350);
        }
    } else {
        if (auctionMonitorInterval) {
            clearInterval(auctionMonitorInterval);
            auctionMonitorInterval = null;
        }
    }

    if (currentState.status === "nominated_timeout" && (currentState.round === 4 || currentState.round === 5)) {
        let nomTimeKey = "nom_timeout_" + currentState.answerTick;
        if (lastHandledStatus !== nomTimeKey) {
            lastHandledStatus = nomTimeKey;
            let player = currentState.nominated;

            if (currentState.round === 5) {
                r5CarryOverPool = currentState.r5Pot || 20;
                updateDoc(doc(db, "quizGame", "state"), {
                    status: "timeout", loser: player, winner: "", pointsChange: 0, carryOver: r5CarryOverPool, timeoutPenalty: true, answerTick: Date.now()
                });
            } else {
                let isSelf = (player === currentState.controller);
                let ptsChange = isSelf ? -20 : -10;
                (async () => {
                    try {
                        const scoreRef = doc(db, "quizScores", player);
                        const scoreSnap = await getDoc(scoreRef);
                        let currentPts = scoreSnap.exists() ? scoreSnap.data().points : 0;
                        await setDoc(scoreRef, { points: currentPts + ptsChange }, { merge: true });

                        let newBlocked = [...(currentState.blocked || []), player];
                        if (newBlocked.length >= 4) {
                            await updateDoc(doc(db, "quizGame", "state"), {
                                status: "timeout", loser: player, winner: "", pointsChange: ptsChange, blocked: newBlocked, timeoutPenalty: true, answerTick: Date.now()
                            });
                        } else {
                            await updateDoc(doc(db, "quizGame", "state"), {
                                status: "results_wrong", loser: player, winner: "", pointsChange: ptsChange, blocked: newBlocked, timeoutPenalty: true, answerTick: Date.now()
                            });
                        }
                    } catch (err) { showError(err.message); }
                })();
            }
        }
    }

    if (currentState.status === "results_pending_r4" || currentState.status === "results_pending_r5") {
        let stateKey = currentState.status + "_" + currentState.fastest + "_" + (currentState.blocked ? currentState.blocked.length : 0);
        if (lastHandledStatus !== stateKey) {
            lastHandledStatus = stateKey;
            statusEl.innerText = `Status: Weryfikacja odpowiedzi (${currentState.fastest})... [3.5s]`;
            
            clearTimeout(suspenseTimer);
            suspenseTimer = setTimeout(async () => {
                try {
                    let isCorrect = currentState.isAnswerCorrect;
                    let player = currentState.fastest;

                    if (currentState.round === 5) {
                        let pot = currentState.r5Pot || 20;
                        if (isCorrect) {
                            const scoreRef = doc(db, "quizScores", player);
                            const scoreSnap = await getDoc(scoreRef);
                            let currentPts = scoreSnap.exists() ? scoreSnap.data().points : 0;
                            await setDoc(scoreRef, { points: currentPts + pot }, { merge: true });
                            
                            r5CarryOverPool = 0;
                            r4Controller = player;
                            await updateDoc(doc(db, "quizGame", "state"), {
                                status: "results", winner: player, loser: "", pointsChange: pot, carryOver: 0, answerTick: Date.now()
                            });
                        } else {
                            r5CarryOverPool = pot;
                            await updateDoc(doc(db, "quizGame", "state"), {
                                status: "results", winner: "", loser: player, pointsChange: 0, carryOver: r5CarryOverPool, answerTick: Date.now()
                            });
                        }
                        return;
                    }

                    let isSelfPlay = (player === currentState.controller && currentState.nominated === currentState.controller);
                    let stake = isSelfPlay ? 20 : 10;
                    let ptsChange = isCorrect ? stake : -stake;

                    const scoreRef = doc(db, "quizScores", player);
                    const scoreSnap = await getDoc(scoreRef);
                    let currentPts = scoreSnap.exists() ? scoreSnap.data().points : 0;
                    await setDoc(scoreRef, { points: currentPts + ptsChange }, { merge: true });

                    if (isCorrect) {
                        r4Controller = player;
                        let sel = document.getElementById('controllerSel');
                        for(let i=0; i<sel.options.length; i++) { if(sel.options[i].value === player) sel.selectedIndex = i; }
                        await updateDoc(doc(db, "quizGame", "state"), {
                            status: "results", winner: player, loser: "", pointsChange: ptsChange, timeoutPenalty: false, answerTick: Date.now()
                        });
                    } else {
                        let newBlocked = [...(currentState.blocked || []), player];
                        let newUsedOpts = [...(currentState.usedOptions || [])];
                        if (currentState.selectedIndex !== undefined) {
                            newUsedOpts.push(currentState.selectedIndex);
                        }

                        if (newBlocked.length >= 4) {
                            await updateDoc(doc(db, "quizGame", "state"), {
                                status: "timeout", loser: player, winner: "", pointsChange: ptsChange, blocked: newBlocked, usedOptions: newUsedOpts, timeoutPenalty: false, answerTick: Date.now()
                            });
                        } else {
                            await updateDoc(doc(db, "quizGame", "state"), {
                                status: "results_wrong", loser: player, winner: "", pointsChange: ptsChange, blocked: newBlocked, usedOptions: newUsedOpts, timeoutPenalty: false, answerTick: Date.now()
                            });
                        }
                    }
                } catch (err) { showError(err.message); }
            }, 3500);
        }
    }

    if (currentState.status === "results_wrong") {
        let wrongKey = "wrong_" + currentState.answerTick;
        if (lastHandledStatus !== wrongKey) {
            lastHandledStatus = wrongKey;
            clearTimeout(autoFlowTimer);
            statusEl.innerText = `Status: Błąd gracza ${currentState.loser}! Za 3.5s DOBITKA (Kto pierwszy, ten lepszy)...`;
            autoFlowTimer = setTimeout(async () => {
                await updateDoc(doc(db, "quizGame", "state"), {
                    status: "reading", fastest: "", winner: "", loser: "", givenAnswer: "", nominated: "", timeoutPenalty: false, tick: Date.now()
                });
            }, 3500);
        }
    }

    if (currentState.status === "results" || currentState.status === "timeout" || currentState.status === "wheel_results" || currentState.status === "r1_results" || currentState.status === "r3_results") {
        let endKey = "end_" + currentState.answerTick;
        if (lastHandledStatus !== endKey) {
            lastHandledStatus = endKey;
            statusEl.innerText = `Status: Zadanie zakończone! Automatyczne przejście do kolejnego za 6 sekund...`;
            clearTimeout(autoFlowTimer);
            autoFlowTimer = setTimeout(() => {
                nextQuestion();
            }, 6000);
        }
    }
});

async function resetScoresOnly() {
    if(!confirm("Czy na pewno chcesz wyzerować punkty wszystkim graczom?")) return;
    try {
        clearTimeout(suspenseTimer); clearTimeout(autoFlowTimer);
        r4Controller = ""; r5CarryOverPool = 0; usedR5Indices = [];
        const players = ["Lila", "Kaja", "Darek", "Jas"];
        for(let p of players) { await setDoc(doc(db, "quizScores", p), { points: 0 }); }
        await setDoc(doc(db, "quizGame", "state"), { status: "idle", round: 1, question: "Punkty wyzerowane! Czekamy na start.", blocked: [], usedOptions: [], pool: currentPool });
        statusEl.innerText = "Status: Punkty wszystkich graczy zostały wyzerowane.";
    } catch (err) { showError(err.message); }
}

async function sendPoolChoice() {
    try {
        clearTimeout(suspenseTimer); clearTimeout(autoFlowTimer);
        currentPool = parseInt(document.getElementById('poolSel').value);
        currentQIndex = { 1: -1, 2: -1, 3: -1, 4: -1, 5: -1 };
        r4Controller = ""; r5CarryOverPool = 0; usedR5Indices = [];
        await setDoc(doc(db, "quizGame", "state"), { status: "idle", round: 1, question: `Załadowano PULĘ ${currentPool}! Czekamy na przycisk START.`, blocked: [], usedOptions: [], pool: currentPool });
        statusEl.innerText = `Status: Załadowano PULĘ ${currentPool}. Kliknij START GRY, aby puścić 1. pytanie!`;
    } catch (err) { showError(err.message); }
}

async function nextQuestion() {
    try {
        clearTimeout(suspenseTimer); clearTimeout(autoFlowTimer);
        currentPool = parseInt(document.getElementById('poolSel').value) || 1;
        let r = parseInt(document.getElementById('roundSel').value);
        
        currentQIndex[r]++;

        if (r === 5) {
            if (currentQIndex[5] >= 15) {
                await showGrandFinale();
                return;
            }
            let tieBanner = "";
            if (currentQIndex[5] === 0 || !r4Controller) {
                let initRes = await determineInitialController();
                r4Controller = initRes.player;
                tieBanner = initRes.tieMsg;
            }
            let segIdx = Math.floor(Math.random() * r5WheelCategories.length);
            let chosenCat = r5WheelCategories[segIdx];
            let qData = pickR5QuestionByCategory(currentPool, chosenCat);

            await setDoc(doc(db, "quizGame", "state"), {
                status: "r5_wait_spin", round: 5, controller: r4Controller, tieMsg: tieBanner,
                wheelSegment: segIdx, category: chosenCat, question: qData.q, options: qData.o, correctIndex: qData.c,
                carryOver: r5CarryOverPool, r5Pot: r5CarryOverPool, blocked: [], usedOptions: [],
                speechTick: Date.now(), pool: currentPool
            });
            return;
        }

        let qData = allDBs[currentPool][r][currentQIndex[r]];
        if (!qData) {
            statusEl.innerText = `Status: Koniec pytań w Rundzie ${r} (Pula ${currentPool})! Zmień rundę.`;
            return alert(`Koniec pytań w Rundzie ${r} z Puli ${currentPool}! Wybierz kolejną rundę z listy.`);
        }

        statusEl.innerText = `Status: Grane zadanie #${currentQIndex[r] + 1} / ${allDBs[currentPool][r].length} (Runda ${r}, Pula ${currentPool})`;

        if (r === 1) {
            await setDoc(doc(db, "quizGame", "state"), {
                status: "speaking", round: 1, question: qData.q, options: qData.o, correctIndex: qData.c,
                r1Answers: {}, r1Winners: [], speechTick: Date.now(), pool: currentPool
            });
        } else if (r === 2) {
            let phraseClean = qData.phrase.replace(/ /g, "");
            let indices = [];
            for (let i = 0; i < phraseClean.length; i++) indices.push(i);
            indices.sort(() => Math.random() - 0.5);

            await setDoc(doc(db, "quizGame", "state"), {
                status: "wheel_reading", round: 2, category: qData.cat, question: qData.phrase,
                wheelOrder: indices, wheelWinners: [], tick: Date.now(), speechTick: Date.now(), pool: currentPool
            });
        } else if (r === 3) {
            await setDoc(doc(db, "quizGame", "state"), {
                status: "speaking", round: 3, question: qData.q, correctText: qData.c,
                r3Winners: [], speechTick: Date.now(), pool: currentPool
            });
        } else if (r === 4) {
            let tieBanner = "";
            if (currentQIndex[r] === 0 || !r4Controller) {
                let initRes = await determineInitialController();
                r4Controller = initRes.player;
                tieBanner = initRes.tieMsg;
            }
            let sel = document.getElementById('controllerSel');
            for(let i=0; i<sel.options.length; i++) { if(sel.options[i].value === r4Controller) sel.selectedIndex = i; }

            await setDoc(doc(db, "quizGame", "state"), { 
                status: "nominating", round: 4, controller: r4Controller, tieMsg: tieBanner,
                category: qData.cat, question: qData.q, options: qData.o, correctIndex: qData.c, 
                blocked: [], usedOptions: [], nominated: "", speechTick: Date.now(), pool: currentPool 
            });
        }
    } catch (err) { showError(err.message); }
}

async function startNominationPhase() {
    try {
        r4Controller = document.getElementById('controllerSel').value;
        let targetStatus = (currentState && currentState.round === 5) ? "r5_wait_spin" : "nominating";
        await updateDoc(doc(db, "quizGame", "state"), { status: targetStatus, controller: r4Controller });
    } catch (err) { showError(err.message); }
}

document.getElementById('btnResetScores').addEventListener('click', resetScoresOnly);
document.getElementById('btnSendPool').addEventListener('click', sendPoolChoice);
document.getElementById('btnStartRound').addEventListener('click', nextQuestion);
document.getElementById('btnNextQ').addEventListener('click', nextQuestion);
document.getElementById('btnShowPodium').addEventListener('click', showGrandFinale);
document.getElementById('btnManualNom').addEventListener('click', startNominationPhase);

</script>
