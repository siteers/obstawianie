async function determineInitialController() {
const snap = await getDocs(collection(db, "quizScores"));
let maxPts = -999999;
let leaders = [];
snap.forEach(d => {
let pts = d.data().points || 0;
if (pts > maxPts) {
maxPts = pts;
leaders = [d.id];
} else if (pts === maxPts) {
leaders.push(d.id);
}
});
if (leaders.length === 0) return { player: "Lila", tieMsg: "" };
if (leaders.length === 1) {
return { player: leaders[0], tieMsg: `NAJWIĘCEJ PUNKTÓW (${maxPts}) MA: ${leaders[0].toUpperCase()}!` };
} else {
let chosen = leaders[Math.floor(Math.random() * leaders.length)];
return { player: chosen, tieMsg: `REMIS LIDERÓW (${maxPts} PKT)! WYLOSOWANO: ${chosen.toUpperCase()}!` };
}
}

const player = r5Order[r5PlayerIdx];
statusEl.innerText = `⚡ Koniec tury gracza ${player} (${reasonText}). Bilans: ${r5PlayerScoreChange >= 0 ? "+" : ""}${r5PlayerScoreChange} pkt.`;

await updateDoc(doc(db, "quizGame", "state"), {
status: "r5_player_summary",
nominated: player,
r5EndReason: reasonText,
r5ScoreDelta: r5PlayerScoreChange,
r5TimeLeftMs: Math.max(0, r5TimeLeftMs),
speechTick: Date.now()
});

clearTimeout(autoFlowTimer);
autoFlowTimer = setTimeout(() => {
startR5ForPlayer(r5PlayerIdx + 1);
}, 7500);
}

function pickR6QuestionByCategory(pool, catName) {
const list = allDBs[pool][6];
let idx = list.findIndex((item, i) => item.cat === catName && !usedR6Indices.includes(i));
if (idx === -1) {
idx = list.findIndex((item, i) => !usedR6Indices.includes(i));
}
if (idx === -1) {
usedR6Indices = [];
idx = 0;
}
usedR6Indices.push(idx);
return list[idx];
}

onSnapshot(doc(db, "quizGame", "state"), (docSnap) => {
if (!docSnap.exists()) return;
currentState = docSnap.data();

document.getElementById('nominateUI').style.display = 'none';
r3LiveBox.style.display = 'none';

// Sprawdzenie, czy w podsumowaniu rundy wszyscy aktywni gracze kliknęli GOTOWOŚĆ na telefonach!
if (currentState.status === "round_summary") {
const readyList = currentState.readyPlayers || [];
const activeList = (currentState.activePlayers && currentState.activePlayers.length > 0) ? currentState.activePlayers : ["Lila", "Kaja", "Darek", "Jas"];
statusEl.innerText = `📊 Podsumowanie Rundy ${currentState.completedRound}: Gotowi gracze: ${readyList.length}/${activeList.length} (${readyList.join(", ") || "nikt"}). Kliknij START RUNDY lub poczekaj na graczy.`;

if (readyList.length > 0 && activeList.every(p => readyList.includes(p))) {
let rdyKey = currentState.readyTick || Date.now();
if (lastSummaryReadyHandled !== rdyKey) {
lastSummaryReadyHandled = rdyKey;
statusEl.innerText = `🚀 Wszyscy gracze zgłosili gotowość! Uruchamiam Rundę ${currentState.nextRound}...`;
clearTimeout(autoFlowTimer);
autoFlowTimer = setTimeout(() => {
nextQuestion();
}, 1200);
}
}
}

if ((currentState.status === "setup_nomination" || currentState.status === "nominating" || currentState.status === "r6_wait_spin") && (currentState.round === 4 || currentState.round === 6)) {
document.getElementById('nominateUI').style.display = 'block';
document.getElementById('n-curr').innerText = currentState.controller || r4Controller;
statusEl.innerText = currentState.round === 6
? `Status: Runda 6 (Awantura) - ${currentState.controller} kręci palcem kołem na swoim telefonie!`
: `Status: Runda 4 - ${currentState.controller} wybiera na telefonie kto odpowiada!`;
}
else if (currentState.status === "speaking") {
statusEl.innerText = `🗣️ Lektor na TV czyta teraz pytanie... Po zakończeniu włączy się stoper!`;
}
else if (currentState.status === "reading" && currentState.round === 1) {
let count = Object.keys(currentState.r1Answers || {}).length;
statusEl.innerText = `Status: Runda 1 (Wyścig ABCD - 12s) - odpowiedziało już: ${count}/4 graczy.`;
}
else if (currentState.status === "wheel_reading" && currentState.round === 2) {
let winnersCount = (currentState.wheelWinners || []).length;
statusEl.innerText = `Status: Runda 2 (Rozsypanka Literowa) w toku! Odgadło już: ${winnersCount}/4 graczy.`;
}
else if (currentState.status === "reading" && currentState.round === 3) {
let winners = currentState.r3Winners || [];
statusEl.innerText = `Status: Runda 3 (Szybkie Pisanie - 20s) - odgadło już: ${winners.length}/4 graczy (Prawidłowa: ${currentState.correctText}).`;
r3LiveBox.style.display = 'block';
r3LiveBox.innerHTML = `<b>Poprawna:</b> <span style="color:#d4af37">${currentState.correctText}</span> | <b>Trafili:</b> ${winners.join(", ") || "brak"}`;
}

// --- OBSŁUGA RUNDY 5 (BŁYSKAWICA PRAWDA/FAŁSZ) ---
if (currentState.round === 5 && currentState.status === "r5_ready_first") {
let readyKey = "r5_first_" + currentState.speechTick;
if (lastR5HandledKey !== readyKey) {
lastR5HandledKey = readyKey;
sendNextR5Question();
}
}

if (currentState.round === 5 && currentState.status === "r5_answered") {
let ansKey = "r5_ans_" + currentState.answerTick;
if (lastR5HandledKey !== ansKey) {
lastR5HandledKey = ansKey;
const player = currentState.nominated;
const isCorrect = (currentState.r5GivenBool === currentState.r5CorrectBool);
const ptsDelta = isCorrect ? 5 : -5;
r5PlayerScoreChange += ptsDelta;
r5TimeLeftMs = Math.max(0, currentState.r5TimeLeftMs || 0);

(async () => {
try {
const scoreRef = doc(db, "quizScores", player);
const scoreSnap = await getDoc(scoreRef);
let curPts = scoreSnap.exists() ? scoreSnap.data().points : 0;
await setDoc(scoreRef, { points: curPts + ptsDelta }, { merge: true });

await updateDoc(doc(db, "quizGame", "state"), {
status: "r5_feedback",
r5LastCorrect: isCorrect,
r5LastPts: ptsDelta,
r5ScoreDelta: r5PlayerScoreChange,
r5TimeLeftMs: r5TimeLeftMs
});

clearTimeout(autoFlowTimer);
autoFlowTimer = setTimeout(() => {
sendNextR5Question();
}, 1700);
} catch (e) { showError(e.message); }
})();
}
}

if (currentState.round === 5 && currentState.status === "r5_timeout") {
let toKey = "r5_to_" + currentState.answerTick;
if (lastR5HandledKey !== toKey) {
lastR5HandledKey = toKey;
r5TimeLeftMs = 0;
finishR5TurnForPlayer("CZAS 20.0s MINĄŁ!");
}
}

// --- OBSŁUGA RUNDY 6 (AWANTURA O PUNKTY): KOŁO I LICYTACJA ---
if (currentState.round === 6 && currentState.status === "r6_spinning") {
if (currentState.spinTick && currentState.spinTick !== lastSpinHandled) {
lastSpinHandled = currentState.spinTick;
statusEl.innerText = `🎡 Koło obraca się na TV i telefonie! Za 5s ruszy licytacja...`;
setTimeout(async () => {
let initBids = { Lila: 5, Kaja: 5, Darek: 5, Jas: 5 };
let totalPot = (currentState.carryOver || 0) + 20;
let now = Date.now();
await updateDoc(doc(db, "quizGame", "state"), {
status: "r6_bidding",
r6Bids: initBids,
r6Pot: totalPot,
r6HighestBidder: "WSZYSCY (PO 5 PKT)",
r6HighestBid: 5,
r6TiedBidders: [],
r6MainSec: 12,
r6Countdown: 0,
auctionStartTime: now + 4500,
bidTick: now,
speechTick: now
});
}, 5000);
}
}

if (currentState.round === 6 && currentState.status === "r6_bidding") {
if (!auctionMonitorInterval) {
auctionMonitorInterval = setInterval(async () => {
if (!currentState || currentState.round !== 6 || currentState.status !== "r6_bidding") {
clearInterval(auctionMonitorInterval);
auctionMonitorInterval = null;
return;
}
const now = Date.now();
const startT = currentState.auctionStartTime || now;
const mainEndT = startT + 12000;
const effectiveCloseT = Math.max(mainEndT + 5000, (currentState.bidTick || startT) + 8000);
const remTotalMs = effectiveCloseT - now;

if (now < mainEndT) {
let mainSec = Math.min(12, Math.max(1, Math.ceil((mainEndT - now) / 1000)));
if (currentState.r6MainSec !== mainSec || currentState.r6Countdown !== 0) {
await updateDoc(doc(db, "quizGame", "state"), { r6MainSec: mainSec, r6Countdown: 0 });
}
} else if (remTotalMs > 5000) {
if (currentState.r6MainSec !== 0 || currentState.r6Countdown !== 0) {
await updateDoc(doc(db, "quizGame", "state"), { r6MainSec: 0, r6Countdown: 0 });
}
} else if (remTotalMs > 0) {
let finalSec = Math.ceil(remTotalMs / 1000);
if (currentState.r6Countdown !== finalSec || currentState.r6MainSec !== 0) {
await updateDoc(doc(db, "quizGame", "state"), { r6MainSec: 0, r6Countdown: finalSec });
}
} else {
clearInterval(auctionMonitorInterval);
auctionMonitorInterval = null;

let bids = currentState.r6Bids || { Lila: 5, Kaja: 5, Darek: 5, Jas: 5 };
let allPlayers = ["Lila", "Kaja", "Darek", "Jas"];
let maxBid = Math.max(...allPlayers.map(p => bids[p] || 5));
let topPlayers = allPlayers.filter(p => (bids[p] || 5) === maxBid);

let winnerPlayer = "";
let wasRandomDraw = false;

if (maxBid === 5) {
winnerPlayer = allPlayers[Math.floor(Math.random() * allPlayers.length)];
wasRandomDraw = true;
}
else if (topPlayers.length === 1) {
winnerPlayer = topPlayers[0];
}
else {
let prevTied = currentState.r6TiedBidders || [];
if (prevTied.length > 0 && currentState.r6OvertimeMax === maxBid) {
winnerPlayer = topPlayers[Math.floor(Math.random() * topPlayers.length)];
wasRandomDraw = true;
} else {
let nowTie = Date.now();
await updateDoc(doc(db, "quizGame", "state"), {
r6TiedBidders: topPlayers,
r6OvertimeMax: maxBid,
r6HighestBidder: `REMIS: ${topPlayers.join(" / ").toUpperCase()}`,
r6MainSec: 12,
r6Countdown: 0,
auctionStartTime: nowTie + 3500,
bidTick: nowTie,
tieBreakTick: nowTie
});
return;
}
}

for (let p of allPlayers) {
let ref = doc(db, "quizScores", p);
let snap = await getDoc(ref);
let cur = snap.exists() ? snap.data().points : 0;
await setDoc(ref, { points: cur - (bids[p] || 5) }, { merge: true });
}

await updateDoc(doc(db, "quizGame", "state"), {
status: "r6_sold",
nominated: winnerPlayer,
r6HighestBidder: winnerPlayer,
r6HighestBid: maxBid,
r6RandomDrawn: wasRandomDraw,
r6TiedBidders: [],
r6MainSec: 0,
r6Countdown: 0,
speechTick: Date.now()
});
}
}, 350);
}
} else {
if (auctionMonitorInterval) {
clearInterval(auctionMonitorInterval);
auctionMonitorInterval = null;
}
}

if (currentState.status === "nominated_timeout" && (currentState.round === 4 || currentState.round === 6)) {
let nomTimeKey = "nom_timeout_" + currentState.answerTick;
if (lastHandledStatus !== nomTimeKey) {
lastHandledStatus = nomTimeKey;
let player = currentState.nominated;

if (currentState.round === 6) {
r6CarryOverPool = currentState.r6Pot || 20;
updateDoc(doc(db, "quizGame", "state"), {
status: "timeout", loser: player, winner: "", pointsChange: 0, carryOver: r6CarryOverPool, timeoutPenalty: true, answerTick: Date.now()
});
} else {
let isSelf = (player === currentState.controller);
let ptsChange = isSelf ? -20 : -10;
(async () => {
try {
const scoreRef = doc(db, "quizScores", player);
const scoreSnap = await getDoc(scoreRef);
let currentPts = scoreSnap.exists() ? scoreSnap.data().points : 0;
await setDoc(scoreRef, { points: currentPts + ptsChange }, { merge: true });

let newBlocked = [...(currentState.blocked || []), player];
if (newBlocked.length >= 4) {
await updateDoc(doc(db, "quizGame", "state"), {
status: "timeout", loser: player, winner: "", pointsChange: ptsChange, blocked: newBlocked, timeoutPenalty: true, answerTick: Date.now()
});
} else {
await updateDoc(doc(db, "quizGame", "state"), {
status: "results_wrong", loser: player, winner: "", pointsChange: ptsChange, blocked: newBlocked, timeoutPenalty: true, answerTick: Date.now()
});
}
} catch (err) { showError(err.message); }
})();
}
}
}

if (currentState.status === "results_pending_r4" || currentState.status === "results_pending_r6") {
let stateKey = currentState.status + "_" + currentState.fastest + "_" + (currentState.blocked ? currentState.blocked.length : 0);
if (lastHandledStatus !== stateKey) {
lastHandledStatus = stateKey;
statusEl.innerText = `Status: Weryfikacja odpowiedzi (${currentState.fastest})... [3.5s]`;

clearTimeout(suspenseTimer);
suspenseTimer = setTimeout(async () => {
try {
let isCorrect = currentState.isAnswerCorrect;
let player = currentState.fastest;

if (currentState.round === 6) {
let pot = currentState.r6Pot || 20;
if (isCorrect) {
const scoreRef = doc(db, "quizScores", player);
const scoreSnap = await getDoc(scoreRef);
let currentPts = scoreSnap.exists() ? scoreSnap.data().points : 0;
await setDoc(scoreRef, { points: currentPts + pot }, { merge: true });

r6CarryOverPool = 0;
r4Controller = player;
await updateDoc(doc(db, "quizGame", "state"), {
status: "results", winner: player, loser: "", pointsChange: pot, carryOver: 0, answerTick: Date.now()
});
} else {
r6CarryOverPool = pot;
await updateDoc(doc(db, "quizGame", "state"), {
status: "results", winner: "", loser: player, pointsChange: 0, carryOver: r6CarryOverPool, answerTick: Date.now()
});
}
return;
}

let isSelfPlay = (player === currentState.controller && currentState.nominated === currentState.controller);
let stake = isSelfPlay ? 20 : 10;
let ptsChange = isCorrect ? stake : -stake;

const scoreRef = doc(db, "quizScores", player);
const scoreSnap = await getDoc(scoreRef);
let currentPts = scoreSnap.exists() ? scoreSnap.data().points : 0;
await setDoc(scoreRef, { points: currentPts + ptsChange }, { merge: true });

if (isCorrect) {
r4Controller = player;
let sel = document.getElementById('controllerSel');
for(let i=0; i<sel.options.length; i++) { if(sel.options[i].value === player) sel.selectedIndex = i; }
await updateDoc(doc(db, "quizGame", "state"), {
status: "results", winner: player, loser: "", pointsChange: ptsChange, timeoutPenalty: false, answerTick: Date.now()
});
} else {
let newBlocked = [...(currentState.blocked || []), player];
let newUsedOpts = [...(currentState.usedOptions || [])];
if (currentState.selectedIndex !== undefined) {
newUsedOpts.push(currentState.selectedIndex);
}

if (newBlocked.length >= 4) {
await updateDoc(doc(db, "quizGame", "state"), {
status: "timeout", loser: player, winner: "", pointsChange: ptsChange, blocked: newBlocked, usedOptions: newUsedOpts, timeoutPenalty: false, answerTick: Date.now()
});
} else {
await updateDoc(doc(db, "quizGame", "state"), {
status: "results_wrong", loser: player, winner: "", pointsChange: ptsChange, blocked: newBlocked, usedOptions: newUsedOpts, timeoutPenalty: false, answerTick: Date.now()
});
}
}
} catch (err) { showError(err.message); }
}, 3500);
}
}

if (currentState.status === "results_wrong") {
let wrongKey = "wrong_" + currentState.answerTick;
if (lastHandledStatus !== wrongKey) {
lastHandledStatus = wrongKey;
clearTimeout(autoFlowTimer);
statusEl.innerText = `Status: Błąd gracza ${currentState.loser}! Za 3.5s DOBITKA (Kto pierwszy, ten lepszy)...`;
autoFlowTimer = setTimeout(async () => {
await updateDoc(doc(db, "quizGame", "state"), {
status: "reading", fastest: "", winner: "", loser: "", givenAnswer: "", nominated: "", timeoutPenalty: false, tick: Date.now()
});
}, 3500);
}
}

if (currentState.status === "results" || currentState.status === "timeout" || currentState.status === "wheel_results" || currentState.status === "r1_results" || currentState.status === "r3_results") {
let endKey = "end_" + currentState.answerTick;
if (lastHandledStatus !== endKey) {
lastHandledStatus = endKey;
statusEl.innerText = `Status: Zadanie zakończone! Automatyczne przejście do kolejnego za 6.5 sekundy...`;
clearTimeout(autoFlowTimer);
autoFlowTimer = setTimeout(() => {
nextQuestion();
}, 6500);
}
}
});

async function resetScoresOnly() {
if(!confirm("Czy na pewno chcesz wyzerować punkty wszystkim graczom?")) return;
try {
clearTimeout(suspenseTimer); clearTimeout(autoFlowTimer);
r4Controller = ""; r6CarryOverPool = 0; usedR6Indices = [];
const players = ["Lila", "Kaja", "Darek", "Jas"];
for(let p of players) { await setDoc(doc(db, "quizScores", p), { points: 0 }); }
await setDoc(doc(db, "quizGame", "state"), { status: "idle", round: 1, question: "Punkty wyzerowane! Czekamy na start.", blocked: [], usedOptions: [], activePlayers: [], pool: currentPool });
statusEl.innerText = "Status: Punkty wszystkich graczy zostały wyzerowane.";
} catch (err) { showError(err.message); }
}

async function sendPoolChoice() {
try {
clearTimeout(suspenseTimer); clearTimeout(autoFlowTimer);
currentPool = parseInt(document.getElementById('poolSel').value);
currentQIndex = { 1: -1, 2: -1, 3: -1, 4: -1, 5: -1, 6: -1 };
r4Controller = ""; r6CarryOverPool = 0; usedR6Indices = [];
const existingActive = (currentState && currentState.activePlayers) ? currentState.activePlayers : [];
await setDoc(doc(db, "quizGame", "state"), { status: "idle", round: 1, question: `Załadowano PULĘ ${currentPool}! Czekamy na przycisk START.`, blocked: [], usedOptions: [], activePlayers: existingActive, pool: currentPool });
statusEl.innerText = `Status: Załadowano PULĘ ${currentPool}. Kliknij START GRY, aby puścić 1. pytanie!`;
} catch (err) { showError(err.message); }
}

async function nextQuestion() {
try {
clearTimeout(suspenseTimer); clearTimeout(autoFlowTimer);
currentPool = parseInt(document.getElementById('poolSel').value) || 1;
let r = parseInt(document.getElementById('roundSel').value);
const existingActive = (currentState && currentState.activePlayers) ? currentState.activePlayers : [];

// Obsługa Rundy 5 (Błyskawica Prawda/Fałsz - z oczekiwaniem na kliknięcie gotowości przez wywołanego gracza!)
if (r === 5) {
if (currentQIndex[5] === -1) {
currentQIndex[5] = 0;
await startR5ForPlayer(0);
} else if (currentState && currentState.status === "r5_wait_ready") {
// Jeśli Admin kliknie przycisk "Pomiń/Wymuś" podczas czekania na gotowość gracza -> wystartuj jego 1. pytanie
await sendNextR5Question();
} else {
await sendNextR5Question();
}
return;
}

currentQIndex[r]++;

// Obsługa Rundy 6 (Awantura o punkty - Koło Kategorii i Licytacja)
if (r === 6) {
if (currentQIndex[6] >= 15) {
await showGrandFinale();
return;
}
let tieBanner = "";
if (currentQIndex[6] === 0 || !r4Controller) {
let initRes = await determineInitialController();
r4Controller = initRes.player;
tieBanner = initRes.tieMsg;
}
let segIdx = Math.floor(Math.random() * r6WheelCategories.length);
let chosenCat = r6WheelCategories[segIdx];
let qData = pickR6QuestionByCategory(currentPool, chosenCat);

await setDoc(doc(db, "quizGame", "state"), {
status: "r6_wait_spin", round: 6, controller: r4Controller, tieMsg: tieBanner,
wheelSegment: segIdx, category: chosenCat, question: qData.q, options: qData.o, correctIndex: qData.c,
carryOver: r6CarryOverPool, r6Pot: r6CarryOverPool, r6TiedBidders: [], blocked: [], usedOptions: [],
activePlayers: existingActive, speechTick: Date.now(), pool: currentPool
});
return;
}

let qData = allDBs[currentPool][r][currentQIndex[r]];
if (!qData) {
await triggerRoundSummary(r);
return;
}

statusEl.innerText = `Status: Grane zadanie #${currentQIndex[r] + 1} / ${allDBs[currentPool][r].length} (Runda ${r}, Pula ${currentPool})`;

if (r === 1) {
await setDoc(doc(db, "quizGame", "state"), {
status: "speaking", round: 1, question: qData.q, options: qData.o, correctIndex: qData.c,
r1Answers: {}, r1Winners: [], activePlayers: existingActive, speechTick: Date.now(), pool: currentPool
});
} else if (r === 2) {
let phraseClean = qData.phrase.replace(/ /g, "");
let indices = [];
for (let i = 0; i < phraseClean.length; i++) indices.push(i);
indices.sort(() => Math.random() - 0.5);

await setDoc(doc(db, "quizGame", "state"), {
status: "wheel_reading", round: 2, category: qData.cat, question: qData.phrase,
wheelOrder: indices, wheelWinners: [], activePlayers: existingActive, tick: Date.now(), speechTick: Date.now(), pool: currentPool
});
} else if (r === 3) {
await setDoc(doc(db, "quizGame", "state"), {
status: "speaking", round: 3, question: qData.q, correctText: qData.c,
r3Winners: [], activePlayers: existingActive, speechTick: Date.now(), pool: currentPool
});
} else if (r === 4) {
let tieBanner = "";
if (currentQIndex[r] === 0 || !r4Controller) {
let initRes = await determineInitialController();
r4Controller = initRes.player;
tieBanner = initRes.tieMsg;
}
let sel = document.getElementById('controllerSel');
for(let i=0; i<sel.options.length; i++) { if(sel.options[i].value === r4Controller) sel.selectedIndex = i; }

await setDoc(doc(db, "quizGame", "state"), {
status: "nominating", round: 4, controller: r4Controller, tieMsg: tieBanner,
category: qData.cat, question: qData.q, options: qData.o, correctIndex: qData.c,
blocked: [], usedOptions: [], nominated: "", activePlayers: existingActive, speechTick: Date.now(), pool: currentPool
});
}
} catch (err) { showError(err.message); }
}

async function startNominationPhase() {
try {
r4Controller = document.getElementById('controllerSel').value;
let targetStatus = (currentState && currentState.round === 6) ? "r6_wait_spin" : "nominating";
await updateDoc(doc(db, "quizGame", "state"), { status: targetStatus, controller: r4Controller });
} catch (err) { showError(err.message); }
}

window.resetScoresOnly = resetScoresOnly;
window.sendPoolChoice = sendPoolChoice;
window.nextQuestion = nextQuestion;
window.showGrandFinale = showGrandFinale;
window.startNominationPhase = startNominationPhase;
</script>
</body>
</html>
