<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Quiz | Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; margin: 0; }
    .box { background: #222; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #444; }
    h3 { margin-top: 0; color: #00d4ff; }
    button { background: #00d4ff; border: none; padding: 15px 20px; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 16px; margin: 5px; }
    button.red { background: #ff4757; color: white; }
    button.green { background: #2ed573; color: black; }
    
    .verify-box { background: #d4af37; color: #000; padding: 20px; border-radius: 15px; display: none; margin-bottom: 20px; }
    .ans-text { font-size: 24px; font-weight: 900; margin: 15px 0; background: #fff; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>

  <div class="box">
    <h3>STEROWANIE GRĄ</h3>
    <button onclick="startGame()">RESETUJ I ZACZNIJ OD NOWA</button><br><br>
    
    <label>Runda:</label>
    <select id="roundSel" style="padding: 10px; font-size: 16px; margin-right: 10px;">
        <option value="1">Runda 1 (ABCD)</option>
        <option value="2">Runda 2 (Pisanie)</option>
        <option value="3">Runda 3 (Ryzyko +-20)</option>
    </select>
    <button onclick="nextQuestion()">PUŚĆ NASTĘPNE PYTANIE</button>
  </div>

  <div class="verify-box" id="verifyUI">
    <h3>WERYFIKACJA ODPOWIEDZI!</h3>
    <p>Gracz <b><span id="v-player"></span></b> wpisał:</p>
    <div class="ans-text" id="v-ans">...</div>
    <p>Prawidłowa powinna być: <b><span id="v-correct"></span></b></p>
    
    <button class="green" onclick="judgeAnswer(true)">✅ ZALICZ (+)</button>
    <button class="red" onclick="judgeAnswer(false)">❌ ODRZUĆ (-)</button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const db = getFirestore(initializeApp(firebaseConfig));

// BAZA PYTAŃ TESTOWYCH (Po 5 na rundę)
const questionsDB = {
    1: [
        { q: "Która planeta jest największa w Układzie Słonecznym?", o: ["Ziemia", "Mars", "Jowisz", "Saturn"], c: 2 },
        { q: "Ile nóg ma pająk?", o: ["Sześć", "Osiem", "Dziesięć", "Dwanaście"], c: 1 },
        { q: "Co jest stolicą Francji?", o: ["Madryt", "Londyn", "Paryż", "Berlin"], c: 2 },
        { q: "Jak nazywa się pingwin z Madagaskaru, który kocha dynamit?", o: ["Skipper", "Kowalski", "Rico", "Szeregowy"], c: 2 },
        { q: "Ile to jest 7 x 8?", o: ["54", "56", "62", "48"], c: 1 }
    ],
    2: [
        { q: "Z jakiego owocu robi się rodzynki?", c: "Z winogron" },
        { q: "Które zwierzę ma najdłuższą szyję?", c: "Żyrafa" },
        { q: "Jak nazywa się kontynent, na którym znajduje się Polska?", c: "Europa" },
        { q: "W jakim sporcie używa się rakietki i lotki?", c: "Badminton" },
        { q: "Ile dni ma luty w roku przestępnym?", c: "29" }
    ],
    3: [
        { q: "Jak nazywa się żółty pokemon Basha?", c: "Pikachu" },
        { q: "Jaki kolor powstanie ze zmieszania żółtego i niebieskiego?", c: "Zielony" },
        { q: "Czego używa Harry Potter do latania?", c: "Miotły" },
        { q: "Ile to jest (20 + 30) - 10?", c: "40" },
        { q: "Kto napisał wiersz 'Lokomotywa'?", c: "Julian Tuwim" }
    ]
};

let currentQIndex = { 1: -1, 2: -1, 3: -1 };
let currentState = null;

onSnapshot(doc(db, "quizGame", "state"), (docSnap) => {
    if (!docSnap.exists()) return;
    currentState = docSnap.data();
    
    // Panel weryfikacji dla Rundy 2 i 3
    if (currentState.status === "verifying") {
        document.getElementById('verifyUI').style.display = 'block';
        document.getElementById('v-player').innerText = currentState.fastest.toUpperCase();
        document.getElementById('v-ans').innerText = currentState.givenAnswer;
        
        let correctTxt = questionsDB[currentState.round][currentQIndex[currentState.round]].c;
        document.getElementById('v-correct').innerText = correctTxt;
    } else {
        document.getElementById('verifyUI').style.display = 'none';
    }
});

window.startGame = async () => {
    if(!confirm("Zresetować punkty wszystkich dzieci do zera?")) return;
    const players = ["Lila", "Kaja", "Darek", "Jas"];
    for(let p of players) { await setDoc(doc(db, "quizScores", p), { points: 0 }); }
    await setDoc(doc(db, "quizGame", "state"), { status: "idle", round: 1, question: "Czekamy na pierwsze pytanie!" });
    currentQIndex = { 1: -1, 2: -1, 3: -1 };
    alert("Gra zresetowana!");
};

window.nextQuestion = async () => {
    let r = parseInt(document.getElementById('roundSel').value);
    currentQIndex[r]++;
    
    let qData = questionsDB[r][currentQIndex[r]];
    if (!qData) return alert("Brak więcej pytań w tej rundzie!");

    let payload = {
        status: "reading",
        round: r,
        question: qData.q,
        fastest: "", winner: "", loser: "", givenAnswer: ""
    };

    if (r === 1) {
        payload.options = qData.o;
        payload.correctIndex = qData.c;
    }
    
    await setDoc(doc(db, "quizGame", "state"), payload);
};

window.judgeAnswer = async (isCorrect) => {
    let r = currentState.round;
    let player = currentState.fastest;
    let ptsChange = 0;
    
    if (r === 2) ptsChange = isCorrect ? 10 : 0;
    if (r === 3) ptsChange = isCorrect ? 20 : -20;
    
    // Aktualizacja punktów w bazie
    if (ptsChange !== 0) {
        const scoreRef = doc(db, "quizScores", player);
        const scoreSnap = await getDoc(scoreRef);
        await updateDoc(scoreRef, { points: scoreSnap.data().points + ptsChange });
    }
    
    // Ekran wyników na TV
    await updateDoc(doc(db, "quizGame", "state"), {
        status: "results",
        winner: isCorrect ? player : "",
        loser: isCorrect ? "" : player,
        pointsChange: ptsChange
    });
};
</script>
</body>
</html>
