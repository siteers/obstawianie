};

let currentQIndex = { 1: -1, 2: -1, 3: -1 };
let currentState = null;
let suspenseTimeout = null;
let autoNextTimer = null; 

onSnapshot(doc(db, "quizGame", "state"), (docSnap) => {
    if (!docSnap.exists()) return;
    currentState = docSnap.data();
    
    document.getElementById('nominateUI').style.display = 'none';
    document.getElementById('verifyUI').style.display = 'none';

    if (currentState.status === "setup_nomination" && currentState.round === 3) {
        document.getElementById('nominateUI').style.display = 'block';
        document.getElementById('n-cat').innerText = currentState.category;
    } else if (currentState.status === "verifying" && currentState.round === 2) {
        document.getElementById('verifyUI').style.display = 'block';
        document.getElementById('v-player').innerText = currentState.fastest.toUpperCase();
        
        let pool = currentState.pool || 1;
        document.getElementById('v-ans').innerText = currentState.givenAnswer;
        document.getElementById('v-correct').innerText = allDBs[pool][2][currentQIndex[2]].c;
    } 

    // ADMIN CZEKA NA BICIE SERCA R1 I R3 (3.5 SEKUNDY)
    if (currentState.status === "results_pending_r1" || currentState.status === "results_pending_r3") {
        if (!suspenseTimeout) {
            suspenseTimeout = setTimeout(async () => {
                let r = currentState.round;
                let isCorrect = currentState.isAnswerCorrect;
                let player = currentState.fastest;
                let ptsChange = (r === 1) ? (isCorrect ? 10 : -10) : (isCorrect ? 20 : -20);

                const scoreRef = doc(db, "quizScores", player);
                const scoreSnap = await getDoc(scoreRef);
                await updateDoc(scoreRef, { points: scoreSnap.data().points + ptsChange });

                let newBlocked = [...(currentState.blocked || []), player];

                if (isCorrect || newBlocked.length >= 4) {
                    await updateDoc(doc(db, "quizGame", "state"), {
                        status: newBlocked.length >= 4 && !isCorrect ? "timeout" : "results", 
                        winner: isCorrect ? player : "", 
                        loser: isCorrect ? "" : player, 
                        pointsChange: ptsChange, 
                        answerTick: Date.now(),
                        blocked: newBlocked
                    });
                } else {
                    // Ktoś źle kliknął w R1/R3 - dajemy kare i WZNAWIAMY pytanie dla reszty
                    await updateDoc(doc(db, "quizGame", "state"), {
                        status: "results_wrong", loser: player, winner: "", pointsChange: ptsChange, answerTick: Date.now(), blocked: newBlocked
                    });
                    setTimeout(async () => {
                        let freshSnap = await getDoc(doc(db, "quizGame", "state"));
                        if(freshSnap.exists() && freshSnap.data().status === "results_wrong") {
                            await updateDoc(doc(db, "quizGame", "state"), { status: "reading", fastest: "", givenAnswer: "", tick: Date.now() });
                        }
                    }, 4000); 
                }
                suspenseTimeout = null;
            }, 3500); 
        }
    }
    
    // AUTO-NEXT Z ADMINA (PO ZIELONYM EKRANIE, CZERWONYM W R2, LUB TIMEOUT)
    if ((currentState.status === "results" && currentState.winner) || currentState.status === "timeout" || currentState.status === "results_r2_wrong") {
        document.getElementById('auto-progress-msg').style.display = 'block';
        clearTimeout(autoNextTimer);
        autoNextTimer = setTimeout(() => {
            if(currentState.status === "results" || currentState.status === "timeout") {
                nextQuestion();
            }
        }, 5000);
    } else {
        document.getElementById('auto-progress-msg').style.display = 'none';
        clearTimeout(autoNextTimer);
    }
});

window.startGame = async () => {
    if(!confirm("Zresetować punkty i zacząć od nowa?")) return;
    
    const pool = parseInt(document.getElementById('poolSel').value);
    const players = ["Lila", "Kaja", "Darek", "Jas"];
    for(let p of players) { await setDoc(doc(db, "quizScores", p), { points: 0 }); }
    await setDoc(doc(db, "quizGame", "state"), { status: "idle", round: 1, question: "Czekamy na start!", blocked: [], pool: pool });
    currentQIndex = { 1: -1, 2: -1, 3: -1 };
    alert("Punkty wyzerowane! Możesz puścić pierwsze pytanie.");
};

window.nextQuestion = async () => {
    clearTimeout(autoNextTimer);
    let r = parseInt(document.getElementById('roundSel').value);
    let pool = currentState ? (currentState.pool || 1) : parseInt(document.getElementById('poolSel').value);
    
    currentQIndex[r]++;
    let qData = allDBs[pool][r][currentQIndex[r]];
    if (!qData) return alert("Koniec pytań w tej rundzie z wybranej Puli!");

    if (r === 3) {
        let bestPlayer = "Lila";
        if (currentQIndex[r] === 0) {
            const snap = await getDocs(collection(db, "quizScores"));
            let maxPts = -999;
            snap.forEach(d => { let pts = d.data().points || 0; if (pts > maxPts) { maxPts = pts; bestPlayer = d.id; } });
            let sel = document.getElementById('controllerSel');
            for(let i=0; i<sel.options.length; i++) { if(sel.options[i].value === bestPlayer) sel.selectedIndex = i; }
        }
        await setDoc(doc(db, "quizGame", "state"), { status: "setup_nomination", round: 3, category: qData.cat, question: qData.q, options: qData.o, correctIndex: qData.c, blocked: [], pool: pool });
    } else {
        let payload = { status: "reading", round: r, question: qData.q, blocked: [], fastest: "", winner: "", loser: "", givenAnswer: "", tick: Date.now(), pool: pool };
        if (r === 1) { payload.options = qData.o; payload.correctIndex = qData.c; }
        await setDoc(doc(db, "quizGame", "state"), payload);
    }
};

window.startNominationPhase = async () => {
    let controller = document.getElementById('controllerSel').value;
    await updateDoc(doc(db, "quizGame", "state"), { status: "nominating", controller: controller });
};

window.judgeAnswer = async (isCorrect) => {
    let player = currentState.fastest;
    let aTick = Date.now();
    let ans = currentState.givenAnswer; 
    
    await updateDoc(doc(db, "quizGame", "state"), { status: "results_pending_r2", fastest: player, givenAnswer: ans, isAnswerCorrect: isCorrect });
    
    setTimeout(async () => {
        if (isCorrect) {
            const scoreRef = doc(db, "quizScores", player);
            const scoreSnap = await getDoc(scoreRef);
            await updateDoc(scoreRef, { points: scoreSnap.data().points + 10 });
            await updateDoc(doc(db, "quizGame", "state"), { status: "results", winner: player, loser: "", pointsChange: 10, givenAnswer: ans, answerTick: aTick });
            
        } else {
            const scoreRef = doc(db, "quizScores", player);
            const scoreSnap = await getDoc(scoreRef);
            await updateDoc(scoreRef, { points: scoreSnap.data().points - 10 });

            let newBlocked = [...(currentState.blocked || []), player];
            
            if (newBlocked.length >= 4) {
                await updateDoc(doc(db, "quizGame", "state"), { status: "timeout", blocked: newBlocked });
            } else {
                await updateDoc(doc(db, "quizGame", "state"), { status: "results_wrong", loser: player, winner: "", pointsChange: -10, givenAnswer: ans, answerTick: aTick, blocked: newBlocked });
                
                setTimeout(async () => {
                    let freshSnap = await getDoc(doc(db, "quizGame", "state"));
                    if(freshSnap.exists() && freshSnap.data().status === "results_wrong") {
                        await updateDoc(doc(db, "quizGame", "state"), { status: "reading", blocked: newBlocked, fastest: "", givenAnswer: "", tick: Date.now() });
                    }
                }, 4000); 
            }
        }
    }, 3500); 
};
