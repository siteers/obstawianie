<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Bet | Hub System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
      --glass: rgba(15, 23, 42, 0.85); --border: rgba(255, 255, 255, 0.1);
      --gray: #64748b;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
      margin: 0; overflow: hidden; display: flex; justify-content: center;
      align-items: center; min-height: 100vh; transition: 0.3s;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .nightmare-mode { background: #300 !important; filter: invert(1) contrast(300%) blur(2px) !important; }
    @keyframes glitch { 0% { transform: translate(0); } 25% { transform: translate(-10px, 10px); } 50% { transform: translate(10px, -10px); } 100% { transform: translate(0); } }
    .nightmare-shake { animation: glitch 0.1s infinite !important; }
    #bg-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .hub-container, #login-container { z-index: 10; position: relative; text-align: center; width: 90vw; max-width: 500px; }
    #login-container { display: flex; flex-direction: column; justify-content: center; align-items: center; max-width: 400px; }
    .hub-container { display: none; }
    
    .login-card {
        background: rgba(10, 15, 30, 0.9); padding: 30px; border-radius: 20px;
        border: 1px solid var(--cyan); box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
        width: 100%; backdrop-filter: blur(10px); box-sizing: border-box;
    }
    
    input, select {
        width: 100%; padding: 15px; margin: 10px 0;
        background: rgba(0,0,0,0.5); border: 1px solid var(--border);
        color: #fff; border-radius: 10px; font-size: 16px;
        box-sizing: border-box; height: 50px; display: block;
    }
    select option { background: #000; color: #fff; }
    
    .auth-links { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
    .auth-link { font-size: 11px; color: var(--cyan); text-decoration: none; font-weight: bold; cursor: pointer; }
    .changelog { margin-top: 30px; text-align: left; font-size: 10px; color: var(--cyan); opacity: 0.8; border-top: 1px solid rgba(0, 212, 255, 0.2); padding-top: 10px; max-height: 120px; overflow-y: auto; }
    
    .btn-cyber {
      display: block; width: 100%; padding: 22px; margin: 12px 0;
      background: var(--glass); border: 1px solid var(--border); border-radius: 25px;
      color: #fff; font-size: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-shadow: 0 2px 10px rgba(0,0,0,0.5); box-sizing: border-box;
      transition: transform 0.02s linear, background 0.3s;
    }
    .btn-cyber:hover { transform: translateY(-3px); }
    .btn-service { background: linear-gradient(135deg, #ea580c, #c2410c); border: 1px solid rgba(234, 88, 12, 0.3); }
    .btn-main { background: linear-gradient(135deg, #d4af37, #b4912f); color: #000; border: 1px solid rgba(212, 175, 55, 0.4); }
    .btn-food { background: linear-gradient(135deg, #10b981, #047857); border: 1px solid rgba(16, 185, 129, 0.3); }
    .btn-mundial { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: 1px solid rgba(59, 130, 246, 0.3); }
    .btn-others { background: linear-gradient(135deg, #a855f7, #7e22ce); border: 1px solid rgba(168, 85, 247, 0.3); }
    .btn-delete-user { background: linear-gradient(135deg, #ff0000, #800000); border: 1px solid #ff4757; }
    .btn-enter { background: linear-gradient(90deg, var(--cyan), #2e86de); color: white; box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3); margin-top: 20px; }
    
    .btn-push-activate { background: linear-gradient(135deg, #1e3c72, #2a5298); border: 1px solid #2a5298; font-size: 14px; padding: 15px; margin-top: 25px; }

    #sub-menu { display: none; }
    #sub-menu.active { display: block; animation: slideUp 0.5s forwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    
    #logoutBtn { 
        position: fixed; top: 50px; right: 20px; 
        background: rgba(255,0,0,0.2); border: 1px solid #ff4757; color: #ff4757; 
        padding: 12px 20px; border-radius: 25px; font-size: 12px; cursor: pointer; 
        z-index: 100; display: none; font-weight: bold; backdrop-filter: blur(5px);
    }
    h1 { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: 5px; margin-bottom: 30px; }
    h2 { color: var(--gold); margin: 0 0 30px 0; font-size: 24px; text-transform: uppercase; letter-spacing: 3px; }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <button id="logoutBtn" onclick="logout()">WYLOGUJ</button>

  <div id="login-container">
    <div class="login-card" id="loginCardElement">
        <h2>TERMINAL DOSTĘPOWY</h2>
        <select id="userSelect">
            <option value="" disabled selected>Wybierz użytkownika</option>
        </select>
        <input type="password" id="userPass" placeholder="Hasło dostępu">
        <div class="auth-links">
            <a class="auth-link" onclick="forgotPassword()">Zapomniałem hasła</a>
        </div>
        <button class="btn-cyber btn-enter" onclick="login()">ZALOGUJ</button>
        <div class="changelog">
            <div>Update (01.04.2026) - Rick Astley pozdrawia</div>
            <div>Update (31.03.2026) - Wprowadzono limity 20 typowań...</div>
            <div>Update (05.03.2026) V.510 - Wprowadzono zmiany w wyborze jedzenia</div>
        </div>
    </div>
  </div>

  <div class="hub-container" id="hub-view">
    <h1 id="hub-title">Witaj, <span id="userNameDisplay" style="color:var(--cyan)">User</span></h1>
    <div id="initial-view">
      <button class="btn-cyber btn-service extra-feature" onclick="window.open('service_desk.html', '_blank')">🛠️ Service Desk</button>
      <div id="user-buttons">
          <button class="btn-cyber btn-main" onclick="revealMenu()">Obstawianie godzin</button>
          <button class="btn-cyber btn-food extra-feature" onclick="window.open('jedzenie_1.html', '_blank')">Wybór jedzenia</button>
          <button class="btn-cyber btn-mundial extra-feature" onclick="window.open('mundial.html', '_self')">Mundial 2026</button>
          <button class="btn-cyber btn-others extra-feature" onclick="window.open('inne_zaklady.html', '_blank')">Inne zakłady</button>
          <button class="btn-cyber btn-push-activate" onclick="enablePushNotifications()">🔔 Aktywuj Powiadomienia</button>
      </div>
      <div id="admin-buttons" style="display:none;">
          <button class="btn-cyber btn-push-activate" onclick="enablePushNotifications()">🔔 Aktywuj Powiadomienia</button>
          <button class="btn-cyber btn-mundial" onclick="window.open('mundial.html', '_self')">Mundial 2026</button>
          <button class="btn-cyber btn-others" onclick="window.open('inne_zaklady.html', '_blank')">🎲 Inne Zakłady</button>
      </div>
    </div>
    <div id="sub-menu">
      <button id="add-hour-btn" class="btn-cyber btn-sub" onclick="window.open('dodaj.html', '_blank')">➕ Dodaj godzinę</button>
      <button class="btn-cyber btn-sub" onclick="window.open('ranking.html', '_blank')">🏆 Ranking</button>
      <button class="btn-cyber btn-sub" onclick="window.open('lista.html', '_blank')">📋 Lista</button>
      <button onclick="hideMenu()" style="background:none; border:none; color:rgba(255,255,255,0.3); cursor:pointer; margin-top:20px; font-weight:bold; text-transform:uppercase; letter-spacing:1px;">← Wróć</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);

    // KLUCZOWE: Naprawa listy użytkowników
    onSnapshot(collection(db, "passwords"), (snap) => {
        const select = document.getElementById('userSelect');
        // Zachowujemy opcję domyślną
        select.innerHTML = '<option value="" disabled selected>Wybierz użytkownika</option>';
        snap.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.id;
            opt.innerText = d.id === "Admin" ? "🔑 ADMIN SYSTEMU" : d.id;
            select.appendChild(opt);
        });
    });

    // Reszta Twojej oryginalnej logiki (login, logout, itd.) pozostaje bez zmian...
    window.login = async () => { /* Twoja logika logowania */ };
    window.logout = () => { localStorage.removeItem('cyberUser'); location.reload(); };
    window.revealMenu = () => { document.getElementById('initial-view').style.display = 'none'; document.getElementById('sub-menu').classList.add('active'); };
    window.hideMenu = () => { document.getElementById('sub-menu').classList.remove('active'); setTimeout(() => { document.getElementById('initial-view').style.display = 'block'; }, 100); };
    
    // Canvas background
    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    // ... reszta logiki canvasa ...
  </script>
</body>
</html>
