<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Bet | Hub System</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cyber-Bet">
  
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="logo.png">

  <style>
    :root {
      --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
      --glass: rgba(15, 23, 42, 0.85); --border: rgba(255, 255, 255, 0.1);
      --gray: #64748b;
    }

    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
      margin: 0; overflow: hidden; display: flex; justify-content: center;
      align-items: center; min-height: 100vh; transition: 0.3s;
      overscroll-behavior-y: contain; user-select: none; -webkit-tap-highlight-color: transparent;
    }

    /* NIGHTMARE MODE STYLES */
    .nightmare-mode { background: #300 !important; filter: invert(1) contrast(300%) blur(2px) !important; transition: 0.1s !important; }
    @keyframes glitch { 0% { transform: translate(0); } 25% { transform: translate(-10px, 10px); } 50% { transform: translate(10px, -10px); } 100% { transform: translate(0); } }
    .nightmare-shake { animation: glitch 0.1s infinite !important; }

    #bg-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    .hub-container {
      z-index: 10; position: relative; text-align: center;
      width: 90vw; max-width: 500px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      display: none; /* Ukryte przed zalogowaniem */
    }

    /* EKRAN LOGOWANIA */
    #login-container {
        z-index: 20; position: relative; display: flex; flex-direction: column;
        align-items: center; justify-content: center; width: 90vw; max-width: 400px;
    }
    
    .login-card {
        background: rgba(10, 15, 30, 0.9); padding: 40px; border-radius: 20px;
        border: 1px solid var(--cyan); box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
        width: 100%; text-align: center; backdrop-filter: blur(10px);
        box-sizing: border-box;
    }

    input, select {
        width: 100%; padding: 15px; margin: 10px 0;
        background: rgba(0,0,0,0.5); border: 1px solid var(--border);
        color: #fff; border-radius: 10px; font-size: 16px; box-sizing: border-box;
        font-family: inherit;
    }
    select option { background: #000; color: #fff; }
    input:focus, select:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }

    /* LINKI POMOCNICZE (Zapomniałem hasła / Rejestracja) */
    .auth-links { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
    .auth-link { font-size: 11px; color: var(--cyan); text-decoration: none; font-weight: bold; cursor: pointer; opacity: 0.8; transition: 0.2s; }
    .auth-link:hover { opacity: 1; text-decoration: underline; }

    /* PRZYCISKI GŁÓWNE */
    .btn-cyber {
      display: block; width: 100%; padding: 22px; margin: 12px 0;
      background: var(--glass); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 25px;
      color: #fff; font-size: 18px; font-weight: 900;
      text-transform: uppercase; letter-spacing: 2px;
      cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-decoration: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      box-sizing: border-box; outline: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5); 
    }

    .btn-cyber:hover { transform: translateY(-3px) scale(1.02); filter: brightness(1.1); }
    .btn-cyber:active { transform: scale(0.96); opacity: 0.9; }

    /* --- PALETA KOLORÓW (Deep Cyber) --- */
    .btn-service { background: linear-gradient(135deg, #ea580c, #c2410c); border: 1px solid rgba(234, 88, 12, 0.3); }
    .btn-main { background: linear-gradient(135deg, #d4af37, #b4912f); color: #000; text-shadow: none; border: 1px solid rgba(212, 175, 55, 0.4); }
    .btn-food { background: linear-gradient(135deg, #10b981, #047857); border: 1px solid rgba(16, 185, 129, 0.3); }
    .btn-mundial { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: 1px solid rgba(59, 130, 246, 0.3); }
    .btn-others { background: linear-gradient(135deg, #a855f7, #7e22ce); border: 1px solid rgba(168, 85, 247, 0.3); }
    
    /* Przycisk Usuwania (Admin) */
    .btn-delete-user { background: linear-gradient(135deg, #ff0000, #800000); border: 1px solid #ff4757; }

    /* Login Button */
    .btn-enter { background: linear-gradient(90deg, var(--cyan), #2e86de); color: white; box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3); margin-top: 20px; text-shadow: none; }

    /* SUB-MENU */
    #sub-menu { display: none; opacity: 0; transform: translateY(20px); }
    #sub-menu.active { display: block; opacity: 1; transform: translateY(0); animation: slideUp 0.5s forwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .btn-sub { background: var(--glass); color: var(--cyan); border-color: rgba(0, 212, 255, 0.2); text-shadow: none; }

    /* Logout Button */
    #logoutBtn { position: fixed; top: 20px; right: 20px; background: rgba(255,0,0,0.2); border: 1px solid #ff4757; color: #ff4757; padding: 8px 15px; border-radius: 20px; font-size: 10px; cursor: pointer; z-index: 100; display: none; }

    h1 { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: 5px; margin-bottom: 30px; opacity: 0.7; }
    h2 { color: var(--gold); margin: 0 0 30px 0; font-size: 24px; text-transform: uppercase; letter-spacing: 3px; }

    /* MODAL USUWANIA */
    #delete-user-modal {
        position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000;
        display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
    }
    .modal-content {
        background: #151b26; border: 1px solid #ff4757; padding: 30px;
        border-radius: 20px; width: 90%; max-width: 400px; text-align: center;
        box-shadow: 0 0 40px rgba(255, 71, 87, 0.2);
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <button id="logoutBtn" onclick="logout()">WYLOGUJ</button>
  <audio id="horrorSound" src="https://assets.mixkit.co/active_storage/sfx/2541/2541-preview.mp3"></audio>

  <div id="login-container">
    <div class="login-card" id="loginCardElement">
        <h2>TERMINAL DOSTĘPOWY</h2>
        <select id="userSelect">
            <option value="" disabled selected>Wybierz użytkownika</option>
            <option disabled>──────────</option>
            <option value="Admin">🔑 ADMIN SYSTEMU</option>
        </select>
        <input type="password" id="userPass" placeholder="Hasło dostępu">
        
        <div class="auth-links">
            <a class="auth-link" onclick="forgotPassword()">Zapomniałem hasła</a>
            <a class="auth-link" onclick="publicRegister()">Zarejestruj się (Nowy gracz)</a>
        </div>

        <button class="btn-cyber btn-enter" onclick="login()">ZALOGUJ</button>
    </div>
  </div>

  <div class="hub-container" id="hub-view">
    <h1 id="hub-title">Witaj, <span id="userNameDisplay" style="color:var(--cyan)">User</span></h1>
    
    <div id="initial-view">
      <button class="btn-cyber btn-service" onclick="window.open('service_desk.html', '_blank')">🛠️ Service Desk</button>
      
      <div id="user-buttons">
          <button class="btn-cyber btn-main" onclick="revealMenu()">Obstawianie godzin</button>
          <button class="btn-cyber btn-food" onclick="window.open('jedzenie_1.html', '_blank')">Wybór jedzenia</button>
          <button class="btn-cyber btn-mundial" onclick="alert('Dostępne już wkrótce!')">Mundial 2026</button>
          <button class="btn-cyber btn-others" onclick="window.open('inne_zaklady.html', '_blank')">Inne zakłady</button>
      </div>

      <div id="admin-buttons" style="display:none;">
          <button class="btn-cyber btn-others" onclick="window.open('inne_zaklady.html', '_blank')">🎲 Inne Zakłady (Pełny Dostęp)</button>
          <button class="btn-cyber btn-delete-user" onclick="deleteUserFlow()">❌ Usuń Gracza</button>
      </div>
    </div>

    <div id="sub-menu">
      <button class="btn-cyber btn-sub" onclick="window.open('dodaj.html', '_blank')">➕ Dodaj godzinę</button>
      <button class="btn-cyber btn-sub" onclick="window.open('ranking.html', '_blank')">🏆 Ranking</button>
      <button class="btn-cyber btn-sub" onclick="window.open('lista.html', '_blank')">📋 Lista</button>
      <button class="btn-cyber btn-sub" onclick="window.open('regulamin.html', '_blank')">📜 Regulamin</button>
      <button onclick="hideMenu()" style="background:none; border:none; color:rgba(255,255,255,0.3); cursor:pointer; margin-top:20px; font-weight:bold; text-transform:uppercase; letter-spacing:1px;">← Wróć</button>
    </div>
  </div>

  <div id="delete-user-modal">
      <div class="modal-content">
          <h3 style="color: #ff4757; margin-top:0;">USUWANIE GRACZA</h3>
          <p style="font-size:12px; color:#aaa;">Wybierz użytkownika, którego chcesz trwale usunąć z systemu. Tej operacji nie da się cofnąć.</p>
          
          <select id="userDeleteSelect">
              <option value="" disabled selected>Wczytywanie...</option>
          </select>

          <div style="display:flex; gap:10px; margin-top:20px; justify-content:center;">
              <button class="btn-cyber" style="background:transparent; border:1px solid #555; font-size:12px; padding:15px;" onclick="closeDeleteModal()">Anuluj</button>
              <button class="btn-cyber" style="background:linear-gradient(135deg, #ff0000, #990000); font-size:12px; padding:15px;" onclick="confirmDeleteUser()">USUŃ</button>
          </div>
      </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- ŁADOWANIE LISTY UŻYTKOWNIKÓW (LOGOWANIE) ---
  onSnapshot(collection(db, "passwords"), (snap) => {
      const select = document.getElementById('userSelect');
      select.innerHTML = `
        <option value="" disabled selected>Wybierz użytkownika</option>
        <option disabled>──────────</option>
        <option value="Admin">🔑 ADMIN SYSTEMU</option>
      `;
      
      snap.forEach(d => {
          if (d.id !== "Admin") {
              const opt = document.createElement('option');
              opt.value = d.id; 
              opt.innerText = d.id;
              select.insertBefore(opt, select.children[1]); 
          }
      });
  });

  // --- SPRAWDZANIE SESJI ---
  const savedUser = localStorage.getItem('cyberUser');
  if (savedUser) {
      showHub(savedUser);
  }

  // --- LOGOWANIE ---
  window.login = async () => {
      const user = document.getElementById('userSelect').value;
      const pass = document.getElementById('userPass').value.trim();

      if(!user) return alert("Wybierz użytkownika!");

      if(user === "Admin") {
          if(pass === "1010") {
              saveSession("Admin");
          } else {
              triggerNightmare();
          }
          return;
      }

      try {
          const userDoc = await getDoc(doc(db, "passwords", user));
          if (userDoc.exists()) {
              const userData = userDoc.data();
              if (String(userData.password) === String(pass)) {
                  saveSession(user);
              } else {
                  triggerNightmare();
              }
          } else {
              alert("Brak hasła w bazie.");
          }
      } catch (error) {
          console.error(error);
          alert("Błąd połączenia.");
      }
  };

  // --- FUNKCJE POMOCNICZE (REJESTRACJA / RESET) ---
  window.publicRegister = async () => {
      const n = prompt("Jak chcesz się nazywać?"); if(!n) return;
      const check = await getDoc(doc(db, "passwords", n));
      if(check.exists()) return alert("Taki użytkownik już istnieje!");

      const p = prompt("Ustaw hasło (4 cyfry):"); if(!p) return;
      await setDoc(doc(db, "passwords", n), { password: p });
      alert("Witaj " + n + "! Możesz się teraz zalogować.");
  };

  window.forgotPassword = async () => {
      const n = document.getElementById('userSelect').value; 
      if(!n || n === "Admin") return alert("Wybierz swojego użytkownika z listy!");
      
      if(prompt("ADMIN CODE (Poproś Admina):") === "0000") {
          const newP = prompt("Podaj nowe hasło:");
          if(newP) {
              await setDoc(doc(db, "passwords", n), { password: newP }, { merge: true });
              alert("Hasło zmienione.");
          }
      } else {
          triggerNightmare();
      }
  };

  // --- USUWANIE GRACZA (MODAL) ---
  window.deleteUserFlow = async () => {
      const modal = document.getElementById('delete-user-modal');
      const select = document.getElementById('userDeleteSelect');
      
      select.innerHTML = '<option value="" disabled selected>Ładowanie...</option>';
      modal.style.display = 'flex';

      // Pobierz listę graczy (bez Admina)
      const snap = await getDocs(collection(db, "passwords"));
      select.innerHTML = '<option value="" disabled selected>Wybierz gracza...</option>';
      
      snap.forEach(d => {
          if (d.id !== "Admin") {
              const opt = document.createElement('option');
              opt.value = d.id;
              opt.innerText = d.id;
              select.appendChild(opt);
          }
      });
  };

  window.closeDeleteModal = () => {
      document.getElementById('delete-user-modal').style.display = 'none';
  };

  window.confirmDeleteUser = async () => {
      const userToDelete = document.getElementById('userDeleteSelect').value;
      
      if (!userToDelete) return alert("Wybierz gracza z listy!");

      if (confirm(`Potwierdzasz usunięcie gracza "${userToDelete}"?`)) {
          await deleteDoc(doc(db, "passwords", userToDelete));
          // Opcjonalnie czyścimy też ranking
          await deleteDoc(doc(db, "ranking", userToDelete)); 
          alert("Gracz usunięty.");
          closeDeleteModal();
      }
  };

  // --- EFEKT NIGHTMARE ---
  function triggerNightmare() {
      const audio = document.getElementById('horrorSound');
      audio.currentTime = 0;
      audio.play().catch(()=>{}); 

      document.body.classList.add('nightmare-mode');
      document.getElementById('loginCardElement').classList.add('nightmare-shake');
      
      setTimeout(() => {
          document.body.classList.remove('nightmare-mode');
          document.getElementById('loginCardElement').classList.remove('nightmare-shake');
      }, 1000);
  }

  document.getElementById('userPass').addEventListener('keypress', (e) => { if(e.key==='Enter') login(); });

  function saveSession(user) {
      localStorage.setItem('cyberUser', user);
      showHub(user);
  }

  function showHub(user) {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('hub-view').style.display = 'block';
      document.getElementById('logoutBtn').style.display = 'block';
      document.getElementById('userNameDisplay').innerText = user;

      const userBtns = document.getElementById('user-buttons');
      const adminBtns = document.getElementById('admin-buttons');

      if (user === "Admin") {
          userBtns.style.display = 'none';
          adminBtns.style.display = 'block'; 
      } else {
          userBtns.style.display = 'block';
          adminBtns.style.display = 'none';
      }
  }

  window.logout = () => {
      localStorage.removeItem('cyberUser');
      location.reload();
  };

  window.revealMenu = () => {
      document.getElementById('initial-view').style.display = 'none';
      document.getElementById('sub-menu').classList.add('active');
  };

  window.hideMenu = () => {
      document.getElementById('sub-menu').classList.remove('active');
      setTimeout(() => { document.getElementById('initial-view').style.display = 'block'; }, 100);
  };

  // --- BACKGROUND ---
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let pts = [];
  function init() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    pts = [];
    for (let i = 0; i < 70; i++) { pts.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5 }); }
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pts.forEach((p, i) => {
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
      ctx.fillStyle = 'rgba(212, 175, 55, 0.3)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2); ctx.fill();
      for (let j = i + 1; j < pts.length; j++) {
        const p2 = pts[j];
        if (Math.hypot(p.x - p2.x, p.y - p2.y) < 150) {
          ctx.strokeStyle = `rgba(0, 212, 255, ${0.5 - Math.hypot(p.x - p2.x, p.y - p2.y)/300})`;
          ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        }
      }
    });
    requestAnimationFrame(draw);
  }
  window.onresize = init; init(); draw();
</script>
</body>
</html>
