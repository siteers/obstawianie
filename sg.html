<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Bet | Hub System</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cyber-Bet">
  
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="logo.png">

  <style>
    :root {
      --gold: #d4af37; --cyan: #00d4ff; --bg: #020408;
      --glass: rgba(15, 23, 42, 0.85); --border: rgba(255, 255, 255, 0.1);
      --gray: #64748b;
    }

    body.light {
      --bg: #f2f2f2; --glass: rgba(255, 255, 255, 0.9); --border: rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
      margin: 0; overflow: hidden; display: flex; justify-content: center;
      align-items: center; min-height: 100vh; transition: 0.3s;
      /* Ustawienia pod aplikację */
      overscroll-behavior-y: contain; 
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #bg-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    .hub-container {
      z-index: 10; position: relative; text-align: center;
      width: 90vw; max-width: 500px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* --- PRZYCISKI GŁÓWNE --- */
    .btn-cyber {
      display: block; width: 100%; padding: 22px; margin: 12px 0;
      background: var(--glass); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 25px;
      color: #fff; font-size: 18px; font-weight: 900;
      text-transform: uppercase; letter-spacing: 2px;
      cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-decoration: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      box-sizing: border-box;
      outline: none;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5); /* Cień pod tekstem dla czytelności */
    }

    @media (hover: hover) {
      .btn-cyber:hover {
        transform: translateY(-5px) scale(1.02);
        filter: brightness(1.1);
      }
    }

    .btn-cyber:active {
      transform: scale(0.96);
      opacity: 0.8;
      background: rgba(255, 255, 255, 0.1);
    }

    /* --- STONOWANE KOLORY (Deep Gradients) --- */
    
    /* Service Desk: Głęboki pomarańcz/rdza */
    .btn-service { 
        background: linear-gradient(135deg, #c2410c, #7c2d12); 
        border: 1px solid rgba(194, 65, 12, 0.3);
    }

    /* Obstawianie: Głębokie złoto/brąz */
    .btn-main { 
        background: linear-gradient(135deg, #b45309, #78350f); 
        color: #fff; 
        border: 1px solid rgba(180, 83, 9, 0.3);
    }

    /* Jedzenie: Ciemna zieleń */
    .btn-food { 
        background: linear-gradient(135deg, #15803d, #14532d); 
        border: 1px solid rgba(21, 128, 61, 0.3);
    }

    /* Mundial: Granatowy/Królewski błękit */
    .btn-mundial { 
        background: linear-gradient(135deg, #1d4ed8, #1e3a8a); 
        border: 1px solid rgba(29, 78, 216, 0.3);
    }

    /* Inne Zakłady: Głęboki fiolet */
    .btn-others { 
        background: linear-gradient(135deg, #7e22ce, #581c87); 
        border: 1px solid rgba(126, 34, 206, 0.3);
    }
    
    /* --- SUB-MENU OBSTAWIANIA --- */
    #sub-menu { display: none; opacity: 0; transform: translateY(20px); }
    #sub-menu.active { display: block; opacity: 1; transform: translateY(0); animation: slideUp 0.5s forwards; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-sub { 
        background: var(--glass);
        color: var(--cyan); 
        border-color: rgba(0, 212, 255, 0.2); 
    }

    #darkModeBtn {
      position: fixed; top: calc(20px + env(safe-area-inset-top)); 
      right: 20px; padding: 10px 20px;
      border-radius: 30px; border: 1px solid var(--border);
      background: var(--glass); color: var(--gold);
      cursor: pointer; font-weight: bold; z-index: 100; font-size: 12px;
    }

    h1 {
      font-size: 11px; color: var(--gray); text-transform: uppercase;
      letter-spacing: 5px; margin-bottom: 30px; opacity: 0.7;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <button id="darkModeBtn">☀️ Light</button>

  <div class="hub-container">
    <h1 id="hub-title">Terminal Dostępowy</h1>
    
    <div id="initial-view">
      <button class="btn-cyber btn-service" onclick="window.open('service_desk.html', '_blank')">🛠️ Service Desk</button>
      
      <button class="btn-cyber btn-main" onclick="revealMenu()">Obstawianie godzin</button>
      
      <button class="btn-cyber btn-food" onclick="window.open('jedzenie_1.html', '_blank')">Wybór jedzenia</button>
      
      <button class="btn-cyber btn-mundial" onclick="alert('Dostępne już wkrótce!')">Mundial 2026</button>
      
      <button class="btn-cyber btn-others" onclick="window.open('inne_zaklady.html', '_blank')">Inne zakłady</button>
    </div>

    <div id="sub-menu">
      <button class="btn-cyber btn-sub" onclick="window.open('dodaj.html', '_blank')">➕ Dodaj godzinę</button>
      <button class="btn-cyber btn-sub" onclick="window.open('ranking.html', '_blank')">🏆 Ranking</button>
      <button class="btn-cyber btn-sub" onclick="window.open('lista.html', '_blank')">📋 Lista</button>
      <button class="btn-cyber btn-sub" onclick="window.open('regulamin.html', '_blank')">📜 Regulamin</button>
      
      <button onclick="hideMenu()" style="background:none; border:none; color:rgba(255,255,255,0.3); cursor:pointer; margin-top:20px; font-weight:bold; text-transform:uppercase; letter-spacing:1px;">← Wróć</button>
    </div>
  </div>

<script>
  window.addEventListener('pageshow', (event) => {
    document.querySelectorAll('.btn-cyber').forEach(btn => {
      btn.blur(); 
    });
  });

  function revealMenu() {
    document.getElementById('initial-view').style.display = 'none';
    const menu = document.getElementById('sub-menu');
    menu.classList.add('active');
    document.getElementById('hub-title').innerText = "Moduł Obstawiania";
  }

  function hideMenu() {
    document.getElementById('sub-menu').classList.remove('active');
    setTimeout(() => {
        document.getElementById('initial-view').style.display = 'block';
        document.getElementById('hub-title').innerText = "Terminal Dostępowy";
    }, 100);
  }

  const darkBtn = document.getElementById("darkModeBtn");
  darkBtn.onclick = () => {
    document.body.classList.toggle("light");
    darkBtn.textContent = document.body.classList.contains("light") ? "🌙 Dark" : "☀️ Light";
  };

  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let pts = [];

  function init() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    pts = [];
    for (let i = 0; i < 70; i++) {
      pts.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const isLight = document.body.classList.contains('light');
    
    pts.forEach((p, i) => {
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

      ctx.fillStyle = isLight ? 'rgba(0,0,0,0.1)' : 'rgba(212, 175, 55, 0.3)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
      ctx.fill();

      for (let j = i + 1; j < pts.length; j++) {
        const p2 = pts[j];
        const d = Math.hypot(p.x - p2.x, p.y - p2.y);
        if (d < 150) {
          ctx.strokeStyle = isLight ? `rgba(0,0,0,${0.1 - d/1500})` : `rgba(0, 212, 255, ${0.5 - d/300})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    });
    requestAnimationFrame(draw);
  }

  window.onresize = init;
  init();
  draw();
</script>
</body>
</html>
