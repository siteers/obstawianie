<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Bet | Mundial 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <link rel="manifest" href="./manifest.json">
    <style>
        :root { --gold: #d4af37; --cyan: #00d4ff; --bg: #020408; --glass: rgba(15, 23, 42, 0.9); --border: rgba(255, 255, 255, 0.1); --error: #ff4d4d; --success: #10b981; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 20px; overflow-x: hidden; }
        .nav { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .btn-back { background: var(--glass); border: 1px solid var(--border); padding: 10px 20px; color: #fff; text-decoration: none; border-radius: 10px; font-weight: bold; }
        
        h1 { text-align: center; color: var(--gold); letter-spacing: 3px; font-size: 28px; margin-bottom: 40px; text-shadow: 0 0 20px rgba(212,175,55,0.3); }
        .section-title { color: var(--cyan); border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin: 40px 0 20px; text-transform: uppercase; font-size: 22px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 15px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .title { color: var(--gold); font-size: 1.2rem; font-weight: 900; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Tabela Grupy */
        .standings { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 0.8rem; text-align: center; }
        .standings th { color: #888; padding-bottom: 5px; border-bottom: 1px solid #333; }
        .standings td { padding: 4px 0; }
        .standings tr:nth-child(1) td, .standings tr:nth-child(2) td { color: var(--success); font-weight: bold; } /* Miejsca awansujące */

        /* Mecze */
        .match-row { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; margin-bottom: 10px; text-align: center; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .match-date { font-size: 0.7rem; color: var(--cyan); margin-bottom: 5px; font-weight: bold; letter-spacing: 1px; }
        .match-teams { font-size: 1rem; font-weight: bold; margin-bottom: 10px; }
        
        /* Kontrolki */
        .bet-box { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
        .bet-input { width: 45px; height: 40px; text-align: center; background: #000; color: #fff; border: 1px solid var(--gold); border-radius: 8px; font-size: 18px; font-weight: bold; }
        .btn-act { background: linear-gradient(135deg, #d4af37, #b4912f); border: none; padding: 8px 15px; border-radius: 8px; font-weight: 900; cursor: pointer; color: #000; width: 100%; text-transform: uppercase; transition: 0.2s; }
        .btn-act:hover { transform: scale(1.02); }
        .btn-conf { background: linear-gradient(135deg, #00d4ff, #0096c7); color: #fff; }
        .locked-text { color: var(--error); font-size: 12px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="nav"><a href="sg.html" class="btn-back">← WRÓĆ DO HUB</a></div>
    <h1>MUNDIAL 2026</h1>

    <div class="section-title">FAZA GRUPOWA</div>
    <div class="grid" id="groupsContainer"></div>

    <div class="section-title">FAZA PUCHAROWA</div>
    <div class="grid" id="knockoutContainer"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, doc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" }));
    const currentUser = localStorage.getItem('cyberUser');

    // 1. ZDEFINIOWANE GRUPY
    const GROUPS = {
        "Grupa A": ["Meksyk", "RPA", "Korea Płd.", "Czechy"],
        "Grupa B": ["Kanada", "Bośnia i Hercegowina", "Katar", "Szwajcaria"],
        "Grupa C": ["Brazylia", "Maroko", "Haiti", "Szkocja"],
        "Grupa D": ["USA", "Paragwaj", "Australia", "Turcja"],
        "Grupa E": ["Niemcy", "Curaçao", "WKS", "Ekwador"],
        "Grupa F": ["Holandia", "Japonia", "Szwecja", "Tunezja"],
        "Grupa G": ["Belgia", "Egipt", "Iran", "Nowa Zelandia"],
        "Grupa H": ["Hiszpania", "Cabo Verde", "Arabia Saud.", "Urugwaj"],
        "Grupa I": ["Francja", "Senegal", "Irak", "Norwegia"],
        "Grupa J": ["Argentyna", "Algieria", "Austria", "Jordania"],
        "Grupa K": ["Portugalia", "DR Konga", "Uzbekistan", "Kolumbia"],
        "Grupa L": ["Anglia", "Chorwacja", "Ghana", "Panama"]
    };

    // 2. TERMINARZ BAZOWY (Z danymi pobranymi z terminarza FIFA)
    const MATCHES = [
        // Grupa A
        { id: "A1", group: "Grupa A", t1: "Meksyk", t2: "RPA", date: "2026-06-11T21:00" },
        { id: "A2", group: "Grupa A", t1: "Korea Płd.", t2: "Czechy", date: "2026-06-12T04:00" },
        { id: "A3", group: "Grupa A", t1: "Meksyk", t2: "Korea Płd.", date: "2026-06-16T21:00" },
        { id: "A4", group: "Grupa A", t1: "RPA", t2: "Czechy", date: "2026-06-16T21:00" },
        { id: "A5", group: "Grupa A", t1: "Czechy", t2: "Meksyk", date: "2026-06-20T21:00" },
        { id: "A6", group: "Grupa A", t1: "RPA", t2: "Korea Płd.", date: "2026-06-20T21:00" },
        // Grupa B
        { id: "B1", group: "Grupa B", t1: "Kanada", t2: "Bośnia i Hercegowina", date: "2026-06-12T21:00" },
        { id: "B2", group: "Grupa B", t1: "Katar", t2: "Szwajcaria", date: "2026-06-13T21:00" },
        { id: "B3", group: "Grupa B", t1: "Kanada", t2: "Katar", date: "2026-06-18T21:00" },
        { id: "B4", group: "Grupa B", t1: "Bośnia i Hercegowina", t2: "Szwajcaria", date: "2026-06-18T21:00" },
        { id: "B5", group: "Grupa B", t1: "Szwajcaria", t2: "Kanada", date: "2026-06-23T21:00" },
        { id: "B6", group: "Grupa B", t1: "Bośnia i Hercegowina", t2: "Katar", date: "2026-06-23T21:00" },
        // Możesz w ten sam sposób dopisać pozostałe mecze dla grup C-L...
    ];

    // 3. DRABINKA PUCHAROWA (Z dynamicznymi referencjami)
    const KNOCKOUTS = [
        { id: "R32_1", stage: "1/16 Finału", ref1: "1A", ref2: "3C/D/E", date: "2026-06-28T18:00" },
        { id: "R32_2", stage: "1/16 Finału", ref1: "2A", ref2: "2B", date: "2026-06-28T22:00" },
        { id: "R32_3", stage: "1/16 Finału", ref1: "1B", ref2: "3E/F/G", date: "2026-06-29T18:00" }
    ];

    // --- FUNKCJE OBSŁUGI ZAKŁADÓW ---
    window.propose = async (id) => {
        const s1 = document.getElementById(`s1_${id}`).value;
        const s2 = document.getElementById(`s2_${id}`).value;
        if(s1 === "" || s2 === "") return alert("Musisz podać wynik!");
        await updateDoc(doc(db, "mundial_matches", id), {
            status: "pending", proposedScore1: parseInt(s1), proposedScore2: parseInt(s2), proposer: currentUser
        }).catch(err => {
            // Jeśli dokument nie istnieje, stwórz go (First bet)
            import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js").then(({setDoc}) => {
                setDoc(doc(db, "mundial_matches", id), { status: "pending", proposedScore1: parseInt(s1), proposedScore2: parseInt(s2), proposer: currentUser });
            });
        });
    };

    window.confirm = async (id) => {
        const ref = doc(db, "mundial_matches", id);
        const data = (await getDoc(ref)).data();
        if(data.proposer === currentUser) return alert("Błąd: Nie możesz sam zatwierdzić swojego wyniku!");
        await updateDoc(ref, { status: "finished", realScore1: data.proposedScore1, realScore2: data.proposedScore2, verifier: currentUser });
    };

    // --- GŁÓWNY SILNIK (RENDEROWANIE + TABELE) ---
    onSnapshot(collection(db, "mundial_matches"), (snap) => {
        const gCont = document.getElementById('groupsContainer');
        const kCont = document.getElementById('knockoutContainer');
        gCont.innerHTML = ""; kCont.innerHTML = "";
        
        const dbData = {};
        snap.forEach(d => dbData[d.id] = d.data());

        // SILNIK OBLICZANIA TABEL
        const standings = {};
        const groupLockStatus = {};

        Object.keys(GROUPS).forEach(gName => {
            standings[gName] = {};
            GROUPS[gName].forEach(t => standings[gName][t] = { pts: 0, gd: 0, gs: 0, played: 0 });
            
            let finishedMatches = 0;
            MATCHES.filter(m => m.group === gName).forEach(m => {
                const dbM = dbData[m.id];
                if (dbM && dbM.status === "finished") {
                    finishedMatches++;
                    const s1 = dbM.realScore1, s2 = dbM.realScore2;
                    const t1 = standings[gName][m.t1], t2 = standings[gName][m.t2];
                    
                    t1.played++; t2.played++;
                    t1.gs += s1; t2.gs += s2;
                    t1.gd += (s1 - s2); t2.gd += (s2 - s1);
                    
                    if (s1 > s2) t1.pts += 3;
                    else if (s1 < s2) t2.pts += 3;
                    else { t1.pts += 1; t2.pts += 1; }
                }
            });
            groupLockStatus[gName] = finishedMatches >= 6; // Grupa zamyka się po 6 meczach
        });

        // Generowanie Widoku Grup
        Object.keys(GROUPS).forEach(gName => {
            // Sortowanie: Punkty -> Bilans -> Zdobyte
            const sortedTeams = Object.keys(standings[gName]).sort((a,b) => {
                const tA = standings[gName][a], tB = standings[gName][b];
                if (tA.pts !== tB.pts) return tB.pts - tA.pts;
                if (tA.gd !== tB.gd) return tB.gd - tA.gd;
                return tB.gs - tA.gs;
            });

            const isLocked = groupLockStatus[gName];
            let html = `<div class="card">
                <div class="title">${gName} ${isLocked ? '<span style="color:var(--error); font-size:0.7rem;">(ZAKOŃCZONA)</span>' : ''}</div>
                <table class="standings">
                    <tr><th>Drużyna</th><th>M</th><th>Bilans</th><th>PKT</th></tr>`;
            
            sortedTeams.forEach((t, index) => {
                const st = standings[gName][t];
                html += `<tr><td>${index+1}. ${t}</td><td>${st.played}</td><td>${st.gd > 0 ? '+'+st.gd : st.gd}</td><td><b>${st.pts}</b></td></tr>`;
            });
            html += `</table><hr style="border:0; border-top:1px solid #333; margin:15px 0;">`;

            MATCHES.filter(m => m.group === gName).forEach(m => {
                const dbM = dbData[m.id] || { status: "upcoming" };
                const matchLocked = new Date() > new Date(m.date) || isLocked;

                html += `<div class="match-row">
                    <div class="match-date">${m.date.replace('T', ' | ')}</div>
                    <div class="match-teams">${m.t1} - ${m.t2}</div>`;
                
                if (dbM.status === "finished") {
                    html += `<div style="color:var(--gold); font-size:18px; font-weight:900;">${dbM.realScore1} : ${dbM.realScore2}</div>`;
                } else if (dbM.status === "pending") {
                    html += `<div style="color:var(--cyan); margin-bottom:5px;">Oczekuje: ${dbM.proposedScore1}:${dbM.proposedScore2}</div>
                             <button class="btn-act btn-conf" onclick="confirm('${m.id}')">POTWIERDŹ</button>`;
                } else if (matchLocked) {
                    html += `<div class="locked-text">MECZ ZABLOKOWANY</div>`;
                } else {
                    html += `<div class="bet-box">
                                <input type="number" id="s1_${m.id}" class="bet-input" placeholder="-">
                                <input type="number" id="s2_${m.id}" class="bet-input" placeholder="-">
                             </div>
                             <button class="btn-act" onclick="propose('${m.id}')">ZGŁOŚ WYNIK</button>`;
                }
                html += `</div>`;
            });
            html += `</div>`;
            gCont.innerHTML += html;
        });

        // Generowanie Fazy Pucharowej (z dynamicznym podmienianiem nazw!)
        KNOCKOUTS.forEach(k => {
            const dbM = dbData[k.id] || { status: "upcoming" };
            const matchLocked = new Date() > new Date(k.date);

            // AUTOMATYZACJA: Podmiana "1A" na zwycięzcę Grupy A, jeśli grupa jest zakończona
            const getTeamName = (ref) => {
                if (ref.length === 2 && ['1','2'].includes(ref[0])) {
                    const pos = parseInt(ref[0]) - 1;
                    const group = "Grupa " + ref[1];
                    if (groupLockStatus[group]) {
                        const sorted = Object.keys(standings[group]).sort((a,b) => {
                            const tA = standings[group][a], tB = standings[group][b];
                            if (tA.pts !== tB.pts) return tB.pts - tA.pts;
                            if (tA.gd !== tB.gd) return tB.gd - tA.gd;
                            return tB.gs - tA.gs;
                        });
                        return sorted[pos]; // Zwraca prawdziwą nazwę drużyny!
                    }
                }
                return ref; // Jeśli grupa wciąż gra, wyświetla np. "1A" lub "3C/D/E"
            };

            const t1 = getTeamName(k.ref1);
            const t2 = getTeamName(k.ref2);

            let html = `<div class="card">
                <div class="title">${k.stage}</div>
                <div class="match-row">
                    <div class="match-date">${k.date.replace('T', ' | ')}</div>
                    <div class="match-teams">${t1} - ${t2}</div>`;

            if (dbM.status === "finished") {
                html += `<div style="color:var(--gold); font-size:18px; font-weight:900;">${dbM.realScore1} : ${dbM.realScore2}</div>`;
            } else if (dbM.status === "pending") {
                html += `<div style="color:var(--cyan); margin-bottom:5px;">Oczekuje: ${dbM.proposedScore1}:${dbM.proposedScore2}</div>
                         <button class="btn-act btn-conf" onclick="confirm('${k.id}')">POTWIERDŹ</button>`;
            } else if (matchLocked || t1 === k.ref1 || t2 === k.ref2) {
                // Blokujemy zakład, jeśli jeszcze nie znamy drużyn lub mecz już się zaczął
                html += `<div class="locked-text">ZAKŁADY ZABLOKOWANE</div>`;
            } else {
                html += `<div class="bet-box">
                            <input type="number" id="s1_${k.id}" class="bet-input" placeholder="-">
                            <input type="number" id="s2_${k.id}" class="bet-input" placeholder="-">
                         </div>
                         <button class="btn-act" onclick="propose('${k.id}')">ZGŁOŚ WYNIK</button>`;
            }
            html += `</div></div>`;
            kCont.innerHTML += html;
        });
    });
</script>
</body>
</html>
