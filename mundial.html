<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Bet | Mundial 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --gold: #d4af37; --cyan: #00d4ff; --bg: #020408; --glass: rgba(15, 23, 42, 0.85); --border: rgba(255, 255, 255, 0.15); --error: #ff4d4d; --success: #10b981; }

        .nav { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10; }
        .btn-back { background: rgba(0,0,0,0.5); border: 1px solid var(--border); padding: 10px 20px; color: #fff; text-decoration: none; border-radius: 10px; font-weight: bold; backdrop-filter: blur(5px); }
        
        h1 { text-align: center; color: var(--gold); letter-spacing: 4px; font-size: 28px; margin-bottom: 20px; text-shadow: 0 0 20px rgba(212,175,55,0.4); position: relative; z-index: 10; }
        .section-title { color: var(--cyan); border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin: 50px auto 20px; text-transform: uppercase; font-size: 22px; position: relative; z-index: 10; text-shadow: 0 0 10px rgba(0, 212, 255, 0.3); text-align: center; max-width: 800px; }
        
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; position: relative; z-index: 10; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 15px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); flex: 1 1 320px; max-width: 400px; }
        .title { color: var(--gold); font-size: 1.2rem; font-weight: 900; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Tabele */
        .standings { width: 100%; border-collapse: collapse; margin-bottom: 5px; font-size: 0.8rem; text-align: center; }
        .standings th { color: #888; padding-bottom: 5px; border-bottom: 1px solid #333; }
        .standings td { padding: 5px 0; }
        .standings tr:nth-child(1) td, .standings tr:nth-child(2) td { color: var(--success); font-weight: bold; }

        /* Zwijane panele z dynamicznym tekstem */
        details { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05); }
        summary { color: var(--cyan); cursor: pointer; font-weight: bold; outline: none; text-align: center; text-transform: uppercase; font-size: 0.9rem; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        
        .group-details summary span::before { content: '▼ POKAŻ MECZE GRUPY'; }
        .group-details[open] summary span::before { content: '▲ ZWIŃ MECZE GRUPY'; }
        
        .knockout-details summary span::before { content: '▼ ROZWIŃ MECZE PUCHAROWE'; font-size: 1.2rem; }
        .knockout-details[open] summary span::before { content: '▲ ZWIŃ MECZE PUCHAROWE'; font-size: 1.2rem; }

        .history-details summary span::before { content: '▼ HISTORIA PRZYZNAWANIA PUNKTÓW'; }
        .history-details[open] summary span::before { content: '▲ ZWIŃ HISTORIĘ PUNKTÓW'; }

        /* Mecze */
        .match-row { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; margin-top: 10px; text-align: center; border: 1px solid var(--border); }
        .match-date { font-size: 0.7rem; color: #888; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; }
        .match-teams { font-size: 1rem; font-weight: bold; margin-bottom: 15px; color: #fff; }
        
        /* Kontrolki Typowania */
        .bet-box { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .bet-input { width: 40px; height: 35px; text-align: center; background: #111; color: var(--cyan); border: 1px solid var(--cyan); border-radius: 5px; font-size: 16px; font-weight: bold; }
        .pen-input { width: 30px; height: 25px; font-size: 12px; border-color: var(--gold); color: var(--gold); }
        .btn-bet { background: linear-gradient(135deg, #00d4ff, #0096c7); border: none; padding: 8px 15px; border-radius: 5px; font-weight: 900; cursor: pointer; color: #000; width: 100%; text-transform: uppercase; }
        
        /* Panel Admina */
        .admin-panel { background: rgba(255,0,0,0.05); border: 1px dashed var(--error); padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 0.8rem; }
        .admin-input { width: 35px; height: 30px; text-align: center; background: #000; color: #fff; border: 1px solid var(--gold); border-radius: 4px; }
        .admin-text { width: 40%; height: 25px; text-align: center; background: #111; color: #fff; border: 1px solid #333; border-radius: 4px; margin: 2px; }
        .btn-admin { background: var(--gold); color: #000; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; width: 100%; }
        .btn-confirm { background: var(--success); }

        .locked-text { color: var(--error); font-size: 12px; font-weight: bold; margin-top: 5px; text-transform: uppercase; }
        .real-score { font-size: 20px; font-weight: 900; color: var(--gold); margin: 10px 0; letter-spacing: 2px; }

        /* Tabela Rankingu i Historia */
        .ranking-container { max-width: 600px; margin: 0 auto; position: relative; z-index: 10; }
        .ranking-table { width: 100%; background: var(--glass); border-radius: 15px; border: 1px solid var(--border); border-collapse: collapse; overflow: hidden; }
        .ranking-table th { background: rgba(0,0,0,0.5); color: var(--gold); padding: 15px; text-align: center; }
        .ranking-table td { padding: 15px; text-align: center; border-top: 1px solid #333; font-weight: bold; }
        
        .history-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
        .history-table th { background: rgba(0,0,0,0.5); padding: 8px; color: var(--gold); border-bottom: 1px solid #333; }
        .history-table td { padding: 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* Drabinka Pionowa */
        .vertical-bracket { display: flex; flex-direction: column; align-items: center; gap: 30px; position: relative; z-index: 10; margin-bottom: 50px; }
        .bracket-round { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 100%; max-width: 1000px; }
        .bracket-round-title { width: 100%; text-align: center; color: var(--gold); font-weight: bold; margin-bottom: 10px; border-bottom: 1px dashed var(--gold); padding-bottom: 5px; }
        .bracket-match { background: var(--glass); border: 1px solid var(--border); padding: 10px; border-radius: 8px; width: 200px; text-align: center; font-size: 0.8rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="nav"><a href="sg.html" class="btn-back">← WRÓĆ DO HUB</a></div>
    <h1>⚽ MUNDIAL 2026</h1>

        <table class="ranking-table" id="rankingTable">
            <tr><th>Gracz</th><th>PUNKTY SUMA</th></tr>

            <summary style="padding: 10px;"><span></span></summary>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, doc, onSnapshot, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" }));
    const currentUser = localStorage.getItem('cyberUser') || "Gość";

    // Rejestrowanie stanu otwartych detali, aby nie zamykały się przy odświeżaniu (zapisywaniu typów)
    const uiState = { groups: {}, knockout: false, history: false };

    const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d');
    let pts = []; function initBg() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; pts = []; for (let i = 0; i < 70; i++) { pts.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5 }); } }
    function drawBg() { ctx.clearRect(0, 0, canvas.width, canvas.height); pts.forEach((p, i) => { p.x += p.vx; p.y += p.vy; if(p.x < 0 || p.x > canvas.width) p.vx *= -1; if(p.y < 0 || p.y > canvas.height) p.vy *= -1; ctx.fillStyle = 'rgba(212, 175, 55, 0.3)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2); ctx.fill(); for (let j = i + 1; j < pts.length; j++) { const p2 = pts[j]; if (Math.hypot(p.x - p2.x, p.y - p2.y) < 150) { ctx.strokeStyle = `rgba(0, 212, 255, ${0.5 - Math.hypot(p.x - p2.x, p.y - p2.y)/300})`; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); } } }); requestAnimationFrame(drawBg); }
    window.onresize = initBg; initBg(); drawBg();

    const GROUPS = {
        "A": ["Meksyk", "RPA", "Korea Płd.", "Czechy"], "B": ["Kanada", "Bośnia", "Katar", "Szwajcaria"],
        "C": ["Brazylia", "Maroko", "Haiti", "Szkocja"], "D": ["USA", "Paragwaj", "Australia", "Turcja"],
        "E": ["Niemcy", "Curaçao", "WKS", "Ekwador"], "F": ["Holandia", "Japonia", "Szwecja", "Tunezja"],
        "G": ["Belgia", "Egipt", "Iran", "N. Zelandia"], "H": ["Hiszpania", "Cabo", "Arabia", "Urugwaj"],
        "I": ["Francja", "Senegal", "Irak", "Norwegia"], "J": ["Argentyna", "Algieria", "Austria", "Jordania"],
        "K": ["Portugalia", "Kongo", "Uzbekistan", "Kolumbia"], "L": ["Anglia", "Chorwacja", "Ghana", "Panama"]
    };

    const MATCHES = []; let mId = 1;
    const gDates = ["2026-06-11T21:00", "2026-06-12T18:00", "2026-06-16T21:00", "2026-06-17T18:00", "2026-06-21T21:00", "2026-06-21T21:00"];
    Object.entries(GROUPS).forEach(([g, t]) => {
        MATCHES.push({ id: `G_${mId++}`, group: g, t1: t[0], t2: t[1], date: gDates[0] }); MATCHES.push({ id: `G_${mId++}`, group: g, t1: t[2], t2: t[3], date: gDates[1] }); MATCHES.push({ id: `G_${mId++}`, group: g, t1: t[0], t2: t[2], date: gDates[2] }); MATCHES.push({ id: `G_${mId++}`, group: g, t1: t[3], t2: t[1], date: gDates[3] }); MATCHES.push({ id: `G_${mId++}`, group: g, t1: t[3], t2: t[0], date: gDates[4] }); MATCHES.push({ id: `G_${mId++}`, group: g, t1: t[1], t2: t[2], date: gDates[5] });
    });

    const KNOCKOUTS = [
        { id: "R32_1", stage: "1/16 Finału", ref1: "2A", ref2: "2B", date: "2026-06-28T15:00" }, { id: "R32_2", stage: "1/16 Finału", ref1: "1A", ref2: "3CDEFHI", date: "2026-06-28T18:00" },
        { id: "R32_3", stage: "1/16 Finału", ref1: "1B", ref2: "3EFGIJ", date: "2026-06-28T21:00" }, { id: "R32_4", stage: "1/16 Finału", ref1: "1C", ref2: "3ABDEF", date: "2026-06-29T18:00" },
        { id: "R32_5", stage: "1/16 Finału", ref1: "1D", ref2: "3BEFIJ", date: "2026-06-29T21:00" }, { id: "R32_6", stage: "1/16 Finału", ref1: "2E", ref2: "2I", date: "2026-06-30T15:00" },
        { id: "R32_7", stage: "1/16 Finału", ref1: "1E", ref2: "3ABCDF", date: "2026-06-30T18:00" }, { id: "R32_8", stage: "1/16 Finału", ref1: "1F", ref2: "2C", date: "2026-06-30T21:00" },
        { id: "R32_9", stage: "1/16 Finału", ref1: "2D", ref2: "2G", date: "2026-07-01T15:00" }, { id: "R32_10", stage: "1/16 Finału", ref1: "1G", ref2: "3AEHIJ", date: "2026-07-01T18:00" },
        { id: "R32_11", stage: "1/16 Finału", ref1: "1H", ref2: "2J", date: "2026-07-01T21:00" }, { id: "R32_12", stage: "1/16 Finału", ref1: "2K", ref2: "2L", date: "2026-07-02T15:00" },
        { id: "R32_13", stage: "1/16 Finału", ref1: "1I", ref2: "3CDFGH", date: "2026-07-02T18:00" }, { id: "R32_14", stage: "1/16 Finału", ref1: "1J", ref2: "2H", date: "2026-07-02T21:00" },
        { id: "R32_15", stage: "1/16 Finału", ref1: "1K", ref2: "3DEIJL", date: "2026-07-03T18:00" }, { id: "R32_16", stage: "1/16 Finału", ref1: "1L", ref2: "3EHIJK", date: "2026-07-03T21:00" },
        { id: "R16_1", stage: "1/8 Finału", ref1: "W_R32_1", ref2: "W_R32_2", date: "2026-07-04T18:00" }, { id: "R16_2", stage: "1/8 Finału", ref1: "W_R32_3", ref2: "W_R32_4", date: "2026-07-04T21:00" },
        { id: "R16_3", stage: "1/8 Finału", ref1: "W_R32_5", ref2: "W_R32_6", date: "2026-07-05T18:00" }, { id: "R16_4", stage: "1/8 Finału", ref1: "W_R32_7", ref2: "W_R32_8", date: "2026-07-05T21:00" },
        { id: "R16_5", stage: "1/8 Finału", ref1: "W_R32_9", ref2: "W_R32_10", date: "2026-07-06T18:00" }, { id: "R16_6", stage: "1/8 Finału", ref1: "W_R32_11", ref2: "W_R32_12", date: "2026-07-06T21:00" },
        { id: "R16_7", stage: "1/8 Finału", ref1: "W_R32_13", ref2: "W_R32_14", date: "2026-07-07T18:00" }, { id: "R16_8", stage: "1/8 Finału", ref1: "W_R32_15", ref2: "W_R32_16", date: "2026-07-07T21:00" },
        { id: "QF_1", stage: "Ćwierćfinał", ref1: "W_R16_1", ref2: "W_R16_2", date: "2026-07-09T18:00" }, { id: "QF_2", stage: "Ćwierćfinał", ref1: "W_R16_3", ref2: "W_R16_4", date: "2026-07-10T18:00" },
        { id: "QF_3", stage: "Ćwierćfinał", ref1: "W_R16_5", ref2: "W_R16_6", date: "2026-07-11T18:00" }, { id: "QF_4", stage: "Ćwierćfinał", ref1: "W_R16_7", ref2: "W_R16_8", date: "2026-07-11T21:00" },
        { id: "SF_1", stage: "Półfinał", ref1: "W_QF_1", ref2: "W_QF_2", date: "2026-07-14T20:00" }, { id: "SF_2", stage: "Półfinał", ref1: "W_QF_3", ref2: "W_QF_4", date: "2026-07-15T20:00" },
        { id: "TP_1", stage: "Mecz o 3. miejsce", ref1: "L_SF_1", ref2: "L_SF_2", date: "2026-07-18T20:00" }, { id: "F_1", stage: "FINAŁ", ref1: "W_SF_1", ref2: "W_SF_2", date: "2026-07-19T20:00" }
    ];

    const isValValid = (v) => v !== "" && v !== null && !isNaN(v) && parseInt(v) >= 0 && parseInt(v) <= 15;

    window.saveBet = async (id, isKnockout) => {
        const s1 = document.getElementById(`b1_${id}`).value;
        const s2 = document.getElementById(`b2_${id}`).value;
        if(!isValValid(s1) || !isValValid(s2)) return alert("Wynik musi być liczbą od 0 do 15!");
        
        let p1 = null, p2 = null;
        if(isKnockout) {
            const tempP1 = document.getElementById(`bp1_${id}`).value;
            const tempP2 = document.getElementById(`bp2_${id}`).value;
            if (tempP1 || tempP2) {
                if(!isValValid(tempP1) || !isValValid(tempP2)) return alert("Karne muszą być z przedziału 0-15!");
                p1 = tempP1; p2 = tempP2;
            }
        }
        
        await setDoc(doc(db, "mundial_matches", id), { bets: { [currentUser]: { s1: parseInt(s1), s2: parseInt(s2), p1: p1 ? parseInt(p1) : null, p2: p2 ? parseInt(p2) : null } } }, { merge: true });
    };

    window.setOverrideTeams = async (id) => {
        const t1 = document.getElementById(`override_t1_${id}`).value;
        const t2 = document.getElementById(`override_t2_${id}`).value;
        const updateData = {};
        if (t1) updateData.override_t1 = t1; else updateData.override_t1 = null;
        if (t2) updateData.override_t2 = t2; else updateData.override_t2 = null;
        
        await setDoc(doc(db, "mundial_matches", id), updateData, { merge: true });
    };

    window.proposeRealScore = async (id, isKnockout) => {
        const s1 = document.getElementById(`a1_${id}`).value;
        const s2 = document.getElementById(`a2_${id}`).value;
        if(!isValValid(s1) || !isValValid(s2)) return alert("Wynik musi być od 0 do 15!");
        
        let p1 = null, p2 = null;
        if(isKnockout) {
            const tempP1 = document.getElementById(`ap1_${id}`).value;
            const tempP2 = document.getElementById(`ap2_${id}`).value;
            if(tempP1 || tempP2) {
                if(!isValValid(tempP1) || !isValValid(tempP2)) return alert("Karne muszą być od 0 do 15!");
                p1 = tempP1; p2 = tempP2;
            }
        }
        
        await setDoc(doc(db, "mundial_matches", id), { status: "pending_real", tempReal1: parseInt(s1), tempReal2: parseInt(s2), tempPen1: p1 ? parseInt(p1) : null, tempPen2: p2 ? parseInt(p2) : null, realProposer: currentUser }, { merge: true });
    };

    window.confirmRealScore = async (id) => {
        const ref = doc(db, "mundial_matches", id);
        const data = (await getDoc(ref)).data();
        if(data.realProposer === currentUser) return alert("Inny gracz musi to potwierdzić!");
        
        await updateDoc(ref, { status: "finished", realScore1: data.tempReal1, realScore2: data.tempReal2, realPen1: data.tempPen1, realPen2: data.tempPen2, realVerifier: currentUser });
    };

    onSnapshot(collection(db, "mundial_matches"), (snap) => {
        // Przed czyszczeniem HTML, zachowajmy stan zwiniętych zakładek
        document.querySelectorAll('details[data-group]').forEach(d => uiState.groups[d.dataset.group] = d.open);
        uiState.knockout = document.getElementById('knockoutDetails')?.open;
        uiState.history = document.getElementById('historyDetails')?.open;

        const dbData = {}; const userPoints = {}; const historyList = [];
        snap.forEach(d => {
            const m = d.data(); dbData[d.id] = m;
            if(m.status === 'finished' && m.bets) {
                Object.keys(m.bets).forEach(u => {
                    if(!userPoints[u]) userPoints[u] = 0;
                    const b = m.bets[u]; const r1 = m.realScore1, r2 = m.realScore2;
                    let gained = 0;
                    if(r1 === b.s1 && r2 === b.s2) gained = 3;
                    else if((r1>r2 && b.s1>b.s2) || (r1<r2 && b.s1<b.s2) || (r1===r2 && b.s1===b.s2)) gained = 1;
                    
                    userPoints[u] += gained;
                    if(gained > 0) {
                        let matchName = d.id;
                        const gMatch = MATCHES.find(ma => ma.id === d.id);
                        if(gMatch) matchName = `${gMatch.t1} - ${gMatch.t2}`;
                        else {
                            const kMatch = KNOCKOUTS.find(k => k.id === d.id);
                            if(kMatch) matchName = `${m.override_t1 || kMatch.ref1} - ${m.override_t2 || kMatch.ref2}`;
                        }
                        historyList.push(`<tr><td><b style="color:var(--cyan)">${u}</b></td><td>${matchName}</td><td>${b.s1}:${b.s2}</td><td>${r1}:${r2}</td><td style="color:var(--success)"><b>+${gained}</b></td></tr>`);
                    }
                });
            }
        });

        const rt = document.getElementById('rankingTable');
        rt.innerHTML = `<tr><th>Gracz</th><th>PUNKTY SUMA</th></tr>`;
        Object.entries(userPoints).sort((a,b) => b[1] - a[1]).forEach(([user, pts]) => {
            rt.innerHTML += `<tr><td>${user}</td><td style="color:var(--cyan); font-size:1.2rem;">${pts}</td></tr>`;
        });
        document.getElementById('historyLog').innerHTML = historyList.length ? historyList.join('') : `<tr><td colspan="5">Brak historii...</td></tr>`;

        const gCont = document.getElementById('groupsContainer');
        const kCont = document.getElementById('knockoutContainer');
        gCont.innerHTML = ""; kCont.innerHTML = "";

        const standings = {}; const groupLockStatus = {};
        Object.keys(GROUPS).forEach(g => {
            standings[g] = {}; GROUPS[g].forEach(t => standings[g][t] = { pts: 0, gd: 0, gs: 0, played: 0 });
            let fMatches = 0;
            MATCHES.filter(m => m.group === g).forEach(m => {
                const dbM = dbData[m.id];
                if (dbM && dbM.status === "finished") {
                    fMatches++; const s1 = dbM.realScore1, s2 = dbM.realScore2;
                    const t1 = standings[g][m.t1], t2 = standings[g][m.t2];
                    t1.played++; t2.played++; t1.gs += s1; t2.gs += s2; t1.gd += (s1 - s2); t2.gd += (s2 - s1);
                    if (s1 > s2) t1.pts += 3; else if (s1 < s2) t2.pts += 3; else { t1.pts += 1; t2.pts += 1; }
                }
            });
            groupLockStatus[g] = fMatches >= 6;
        });

        Object.keys(GROUPS).forEach(g => {
            const sortedTeams = Object.keys(standings[g]).sort((a,b) => { const tA = standings[g][a], tB = standings[g][b]; if (tA.pts !== tB.pts) return tB.pts - tA.pts; if (tA.gd !== tB.gd) return tB.gd - tA.gd; return tB.gs - tA.gs; });
            const isLocked = groupLockStatus[g];
            let html = `<div class="card"><div class="title">Grupa ${g}</div><table class="standings"><tr><th>Zespół</th><th>M</th><th>B</th><th>PKT</th></tr>`;
            sortedTeams.forEach((t, i) => html += `<tr><td>${i+1}. ${t}</td><td>${standings[g][t].played}</td><td>${standings[g][t].gd > 0 ? '+'+standings[g][t].gd : standings[g][t].gd}</td><td><b>${standings[g][t].pts}</b></td></tr>`);
            
            const isOpen = uiState.groups[g] ? 'open' : '';
            html += `</table><details data-group="${g}" class="group-details" ${isOpen}><summary><span></span></summary>`;

            MATCHES.filter(m => m.group === g).forEach(m => {
                const dbM = dbData[m.id] || {}; const myBet = dbM.bets?.[currentUser]; const matchLocked = new Date() > new Date(m.date) || isLocked;
                html += `<div class="match-row"><div class="match-date">${m.date.replace('T', ' ')}</div><div class="match-teams">${m.t1} - ${m.t2}</div>`;
                if (dbM.status === "finished") {
                    html += `<div class="real-score">${dbM.realScore1} : ${dbM.realScore2}</div>`;
                    if(myBet) html += `<div style="font-size:11px; color:#aaa;">Twój typ: ${myBet.s1}:${myBet.s2}</div>`;
                } else {
                    html += `<div class="bet-box"><input type="number" id="b1_${m.id}" class="bet-input" min="0" max="15" value="${myBet?.s1??''}" ${matchLocked ? 'disabled' : ''}> : <input type="number" id="b2_${m.id}" class="bet-input" min="0" max="15" value="${myBet?.s2??''}" ${matchLocked ? 'disabled' : ''}></div>`;
                    if(matchLocked) html += `<div class="locked-text">ZAMKNIĘTE</div>`; else html += `<button class="btn-act btn-bet" onclick="saveBet('${m.id}', false)">ZAPISZ TYP</button>`;
                }
                if(dbM.status === 'pending_real') {
                    if(dbM.realProposer === currentUser) html += `<div class="locked-text" style="color:var(--cyan)">Czeka na potw.: ${dbM.tempReal1}:${dbM.tempReal2}</div>`;
                    else html += `<button class="btn-admin btn-confirm" onclick="confirmRealScore('${m.id}')">POTWIERDŹ WYNIK (${dbM.tempReal1}:${dbM.tempReal2})</button>`;
                } else if(dbM.status !== "finished") {
                    html += `<details class="admin-panel"><summary>Wprowadź oficjalny wynik</summary><input type="number" id="a1_${m.id}" class="admin-input" min="0" max="15">:<input type="number" id="a2_${m.id}" class="admin-input" min="0" max="15"><button class="btn-admin" onclick="proposeRealScore('${m.id}', false)">ZGŁOŚ WYNIK</button></details>`;
                }
                html += `</div>`;
            });
            html += `</details></div>`; gCont.innerHTML += html;
        });

        const resolveKnockoutTeam = (ref) => {
            if (ref.length === 2 && ['1','2'].includes(ref[0])) {
                if (groupLockStatus[ref[1]]) {
                    const sorted = Object.keys(standings[ref[1]]).sort((a,b) => { const tA = standings[ref[1]][a], tB = standings[ref[1]][b]; if (tA.pts !== tB.pts) return tB.pts - tA.pts; if (tA.gd !== tB.gd) return tB.gd - tA.gd; return tB.gs - tA.gs; });
                    return sorted[parseInt(ref[0]) - 1];
                }
                return `${ref[0]}. m. Gr. ${ref[1]}`;
            }
            if (ref.startsWith('W_') || ref.startsWith('L_')) {
                const isWinner = ref.startsWith('W_'); const matchId = ref.substring(2); const prevM = dbData[matchId];
                if(prevM && prevM.status === "finished") {
                    const prevDef = KNOCKOUTS.find(k => k.id === matchId);
                    const pt1 = prevM.override_t1 || resolveKnockoutTeam(prevDef.ref1); const pt2 = prevM.override_t2 || resolveKnockoutTeam(prevDef.ref2);
                    let w = pt1, l = pt2;
                    if(prevM.realScore2 > prevM.realScore1 || prevM.realPen2 > prevM.realPen1) { w = pt2; l = pt1; }
                    return isWinner ? w : l;
                }
                return isWinner ? `Zw. ${matchId}` : `Prz. ${matchId}`;
            }
            return ref;
        };

        KNOCKOUTS.forEach(k => {
            const dbM = dbData[k.id] || {}; const matchLocked = new Date() > new Date(k.date); const myBet = dbM.bets?.[currentUser];
            const t1 = dbM.override_t1 || resolveKnockoutTeam(k.ref1); const t2 = dbM.override_t2 || resolveKnockoutTeam(k.ref2);

            let html = `<div class="card"><div class="title" style="color:var(--cyan)">${k.stage}</div><div class="match-row" style="margin:0;"><div class="match-date">${k.date.replace('T', ' ')}</div><div class="match-teams">${t1}<br><span style="font-size:12px; color:#666;">vs</span><br>${t2}</div>`;
            if (dbM.status === "finished") {
                html += `<div class="real-score">${dbM.realScore1} : ${dbM.realScore2} ${dbM.realPen1 !== null ? `(K: ${dbM.realPen1}-${dbM.realPen2})` : ''}</div>`;
                if(myBet) html += `<div style="font-size:11px; color:#aaa;">Twój typ: ${myBet.s1}:${myBet.s2} ${myBet.p1 !== null ? `(K: ${myBet.p1}-${myBet.p2})` : ''}</div>`;
            } else {
                html += `<div class="bet-box"><input type="number" id="b1_${k.id}" class="bet-input" min="0" max="15" value="${myBet?.s1??''}" ${matchLocked ? 'disabled' : ''}>:<input type="number" id="b2_${k.id}" class="bet-input" min="0" max="15" value="${myBet?.s2??''}" ${matchLocked ? 'disabled' : ''}><span style="font-size:12px; color:#666;"> (K: <input type="number" id="bp1_${k.id}" class="bet-input pen-input" min="0" max="15" value="${myBet?.p1??''}" ${matchLocked ? 'disabled' : ''}>-<input type="number" id="bp2_${k.id}" class="bet-input pen-input" min="0" max="15" value="${myBet?.p2??''}" ${matchLocked ? 'disabled' : ''}> )</span></div>`;
                if (matchLocked) html += `<div class="locked-text">ZABLOKOWANE</div>`; else html += `<button class="btn-act btn-bet" onclick="saveBet('${k.id}', true)">ZAPISZ TYP</button>`;
            }
            if(dbM.status === 'pending_real') {
                if(dbM.realProposer === currentUser) html += `<div class="locked-text" style="color:var(--cyan)">Czeka na potw.: ${dbM.tempReal1}:${dbM.tempReal2}</div>`;
                else html += `<button class="btn-admin btn-confirm" onclick="confirmRealScore('${k.id}')">POTWIERDŹ WYNIK (${dbM.tempReal1}:${dbM.tempReal2})</button>`;
            } else if(dbM.status !== "finished") {
                html += `<details class="admin-panel"><summary>Wpisz wynik / Drużyny</summary>
                         <div style="margin-bottom: 10px; border-bottom: 1px dashed #333; padding-bottom: 10px;">
                             <input type="text" id="override_t1_${k.id}" class="admin-text" placeholder="D1 (Ręcznie)" value="${dbM.override_t1 || ''}">
                             <input type="text" id="override_t2_${k.id}" class="admin-text" placeholder="D2 (Ręcznie)" value="${dbM.override_t2 || ''}">
                             <button class="btn-admin" onclick="setOverrideTeams('${k.id}')">USTAW DRUŻYNY</button>
                         </div>
                         <div>
                             <input type="number" id="a1_${k.id}" class="admin-input" min="0" max="15">:<input type="number" id="a2_${k.id}" class="admin-input" min="0" max="15">
                             (K: <input type="number" id="ap1_${k.id}" class="admin-input" min="0" max="15" style="width:25px;height:20px;">:<input type="number" id="ap2_${k.id}" class="admin-input" min="0" max="15" style="width:25px;height:20px;">)
                             <button class="btn-admin" onclick="proposeRealScore('${k.id}', true)">ZGŁOŚ WYNIK</button>
                         </div>
                         </details>`;
            }
            html += `</div></div>`; kCont.innerHTML += html;
        });

        // Odtworzenie stanu głównych detali (Historia / Pucharowe)
        const histD = document.getElementById('historyDetails'); if(histD && uiState.history) histD.open = true;
        const knockD = document.getElementById('knockoutDetails'); if(knockD && uiState.knockout) knockD.open = true;

        // DRZEWKO PIONOWE
        const stages = ["1/16 Finału", "1/8 Finału", "Ćwierćfinał", "Półfinał", "FINAŁ"];
        const tree = document.getElementById('bracketTree'); tree.innerHTML = "";
        stages.forEach(st => {
            let sHtml = `<div class="bracket-round"><div class="bracket-round-title">${st}</div>`;
            KNOCKOUTS.filter(k => k.stage === st).forEach(k => {
                const dbM = dbData[k.id] || {};
                const t1 = dbM.override_t1 || resolveKnockoutTeam(k.ref1); const t2 = dbM.override_t2 || resolveKnockoutTeam(k.ref2);
                let score = dbM.status === "finished" ? `${dbM.realScore1}:${dbM.realScore2}` : "vs";
                sHtml += `<div class="bracket-match"><b>${t1}</b><br><span style="color:var(--gold); font-weight:bold;">${score}</span><br><b>${t2}</b></div>`;
            });
            sHtml += `</div>`; tree.innerHTML += sHtml;
        });
    });
</script>
</body>
</html>
