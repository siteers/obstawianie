// --- ŚNIEG W TLE ---
const snowCanvas = document.getElementById('snow-canvas');
const snowCtx = snowCanvas.getContext('2d');
let snowflakes = [];
function initSnow() {
snowCanvas.width = window.innerWidth;
snowCanvas.height = window.innerHeight;
snowflakes = [];
for (let i = 0; i < 35; i++) {
snowflakes.push({ x: Math.random() * snowCanvas.width, y: Math.random() * snowCanvas.height, r: Math.random() * 3 + 1.5, vy: Math.random() * 0.9 + 0.4, vx: (Math.random() - 0.5) * 0.5, alpha: Math.random() * 0.5 + 0.3 });
}
}
initSnow();
window.addEventListener('resize', initSnow);
function animateSnow() {
snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
for (let i = 0; i < snowflakes.length; i++) {
const f = snowflakes[i];
f.y += f.vy; f.x += f.vx;
if (f.y > snowCanvas.height) { f.y = -5; f.x = Math.random() * snowCanvas.width; }
snowCtx.globalAlpha = f.alpha; snowCtx.fillStyle = "#ffffff";
snowCtx.beginPath(); snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2); snowCtx.fill();
}
requestAnimationFrame(animateSnow);
}
animateSnow();

// --- LEKTOR PL-PL ---
let selectedPlVoice = null;
let speechSafetyTimer = null;
let utteranceQueue = [];

function initPolishVoices() {
if (!('speechSynthesis' in window)) return;
const voices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('pl'));
const sel = document.getElementById('voiceSelect');
if (!voices.length) return;
sel.innerHTML = "";
voices.sort((a, b) => {
const score = (v) => {
const n = v.name.toLowerCase();
if ((n.includes('zofia') || n.includes('maja') || n.includes('agnieszka')) && (n.includes('natural') || n.includes('online'))) return 20;
if (n.includes('zofia') || n.includes('maja') || n.includes('agnieszka') || n.includes('ewa')) return 15;
if (n.includes('google')) return 12;
return 3;
};
return score(b) - score(a);
});
voices.forEach((v, idx) => {
const opt = document.createElement('option');
opt.value = idx; opt.innerText = v.name; sel.appendChild(opt);
});
selectedPlVoice = voices[0];
sel.onchange = () => {
selectedPlVoice = voices[parseInt(sel.value)] || voices[0];
speakPolishText("Głos lektora został zmieniony.");
};
}
if ('speechSynthesis' in window) {
window.speechSynthesis.onvoiceschanged = initPolishVoices;
setTimeout(initPolishVoices, 300);
}

function speakPolishText(textToRead, onDoneCallback) {
clearTimeout(speechSafetyTimer);
if (!('speechSynthesis' in window)) { if (onDoneCallback) setTimeout(onDoneCallback, 1500); return; }
window.speechSynthesis.cancel();
let cleanText = textToRead.replace(/:\s*$/, "").replace(/:/g, ", ") + " ... ,";
const utter = new SpeechSynthesisUtterance(cleanText);
utter.lang = "pl-PL";
if (selectedPlVoice) utter.voice = selectedPlVoice;
utter.rate = 0.93; utter.pitch = 1.05;
utteranceQueue.push(utter);
if (utteranceQueue.length > 10) utteranceQueue.shift();
let finished = false;
const finishOnce = () => {

// SYNTEZATOR ROSNĄCEGO NAPIĘCIA W ETAPIE 6 (60s -> 0s)
let lastTensionBeatAt = 0;
function playStage6TensionPulse(remainingMs) {
if (!audioCtx) return;
if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

// progress = 0.0 (na starcie przy 60s) -> 1.0 (tuż przed 0s)
const progress = Math.max(0, Math.min(1, (60000 - remainingMs) / 60000));
// Odstęp między uderzeniami spada z 650ms (przy 60s) do 115ms (w ostatnich sekundach!)
const intervalMs = Math.round(650 - progress * 535);
const nowMs = Date.now();
if (nowMs - lastTensionBeatAt < intervalMs) return;
lastTensionBeatAt = nowMs;

const now = audioCtx.currentTime;

// 1. Niski puls (bicie serca / reaktor) - przyspiesza i rośnie z czasem
const bassOsc = audioCtx.createOscillator();
const bassGain = audioCtx.createGain();
bassOsc.type = "triangle";
const baseFreq = 75 + Math.pow(progress, 1.5) * 320;
bassOsc.frequency.setValueAtTime(baseFreq, now);
bassOsc.frequency.exponentialRampToValueAtTime(baseFreq * 0.65, now + 0.14);

const vol = 0.16 + progress * 0.26;
bassGain.gain.setValueAtTime(vol, now);
bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

bassOsc.connect(bassGain);
bassGain.connect(audioCtx.destination);
bassOsc.start(now);
bassOsc.stop(now + 0.16);

// 2. Od połowy czasu (poniżej 35s) dochodzi wysoki, nerwowy impuls skanera
if (progress > 0.4) {
const hiOsc = audioCtx.createOscillator();
const hiGain = audioCtx.createGain();
hiOsc.type = "sawtooth";
const hiFreq = 440 + Math.pow(progress, 2) * 880;
hiOsc.frequency.setValueAtTime(hiFreq, now);
hiGain.gain.setValueAtTime((progress - 0.35) * 0.22, now);
hiGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
hiOsc.connect(hiGain);
hiGain.connect(audioCtx.destination);
hiOsc.start(now);
hiOsc.stop(now + 0.08);
}
}

function playFireworkBoom() {
if (!audioCtx) return;
if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
const now = audioCtx.currentTime;

const bufferSize = audioCtx.sampleRate * 0.45;
const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const output = noiseBuffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) {
output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.14));
}
const whiteNoise = audioCtx.createBufferSource();
whiteNoise.buffer = noiseBuffer;

const filter = audioCtx.createBiquadFilter();
filter.type = "lowpass";
filter.frequency.setValueAtTime(850, now);
filter.frequency.exponentialRampToValueAtTime(90, now + 0.42);

const gain = audioCtx.createGain();
gain.gain.setValueAtTime(0.55, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.42);

whiteNoise.connect(filter);
filter.connect(gain);
gain.connect(audioCtx.destination);
whiteNoise.start(now);
}

// --- PEŁNY SILNIK WIZUALNYCH FAJERWERKÓW NA TV ---
const fwCanvas = document.getElementById('fireworks-canvas');
const fwCtx = fwCanvas.getContext('2d');
let fwParticles = [];
let fwRockets = [];
let fwActive = false;
let fwLoopId = null;
let fwSpawnTimer = null;

function createExplosion(x, y, mainColor) {
playFireworkBoom();
const count = 18;
for (let i = 0; i < count; i++) {
const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.12;
const speed = Math.random() * 5.5 + 2.2;
fwParticles.push({
x, y,
vx: Math.cos(angle) * speed,
vy: Math.sin(angle) * speed,
alpha: 1,
size: Math.random() * 3.5 + 1.8,
color: i % 2 === 0 ? '#ffffff' : mainColor,
decay: Math.random() * 0.02 + 0.032
});
}
}

function startFireworks() {
if (fwActive) return;
fwActive = true;
fwCanvas.style.display = 'block';
fwCanvas.width = window.innerWidth;
fwCanvas.height = window.innerHeight;
fwParticles = [];
fwRockets = [];

const colors = ['#ffd700', '#ff4757', '#2ed573', '#00d4ff', '#ff9f43'];

function launchWave() {
if (!fwActive) return;
const startX = fwCanvas.width * (0.18 + Math.random() * 0.64);
const targetY = fwCanvas.height * (0.14 + Math.random() * 0.32);
const color = colors[Math.floor(Math.random() * colors.length)];
fwRockets.push({
x: startX,
y: fwCanvas.height,
vx: (Math.random() - 0.5) * 1.5,
vy: -(Math.random() * 4 + 9.5),
targetY,
color
});
fwSpawnTimer = setTimeout(launchWave, 1300);
}
launchWave();

function animateFw() {
if (!fwActive) return;
fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

if (fwParticles.length > 45) {
fwParticles.splice(0, fwParticles.length - 45);
}

for (let i = fwRockets.length - 1; i >= 0; i--) {
const r = fwRockets[i];
r.x += r.vx;
r.y += r.vy;
r.vy += 0.1;

fwCtx.globalAlpha = 1;
fwCtx.fillStyle = '#ffffff';
fwCtx.beginPath();
fwCtx.arc(r.x, r.y, 3.2, 0, Math.PI * 2);
fwCtx.fill();

if (r.y <= r.targetY || r.vy >= 0) {
createExplosion(r.x, r.y, r.color);
fwRockets.splice(i, 1);
}
}

for (let i = fwParticles.length - 1; i >= 0; i--) {
const p = fwParticles[i];
p.x += p.vx;
p.y += p.vy;
p.vy += 0.07;
p.alpha -= p.decay;

if (p.alpha <= 0) {
fwParticles.splice(i, 1);
} else {
fwCtx.globalAlpha = p.alpha;
fwCtx.fillStyle = p.color;
fwCtx.beginPath();
fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
fwCtx.fill();
}
}
fwLoopId = requestAnimationFrame(animateFw);
}
animateFw();
}

function stopFireworks() {
fwActive = false;
clearTimeout(fwSpawnTimer);
if (fwLoopId) cancelAnimationFrame(fwLoopId);
fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
fwCanvas.style.display = 'none';
}

if (lastFinaleSuspenseTick !== fTick) {
lastFinaleSuspenseTick = fTick;
runFinaleSuspenseSequence();
}
return;
}

// WIELKI FINAŁ (PO ZAKOŃCZENIU SEKWENCJI NAPIĘCIA)
if (status === "finale_unlocked" || (st === 7 && status !== "finale_suspense")) {
stageBox.classList.add('victory-glow');
head.innerText = "🏆 TAJEMNICA SKARBCA ROZWIĄZANA! 🏆";
arena.innerHTML = `<div style="font-size:2.15vw; color:var(--gold); font-weight:900; line-height:1.45; text-shadow:0 2px 8px #000;">
WSZYSTKIE 6 RYGLI PUŚCIŁO!<br>
TAJNA SKRZYNIA Z PREZENTEM JEST GOTOWA, ALE...<br>
<span style="color:#2dc653; font-size:2.5vw;">KLUCZ DO NIEJ UKRYŁ W SWOJEJ KIESZENI WUJEK!</span><br>
🎅🔑 ŁAPCIE WUJKA I ODBIERZCIE KLUCZ! 🔑🎅
</div>`;
vicBanner.style.display = 'block';
if (!fwActive) {
startFireworks();
startVictoryFanfareLoop();
speakPolishText("Wszystkie zamki otwarte! Klucz do tajnej skrzyni z Waszym prezentem ukrył w swojej kieszeni Wujek! Łapcie go!");
}
return;
}

vicBanner.style.display = 'none';

if (status === "stage_complete") {
const cNum = currentState.completedStageNum || st;
head.innerText = `✅ RYGIEL ${cNum} ODBLOKOWANY!`;
arena.innerHTML = `<div style="font-size:1.9vw; color:#2dc653; font-weight:900; line-height:1.4;">
🎉 BRAWO DRUŻYNO! ETAP ${cNum} UKOŃCZONY! 🎉<br>
<span style="font-size:1.3vw; color:#fff;">Kliknijcie przycisk na telefonie, aby uruchomić kolejny etap!</span>
</div>`;
if (lastAnnouncedStage !== 100 + cNum) {
lastAnnouncedStage = 100 + cNum;
winSound.currentTime = 0; winSound.play().catch(()=>{});
speakPolishText(`Brawo drużyno! Rygiel numer ${cNum} został odblokowany!`);
}
return;
}

if (st === 1) {
head.innerText = "📸 ETAP 1: FOTO-ZWIAD - CZEKAMY NA ZDJĘCIA!";
let html = `<div style="font-size:1.15vw; color:#cbd5e1; margin-bottom:10px;">Zróbcie po 3 zdjęcia na telefonach. Wujek zatwierdza je na żywo!</div><div style="display:flex; gap:1vw; justify-content:center; width:100%;">`;
activeList.forEach(p => {
const pData = photos[p] || {};
const sNum = prog[p] || 0;
html += `<div style="background:#081c15; border:2px solid ${pData.status==='pending'?'#ffd700':'#334155'}; border-radius:12px; padding:8px; width:12.5vw; text-align:center;">
<b style="color:var(--gold); font-size:1.1vw;">${p.toUpperCase()} (${sNum}/3)</b><br>
${pData.img ? `<img class="center-photo-thumb" src="${pData.img}">` : `<div style="height:9.5vw; display:flex; align-items:center; justify-content:center; background:#000; border-radius:8px; margin:6px 0; font-size:0.85vw; color:#666;">Czeka na zdjęcie...</div>`}
<span style="font-size:0.85vw; font-weight:bold; color:${pData.status==='approved'?'#2dc653':pData.status==='rejected'?'#ff4d4d':'#ffd700'}">${pData.status==='approved'?'✔️ ZATWIERDZONE':pData.status==='pending'?'⏳ CZEKA NA WUJKA':pData.status==='rejected'?'❌ POPRAW ZDJĘCIE':'Ruszaj z aparatem!'}</span>
</div>`;
});
html += `</div>`;
arena.innerHTML = html;
if (lastAnnouncedStage !== 1) {
lastAnnouncedStage = 1;
speakPolishText("Etap pierwszy: Foto-Zwiad! Każdy Agent ma do wykonania trzy świąteczne zdjęcia w domu.");
}
}
else if (st === 2) {
head.innerText = "🔎 ETAP 2: POSZUKIWACZE TAJNYCH KODÓW W DOMU";
let solvedTotal = activeList.reduce((acc, p) => acc + (prog[p] || 0), 0);
let maxTotal = activeList.length * 3;
arena.innerHTML = `<div style="font-size:1.55vw; font-weight:900; color:var(--gold); line-height:1.45;">
Rozszyfrujcie trudne zagadki w narożnikach ekranu i na telefonach!<br>
Odszukajcie kryjówki w domu i wpiszcie 3-cyfrowe kody.<br><br>
<span style="font-size:2.2vw; color:#2dc653;">ODNALEZIONE KODY: ${solvedTotal} / ${maxTotal}</span>
</div>`;
if (lastAnnouncedStage !== 2) {
lastAnnouncedStage = 2;
speakPolishText("Etap drugi! Rozszyfrujcie zagadki i odszukajcie ukryte w domu tajne kody!");
}
}
else if (st === 3) {
head.innerText = "🧠 ETAP 3: ŚWIĄTECZNA ROZGRZEWKA UMYSŁÓW";
let solvedTotal = activeList.reduce((acc, p) => acc + (prog[p] || 0), 0);
let maxTotal = activeList.length * 3;
arena.innerHTML = `<div style="font-size:1.55vw; font-weight:900; color:var(--gold); line-height:1.45;">
Każdy Agent odpowiada na 3 świąteczno-zimowe pytania na swoim telefonie!<br>
<span style="color:#ff4d4d; font-size:1.25vw;">⚠️ UWAGA: Za błędną odpowiedź terminal blokuje się na karne 20 sekund!</span><br><br>
<span style="font-size:2.2vw; color:#2dc653;">ROZWIĄZANE ZAGADKI: ${solvedTotal} / ${maxTotal}</span>
</div>`;
if (lastAnnouncedStage !== 3) {
lastAnnouncedStage = 3;
speakPolishText("Etap trzeci! Odpowiedzcie na trzy świąteczne pytania. Uważajcie, bo za błąd jest dwadzieścia sekund blokady!");
}
}
else if (st === 4) {
head.innerText = "🎶 ETAP 4: TAJNY SZYFR KOLORÓW ELFÓW (SIMON SAYS)";
const simonLvl = currentState.simonLevel || 1;
const inpLen = (currentState.simonInput || []).length;
const seqLen = (currentState.simonSeq || []).length;

if (!document.getElementById('sp-Lila')) {
arena.innerHTML = `
<div style="font-size:1.2vw; font-weight:bold; color:var(--gold);" id="simonLvlText">POZIOM PAMIĘCI: ${simonLvl} / 3 (${inpLen}/${seqLen})</div>
<div style="font-size:1.1vw; color:#cbd5e1; margin:4px 0;" id="simonStatusText"> Przygotowanie sekwencji...</div>
<div class="simon-grid">
<div class="simon-pad" style="background:#f59e0b;" id="sp-Lila">🦌 LILA<br>(ŻÓŁTY)</div>
<div class="simon-pad" style="background:#00d4ff;" id="sp-Kaja">⛄ KAJA<br>(NIEBIESKI)</div>
<div class="simon-pad" style="background:#2dc653;" id="sp-Darek">🎄 DAREK<br>(ZIELONY)</div>
<div class="simon-pad" style="background:#d62828; color:#fff;" id="sp-Jas">🎅 JAŚ<br>(CZERWONY)</div>
</div>
`;
} else {
const lvlEl = document.getElementById('simonLvlText');
if (lvlEl) lvlEl.innerText = `POZIOM PAMIĘCI: ${simonLvl} / 3 (Wprowadzono: ${inpLen}/${seqLen})`;
}

if (currentState.colorTick && currentState.colorTick !== lastColorTickPlayed) {
lastColorTickPlayed = currentState.colorTick;
if (currentState.lastColorPressed) {
highlightSimonPad(currentState.lastColorPressed, 380);
}
}

if (status === "stage4_watch" && currentState.seqTick && currentState.seqTick !== lastSeqTickPlayed) {
lastSeqTickPlayed = currentState.seqTick;
playSimonSequenceOnTV(currentState.simonSeq || [], currentState.simonMistakeBy, simonLvl);
}
}
else if (st === 5) {
head.innerText = "🔥 ETAP 5: TANKOWANIE SAŃ MIKOŁAJA (WYZWANIE 20 SEKUND!)";
if (status === "stage5_failed") {
clearInterval(tvStage5TimerInterval);
arena.innerHTML = `<div style="font-size:2vw; color:#ff4d4d; font-weight:900; line-height:1.4;">
❄️ CZAS 20 SEKUND MINĄŁ! SILNIK ZAMARZŁ! ❄️<br>
<span style="font-size:1.3vw; color:#fff;">Kliknijcie "SPRÓBUJCIE PONOWNIE" na telefonie, aby zresetować stoper!</span>
</div>`;
if (lastAnnouncedStage !== 599) {
lastAnnouncedStage = 599;
loseSound.currentTime = 0; loseSound.play().catch(()=>{});
speakPolishText("Czas minął! Zabrakło mocy w silniku! Kliknijcie ponowną próbę na telefonie i stukajcie jeszcze szybciej!");
}
return;
}

const remCount = currentState.tapsCount || 0;
const tgtCount = currentState.tapsTarget || 300;
const pct = Math.min(100, Math.round((remCount / tgtCount) * 100));

if (!document.getElementById('tvStage5Sec')) {
arena.innerHTML = `
<div id="tvStage5Sec" style="font-size:2.2vw; font-weight:900; color:#ff4d4d; margin-bottom:6px;">🗣️ SŁUCHAJCIE LEKTORA - PRZYGOTUJCIE PALCE... (20.0s)</div>
<div style="font-size:1.2vw; font-weight:bold; margin-bottom:8px;">Stukajcie wspólnie w telefony, aby nabić <span id="tvStage5Tgt">${tgtCount}</span> jednostek mocy przed końcem czasu!</div>
<div id="tvStage5Clicks" style="font-size:2.7vw; font-weight:900; color:var(--gold); margin-bottom:8px;">${remCount} / ${tgtCount} KLIKÓW (${pct}%)</div>
<div style="width:78%; background:#071912; border:2px solid var(--gold); border-radius:15px; height:2.1vw; overflow:hidden;">
<div id="tvStage5Bar" style="height:100%; width:${pct}%; background:linear-gradient(90deg, #d62828, #ffd700, #2dc653); transition:0.1s;"></div>
</div>
`;
} else {
document.getElementById('tvStage5Clicks').innerText = `${remCount} / ${tgtCount} KLIKÓW (${pct}%)`;
document.getElementById('tvStage5Bar').style.width = `${pct}%`;
}

if (lastAnnouncedStage !== 5) {
lastAnnouncedStage = 5;
stage5ReadyAfterSpeech = false;
speakPolishText("Etap piąty! Przygotujcie palce! Macie dwadzieścia sekund, aby wspólnie rozgrzać silniki sań! Trzy, dwa, jeden, start!", async () => {
const freshNow = Date.now();
lastStage5StartSeen = freshNow;
stage5ReadyAfterSpeech = true;
await updateDoc(stateRef, { status: "stage5_active", tapsStartTime: freshNow });
startTVStage5Countdown(freshNow);
});
} else if (currentState.tapsStartTime && currentState.tapsStartTime !== lastStage5StartSeen && stage5ReadyAfterSpeech) {
lastStage5StartSeen = currentState.tapsStartTime;
startTVStage5Countdown( Date.now() );
}
}
else if (st === 6) {
const msRem = currentState.holdRemainingMs !== undefined ? currentState.holdRemainingMs : 60000;
const secStr = (msRem / 1000).toFixed(1);
head.innerText = "⚡ ETAP 6: OSTATNI RYGIEL - SKANER WYTRWAŁOŚCI (60 SEKUND BEZ PUSZCZANIA!)";
const hm = currentState.holdMap || {};
let allHold = activeList.every(p => hm[p] === true);
arena.innerHTML = `
<div style="font-size:1.2vw; font-weight:bold; margin-bottom:6px; color:#ffd700;">⚠️ UWAGA: JEŚLI KTOKOLWIEK PUŚCI PALEC, ZEGAR WRACA NA 60.0 SEKUND! ⚠️</div>
<div style="font-size:4vw; font-weight:900; color:${allHold ? '#2dc653' : '#ff4757'}; text-shadow:0 0 1.5vw ${allHold ? '#2dc653' : '#ff4757'};">${secStr}s</div>
<div style="font-size:1.2vw; color:#fff; font-weight:bold; margin-top:6px;">${allHold ? "⚡ SKANOWANIE W TOKU - NIE PUSZCZAJCIE! ⚡" : "⏸️ POŁÓŻCIE WSZYSCY PALCE NA SKANERACH!"}</div>
<div style="font-size:1.15vw; color:var(--gold); margin-top:10px;">Status skanerów: ${activeList.map(p => `${p.toUpperCase()}: ${hm[p] ? '✅ TRZYMA' : '❌ BRAK'}`).join(" &nbsp;|&nbsp; ")}</div>
`;
if (lastAnnouncedStage !== 6) {
lastAnnouncedStage = 6;
speakPolishText("Etap szósty, ostatni rygiel! Przyłóżcie wszyscy jednocześnie palce do skanerów i trzymajcie przez sześćdziesiąt sekund! Uwaga: jeśli ktokolwiek puści palec, zegar zresetuje się z powrotem do sześćdziesięciu sekund!");
}
}
else {
head.innerText = "🎅 OCZEKIWANIE NA START MISJI MIKOŁAJKOWEJ 🎄";
arena.innerHTML = `<div style="font-size:1.4vw; color:var(--gold); font-weight:bold;">Przygotujcie telefony! Zaraz Wujek uruchomi Etap 1!</div>`;
}
}
</script>
</body>
</html>
