<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mikołajki | Ekran Główny TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
--gold: #ffd700;
--warm-gold: #f59e0b;
--xmas-red: #d62828;
--xmas-bright-red: #ff4d4d;
--xmas-green: #1b4332;
--xmas-light-green: #2dc653;
--snow: #ffffff;
}
body {
font-family: sans-serif;
background: radial-gradient(circle at center, #1b4332 0%, #081c15 65%, #040d0a 100%);
color: var(--snow);
margin: 0; padding: 0; overflow: hidden; height: 100vh;
display: flex; align-items: center; justify-content: center;
}

#audio-overlay {
position: fixed; inset: 0; background: rgba(8, 28, 21, 0.96); z-index: 9999;
display: flex; flex-direction: column; gap: 1.5vw; align-items: center; justify-content: center;
}
#audio-btn {
background: linear-gradient(135deg, var(--xmas-red), #9b111e);
color: #fff; border: 0.25vw solid var(--gold); padding: 2vw 4vw; font-size: 2vw; font-weight: 900;
border-radius: 1.5vw; cursor: pointer; text-transform: uppercase;
box-shadow: 0 0 3.5vw rgba(255, 215, 0, 0.6); animation: pulse 1.2s infinite;
}

/* SZNUR ŚWIĄTECZNYCH LAMPEK */
.christmas-lights {
position: fixed; top: 0; left: 0; width: 100%; height: 2vw;
display: flex; justify-content: space-around; align-items: flex-start;
z-index: 920; pointer-events: none;
}
.light-bulb {
width: 0.9vw; height: 1.4vw; border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
margin-top: -0.2vw; animation: twinkle 1.6s infinite alternate;
}
.light-bulb:nth-child(4n+1) { background: #ff3b30; box-shadow: 0 0 1.2vw #ff3b30; animation-delay: 0s; }
.light-bulb:nth-child(4n+2) { background: #ffd700; box-shadow: 0 0 1.2vw #ffd700; animation-delay: 0.4s; }
.light-bulb:nth-child(4n+3) { background: #2dc653; box-shadow: 0 0 1.2vw #2dc653; animation-delay: 0.8s; }
.light-bulb:nth-child(4n+4) { background: #00d4ff; box-shadow: 0 0 1.2vw #00d4ff; animation-delay: 1.2s; }

@keyframes twinkle {
0% { opacity: 0.45; transform: scale(0.9); }
100% { opacity: 1; transform: scale(1.1); }
}

#voice-bar {
position: fixed; bottom: 0.6vw; left: 50%; transform: translateX(-50%); z-index: 950;
opacity: 0.5; transition: 0.3s; font-size: 0.85vw; background: rgba(8, 28, 21, 0.9);
padding: 0.35vw 1vw; border-radius: 0.6vw; display: flex; align-items: center; gap: 0.8vw;
border: 1px solid var(--gold);
}
#voice-bar:hover { opacity: 1; }
#voiceSelect { background: #081c15; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; font-size: 0.8vw; padding: 2px 6px; }
#muteMusicBtn { background: var(--xmas-red); color: #fff; border: 1px solid var(--gold); border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 0.8vw; font-weight: bold; }

#snow-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#fireworks-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 800; display: none; background: transparent; }

@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }

#fullscreenBoard { display: flex; width: 100vw; height: 100vh; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10; }

/* CENTRALNA ŚWIĄTECZNA SCENA - SKARBIEC Z 6 RYGLAMI */
.center-stage {
width: 58vw; max-width: 58vw; text-align: center;
background: linear-gradient(160deg, rgba(20, 54, 38, 0.95), rgba(10, 30, 22, 0.97));
border: 0.3vw solid var(--gold); border-radius: 2vw; padding: 1.8vw 2.2vw;
box-shadow: 0 0 4vw rgba(255, 215, 0, 0.3), inset 0 0 2vw rgba(214, 40, 40, 0.2);
transition: 0.5s; z-index: 10; box-sizing: border-box;
display: flex; flex-direction: column; align-items: center;
}
.center-stage.victory-glow {
border-color: #fff;
box-shadow: 0 0 6vw rgba(255, 215, 0, 0.9), inset 0 0 3vw rgba(45, 198, 83, 0.4);
}

.mission-header {
font-size: 1.35vw; color: var(--gold); text-transform: uppercase; letter-spacing: 0.2vw;
font-weight: 900; margin-bottom: 0.8vw; text-shadow: 0 2px 6px rgba(0,0,0,0.8);
}

/* PASKI RYKGLI SKARBCA (1 - 6) */
.bolts-bar { display: flex; gap: 0.6vw; margin-bottom: 1vw; }
.vault-bolt {
background: #0b1a13; border: 2px solid var(--gold); color: #888; font-size: 0.8vw; font-weight: 900;
padding: 6px 12px; border-radius: 6px; text-transform: uppercase; transition: 0.3s;
}
.vault-bolt.unlocked { background: var(--xmas-light-green); color: #000; border-color: #fff; box-shadow: 0 0 12px #2dc653; }

/* PANEL WYZWAŃ NA ŚRODKU TV */
.stage-arena { width: 100%; min-height: 18vw; display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* ETAP 4: WIZUALIZACJA SIMON SAYS (SZYFR KOLORÓW) */
.simon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1vw; width: 22vw; height: 22vw; margin: 1vw auto; }
.simon-pad { border-radius: 1vw; border: 3px solid #fff; opacity: 0.35; transition: 0.15s; }
.simon-pad.lit { opacity: 1; transform: scale(1.06); box-shadow: 0 0 2.5vw #fff; }

#victory-banner {
display: none; font-size: 1.8vw; font-weight: 900; color: var(--gold);
text-transform: uppercase; letter-spacing: 0.15vw; margin-top: 0.8vw;
text-shadow: 0 0 1.5vw var(--gold), 0 2px 5px #000; animation: pulse 1s infinite;
}

/* NAROŻNE KARTY POMOCNIKÓW MIKOŁAJA */
.tv-corner {
position: absolute; width: 18.5vw;
background: linear-gradient(145deg, rgba(110, 14, 22, 0.92), rgba(55, 8, 14, 0.95));
border: 0.22vw solid var(--gold);
border-radius: 1.3vw; padding: 0.9vw 1vw; display: flex; flex-direction: column; gap: 0.5vw;
box-shadow: 0 0 2vw rgba(0, 0, 0, 0.6), 0 0 1.2vw rgba(255, 215, 0, 0.25);
transition: all 0.35s; z-index: 900; box-sizing: border-box;
}
.tv-corner.flash-success {
border-color: #fff; background: linear-gradient(145deg, rgba(25, 135, 84, 0.95), rgba(15, 81, 50, 0.95));
box-shadow: 0 0 3.5vw rgba(45, 198, 83, 0.9); transform: scale(1.04);
}
.tv-corner.done-all {
border-color: var(--xmas-light-green);
background: linear-gradient(145deg, rgba(20, 83, 45, 0.92), rgba(10, 45, 25, 0.95));
}

.tv-top-left { top: 2vw; left: 1.5vw; }
.tv-top-right { top: 2vw; right: 1.5vw; }
.tv-bottom-left { bottom: 1.5vw; left: 1.5vw; }
.tv-bottom-right { bottom: 1.5vw; right: 1.5vw; }

.tv-agent-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 0.1vw solid rgba(255, 215, 0, 0.35); padding-bottom: 0.3vw; }
.tv-agent-name { font-size: 1.35vw; color: var(--gold); font-weight: 900; letter-spacing: 0.1vw; text-transform: uppercase; }
.tv-task-num { font-size: 0.75vw; color: #fff; letter-spacing: 0.05vw; font-weight: 900; background: rgba(0, 0, 0, 0.45); border: 1px solid var(--gold); padding: 0.15vw 0.4vw; border-radius: 0.35vw; }

.tv-task-q { font-size: 0.98vw; font-weight: bold; text-align: center; min-height: 2.4vw; display: flex; align-items: center; justify-content: center; color: #e2e8f0; line-height: 1.2; }
.tv-photo-view { width: 100%; height: 7.5vw; object-fit: cover; border-radius: 0.5vw; border: 1px solid var(--gold); background: #000; margin-top: 4px; display: none; }
</style>
</head>
<body>

<div class="christmas-lights">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const winSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3");
winSound.volume = 0.95;
const fanfareSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3");
fanfareSound.volume = 1.0;

const STAGE1_PHOTOS = {
Lila: ["Zrób zdjęcie uśmiechniętego Bartusia!", "Zrób zbliżenie na swoją własną skarpetkę!", "Zrób wspólne zdjęcie pozostałym Agentom!"],
Kaja: ["Załóż okulary przeciwsłoneczne lub zimową czapkę i zrób selfie!", "Znajdź w domu coś zielonego i zrób temu zdjęcie!", "Zrób zdjęcie swoim ulubionym butom!"],
Darek: ["Zrób zdjęcie plecaka, walizki lub torby podróżnej!", "Znajdź w domu przedmiot pokazujący godzinę!", "Zrób z ukrycia zdjęcie dorosłemu w pokoju!"],
Jas: ["Znajdź w domu coś czerwonego jak czapka Mikołaja!", "Zrób zdjęcie swojej ulubionej zabawce!", "Zrób zdjęcie kubkowi na ciepłą herbatę!"]
};

// ŚNIEG
const snowCanvas = document.getElementById('snow-canvas');
const snowCtx = snowCanvas.getContext('2d');
let snowflakes = [];
function initSnow() {
snowCanvas.width = window.innerWidth;
snowCanvas.height = window.innerHeight;
snowflakes = [];
for (let i = 0; i < 35; i++) {
snowflakes.push({ x: Math.random() * snowCanvas.width, y: Math.random() * snowCanvas.height, r: Math.random() * 3 + 1.5, vy: Math.random() * 0.9 + 0.4, vx: (Math.random() - 0.5) * 0.5, alpha: Math.random() * 0.5 + 0.3 });
}
}
initSnow();
window.addEventListener('resize', initSnow);
function animateSnow() {
snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
for (let i = 0; i < snowflakes.length; i++) {
const f = snowflakes[i];
f.y += f.vy; f.x += f.vx;
if (f.y > snowCanvas.height) { f.y = -5; f.x = Math.random() * snowCanvas.width; }
snowCtx.globalAlpha = f.alpha; snowCtx.fillStyle = "#ffffff";
snowCtx.beginPath(); snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2); snowCtx.fill();
}
requestAnimationFrame(animateSnow);
}
animateSnow();

// LEKTOR PL-PL
let selectedPlVoice = null;
let speechSafetyTimer = null;
let utteranceQueue = [];

function initPolishVoices() {
if (!('speechSynthesis' in window)) return;
const voices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('pl'));
const sel = document.getElementById('voiceSelect');
if (!voices.length) return;
sel.innerHTML = "";
voices.forEach((v, idx) => {
const opt = document.createElement('option');
opt.value = idx; opt.innerText = v.name; sel.appendChild(opt);
});
selectedPlVoice = voices[0];
}
if ('speechSynthesis' in window) {
window.speechSynthesis.onvoiceschanged = initPolishVoices;
setTimeout(initPolishVoices, 300);
}

function speakPolishText(textToRead, onDoneCallback) {
clearTimeout(speechSafetyTimer);
if (!('speechSynthesis' in window)) { if (onDoneCallback) setTimeout(onDoneCallback, 1500); return; }
window.speechSynthesis.cancel();
let cleanText = textToRead.replace(/:\s*$/, "").replace(/:/g, ", ") + " ... ,";
const utter = new SpeechSynthesisUtterance(cleanText);
utter.lang = "pl-PL";
if (selectedPlVoice) utter.voice = selectedPlVoice;
utter.rate = 0.93; utter.pitch = 1.05;
utteranceQueue.push(utter);
let finished = false;
const finishOnce = () => { if (finished) return; finished = true; clearTimeout(speechSafetyTimer); if (onDoneCallback) setTimeout(onDoneCallback, 400); };
utter.onend = finishOnce; utter.onerror = finishOnce;
speechSafetyTimer = setTimeout(finishOnce, 12000);
window.speechSynthesis.speak(utter);
}

// DZWONECZKI
let audioCtx = null;
let bgMasterGain = null;
let musicInterval = null;
let fanfareLoopInterval = null;
let isBgMusicPlaying = false;
let musicMutedByUser = false;

function createFestiveChimesMusic() {
if (audioCtx) return;
const AudioContext = window.AudioContext || window.webkitAudioContext;
audioCtx = new AudioContext();
bgMasterGain = audioCtx.createGain();
bgMasterGain.gain.value = 0.20;
bgMasterGain.connect(audioCtx.destination);
const jingleMelody = [659.25, 659.25, 659.25, 0, 659.25, 659.25, 659.25, 0, 659.25, 783.99, 523.25, 587.33, 659.25, 0, 0, 0];
let step = 0;
musicInterval = setInterval(() => {
if (!audioCtx || !isBgMusicPlaying || musicMutedByUser) return;
if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
const now = audioCtx.currentTime;
const freq = jingleMelody[step % jingleMelody.length];
if (freq > 0) {
const bellOsc = audioCtx.createOscillator();
const bellGain = audioCtx.createGain();
bellOsc.type = "sine"; bellOsc.frequency.setValueAtTime(freq, now);
bellGain.gain.setValueAtTime(0.08, now); bellGain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
bellOsc.connect(bellGain); bellGain.connect(bgMasterGain);
bellOsc.start(now); bellOsc.stop(now + 0.25);
}
step++;
}, 260);
}

window.toggleBgMusic = function() {
musicMutedByUser = !musicMutedByUser;
document.getElementById('muteMusicBtn').innerText = musicMutedByUser ? "🔇 Dzwoneczki: WYŁ" : "🔔 Dzwoneczki: WŁ";
};

function playFireworkBoom() {
if (!audioCtx) return;
if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
const now = audioCtx.currentTime;
const bufferSize = audioCtx.sampleRate * 0.35;
const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const output = noiseBuffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) { output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.1)); }
const whiteNoise = audioCtx.createBufferSource(); whiteNoise.buffer = noiseBuffer;
const filter = audioCtx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.setValueAtTime(700, now);
const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.35, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
whiteNoise.start(now);
}

function startVictoryFanfareLoop() {
clearInterval(fanfareLoopInterval);
fanfareSound.currentTime = 0; fanfareSound.play().catch(()=>{});
winSound.currentTime = 0; winSound.play().catch(()=>{});
fanfareLoopInterval = setInterval(() => { playFireworkBoom(); fanfareSound.currentTime = 0; fanfareSound.play().catch(()=>{}); }, 6500);
}

window.initAudio = function() {
document.getElementById('audio-overlay').style.display = 'none';
createFestiveChimesMusic(); isBgMusicPlaying = true; initPolishVoices();
speakPolishText("Pancerny Skarbiec Mikołaja został zamknięty na sześć rygli. Agenci, do dzieła!");
};

const fwCanvas = document.getElementById('fireworks-canvas');
const fwCtx = fwCanvas.getContext('2d');
let fwParticles = []; let fwRockets = []; let fwActive = false; let fwLoopId = null;

function startFireworks() {
if (fwActive) return;
fwActive = true; fwCanvas.style.display = 'block';
fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight;
fwParticles = []; fwRockets = [];
const colors = ['#ffd700', '#ff4757', '#2ed573', '#ffffff', '#ff9f43'];
function launchWave() {
if (!fwActive) return;
fwRockets.push({ x: fwCanvas.width * (0.2 + Math.random() * 0.6), y: fwCanvas.height, vx: (Math.random() - 0.5) * 1.5, vy: -(Math.random() * 4 + 9), targetY: fwCanvas.height * (0.15 + Math.random() * 0.3), color: colors[Math.floor(Math.random() * colors.length)] });
setTimeout(launchWave, 1500);
}
launchWave();
function animateFw() {
if (!fwActive) return;
fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
if (fwParticles.length > 35) fwParticles.splice(0, fwParticles.length - 35);
for (let i = fwRockets.length - 1; i >= 0; i--) {
const r = fwRockets[i]; r.x += r.vx; r.y += r.vy; r.vy += 0.1;
if (r.y <= r.targetY || r.vy >= 0) { playFireworkBoom(); fwRockets.splice(i, 1); }
}
fwLoopId = requestAnimationFrame(animateFw);
}
animateFw();
}

let currentState = null;
const agentsList = ["Lila", "Kaja", "Darek", "Jaś"];
const dbKeyMap = { "Lila": "Lila", "Kaja": "Kaja", "Darek": "Darek", "Jaś": "Jas" };

onSnapshot(doc(db, "mikolajGame", "state"), (docSnap) => {
if (!docSnap.exists()) return;
currentState = docSnap.data();
renderTVStage();
});

function renderTVStage() {
if (!currentState) return;
const st = currentState.stage || 0;
const status = currentState.status || "idle";
const activeList = currentState.activePlayers || ["Lila", "Kaja", "Darek", "Jas"];
const prog = currentState.stepProgress || {};
const photos = currentState.photos || {};

// Aktualizacja rygli skarbca na górze
for (let i = 1; i <= 6; i++) {
const bolt = document.getElementById(`bolt-${i}`);
if (bolt) {
if (i < st || status === "finale_unlocked") {
bolt.className = "vault-bolt unlocked";
bolt.innerText = `RYGIEL ${i} 🔓`;
} else if (i === st) {
bolt.className = "vault-bolt unlocked";
bolt.innerText = `RYGIEL ${i} ⏳`;
} else {
bolt.className = "vault-bolt";
bolt.innerText = `RYGIEL ${i} 🔒`;
}
}
}

// Aktualizacja narożników Agentów
agentsList.forEach(a => {
const corner = document.getElementById(`tv-${a}`);
const numEl = document.getElementById(`tv-num-${a}`);
const qEl = document.getElementById(`tv-q-${a}`);
const imgEl = document.getElementById(`tv-img-${a}`);
const dbK = dbKeyMap[a];

if (!activeList.includes(dbK)) {
corner.style.display = 'none';
return;
}
corner.style.display = 'flex';
const pStep = prog[dbK] || 0;
const pPhoto = photos[dbK] || {};

if (st === 1) {
numEl.innerText = `ZDJĘCIE ${pStep + 1}/3`;
qEl.innerText = pStep < 3 ? STAGE1_PHOTOS[dbK][pStep] : "Zrobione (3/3)!";
if (pPhoto.img) {
imgEl.style.display = 'block';
imgEl.src = pPhoto.img;
} else {
imgEl.style.display = 'none';
}
} else if (st === 2) {
numEl.innerText = `KRYJÓWKA ${pStep + 1}/3`;
qEl.innerText = pStep < 3 ? "Szukaj tajnego kodu w domowych kryjówkach!" : "Wszystkie kody znalezione!";
imgEl.style.display = 'none';
} else if (st === 3) {
numEl.innerText = `PYTANIE ${pStep + 1}/3`;
qEl.innerText = pStep < 3 ? "Odpowiadaj na pytania na telefonie!" : "Rozwiązane!";
imgEl.style.display = 'none';
} else {
numEl.innerText = `ETAP ${st}`;
qEl.innerText = "Pomagaj drużynie!";
imgEl.style.display = 'none';
}
});

// Centralna Arena TV
const arena = document.getElementById('stageArena');
const vicBanner = document.getElementById('victory-banner');
const head = document.getElementById('missionHeader');

if (status === "finale_unlocked" || st === 7) {
head.innerText = "🏆 SKARBIEC OTWARTY! 🏆";
arena.innerHTML = `<div style="font-size:2.2vw; color:var(--gold); font-weight:900; line-height:1.4;">Wszystkie 6 rygli puściło!<br>KLUCZ DO SKRZYNI Z PREZENTEM MA W KIESZENI WUJEK! ŁAPCIE GO! 🎅🔑</div>`;
vicBanner.style.display = 'block';
startFireworks();
return;
}

vicBanner.style.display = 'none';

if (st === 1) {
head.innerText = "📸 ETAP 1: FOTO-ZWIAD - CZEKAMY NA ZDJĘCIA!";
let html = `<div style="font-size:1.25vw; color:#cbd5e1; margin-bottom:10px;">Dzieci robią zdjęcia na telefonach. Wujek zatwierdza je w swoim panelu Admina!</div><div style="display:flex; gap:1vw;">`;
activeList.forEach(p => {
const pData = photos[p] || {};
const sNum = prog[p] || 0;
html += `<div style="background:#081c15; border:1px solid #334155; border-radius:10px; padding:10px; width:10vw; text-align:center;">
<b style="color:var(--gold);">${p.toUpperCase()}</b><br><span style="font-size:0.8vw;">Postęp: ${sNum}/3</span><br>
<span style="font-size:0.85vw; color:${pData.status==='approved'?'#2dc653':'#ffd700'}">${pData.status==='approved'?'✔️ ZATWIERDZIONE':pData.status==='pending'?'⏳ CZEKA NA WUJKA':'Ruszaj do aparatu!'}</span>
</div>`;
});
html += `</div>`;
arena.innerHTML = html;
}
else if (st === 2) {
head.innerText = "🔎 ETAP 2: POSZUKIWACZE TAJNYCH KODÓW W DOMU";
arena.innerHTML = `<div style="font-size:1.6vw; font-weight:900; color:var(--gold); line-height:1.4;">Rozszyfrujcie zagadki na telefonach,<br>znajdźcie 12 ukrytych karteczek w domu i wpiszcie kody!</div>`;
}
else if (st === 3) {
head.innerText = "🧠 ETAP 3: ŚWIĄTECZNA ROZGRZEWKA UMYSŁÓW";
arena.innerHTML = `<div style="font-size:1.6vw; font-weight:900; color:var(--gold); line-height:1.4;">Każdy Agent odpowiada na 3 pytania o Cyprze i Mikołaju na swoim telefonie!</div>`;
}
else if (st === 4) {
head.innerText = "🎶 ETAP 4: TAJNY SZYFR KOLORÓW ELFÓW (SIMON SAYS)";
const simonLvl = currentState.simonLevel || 1;
arena.innerHTML = `
<div style="font-size:1.2vw; font-weight:bold; margin-bottom:6px;">Poziom pamięci: ${simonLvl} / 3</div>
<div class="simon-grid">
<div class="simon-pad" style="background:#f59e0b;" id="sp-Lila"></div>
<div class="simon-pad" style="background:#00d4ff;" id="sp-Kaja"></div>
<div class="simon-pad" style="background:#2dc653;" id="sp-Darek"></div>
<div class="simon-pad" style="background:#d62828;" id="sp-Jas"></div>
</div>
`;
}
else if (st === 5) {
const remCount = currentState.tapsCount || 0;
const tgtCount = currentState.tapsTarget || 300;
const pct = Math.min(100, Math.round((remCount / tgtCount) * 100));
head.innerText = "🔥 ETAP 5: TANKOWANIE SAŃ MIKOŁAJA (WYZWANIE 20s)";
arena.innerHTML = `
<div style="font-size:1.3vw; font-weight:bold; margin-bottom:10px;">Stukajcie wspólnie w telefony, aby nabić moc silników!</div>
<div style="font-size:2.8vw; font-weight:900; color:var(--gold); margin-bottom:10px;">${remCount} / ${tgtCount} KLIKÓW (${pct}%)</div>
<div style="width:75%; background:#071912; border:2px solid var(--gold); border-radius:15px; height:2vw; overflow:hidden;">
<div style="height:100%; width:${pct}%; background:linear-gradient(90deg, #d62828, #ffd700); transition:0.1s;"></div>
</div>
`;
}
else if (st === 6) {
const msRem = currentState.holdRemainingMs || 60000;
const secStr = (msRem / 1000).toFixed(1);
head.innerText = "⚡ ETAP 6: OSTATNI RYGIEL - SKANER WYTRWAŁOŚCI";
const hm = currentState.holdMap || {};
let allHold = activeList.every(p => hm[dbKeyMap[p]] === true);
arena.innerHTML = `
<div style="font-size:1.3vw; font-weight:bold; margin-bottom:10px;">Wszyscy aktywni Agenci muszą trzymać palec na skanerze przez 60 sekund!</div>
<div style="font-size:3.5vw; font-weight:900; color:${allHold ? '#2dc653' : '#ff4757'};">${secStr}s</div>
<div style="font-size:1.1vw; color:#cbd5e1; margin-top:8px;">Status palców: ${activeList.map(p => `${p}: ${hm[dbKeyMap[p]] ? '✅' : '❌'}`).join(" | ")}</div>
`;
}
else {
head.innerText = "🎅 OCZEKIWANIE NA START MISJI 🎄";
arena.innerHTML = `<div style="font-size:1.3vw; color:var(--cyan);">Wujek wybierze w panelu Admina Etap 1 i kliknie Uruchom!</div>`;
}
}
</script>
</body>
</html>
