<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>🏆 Pro Dashboard - Obstawianie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --gold: #d4af37; --cyan: #00d4ff; --bg: #f2f2f2; --text: #111;
            --glass: rgba(255, 255, 255, 0.9); --border: rgba(0, 0, 0, 0.1);
            --up: #00ff00; --down: #ff4d4d; --neutral: #ffff00;
        }
        body.dark {
            --bg: #020408; --text: #fff; --glass: rgba(15, 23, 42, 0.75); --border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            margin: 0; padding: 20px; min-height: 100vh; transition: 0.3s; overflow-x: hidden;
        }
        #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        .dashboard-container { max-width: 1000px; margin: 0 auto; z-index: 10; position: relative; }
        h1 { text-align: center; color: var(--gold); text-transform: uppercase; letter-spacing: 3px; font-size: clamp(20px, 5vw, 28px); margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--glass); backdrop-filter: blur(15px); padding: 20px; border-radius: 20px; border: 1px solid var(--border); text-align: center; }
        .stat-card h3 { margin: 0; font-size: 10px; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        .stat-card p { margin: 10px 0 0; font-size: 22px; font-weight: bold; color: var(--gold); }
        .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-link { padding: 10px 20px; border: 1px solid var(--border); background: var(--glass); color: var(--text); cursor: pointer; font-weight: bold; border-radius: 30px; transition: 0.3s; font-size: 13px; }
        .tab-link.active { background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .tab-content { display: none; animation: fadeIn 0.5s ease; }
        .tab-content.active { display: block; }
        .glass-panel { background: var(--glass); backdrop-filter: blur(20px); padding: 25px; border-radius: 25px; border: 1px solid var(--border); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        .trend-icon { font-size: 14px; margin-right: 8px; font-weight: bold; display: inline-block; width: 15px; text-align: center; }
        .trend-up { color: var(--up); } .trend-down { color: var(--down); } .trend-neutral { color: var(--neutral); }
        .player-name { color: var(--cyan); cursor: pointer; text-decoration: underline; font-weight: bold; }
        .badge-container { display: inline-flex; gap: 6px; margin-left: 10px; vertical-align: middle; }
        .badge { font-size: 18px; cursor: help; transition: transform 0.2s; }
        .badge:hover { transform: scale(1.4); }

        .legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 11px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid var(--border); }

        /* REMIS BUTTON */
        .tie-btn { 
            background: var(--gold); color: #000; padding: 4px 10px; border-radius: 8px; 
            font-size: 10px; font-weight: 900; cursor: pointer; border: none; 
            margin-left: 10px; animation: tieBlink 1s infinite alternate; 
        }
        @keyframes tieBlink { from { opacity: 0.4; box-shadow: 0 0 0px var(--gold); } to { opacity: 1; box-shadow: 0 0 15px var(--gold); } }

        /* --- COIN MODAL STYLES --- */
        #coinOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .coin-scene { width: 150px; height: 150px; perspective: 1000px; margin: 40px 0; }
        .coin { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 3s cubic-bezier(0.4, 0, 0.2, 1); }
        .coin div { position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 60px; border: 8px solid var(--gold); background: #1a1a1a; box-shadow: inset 0 0 20px var(--gold), 0 0 30px var(--gold); }
        .coin .tails { transform: rotateY(180deg); }
        .flip-heads { transform: rotateY(1800deg); } /* 5 obrotów */
        .flip-tails { transform: rotateY(1980deg); } /* 5.5 obrotu */
        .pick-btn { padding: 15px 30px; border: 2px solid var(--gold); background: transparent; color: var(--gold); font-weight: 900; border-radius: 40px; cursor: pointer; transition: 0.3s; margin: 0 10px; }
        .pick-btn:hover { background: var(--gold); color: #000; }

        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .full-width-chart { grid-column: 1 / -1; }
        #playerCardOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(10px); }
        .character-card { background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.98)); border: 2px solid var(--cyan); border-radius: 30px; width: 95%; max-width: 480px; padding: 25px; position: relative; box-shadow: 0 0 50px rgba(0, 212, 255, 0.2); color: #fff; text-align: center; }
        .close-card { position: absolute; top: 15px; right: 20px; font-size: 28px; color: #888; cursor: pointer; }
        .xp-bar-container { background: rgba(255,255,255,0.1); height: 8px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .xp-bar-fill { background: var(--cyan); height: 100%; width: 0%; transition: 1s; box-shadow: 0 0 10px var(--cyan); }
        #darkModeBtn { position: fixed; top: 15px; right: 15px; padding: 10px 18px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; background: #111; color: white; z-index: 1000; }
        body.dark #darkModeBtn { background: #f1f1f1; color: #111; }
        .deleteBtn { color: #ff4d4d; cursor: pointer; font-size: 20px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="dark">
    <canvas id="bg-canvas"></canvas>
    <button id="darkModeBtn">☀️ Light mode</button>

    <div id="coinOverlay">
        <h1 style="color: var(--gold); margin: 0;">SUPER REMIS!</h1>
        <p id="tiePlayers" style="font-weight: bold; letter-spacing: 1px;"></p>
        <div id="coinControls">
            <p>Wybierz swoją stronę:</p>
            <button class="pick-btn" onclick="startFlip('heads')">ORZEŁ 🦅</button>
            <button class="pick-btn" onclick="startFlip('tails')">RESZKA 🪙</button>
        </div>
        <div class="coin-scene"><div id="fancyCoin" class="coin"><div class="heads">🦅</div><div class="tails">🪙</div></div></div>
        <h2 id="flipResult" style="color: var(--cyan); height: 40px;"></h2>
    </div>

    <div class="dashboard-container">
        <h1>📊 Game Analytics Dashboard</h1>
        <div class="stats-grid">
            <div class="stat-card"><h3>Lider Rankingu</h3><p id="top-player">-</p></div>
            <div class="stat-card"><h3>Ostatni Zwycięzca</h3><p id="last-winner">-</p></div>
            <div class="stat-card"><h3>Rozegrane Rundy</h3><p id="total-rounds">0</p></div>
        </div>
        <div class="tabs">
            <button class="tab-link active" onclick="openTab(event, 'ranking-tab')">🏆 Ranking</button>
            <button class="tab-link" onclick="openTab(event, 'stats-tab')">📈 Wykresy</button>
            <button class="tab-link" onclick="openTab(event, 'history-tab')">📋 Historia</button>
        </div>
        <div id="ranking-tab" class="tab-content active">
            <div class="glass-panel">
                <table id="rankTable">
                    <thead><tr><th>#</th><th>Trend / Imię</th><th>Punkty</th><th>Podium</th></tr></thead>
                    <tbody></tbody>
                </table>
                <div class="legend-grid">
                    <div class="legend-item"><span>👑</span> <div><b>Dominator</b></div></div>
                    <div class="legend-item"><span>🎯</span> <div><b>Snajper</b></div></div>
                    <div class="legend-item"><span>🛡️</span> <div><b>Weteran</b></div></div>
                </div>
            </div>
        </div>
        <div id="stats-tab" class="tab-content">
            <div class="charts-grid">
                <div class="glass-panel full-width-chart"><h4>Historia Pozycji</h4><canvas id="rankHistoryChart"></canvas></div>
                <div class="glass-panel full-width-chart"><h4>Skuteczność Medalowa</h4><canvas id="medalChart"></canvas></div>
                <div class="glass-panel"><h4>Ranking Punktowy</h4><canvas id="barChart"></canvas></div>
                <div class="glass-panel"><h4>Dominacja Medalowa</h4><canvas id="pieChart"></canvas></div>
            </div>
        </div>
        <div id="history-tab" class="tab-content"><div class="glass-panel"><table id="historyTable"><thead><tr><th>Data</th><th>Wyniki</th><th>X</th></tr></thead><tbody></tbody></table></div></div>
    </div>

    <div id="playerCardOverlay">
        <div class="character-card" id="characterCard">
            <span class="close-card" onclick="closePlayerCard()">×</span>
            <div id="playerLevel" style="color: var(--cyan); font-weight: bold; font-size: 12px;">LEVEL 1</div>
            <h2 id="cardPlayerName">NAME</h2>
            <div class="xp-bar-container"><div id="xpBar" class="xp-bar-fill"></div></div>
            <div style="height: 250px;"><canvas id="radarChart"></canvas></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, deleteDoc, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        // --- CYBER STYLES ---
        const cyberColors = ['#00d4ff', '#d4af37', '#00ff00', '#ff00ff', '#ffffff', '#ff4d4d', '#ffff00', '#c0c0c0'];
        const chartColor = '#888';
        
        let historyChart = new Chart(document.getElementById('rankHistoryChart'), { type: 'line', options: { responsive: true, scales: { y: { reverse: true, ticks: { stepSize: 1, color: chartColor } }, x: { ticks: { color: chartColor } } }, plugins: { legend: { labels: { color: chartColor } } } } });
        let medalChart = new Chart(document.getElementById('medalChart'), { type: 'bar', options: { responsive: true, scales: { x: { stacked: true, ticks: { color: chartColor } }, y: { stacked: true, ticks: { color: chartColor } } } } });
        let barChart = new Chart(document.getElementById('barChart'), { type: 'bar', options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { ticks: { color: chartColor } }, x: { ticks: { color: chartColor } } } } });
        let pieChart = new Chart(document.getElementById('pieChart'), { type: 'doughnut', options: { responsive: true, plugins: { legend: { labels: { color: chartColor } } } } });
        let radarChart;

        let historyData = [], playersData = [], globalStats = [], tiedPair = [];

        // --- TIE BREAKER SYSTEM (COIN FLIP) ---
        window.openTieBreaker = (n1, n2) => {
            tiedPair = [n1, n2];
            document.getElementById('tiePlayers').innerText = `${n1} vs ${n2}`;
            document.getElementById('coinOverlay').style.display = 'flex';
            document.getElementById('flipResult').innerText = '';
            document.getElementById('coinControls').style.display = 'block';
            document.getElementById('fancyCoin').className = 'coin';
        };

        window.startFlip = async (choice) => {
            document.getElementById('coinControls').style.display = 'none';
            const isHeads = Math.random() > 0.5;
            const coin = document.getElementById('fancyCoin');
            coin.classList.add(isHeads ? 'flip-heads' : 'flip-tails');

            setTimeout(async () => {
                const result = isHeads ? 'heads' : 'tails';
                const winner = (choice === result) ? tiedPair[0] : tiedPair[1];
                document.getElementById('flipResult').innerText = `WYGRYWA: ${winner.toUpperCase()}!`;
                
                // Zapisz wynik w Firestore jako stały bonus "szczęścia"
                const ref = doc(db, "ranking", winner);
                const snap = await getDoc(ref);
                await updateDoc(ref, { tieBreaker: (snap.data().tieBreaker || 0) + 1 });
                
                setTimeout(() => document.getElementById('coinOverlay').style.display = 'none', 2000);
            }, 3000);
        };

        function refreshStats() {
            if (!playersData.length) return;
            globalStats = playersData.map(p => {
                let gold = 0, silver = 0, bronze = 0;
                historyData.forEach(r => r.winners.forEach(w => { if(w.name===p.name){ if(w.rank===1) gold++; else if(w.rank===2) silver++; else bronze++; } }));
                return { ...p, gold, silver, bronze, totalPodiums: gold+silver+bronze, tieValue: p.tieBreaker || 0 };
            });

            // DEEP TIE-BREAKER LOGIC
            globalStats.sort((a, b) => (b.points - a.points) || (b.gold - a.gold) || (b.silver - a.silver) || (b.bronze - a.bronze) || (b.tieValue - a.tieValue));

            const tbody = document.querySelector("#rankTable tbody"); tbody.innerHTML = "";
            globalStats.forEach((p, i) => {
                let tieBtn = "";
                const next = globalStats[i+1];
                if(next && p.points === next.points && p.gold === next.gold && p.silver === next.silver && p.bronze === next.bronze) {
                    tieBtn = `<button class="tie-btn" onclick="openTieBreaker('${p.name}', '${next.name}')">REMIS</button>`;
                }
                tbody.innerHTML += `<tr><td>${i+1}</td><td><span class="player-name" onclick="showPlayerCard('${p.name}')">${p.name}</span>${tieBtn}</td><td style="color:var(--gold)">${p.points} <small>(${p.gold}🥇)</small></td><td>${p.totalPodiums}</td></tr>`;
            });

            updateHistoryChart();
            const names = globalStats.map(s => s.name);
            medalChart.data = { labels: names, datasets: [{ label: 'Złoto', data: globalStats.map(s=>s.gold), backgroundColor: '#d4af37' }, { label: 'Srebro', data: globalStats.map(s=>s.silver), backgroundColor: '#c0c0c0' }, { label: 'Brąz', data: globalStats.map(s=>s.bronze), backgroundColor: '#cd7f32' }] };
            medalChart.update();
            barChart.data = { labels: names, datasets: [{ data: globalStats.map(s=>s.points), backgroundColor: '#d4af37' }] };
            barChart.update();
            pieChart.data = { labels: ['Złoto', 'Srebro', 'Brąz'], datasets: [{ data: [globalStats.reduce((a,b)=>a+b.gold,0), globalStats.reduce((a,b)=>a+b.silver,0), globalStats.reduce((a,b)=>a+b.bronze,0)], backgroundColor: ['#d4af37', '#c0c0c0', '#cd7f32'], borderWidth: 0 }] };
            pieChart.update();
        }

        function updateHistoryChart() {
            const totalR = historyData.length; const historyChronological = [...historyData].reverse();
            const startIdx = Math.max(0, totalR - 10); const players = playersData.map(p => p.name); const datasets = [];
            players.forEach((playerName, pIdx) => {
                const positions = []; const tScores = {}; const tGold = {}; const tSilver = {}; const tBronze = {}; const tTie = {};
                players.forEach(n => { tScores[n] = 0; tGold[n] = 0; tSilver[n] = 0; tBronze[n] = 0; tTie[n] = 0; });
                historyChronological.forEach((round, idx) => {
                    round.winners.forEach(w => { if(tScores.hasOwnProperty(w.name)) { tScores[w.name] += (w.rank===1?3:w.rank===2?2:1); if(w.rank===1) tGold[w.name]++; else if(w.rank===2) tSilver[w.name]++; else tBronze[w.name]++; } });
                    if(idx >= startIdx) {
                        const roundRanking = players.map(n => ({ name: n, pts: tScores[n], gold: tGold[n], silver: tSilver[n], bronze: tBronze[n] })).sort((a,b) => (b.pts - a.pts) || (b.gold - a.gold) || (b.silver - a.silver) || (b.bronze - a.bronze));
                        positions.push(roundRanking.findIndex(r => r.name === playerName) + 1);
                    }
                });
                datasets.push({ label: playerName, data: positions, borderColor: cyberColors[pIdx % cyberColors.length], tension: 0.3, fill: false });
            });
            historyChart.data = { labels: historyChronological.slice(startIdx).map((_, i) => `Runda ${startIdx + i + 1}`), datasets: datasets };
            historyChart.update();
        }

        onSnapshot(query(collection(db, "history"), orderBy("timestamp", "desc")), snap => {
            historyData = []; const hbody = document.querySelector("#historyTable tbody"); hbody.innerHTML = "";
            snap.forEach(d => { const data = d.data(); historyData.push(data); hbody.innerHTML += `<tr><td>${data.date}</td><td style="font-size:12px">${data.winners.map(w=>`${w.rank}.${w.name}`).join(", ")}</td><td><span class="deleteBtn" onclick="deleteHistoryRecord('${d.id}')">×</span></td></tr>`; });
            document.getElementById('total-rounds').textContent = historyData.length; refreshStats();
        });

        onSnapshot(collection(db, "ranking"), snap => { playersData = snap.docs.map(d => ({ name: d.id, points: d.data().points || 0, tieBreaker: d.data().tieBreaker || 0 })); refreshStats(); });

        const darkBtn = document.getElementById("darkModeBtn");
        darkBtn.onclick = () => { document.body.classList.toggle("dark"); darkBtn.textContent = document.body.classList.contains("dark")?"☀️ Light mode":"🌙 Dark mode"; };
        
        // Background particles logic...
        const bgCanvas = document.getElementById('bg-canvas'); const bgCtx = bgCanvas.getContext('2d');
        let particles = []; function resize() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; } window.onresize = resize; resize();
        class Particle { constructor() { this.x = Math.random()*bgCanvas.width; this.y = Math.random()*bgCanvas.height; this.vx = (Math.random()-0.5)*0.4; this.vy = (Math.random()-0.5)*0.4; } update() { this.x += this.vx; this.y += this.vy; if(this.x<0||this.x>bgCanvas.width) this.vx*=-1; if(this.y<0||this.y>bgCanvas.height) this.vy*=-1; } }
        for(let i=0; i<60; i++) particles.push(new Particle());
        function drawBg() { bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height); if(document.body.classList.contains('dark')) { particles.forEach((p, i) => { p.update(); bgCtx.fillStyle='rgba(212,175,55,0.3)'; bgCtx.beginPath(); bgCtx.arc(p.x,p.y,1.5,0,Math.PI*2); bgCtx.fill(); for(let j=i+1; j<particles.length; j++) { let p2=particles[j]; let d=Math.hypot(p.x-p2.x,p.y-p2.y); if(d<120) { bgCtx.strokeStyle=`rgba(0,212,255,${1-d/120})`; bgCtx.lineWidth=0.5; bgCtx.beginPath(); bgCtx.moveTo(p.x,p.y); bgCtx.lineTo(p2.x,p2.y); bgCtx.stroke(); } } }); } requestAnimationFrame(drawBg); } drawBg();
    </script>
</body>
</html>
