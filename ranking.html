<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>🏆 Pro Dashboard - Obstawianie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --gold: #d4af37;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --bg-dark: #0f0f0f;
            --card-dark: #1a1a1a;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; background: #f0f2f5; color: #111; margin: 0; padding: 20px; transition: 0.3s; }
        body.dark { background: var(--bg-dark); color: #fff; }

        .dashboard-container { max-width: 1000px; margin: 0 auto; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        body.dark .stat-card { background: var(--card-dark); border: 1px solid #333; }
        .stat-card h3 { margin: 0; font-size: 12px; text-transform: uppercase; color: #888; }
        .stat-card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; color: var(--gold); } /* Złoty lider */

        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        body.dark .tabs { border-bottom-color: #333; }
        .tab-link { padding: 10px 20px; border: none; background: none; color: #888; cursor: pointer; font-weight: bold; border-radius: 8px; transition: 0.3s; }
        .tab-link.active { background: var(--gold); color: #000; }
        .tab-content { display: none; animation: fadeIn 0.5s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glass-panel { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 20px; }
        body.dark .glass-panel { background: var(--card-dark); border: 1px solid #333; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        body.dark th, body.dark td { border-bottom-color: #333; }
        th { color: #888; font-size: 13px; }

        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .full-width-chart { grid-column: 1 / -1; }
        canvas { width: 100% !important; max-height: 350px; }

        #darkModeBtn { position: fixed; top: 15px; right: 15px; padding: 10px 18px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; background: var(--card-dark); color: white; z-index: 1000; }
        body.dark #darkModeBtn { background: white; color: black; }
        
        .deleteBtn { color: #ff4d4d; cursor: pointer; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body class="dark">
    <button id="darkModeBtn">☀️ Light mode</button>

    <div class="dashboard-container">
        <h1>📊 Game Analytics Dashboard</h1>

        <div class="stats-grid">
            <div class="stat-card"><h3>Lider Rankingu</h3><p id="top-player">-</p></div>
            <div class="stat-card"><h3>Ostatni Zwycięzca</h3><p id="last-winner">-</p></div>
            <div class="stat-card"><h3>Suma Rozegranych Rund</h3><p id="total-rounds">0</p></div>
        </div>

        <div class="tabs">
            <button class="tab-link active" onclick="openTab(event, 'ranking-tab')">🏆 Ranking</button>
            <button class="tab-link" onclick="openTab(event, 'stats-tab')">📈 Wykresy</button>
            <button class="tab-link" onclick="openTab(event, 'history-tab')">📋 Historia</button>
        </div>

        <div id="ranking-tab" class="tab-content active">
            <div class="glass-panel">
                <table id="rankTable">
                    <thead><tr><th>#</th><th>Imię</th><th>Suma Punktów</th><th>Ilość Podium</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="stats-tab" class="tab-content">
            <div class="charts-grid">
                <div class="glass-panel full-width-chart">
                    <h4>Skuteczność (Ilość zdobytych miejsc)</h4>
                    <canvas id="medalChart"></canvas>
                </div>
                <div class="glass-panel">
                    <h4>Ranking Punktowy</h4>
                    <canvas id="barChart"></canvas>
                </div>
                <div class="glass-panel">
                    <h4>Dominacja Medalowa</h4>
                    <canvas id="pieChart"></canvas>
                </div>
                <div class="glass-panel">
                    <h4>Średnia pkt na podium</h4>
                    <canvas id="avgChart"></canvas>
                </div>
            </div>
        </div>

        <div id="history-tab" class="tab-content">
            <div class="glass-panel">
                <table id="historyTable">
                    <thead><tr><th>Data i Godzina</th><th>Wyniki (Miejsca)</th><th>X</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, limit, deleteDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI",
            authDomain: "obstaiwanie.firebaseapp.com",
            projectId: "obstaiwanie"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const barCtx = document.getElementById('barChart').getContext('2d');
        const pieCtx = document.getElementById('pieChart').getContext('2d');
        const medalCtx = document.getElementById('medalChart').getContext('2d');
        const avgCtx = document.getElementById('avgChart').getContext('2d');
        
        let barChart = new Chart(barCtx, { type: 'bar', options: { responsive: true, plugins: { legend: { display: false } } } });
        let pieChart = new Chart(pieCtx, { type: 'doughnut', options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#888' } } } } });
        let medalChart = new Chart(medalCtx, { 
            type: 'bar', 
            options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }, plugins: { legend: { position: 'top', labels: { color: '#888' } } } } 
        });
        let avgChart = new Chart(avgCtx, { type: 'polarArea', options: { responsive: true, plugins: { legend: { display: false } } } });

        window.openTab = (evt, tabName) => {
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) contents[i].classList.remove("active");
            const links = document.getElementsByClassName("tab-link");
            for (let i = 0; i < links.length; i++) links[i].classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        };

        let historyData = [];

        // 1. POBIERANIE HISTORII (Naprawa undefined + Podium Krzyśka)
        onSnapshot(query(collection(db, "history"), orderBy("timestamp", "desc"), limit(100)), snap => {
            historyData = [];
            const historyList = document.querySelector("#historyTable tbody");
            historyList.innerHTML = "";
            
            snap.forEach(documentDoc => {
                let data = documentDoc.data();
                
                // DATA RECOVERY: Jeśli w winners nie ma rankingu (stare rekordy Krzyśka), naprawiamy to loclanie
                data.winners = data.winners.map((w, index) => {
                    if (w.rank === undefined || w.rank === null) {
                        return { ...w, rank: index + 1 }; // 0 -> 1., 1 -> 2., 2 -> 3.
                    }
                    return w;
                });

                historyData.push(data);
                
                const winnersString = data.winners.map(w => `${w.rank}. ${w.name}`).join(", ");
                historyList.innerHTML += `
                    <tr>
                        <td>${data.date}</td>
                        <td style="font-size:12px">${winnersString}</td>
                        <td><span class="deleteBtn" onclick="deleteHistoryRecord('${documentDoc.id}')">×</span></td>
                    </tr>`;
            });

            document.getElementById('total-rounds').textContent = historyData.length;
            if(historyData.length > 0) {
                const winnerObj = historyData[0].winners.find(w => w.rank === 1);
                document.getElementById('last-winner').textContent = winnerObj ? winnerObj.name : "-";
            }
        });

        // 2. RANKING I WYKRESY
        onSnapshot(collection(db, "ranking"), snap => {
            let players = [];
            snap.forEach(d => players.push({ name: d.id, points: d.data().points || 0 }));
            players.sort((a, b) => b.points - a.points);

            if(players.length > 0) document.getElementById('top-player').textContent = players[0].name;

            const stats = players.map(p => {
                let gold = 0, silver = 0, bronze = 0;
                historyData.forEach(round => {
                    round.winners.forEach(w => {
                        if(w.name === p.name) {
                            if(w.rank === 1) gold++;
                            else if(w.rank === 2) silver++;
                            else if(w.rank === 3) bronze++;
                        }
                    });
                });
                const totalPodiums = gold + silver + bronze;
                const avgPts = totalPodiums > 0 ? (p.points / totalPodiums).toFixed(1) : 0;
                return { ...p, gold, silver, bronze, totalPodiums, avgPts };
            });

            const rankTbody = document.querySelector("#rankTable tbody");
            rankTbody.innerHTML = "";
            stats.forEach((p, i) => {
                rankTbody.innerHTML += `<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.points}</td><td>${p.totalPodiums}</td></tr>`;
            });

            updateCharts(stats);
        });

        function updateCharts(stats) {
            const names = stats.map(s => s.name);
            
            medalChart.data = {
                labels: names,
                datasets: [
                    { label: 'Złoto', data: stats.map(s => s.gold), backgroundColor: '#d4af37' },
                    { label: 'Srebro', data: stats.map(s => s.silver), backgroundColor: '#c0c0c0' },
                    { label: 'Brąz', data: stats.map(s => s.bronze), backgroundColor: '#cd7f32' }
                ]
            };
            medalChart.update();

            barChart.data = {
                labels: names,
                datasets: [{ data: stats.map(s => s.points), backgroundColor: '#d4af37', borderRadius: 5 }]
            };
            barChart.update();

            const tG = stats.reduce((a,b)=>a+b.gold,0);
            const tS = stats.reduce((a,b)=>a+b.silver,0);
            const tB = stats.reduce((a,b)=>a+b.bronze,0);
            pieChart.data = {
                labels: ['Złoto', 'Srebro', 'Brąz'],
                datasets: [{ data: [tG, tS, tB], backgroundColor: ['#d4af37', '#c0c0c0', '#cd7f32'], borderWidth: 0 }]
            };
            pieChart.update();

            avgChart.data = {
                labels: names,
                datasets: [{ data: stats.map(s => s.avgPts), backgroundColor: stats.map((_,i)=>`rgba(212, 175, 55, ${1-(i*0.15)})`), borderWidth: 0 }]
            };
            avgChart.update();
        }

        window.deleteHistoryRecord = async (id) => {
            if(!confirm("Cofnąć ten zapis?")) return;
            const snap = await getDoc(doc(db, "history", id));
            if(snap.exists()){
                const data = snap.data();
                for(let i=0; i<data.winners.length; i++){
                    const w = data.winners[i];
                    const r = (w.rank !== undefined) ? w.rank : (i+1);
                    const pts = r == 1 ? -3 : (r == 2 ? -2 : -1);
                    const ref = doc(db, "ranking", w.name);
                    const pSnap = await getDoc(ref);
                    if(pSnap.exists()){
                        const newP = (pSnap.data().points || 0) + pts;
                        if(newP <= 0) await deleteDoc(ref);
                        else await updateDoc(ref, {points: newP});
                    }
                }
                await deleteDoc(doc(db, "history", id));
            }
        };

        const darkBtn = document.getElementById("darkModeBtn");
        darkBtn.onclick = () => {
            document.body.classList.toggle("dark");
            darkBtn.textContent = document.body.classList.contains("dark") ? "☀️ Light mode" : "🌙 Dark mode";
        };
    </script>
</body>
</html>
