<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Pad | Gracz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <style>
    :root { --cyan: #00d4ff; --gold: #d4af37; --bg: #050b14; --error: #ff4757; }
    body { 
      font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      min-height: 100vh; text-align: center; box-sizing: border-box;
    }
    body.keyboard-mode { justify-content: flex-start; padding-top: 12px; }
    
    .login-box { background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--cyan); width: 85%; max-width: 350px; }
    select { width: 100%; padding: 15px; font-size: 20px; margin-bottom: 20px; border-radius: 10px; background: #000; color: #fff; }
    
    #gamePad { display: none; width: 94%; max-width: 420px; }
    .status-top { font-size: 13px; color: #888; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; font-weight: bold; cursor: pointer; user-select: none; }
    
    /* KOLOROWE KAFELKI ABCD ZGODNE Z EKRANEM TV */
    .grid-abcd { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; display: none; }
    .btn-abcd { 
      color: #fff; border-radius: 16px; padding: 18px 10px; cursor: pointer; transition: 0.15s; 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      min-height: 100px; word-break: break-word; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .btn-color-0 { background: rgba(241, 196, 15, 0.28); border: 3px solid #f1c40f; box-shadow: 0 0 15px rgba(241, 196, 15, 0.3); }
    .btn-color-1 { background: rgba(0, 212, 255, 0.28); border: 3px solid #00d4ff; box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }
    .btn-color-2 { background: rgba(46, 213, 115, 0.28); border: 3px solid #2ed573; box-shadow: 0 0 15px rgba(46, 213, 115, 0.3); }
    .btn-color-3 { background: rgba(255, 71, 87, 0.28); border: 3px solid #ff4757; box-shadow: 0 0 15px rgba(255, 71, 87, 0.3); }

    .btn-abcd .opt-letter { font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 6px; }
    .btn-abcd .opt-label { font-size: 15px; font-weight: bold; color: #fff; line-height: 1.25; }
    .btn-abcd:active { transform: scale(0.95); filter: brightness(1.3); }
    .btn-abcd:disabled { opacity: 0.18; border-color: #555 !important; background: #111 !important; color: #666 !important; text-decoration: line-through; pointer-events: none; box-shadow: none !important; }
    
    /* KAFELKI KOŁA FORTUNY NA TELEFONIE (RUNDA 2) */
    .wheel-pad-area { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .wheel-pad-cat { font-size: 14px; color: var(--cyan); font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
    .wheel-pad-board { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; margin: 6px 0; width: 100%; }
    .wheel-pad-word { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
    
    .wheel-tile-input {
      width: 34px; height: 42px; background: #111; border: 2px solid #444; border-radius: 7px;
      color: #fff; font-size: 20px; font-weight: 900; text-align: center; text-transform: uppercase;
      padding: 0; outline: none; box-sizing: border-box; font-family: monospace; caret-color: transparent;
    }
    .wheel-tile-input:focus { border-color: var(--cyan); background: rgba(0, 212, 255, 0.15); box-shadow: 0 0 10px rgba(0, 212, 255, 0.5); transform: translateY(-2px); }
    .wheel-tile-input.revealed { background: var(--gold) !important; color: #000 !important; border-color: #fff !important; pointer-events: none; }
    .wheel-tile-input.filled { border-color: var(--cyan); color: var(--cyan); }

    /* RUNDA 3: SZYBKIE PISANIE */
    .input-area { display: none; flex-direction: column; gap: 10px; }
    input.text-r3 { font-size: 22px; padding: 14px; text-align: center; border-radius: 10px; border: 2px solid #555; background: #000; color: #fff; text-transform: uppercase; }
    .btn-submit { background: var(--cyan); color: #000; font-size: 18px; font-weight: 900; padding: 16px; border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase; width: 100%; }
    .btn-submit:active { transform: scale(0.97); }
    
    .nominate-area { display: none; flex-direction: column; gap: 10px; }
    .btn-nom { background: #d4af37; color: #000; font-size: 18px; font-weight: bold; padding: 15px; border-radius: 10px; border: none; cursor: pointer; text-transform: uppercase; }
    .btn-nom.self-btn { background: #00d4ff; color: #000; box-shadow: 0 0 15px rgba(0,212,255,0.4); }
    .btn-nom:disabled { opacity: 0.25; background: #444; color: #888; text-decoration: line-through; pointer-events: none; box-shadow: none; }
    
    .locked-msg { font-size: 19px; color: #ff4757; font-weight: bold; margin-top: 20px; display: none; border: 2px dashed #ff4757; padding: 20px; border-radius: 15px; background: rgba(255,0,0,0.1); }
    .locked-msg.win-msg { color: #00ff00; border-color: #00ff00; background: rgba(0,255,0,0.1); }
    .locked-msg.speak-msg { color: var(--cyan); border-color: var(--cyan); background: rgba(0,212,255,0.1); }
    .feedback-msg { font-size: 13px; color: #ff4757; font-weight: bold; min-height: 18px; }
  </style>
</head>
<body>

  <div class="login-box" id="loginUI">
    <h2>WYBIERZ AGENTA</h2>
    <select id="agentSel">
      <option value="" disabled selected>-- WYBIERZ AGENTA --</option>
      <option value="Lila">Lila</option><option value="Kaja">Kaja</option>
      <option value="Darek">Darek</option><option value="Jas">Jaś</option>
    </select>
    <button class="btn-submit" onclick="joinGame()">DOŁĄCZ DO GRY</button>
  </div>

  <div id="gamePad">
    <div class="status-top" id="padStatus" onclick="forceSyncState()" title="Dotknij, aby odświeżyć połączenie">Oczekiwanie na pytanie...</div>
    
    <!-- RUNDA 1 i 4: KOLOROWE KAFELKI ABCD -->
    <div class="grid-abcd" id="ui-abcd">
      <button class="btn-abcd btn-color-0" id="pad-btn-0" onclick="sendAnswer(0)">
        <span class="opt-letter">A</span><span class="opt-label" id="pad-lbl-0"></span>
      </button>
      <button class="btn-abcd btn-color-1" id="pad-btn-1" onclick="sendAnswer(1)">
        <span class="opt-letter">B</span><span class="opt-label" id="pad-lbl-1"></span>
      </button>
      <button class="btn-abcd btn-color-2" id="pad-btn-2" onclick="sendAnswer(2)">
        <span class="opt-letter">C</span><span class="opt-label" id="pad-lbl-2"></span>
      </button>
      <button class="btn-abcd btn-color-3" id="pad-btn-3" onclick="sendAnswer(3)">
        <span class="opt-letter">D</span><span class="opt-label" id="pad-lbl-3"></span>
      </button>
    </div>

    <!-- RUNDA 2: INTERAKTYWNE KAFELKI KOŁA FORTUNY -->
    <div class="wheel-pad-area" id="ui-wheel">
      <div class="wheel-pad-cat" id="wheelPadCat">KATEGORIA</div>
      <div class="wheel-pad-board" id="wheelPadBoard"></div>
      <div class="feedback-msg" id="wheelFeedback"></div>
      <button class="btn-submit" onclick="submitWheelTiles()">ZATWIERDŹ HASŁO</button>
    </div>
    
    <!-- RUNDA 3: SZYBKIE PISANIE -->
    <div class="input-area" id="ui-input">
      <input type="text" class="text-r3" id="typeAnswer" placeholder="Wpisz odpowiedź..." autocomplete="off">
      <div class="feedback-msg" id="r3Feedback"></div>
      <button class="btn-submit" onclick="sendTypedAnswer()">WYŚLIJ ODPOWIEDŹ</button>
    </div>
    
    <!-- RUNDA 4: WYBIERANIE -->
    <div class="nominate-area" id="ui-nominate">
      <h3 style="color:#d4af37; margin-bottom: 5px;">TY WYBIERASZ!</h3>
      <p style="font-size: 13px; margin-top: 0; color:#ccc;">Kategoria: <b id="pad-cat" style="color:#00d4ff;"></b></p>
      <button class="btn-nom" id="nom-Lila" onclick="nominatePlayer('Lila')">LILA</button>
      <button class="btn-nom" id="nom-Kaja" onclick="nominatePlayer('Kaja')">KAJA</button>
      <button class="btn-nom" id="nom-Darek" onclick="nominatePlayer('Darek')">DAREK</button>
      <button class="btn-nom" id="nom-Jas" onclick="nominatePlayer('Jas')">JAŚ</button>
    </div>
    
    <div class="locked-msg" id="ui-locked">ZABLOKOWANE! Patrz na ekran.</div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const db = getFirestore(initializeApp(firebaseConfig));

let myName = "";
let currentState = null;
let unsubscribeSnapshot = null;
let watchdogInterval = null;

let currentWheelTick = null;
let lastR3Question = null;
let padWheelInterval = null;
let padRevealedCount = 0;
let tileInputs = [];
let targetLetters = [];

function normalizeChar(str) {
    return (str || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ł/g, "l").replace(/[^a-z0-9]/g, "");
}

window.forceSyncState = async () => {
    if (!myName) return;
    try {
        const snap = await getDoc(doc(db, "quizGame", "state"));
        if (snap.exists()) {
            currentState = snap.data();
            updatePadUI();
        }
    } catch (e) {}
};

function startRealtimeListener() {
    if (unsubscribeSnapshot) unsubscribeSnapshot();
    unsubscribeSnapshot = onSnapshot(doc(db, "quizGame", "state"), (docSnap) => {
        if (!docSnap.exists()) return;
        currentState = docSnap.data();
        updatePadUI();
    }, () => {
        setTimeout(window.forceSyncState, 1500);
    });
}

window.joinGame = () => {
    myName = document.getElementById('agentSel').value;
    if(!myName) return alert("Musisz wybrać Agenta z listy!");
    
    document.getElementById('loginUI').style.display = 'none';
    document.getElementById('gamePad').style.display = 'block';
    
    startRealtimeListener();

    clearInterval(watchdogInterval);
    watchdogInterval = setInterval(window.forceSyncState, 2500);
};

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && myName) {
        startRealtimeListener();
        window.forceSyncState();
    }
});
window.addEventListener("focus", () => { if (myName) window.forceSyncState(); });
window.addEventListener("online", () => { if (myName) { startRealtimeListener(); window.forceSyncState(); } });

function buildWheelPadTiles(phrase) {
    const board = document.getElementById('wheelPadBoard');
    board.innerHTML = "";
    tileInputs = [];
    targetLetters = [];
    let globalIdx = 0;

    phrase.split(" ").forEach(word => {
        const wDiv = document.createElement('div');
        wDiv.className = "wheel-pad-word";
        for (let ch of word) {
            const inp = document.createElement('input');
            inp.type = "text";
            inp.maxLength = 1;
            inp.className = "wheel-tile-input";
            inp.dataset.idx = globalIdx;
            inp.autocomplete = "off";
            inp.autocapitalize = "characters";
            inp.spellcheck = false;

            const idxCopy = globalIdx;
            targetLetters.push(ch);

            inp.addEventListener('focus', () => {
                if (inp.readOnly || inp.classList.contains('revealed')) {
                    focusNextEditableTile(idxCopy + 1);
                    return;
                }
                inp.select();
            });

            inp.addEventListener('input', (e) => {
                if (inp.readOnly || inp.classList.contains('revealed')) {
                    inp.value = targetLetters[idxCopy];
                    focusNextEditableTile(idxCopy + 1);
                    return;
                }
                document.getElementById('wheelFeedback').innerText = "";
                let val = e.target.value.trim().slice(-1).toUpperCase();
                e.target.value = val;
                if (val) {
                    inp.classList.add('filled');
                    focusNextEditableTile(idxCopy + 1);
                } else {
                    inp.classList.remove('filled');
                }
            });

            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    e.preventDefault();
                    if (inp.readOnly || inp.classList.contains('revealed')) {
                        inp.value = targetLetters[idxCopy];
                        focusPrevEditableTile(idxCopy - 1);
                        return;
                    }
                    if (inp.value === "") {
                        focusPrevEditableTile(idxCopy - 1);
                    } else {
                        inp.value = "";
                        inp.classList.remove('filled');
                    }
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    window.submitWheelTiles();
                }
            });

            wDiv.appendChild(inp);
            tileInputs.push(inp);
            globalIdx++;
        }
        board.appendChild(wDiv);
    });
}

function focusNextEditableTile(startIdx) {
    for (let i = startIdx; i < tileInputs.length; i++) {
        if (!tileInputs[i].readOnly && !tileInputs[i].classList.contains('revealed')) {
            tileInputs[i].focus();
            return;
        }
    }
}

function focusPrevEditableTile(startIdx) {
    for (let i = startIdx; i >= 0; i--) {
        if (!tileInputs[i].readOnly && !tileInputs[i].classList.contains('revealed')) {
            tileInputs[i].focus();
            tileInputs[i].value = "";
            tileInputs[i].classList.remove('filled');
            return;
        }
    }
}

function updateRevealedTilesOnPad() {
    if (!currentState || !currentState.wheelOrder) return;
    const unlocked = currentState.wheelOrder.slice(0, padRevealedCount);
    unlocked.forEach(idx => {
        const inp = tileInputs[idx];
        if (inp) {
            const wasFocused = (document.activeElement === inp);
            inp.value = targetLetters[idx];
            inp.readOnly = true;
            inp.classList.remove('filled');
            inp.classList.add('revealed');
            if (wasFocused) focusNextEditableTile(idx + 1);
        }
    });
}

function updatePadUI() {
    document.getElementById('ui-abcd').style.display = 'none';
    document.getElementById('ui-wheel').style.display = 'none';
    document.getElementById('ui-input').style.display = 'none';
    document.getElementById('ui-nominate').style.display = 'none';
    const lockedEl = document.getElementById('ui-locked');
    lockedEl.style.display = 'none';
    lockedEl.classList.remove('win-msg', 'speak-msg');
    document.body.classList.remove('keyboard-mode');

    if (currentState && currentState.status === "podium") {
        clearInterval(padWheelInterval);
        document.getElementById('padStatus').innerText = "🏆 WIELKI FINAŁ! 🏆";
        lockedEl.classList.add('win-msg');
        lockedEl.style.display = 'block';
        lockedEl.innerText = "KONIEC GRY! SPÓJRZ NA PODIUM I FAJERWERKI NA TV!";
        return;
    }

    // FAZA LEKTORA: Dopóki lektor czyta pytanie na TV, odpowiedzi są ukryte
    if (currentState && currentState.status === "speaking") {
        if (currentState.round === 3 && currentState.question !== lastR3Question) {
            lastR3Question = currentState.question;
            document.getElementById('typeAnswer').value = "";
            document.getElementById('r3Feedback').innerText = "";
        }
        document.getElementById('padStatus').innerText = "🗣️ SŁUCHAJ LEKTORA NA TV!";
        lockedEl.classList.add('speak-msg');
        lockedEl.style.display = 'block';
        lockedEl.innerText = "LEKTOR CZYTA PYTANIE...\nZA CHWILĘ ODBLOKUJĄ SIĘ ODPOWIEDZI!";
        return;
    }
    
    if (!currentState || currentState.status === "idle" || currentState.status === "results" || currentState.status === "timeout" || currentState.status === "nominated_timeout" || currentState.status === "wheel_results" || currentState.status === "r1_results" || currentState.status === "r3_results") {
        clearInterval(padWheelInterval);
        document.getElementById('padStatus').innerText = "Patrz na ekran TV!";
        if (currentState && (currentState.status === "results" || currentState.status === "timeout" || currentState.status === "r3_results")) {
            document.getElementById('typeAnswer').value = "";
            document.getElementById('r3Feedback').innerText = "";
            lastR3Question = null;
        }
        return;
    }

    if (currentState.status === "results_wrong") {
        document.getElementById('padStatus').innerText = "KTOŚ SIĘ POMYLIŁ! ZA CHWILĘ DOBITKA...";
        lockedEl.style.display = 'block';
        lockedEl.innerText = "PRZYGOTUJ SIĘ! ZA MOMENT KTO PIERWSZY, TEN LEPSZY!";
        return;
    }

    if (currentState.status === "wheel_reading" && currentState.round === 2) {
        const winners = currentState.wheelWinners || [];
        const myRank = winners.indexOf(myName);
        const ptsMap = [20, 15, 10, 5];

        if (myRank !== -1) {
            clearInterval(padWheelInterval);
            document.getElementById('padStatus').innerText = "BRAWO! ODGADŁEŚ HASŁO!";
            lockedEl.classList.add('win-msg');
            lockedEl.style.display = 'block';
            lockedEl.innerText = `MIEJSCE #${myRank + 1} (+${ptsMap[myRank]} PKT)! CZEKAJ NA POZOSTAŁYCH.`;
            return;
        }

        document.body.classList.add('keyboard-mode');
        document.getElementById('padStatus').innerText = "WPISUJ BRAKUJĄCE LITERY W KAFELKI:";
        document.getElementById('wheelPadCat').innerText = "KATEGORIA: " + (currentState.category || "");
        document.getElementById('ui-wheel').style.display = 'flex';

        if (currentState.tick !== currentWheelTick) {
            currentWheelTick = currentState.tick;
            clearInterval(padWheelInterval);
            padRevealedCount = 0;
            document.getElementById('wheelFeedback').innerText = "";
            buildWheelPadTiles(currentState.question);

            let totalLetters = (currentState.wheelOrder || []).length;
            let intervalMs = Math.max(1500, Math.floor(52000 / Math.max(1, totalLetters)));
            padWheelInterval = setInterval(() => {
                if (padRevealedCount < totalLetters) {
                    padRevealedCount++;
                    updateRevealedTilesOnPad();
                }
            }, intervalMs);

            setTimeout(() => focusNextEditableTile(0), 100);
        }
        return;
    }
    
    if (currentState.status === "nominating") {
        if (currentState.controller === myName) {
            document.getElementById('padStatus').innerText = "DECYZJA NALEŻY DO CIEBIE!";
            document.getElementById('pad-cat').innerText = currentState.category || "";
            
            const allPlayers = [
                { id: "Lila", label: "LILA" },
                { id: "Kaja", label: "KAJA" },
                { id: "Darek", label: "DAREK" },
                { id: "Jas", label: "JAŚ" }
            ];
            allPlayers.forEach(p => {
                let btn = document.getElementById(`nom-${p.id}`);
                let isBlocked = currentState.blocked && currentState.blocked.includes(p.id);
                btn.disabled = isBlocked;
                if (p.id === myName) {
                    btn.classList.add('self-btn');
                    btn.innerText = `${p.label} - BIORĘ NA SIEBIE! (±20 PKT)`;
                } else {
                    btn.classList.remove('self-btn');
                    btn.innerText = `${p.label} (±10 PKT)`;
                }
            });

            document.getElementById('ui-nominate').style.display = 'flex';
        } else {
            document.getElementById('padStatus').innerText = `${currentState.controller.toUpperCase()} WYBIERA KTO ODPOWIADA...`;
        }
        return;
    }

    if (currentState.status === "reading") {
        if (currentState.round === 3 && currentState.question !== lastR3Question) {
            lastR3Question = currentState.question;
            document.getElementById('typeAnswer').value = "";
            document.getElementById('r3Feedback').innerText = "";
        }

        // RUNDA 1: Wyścig dla każdego (15/12/10/8 pkt, błąd = 0 pkt)
        if (currentState.round === 1) {
            const myAns = (currentState.r1Answers || {})[myName];
            if (myAns) {
                document.getElementById('padStatus').innerText = "ODPOWIEDŹ ZAPISANA!";
                if (myAns.pts > 0) lockedEl.classList.add('win-msg');
                lockedEl.style.display = 'block';
                lockedEl.innerText = myAns.pts > 0 
                    ? `DOBRZE! ZDOBYWASZ +${myAns.pts} PKT!\nCZEKAJ NA POZOSTAŁYCH GRACZY.` 
                    : `NIESTETY BŁĄD (0 PKT).\nCZEKAJ NA KONIEC CZASU.`;
                return;
            }
            for(let i=0; i<4; i++) {
                let btn = document.getElementById(`pad-btn-${i}`);
                let lbl = document.getElementById(`pad-lbl-${i}`);
                btn.disabled = false;
                lbl.innerText = (currentState.options && currentState.options[i]) ? currentState.options[i] : "";
            }
            document.getElementById('padStatus').innerText = "WYBIERZ ODPOWIEDŹ (15 / 12 / 10 / 8 PKT):";
            document.getElementById('ui-abcd').style.display = 'grid';
            return;
        }

        // RUNDA 3: Szybkie pisanie dla każdego (15/12/10/8 pkt)
        if (currentState.round === 3) {
            const winners = currentState.r3Winners || [];
            const myRank = winners.indexOf(myName);
            const ptsMap = [15, 12, 10, 8];
            if (myRank !== -1) {
                document.getElementById('padStatus').innerText = "BRAWO! ODPOWIEDŹ ZALICZONA!";
                lockedEl.classList.add('win-msg');
                lockedEl.style.display = 'block';
                lockedEl.innerText = `MIEJSCE #${myRank + 1} (+${ptsMap[myRank]} PKT)!\nCZEKAJ NA POZOSTAŁYCH.`;
                return;
            }
            document.body.classList.add('keyboard-mode');
            document.getElementById('padStatus').innerText = "MASZ 15 SEKUND - WPISZ ODPOWIEDŹ:";
            document.getElementById('ui-input').style.display = 'flex';
            return;
        }

        // RUNDA 4: Ryzyko
        if (currentState.round === 4) {
            if (currentState.blocked && currentState.blocked.includes(myName)) {
                document.getElementById('padStatus').innerText = "ODPADŁEŚ W TYM PYTANIU!";
                lockedEl.style.display = 'block';
                lockedEl.innerText = "STRACIŁEŚ SZANSĘ W TYM PYTANIU. TERAZ PRÓBUJĄ POZOSTALI!";
                return;
            }

            for(let i=0; i<4; i++) {
                let btn = document.getElementById(`pad-btn-${i}`);
                let lbl = document.getElementById(`pad-lbl-${i}`);
                btn.disabled = (currentState.usedOptions && currentState.usedOptions.includes(i));
                lbl.innerText = (currentState.options && currentState.options[i]) ? currentState.options[i] : "";
            }

            if (!currentState.nominated || currentState.nominated === myName) {
                let msg = !currentState.nominated 
                    ? "DOBITKA! KTO PIERWSZY, TEN LEPSZY! (±10 PKT)" 
                    : (currentState.nominated === currentState.controller ? "GRASZ O ±20 PKT! ODPOWIADAJ!" : "ZOSTAŁEŚ WYBRANY (±10 PKT)! ODPOWIADAJ!");
                document.getElementById('padStatus').innerText = msg;
                document.getElementById('ui-abcd').style.display = 'grid';
            } else {
                document.getElementById('padStatus').innerText = "KIBICUJ!";
                lockedEl.style.display = 'block';
                lockedEl.innerText = `TERAZ ODPOWIADA: ${currentState.nominated.toUpperCase()}`;
            }
        }
    }
    
    if (currentState.status && (currentState.status.startsWith("results_pending") || currentState.status === "verifying")) {
        document.getElementById('padStatus').innerText = "TRWA WERYFIKACJA...";
        lockedEl.style.display = 'block';
        lockedEl.innerText = "PATRZ NA TELEWIZOR!";
    }
}

window.submitWheelTiles = async () => {
    if (!currentState || currentState.round !== 2 || currentState.status !== "wheel_reading") return;
    
    updateRevealedTilesOnPad();

    const userBuilt = tileInputs.map(inp => inp.value).join("");
    const targetBuilt = targetLetters.join("");

    if (normalizeChar(userBuilt).length < normalizeChar(targetBuilt).length) {
        document.getElementById('wheelFeedback').innerText = "⚠️ WYPEŁNIJ WSZYSTKIE PUSTE KAFELKI!";
        focusNextEditableTile(0);
        return;
    }

    if (normalizeChar(userBuilt) === normalizeChar(targetBuilt)) {
        const stateRef = doc(db, "quizGame", "state");
        const snap = await getDoc(stateRef);
        const data = snap.data();
        let winners = data.wheelWinners || [];

        if (!winners.includes(myName)) {
            const ptsMap = [20, 15, 10, 5];
            let myPts = ptsMap[winners.length] || 5;
            winners.push(myName);

            const scoreRef = doc(db, "quizScores", myName);
            const scoreSnap = await getDoc(scoreRef);
            let curPts = scoreSnap.exists() ? scoreSnap.data().points : 0;
            await setDoc(scoreRef, { points: curPts + myPts }, { merge: true });

            if (winners.length >= 4) {
                await updateDoc(stateRef, { wheelWinners: winners, status: "wheel_results", answerTick: Date.now() });
            } else {
                await updateDoc(stateRef, { wheelWinners: winners });
            }
        }
    } else {
        document.getElementById('wheelFeedback').innerText = "❌ BŁĘDNE HASŁO! POPRAW LITERY!";
        tileInputs.forEach(inp => {
            if (!inp.readOnly && !inp.classList.contains('revealed')) {
                inp.value = "";
                inp.classList.remove('filled');
            }
        });
        focusNextEditableTile(0);
    }
};

window.sendAnswer = async (index) => {
    if (currentState.status !== "reading") return;
    const isCorrect = (index === currentState.correctIndex);
    
    // RUNDA 1: Punktacja 15 / 12 / 10 / 8 pkt dla poprawnych, 0 pkt dla błędnych (bez blokowania pozostałych)
    if (currentState.round === 1) {
        const stateRef = doc(db, "quizGame", "state");
        const snap = await getDoc(stateRef);
        const data = snap.data();
        let answers = data.r1Answers || {};
        let winners = data.r1Winners || [];
        if (answers[myName]) return;

        let myPts = 0;
        if (isCorrect) {
            const ptsMap = [15, 12, 10, 8];
            myPts = ptsMap[winners.length] || 8;
            winners.push(myName);

            const scoreRef = doc(db, "quizScores", myName);
            const scoreSnap = await getDoc(scoreRef);
            let curPts = scoreSnap.exists() ? scoreSnap.data().points : 0;
            await setDoc(scoreRef, { points: curPts + myPts }, { merge: true });
        }
        answers[myName] = { index, isCorrect, pts: myPts };

        if (Object.keys(answers).length >= 4) {
            await updateDoc(stateRef, { r1Answers: answers, r1Winners: winners, status: "r1_results", answerTick: Date.now() });
        } else {
            await updateDoc(stateRef, { r1Answers: answers, r1Winners: winners });
        }
        return;
    }

    // RUNDA 4: Ryzyko
    if (currentState.round === 4) {
        await updateDoc(doc(db, "quizGame", "state"), { status: "results_pending_r4", fastest: myName, selectedIndex: index, isAnswerCorrect: isCorrect });
    }
};

window.sendTypedAnswer = async () => {
    const inputEl = document.getElementById('typeAnswer');
    const ans = inputEl.value.trim();
    if (!ans) return;

    // RUNDA 3: Automatyczna weryfikacja ze wsparciem synonimów (15 / 12 / 10 / 8 pkt)
    if (currentState.status === "reading" && currentState.round === 3) {
        const acceptedList = (currentState.correctText || "").split("/").map(s => normalizeChar(s));
        const userNorm = normalizeChar(ans);

        const isMatch = acceptedList.some(acc => acc && (userNorm === acc || (acc.length >= 4 && userNorm.includes(acc))));

        if (isMatch) {
            inputEl.value = "";
            document.getElementById('r3Feedback').innerText = "";
            const stateRef = doc(db, "quizGame", "state");
            const snap = await getDoc(stateRef);
            const data = snap.data();
            let winners = data.r3Winners || [];

            if (!winners.includes(myName)) {
                const ptsMap = [15, 12, 10, 8];
                let myPts = ptsMap[winners.length] || 8;
                winners.push(myName);

                const scoreRef = doc(db, "quizScores", myName);
                const scoreSnap = await getDoc(scoreRef);
                let curPts = scoreSnap.exists() ? scoreSnap.data().points : 0;
                await setDoc(scoreRef, { points: curPts + myPts }, { merge: true });

                if (winners.length >= 4) {
                    await updateDoc(stateRef, { r3Winners: winners, status: "r3_results", answerTick: Date.now() });
                } else {
                    await updateDoc(stateRef, { r3Winners: winners });
                }
            }
        } else {
            document.getElementById('r3Feedback').innerText = "❌ SPRAWDŹ PISOWNIĘ I SPRÓBUJ PONOWNIE!";
        }
    }
};

window.nominatePlayer = async (targetPlayer) => {
    if (currentState.status !== "nominating" || currentState.controller !== myName) return;
    // Po wskazaniu gracza w R4 uruchamiamy najpierw lektora ("speaking")!
    await updateDoc(doc(db, "quizGame", "state"), { status: "speaking", nominated: targetPlayer, tieMsg: "", speechTick: Date.now() });
};
</script>
