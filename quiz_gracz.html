<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Pad | Gracz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --cyan: #00d4ff; --bg: #050b14; }
    body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    
    .login-box { background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--cyan); width: 85%; max-width: 350px; }
    select { width: 100%; padding: 15px; font-size: 20px; margin-bottom: 20px; border-radius: 10px; background: #000; color: #fff; }
    
    #gamePad { display: none; width: 90%; max-width: 400px; }
    .status-top { font-size: 14px; color: #888; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 2px; font-weight: bold; }
    
    .grid-abcd { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; display: none; }
    .btn-abcd { background: #111; border: 2px solid var(--cyan); color: #fff; font-size: 30px; font-weight: bold; padding: 35px 20px; border-radius: 15px; cursor: pointer; transition: 0.2s; }
    .btn-abcd:active { background: var(--cyan); color: #000; transform: scale(0.95); }
    .btn-abcd:disabled { opacity: 0.2; border-color: #ff4757; color: #ff4757; text-decoration: line-through; pointer-events: none; }
    
    .input-area { display: none; flex-direction: column; gap: 15px; }
    input[type="text"] { font-size: 24px; padding: 15px; text-align: center; border-radius: 10px; border: 2px solid #555; background: #000; color: #fff; text-transform: uppercase; }
    .btn-submit { background: var(--cyan); color: #000; font-size: 20px; font-weight: bold; padding: 20px; border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase; }
    
    .nominate-area { display: none; flex-direction: column; gap: 10px; }
    .btn-nom { background: #d4af37; color: #000; font-size: 18px; font-weight: bold; padding: 15px; border-radius: 10px; border: none; cursor: pointer; text-transform: uppercase; }
    .btn-nom.self-btn { background: #00d4ff; color: #000; box-shadow: 0 0 15px rgba(0,212,255,0.4); }
    .btn-nom:disabled { opacity: 0.25; background: #444; color: #888; text-decoration: line-through; pointer-events: none; box-shadow: none; }
    
    .locked-msg { font-size: 22px; color: #ff4757; font-weight: bold; margin-top: 30px; display: none; border: 2px dashed #ff4757; padding: 25px; border-radius: 15px; background: rgba(255,0,0,0.1); }
  </style>
</head>
<body>

  <div class="login-box" id="loginUI">
    <h2>WYBIERZ AGENTA</h2>
    <select id="agentSel">
      <option value="" disabled selected>-- WYBIERZ AGENTA --</option>
      <option value="Lila">Lila</option><option value="Kaja">Kaja</option>
      <option value="Darek">Darek</option><option value="Jas">Jaś</option>
    </select>
    <button class="btn-submit" style="width:100%;" onclick="joinGame()">DOŁĄCZ DO GRY</button>
  </div>

  <div id="gamePad">
    <div class="status-top" id="padStatus">Oczekiwanie na pytanie...</div>
    
    <div class="grid-abcd" id="ui-abcd">
      <button class="btn-abcd" id="pad-btn-0" onclick="sendAnswer(0)">A</button>
      <button class="btn-abcd" id="pad-btn-1" onclick="sendAnswer(1)">B</button>
      <button class="btn-abcd" id="pad-btn-2" onclick="sendAnswer(2)">C</button>
      <button class="btn-abcd" id="pad-btn-3" onclick="sendAnswer(3)">D</button>
    </div>
    
    <div class="input-area" id="ui-input">
      <input type="text" id="typeAnswer" placeholder="Wpisz odpowiedź...">
      <button class="btn-submit" onclick="sendTypedAnswer()">WYŚLIJ</button>
    </div>
    
    <div class="nominate-area" id="ui-nominate">
      <h3 style="color:#d4af37; margin-bottom: 5px;">TY WYBIERASZ!</h3>
      <p style="font-size: 13px; margin-top: 0; color:#ccc;">Kategoria: <b id="pad-cat" style="color:#00d4ff;"></b></p>
      <button class="btn-nom" id="nom-Lila" onclick="nominatePlayer('Lila')">LILA</button>
      <button class="btn-nom" id="nom-Kaja" onclick="nominatePlayer('Kaja')">KAJA</button>
      <button class="btn-nom" id="nom-Darek" onclick="nominatePlayer('Darek')">DAREK</button>
      <button class="btn-nom" id="nom-Jas" onclick="nominatePlayer('Jas')">JAŚ</button>
    </div>
    
    <div class="locked-msg" id="ui-locked">ZABLOKOWANE! Patrz na ekran.</div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCEEVCSx2uOOggu_4y_gUo4WMyKqf-HlKI", authDomain: "obstaiwanie.firebaseapp.com", projectId: "obstaiwanie" };
const db = getFirestore(initializeApp(firebaseConfig));

let myName = "";
let currentState = null;

window.joinGame = () => {
    myName = document.getElementById('agentSel').value;
    if(!myName) return alert("Musisz wybrać Agenta z listy!");
    
    document.getElementById('loginUI').style.display = 'none';
    document.getElementById('gamePad').style.display = 'block';
    
    onSnapshot(doc(db, "quizGame", "state"), (docSnap) => {
        if (!docSnap.exists()) return;
        currentState = docSnap.data();
        updatePadUI();
    });
};

function updatePadUI() {
    document.getElementById('ui-abcd').style.display = 'none';
    document.getElementById('ui-input').style.display = 'none';
    document.getElementById('ui-nominate').style.display = 'none';
    document.getElementById('ui-locked').style.display = 'none';
    
    if (!currentState || currentState.status === "idle" || currentState.status === "results" || currentState.status === "results_wrong" || currentState.status === "timeout" || currentState.status === "nominated_timeout") {
        document.getElementById('padStatus').innerText = "Patrz na ekran TV!";
        return;
    }
    
    if (currentState.status === "nominating") {
        if (currentState.controller === myName) {
            document.getElementById('padStatus').innerText = "DECZYJA NALEŻY DO CIEBIE!";
            document.getElementById('pad-cat').innerText = currentState.category || "";
            
            const allPlayers = [
                { id: "Lila", label: "LILA" },
                { id: "Kaja", label: "KAJA" },
                { id: "Darek", label: "DAREK" },
                { id: "Jas", label: "JAŚ" }
            ];
            allPlayers.forEach(p => {
                let btn = document.getElementById(`nom-${p.id}`);
                let isBlocked = currentState.blocked && currentState.blocked.includes(p.id);
                btn.disabled = isBlocked;
                if (p.id === myName) {
                    btn.classList.add('self-btn');
                    btn.innerText = `${p.label} - BIORĘ NA SIEBIE! (±20 PKT)`;
                } else {
                    btn.classList.remove('self-btn');
                    btn.innerText = `${p.label} (±10 PKT)`;
                }
            });

            document.getElementById('ui-nominate').style.display = 'flex';
        } else {
            document.getElementById('padStatus').innerText = `${currentState.controller.toUpperCase()} WYBIERA KTO ODPOWIADA...`;
        }
        return;
    }

    if (currentState.status === "reading") {
        if (currentState.blocked && currentState.blocked.includes(myName)) {
            document.getElementById('padStatus').innerText = "ODPADŁEŚ W TYM PYTANIU!";
            document.getElementById('ui-locked').style.display = 'block';
            document.getElementById('ui-locked').innerText = "STRACIŁEŚ SZANSĘ W TYM PYTANIU. TERAZ PRÓBUJĄ POZOSTALI!";
            return;
        }

        for(let i=0; i<4; i++) {
            let btn = document.getElementById(`pad-btn-${i}`);
            btn.disabled = (currentState.usedOptions && currentState.usedOptions.includes(i));
        }

        if (currentState.round === 1) {
            document.getElementById('padStatus').innerText = "SZYBKO WYBIERZ ODPOWIEDŹ!";
            document.getElementById('ui-abcd').style.display = 'grid';
        } else if (currentState.round === 2) {
            document.getElementById('padStatus').innerText = "MASZ 15 SEKUND - WPISUJ!";
            document.getElementById('ui-input').style.display = 'flex';
        } else if (currentState.round === 3) {
            if (!currentState.nominated || currentState.nominated === myName) {
                let msg = (currentState.nominated === currentState.controller) ? "GRASZ O ±20 PKT! ODPOWIADAJ!" : "TWOJA SZANSA (±10 PKT)! ODPOWIADAJ!";
                document.getElementById('padStatus').innerText = msg;
                document.getElementById('ui-abcd').style.display = 'grid';
            } else {
                document.getElementById('padStatus').innerText = "KIBICUJ!";
                document.getElementById('ui-locked').style.display = 'block';
                document.getElementById('ui-locked').innerText = `TERAZ ODPOWIADA: ${currentState.nominated.toUpperCase()}`;
            }
        }
    }
    
    if (currentState.status.startsWith("results_pending") || currentState.status === "verifying") {
        document.getElementById('padStatus').innerText = "TRWA WERYFIKACJA...";
        document.getElementById('ui-locked').style.display = 'block';
        document.getElementById('ui-locked').innerText = "PATRZ NA TELEWIZOR!";
    }
}

window.sendAnswer = async (index) => {
    if (currentState.status !== "reading") return;
    const isCorrect = (index === currentState.correctIndex);
    
    if (currentState.round === 1) {
        await updateDoc(doc(db, "quizGame", "state"), { status: "results_pending_r1", fastest: myName, selectedIndex: index, isAnswerCorrect: isCorrect });
    } else if (currentState.round === 3) {
        await updateDoc(doc(db, "quizGame", "state"), { status: "results_pending_r3", fastest: myName, selectedIndex: index, isAnswerCorrect: isCorrect });
    }
};

window.sendTypedAnswer = async () => {
    const ans = document.getElementById('typeAnswer').value.trim();
    if (!ans || currentState.status !== "reading" || currentState.round !== 2) return;
    await updateDoc(doc(db, "quizGame", "state"), { status: "verifying", fastest: myName, givenAnswer: ans });
    document.getElementById('typeAnswer').value = ""; 
};

window.nominatePlayer = async (targetPlayer) => {
    if (currentState.status !== "nominating" || currentState.controller !== myName) return;
    await updateDoc(doc(db, "quizGame", "state"), { status: "reading", nominated: targetPlayer, tieMsg: "", tick: Date.now() });
};
</script>
</body>
</html>
